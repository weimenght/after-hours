<style>
  /* one screen per state; warm paper by day, a lamplit street at night */
  :root {
    --paper:#f6efe3; --paper2:#eadcc6; --road:#cfc3b0; --ink:#3b2a20; --soft:#7b6656; --field:#fffaf2; --line:#3b2a20;
    --clay:#d9774b; --sun:#e7b54a; --sage:#9bb08a; --sky:#7a9cc6; --skin:#f3d2b3; --blush:#e89a7a; --dot:rgba(59,42,32,.05); color-scheme:light;
    --hand:"Caveat","Chalkboard SE","Segoe Print","Bradley Hand",ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --body:"Figtree",ui-rounded,"Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1814; --paper2:#2e261f; --road:#3a3129; --ink:#f3ead8; --soft:#b9a88e; --field:#2a221c; --dot:rgba(255,255,255,.03); color-scheme:dark; } }
  :root[data-theme="dark"] { --paper:#1d1814; --paper2:#2e261f; --road:#3a3129; --ink:#f3ead8; --soft:#b9a88e; --field:#2a221c; --dot:rgba(255,255,255,.03); color-scheme:dark; }
  :lang(zh-Hant) { --hand:"Caveat","PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif; --body:"Figtree",system-ui,"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--paper); color:var(--ink); }
  body { font:19px/1.4 var(--body); -webkit-tap-highlight-color:transparent; background-image:radial-gradient(var(--dot) 1px, transparent 1px); background-size:6px 6px; }
  header { --ahh-bg:var(--field); --ahh-ink:var(--ink); --ahh-line:var(--line); --ahh-name:var(--hand); max-width:380px; margin:0 auto; padding:max(4px, env(safe-area-inset-top)) 16px 0; }
  header .ahh-nm { font-size:28px; font-weight:700; }
  header .ahh-b { width:44px; height:44px; padding:0; font:700 22px/1 var(--hand); color:var(--ink); background:var(--field); border:2.5px solid var(--ink); border-radius:255px 14px 225px 14px/14px 225px 14px 255px; box-shadow:2px 2px 0 var(--ink); cursor:pointer; }
  header .ahh-b svg { width:18px; height:18px; }
  #app { max-width:380px; margin:0 auto; padding:0 16px; }
  .screen { min-height:calc(100vh - 44px); min-height:calc(100dvh - 44px); display:flex; flex-direction:column; justify-content:center; gap:18px; padding:16px 0 32px; animation:in .35s ease; }
  body.bare .screen { min-height:100vh; min-height:100dvh; }
  body.bare header, body.bare footer, body.mid footer { display:none; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation:none; } }
  h1, .hand { font-family:var(--hand); font-weight:600; }
  h1 { font-size:44px; line-height:1.02; white-space:pre-line; }
  html:lang(zh) h1, html:lang(zh-Hant) h1 { font-size:34px; line-height:1.3; font-weight:700; }
  .lede { font-size:20px; color:var(--soft); }
  .popo { margin:10px 0 0; font-style:italic; line-height:1.45; } .popo b { font-style:normal; font-weight:600; margin-right:4px; }
  .popo.paper { padding:8px 12px; background:#fffaf2; color:#3a2a1c; border:1.5px solid var(--ink); border-radius:4px; transform:rotate(-.6deg); font-family:'Caveat',cursive; font-style:normal; font-size:21px; }
  .center { text-align:center; align-items:center; }
  .scene { width:100%; height:auto; display:block; image-rendering:pixelated; border-radius:14px; }
  label { font-family:var(--hand); font-weight:600; font-size:27px; display:block; margin-bottom:6px; }
  html:lang(zh) label, html:lang(zh-Hant) label { font-size:20px; font-weight:700; }
  .times { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .days .chip { grid-column:span 2; }

  .days .chip { font-size:22px; padding:7px 0; }

  .times .other, .times .pickt { grid-column:span 2; }
  /* our own hour and minute choosers: the phone's time field draws empty and flat in some browsers */

  .pickt[hidden] { display:none; }
  .pickt span { font-family:var(--hand); font-weight:600; font-size:34px; }
  .pickt select { -webkit-appearance:none; appearance:none; font-family:var(--hand); font-weight:600; font-size:31px; line-height:1.2; color:#3b2a20; background:var(--sun); border:2.5px solid var(--ink); border-radius:255px 14px 225px 14px/14px 225px 14px 255px; padding:8px 18px; min-width:104px; text-align:center; text-align-last:center; cursor:pointer; }
  .pickt select:focus-visible { outline:3px solid rgba(231,181,74,.6); outline-offset:2px; }
  .pickt option { color:var(--ink); background:var(--field); }
  html:lang(zh) .times .other, html:lang(zh-Hant) .times .other { font-size:20px; }
  .chip:disabled { opacity:.35; box-shadow:none; cursor:default; }
  .chip, .btn, input { font:inherit; color:var(--ink); background:var(--field); border:2.5px solid var(--ink); border-radius:255px 14px 225px 14px/14px 225px 14px 255px; }

  .chip[aria-pressed=true] { background:var(--sun); color:#3b2a20; box-shadow:none; transform:translate(2px,2px); }
  input { width:100%; font-size:20px; padding:13px 14px; outline:none; }

  input::placeholder { color:var(--soft); opacity:.7; }
  .btn { display:block; width:100%; font-family:var(--hand); font-weight:600; font-size:33px; padding:12px 10px; cursor:pointer; background:var(--clay); color:#fffaf2; box-shadow:3px 3px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  html:lang(zh) .btn, html:lang(zh-Hant) .btn, html:lang(zh) .chip, html:lang(zh-Hant) .chip { font-size:23px; font-weight:700; }
  .btn:active { transform:translate(3px,3px); box-shadow:none; }
  .btn.quiet { background:var(--field); color:var(--ink); }
  .btn.sage { background:var(--sage); color:#3b2a20; }
  .row { display:flex; gap:12px; width:100%; } .row .btn { flex:1; }
  .link { background:none; border:0; font:inherit; font-size:16px; color:var(--soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px; }
  .faint { opacity:.5; }
  .code { font-family:var(--hand); font-weight:600; font-size:80px; letter-spacing:.12em; line-height:1; text-align:center; padding:14px 0 6px; border:2.5px dashed var(--ink); border-radius:18px 6px 20px 8px; background:var(--field); width:100%; }
  .big { font-family:var(--hand); font-weight:600; font-size:72px; line-height:1; }
  .clock { font-family:var(--hand); font-weight:600; font-size:min(80px,20vw); line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .clock small { display:block; font-size:.5em; margin-bottom:6px; color:var(--soft); }
  .corner { font-family:var(--hand); font-weight:600; font-size:35px; line-height:1.1; word-break:break-word; }
  html:lang(zh) .corner, html:lang(zh-Hant) .corner { font-size:26px; line-height:1.35; }
  .mins { font-size:160px; font-weight:300; line-height:1; color:var(--soft); font-variant-numeric:tabular-nums; }
  .note { font-size:16px; color:var(--soft); min-height:1.4em; }
  .err { color:#b14a24; }
  .spacer { flex:1; }
  .langmenu { position:absolute; right:16px; top:42px; z-index:5; background:var(--field); border:2px solid var(--ink); border-radius:12px; padding:6px; display:flex; flex-direction:column; box-shadow:3px 3px 0 var(--ink); }
  .langmenu button { font:16px var(--body); color:var(--ink); background:none; border:0; text-align:left; padding:8px 12px; border-radius:8px; cursor:pointer; }
  .langmenu button[aria-checked=true] { background:var(--paper2); }
  footer { max-width:380px; margin:0 auto; padding:0 16px 24px; font-size:13px; color:var(--soft); text-align:center; }
  footer a { color:inherit; }
  #testbar { position:fixed; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:8px; background:rgba(59,42,32,.92); font:13px system-ui,sans-serif; z-index:9; }
  #testbar[hidden] { display:none; }
  #testbar button { font:inherit; padding:5px 9px; border-radius:6px; border:1px solid #fffaf2; background:transparent; color:#fffaf2; cursor:pointer; }
  #testbar button.on { background:#fffaf2; color:#3b2a20; }
  #testbar span { color:#e7b54a; align-self:center; }
  /* handoff/DESIGN.md §5: phone one column; tablet the same, centred at 560; computer the picture (560) beside the flow (480), 1080 in all; a screen without a picture stays one column of 480 */
  @media (min-width: 720px) { header, #app, footer { max-width:592px; } }
  @media (min-width: 1024px) {
    header, #app, footer { max-width:1112px; }
    .screen:not(:has(> .scene)) { max-width:480px; margin-left:auto; margin-right:auto; width:100%; }
    .screen:has(> .scene) { display:grid; grid-template-columns:minmax(0, 560px) minmax(0, 480px); justify-content:space-between; column-gap:40px; row-gap:0; align-content:center; }
    .screen:has(> .scene) > .scene { grid-column:1; grid-row:1 / span 30; align-self:center; width:100%; max-width:none; margin:0; }
    .screen:has(> .scene) > :not(.scene) { grid-column:2; margin-bottom:14px; }
  }
</style>
