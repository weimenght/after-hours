<style>
/* Still Today (town family, handoff/DESIGN.md): the square under Josep's clock in pixels beside one question at a time;

:root {
  --page: #14101e; --check: rgba(0,0,0,.25); --paper: #f3ead8; --ink: #1d130d; --line: #000; --amber: #f6b73c;

:root[data-theme="light"] { --page: #e9dcc0; --check: rgba(120,80,40,.08); --muted: #6a5240; --head: #1d130d; --sl-ink: #1d130d; --sl-dim: #6a5240; color-scheme: light }
:lang(zh-Hant) { --vt: "VT323", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", ui-monospace, monospace; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }

.top { --ahh-bg: var(--paper); --ahh-ink: var(--ink); --ahh-line: var(--line); box-sizing: border-box; max-width: 560px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.top .ahh-ic img { width: 100%; height: 100%; image-rendering: pixelated; }
html:lang(zh) .top .ahh-nm, html:lang(zh-Hant) .top .ahh-nm { font: 700 18px/1.2 var(--vt); letter-spacing: .1em; }

.main { box-sizing: border-box; max-width: 560px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.stage { position: relative; width: 100%; aspect-ratio: 192 / 120; max-height: 40vh; margin: 0 auto; border: 3px solid var(--line); box-shadow: var(--drop); background: #14101e; box-sizing: border-box; }
@supports (aspect-ratio: 1) { .stage { max-width: calc(40vh * 1.6); } }

.stage .shade { position: absolute; inset: 0; background: #05040a; opacity: 0; transition: opacity 2.4s; pointer-events: none; }
.stage.down .shade { opacity: .72; }
/* the clock face is a button: tap it to turn the clock round (Josep's winding log) */
.stage .face { all: unset; position: absolute; left: 43.2%; top: 25.8%; width: 13.6%; height: 21.7%; border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.stage .face:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
#foot { color: var(--muted); text-align: center; font-size: 16px; padding: 4px 16px 20px; }
#foot a { color: inherit; }
@media (min-width: 720px) { .stage { max-height: 50vh; } @supports (aspect-ratio: 1) { .stage { max-width: calc(50vh * 1.6); } } }
@media (min-width: 1024px) {
  .main { max-width: 1080px; display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 480px); gap: 40px; justify-content: center; align-items: start; padding: 32px 32px 40px; }
  .top { max-width: 1080px; padding-left: 32px; padding-right: 32px; }
  .scenecol { position: sticky; top: 24px; }
  .stage { max-height: none; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { .stage .shade { transition: none; } }

<body>
<header class="top" id="head"><span class="brand">Still Today</span></header>
<main class="main">
  <div class="scenecol">
    <div class="stage" id="stage" role="img">
      <canvas id="sq" width="192" height="120"></canvas><div class="shade"></div>
      <button class="face" id="face" type="button"></button>
    </div>
  </div>
  <div id="flow" aria-live="polite"></div>
</main>
<footer id="foot"></footer>

<script src="./words.js?v=5b46de9f9a"></script>
<script src="./still.js?v=08f0005f8c"></script>
<script>
(function () {
"use strict";
var W = window.SL_W, $ = function (id) { return document.getElementById(id); };
var LANGS = ["en", "zh", "zh-Hant", "es", "ca"];
function li() { var l = window.FBL ? FBL.get() : (document.documentElement.lang || "en"); var i = LANGS.indexOf(l); return i < 0 ? 0 : i; }
function T(a) { return a == null ? "" : typeof a === "string" ? a : (a[li()] || a[0]); }

/* ---------- the square under Josep's clock: the sky by your hour, roofs, the tower, the animals where they'd be ---------- */
var SC = { slow: 0, down: false, stars: null };
function season() { var s = FW().season ? FW().season() : null; if (s) return s; var m = new Date().getMonth(); return m < 2 || m === 11 ? "winter" : m < 5 ? "spring" : m < 8 ? "summer" : "autumn"; }
function skyCols(h) {
  if (h < 5 || h >= 21) return ["#100c1c", "#161228", "#1e1a36"];
  if (h < 8) return ["#3a3a6a", "#8a6a9a", "#e8a070"];
  if (h < 17) return ["#4f82c8", "#6e9ed8", "#9cc2ea"];

  var cv = $("sq"), g = cv.getContext("2d"), h = hourNow(), Wd = 192, C = skyCols(h), dk = dark(h) || SC.down, se = season();

  if (dk) {
    if (!SC.stars) { SC.stars = []; for (var i = 0; i < 26; i++) SC.stars.push([(Math.random() * Wd) | 0, (Math.random() * 56) | 0]); }
    g.fillStyle = "#f3ead8"; SC.stars.forEach(function (s) { g.fillRect(s[0], s[1], 1, 1); });
    g.fillStyle = "#f4e8cf"; g.fillRect(160, 12, 8, 8); g.fillRect(159, 13, 10, 6); g.fillStyle = C[0]; g.fillRect(163, 11, 7, 7);
  } else { g.fillStyle = "#fff2c0"; var sx = 20 + ((h - 6) / 14) * 150; g.fillRect(sx, 22, 8, 8); g.fillRect(sx - 1, 23, 10, 6); }
  /* the houses round the square */
  var wall = dk ? "#3e2f34" : "#d8c4a0", wall2 = dk ? "#33262c" : "#c4ac86", roof = dk ? "#5a2a20" : "#a0442a", win = dk ? "#f6b73c" : "#6a8aa8";
  [[0, 58, 40, wall], [36, 66, 46, wall2], [114, 62, 42, wall2], [152, 54, 40, wall]].forEach(function (b, n) {
    var x = b[0], y = b[1], w = b[2];
    g.fillStyle = b[3]; g.fillRect(x, y, w, 104 - y);
    g.fillStyle = roof; for (var s = 0; s < 6; s++) g.fillRect(x - 2 + s, y - 6 + s, w + 4 - 2 * s, 1); g.fillRect(x - 2, y - 1, w + 4, 2);
    if (se === "winter") { g.fillStyle = "#eef2f8"; g.fillRect(x - 2, y - 2, w + 4, 1); }
    for (var r = y + 6; r < 92; r += 13) for (var c = x + 5; c < x + w - 8; c += 12) {
      var lit = dk && ((c * 7 + r * 3 + n) % 5 !== 0); g.fillStyle = dk ? (lit ? win : "#22181e") : win; g.fillRect(c, r, 6, 7);
      g.fillStyle = dk ? "#1a1014" : "#f3ead8"; g.fillRect(c + 2, r, 1, 7);
    }
  });
  /* Josep's tower */
  var st = dk ? "#5a5058" : "#9a8a78", st2 = dk ? "#4a4048" : "#86786a";
  g.fillStyle = st; g.fillRect(80, 22, 32, 82); g.fillStyle = st2; for (var y = 26; y < 104; y += 6) g.fillRect(80, y, 32, 1);
  g.fillStyle = dk ? "#4a2018" : "#8a3a24"; for (var t = 0; t < 12; t++) g.fillRect(78 + t, 10 + t, 36 - 2 * t, 1); g.fillRect(77, 21, 38, 2);
  g.fillStyle = "#c8a040"; g.fillRect(95, 4, 2, 7);
  /* the face, lit at night; the hands at your time minus however slow Josep's clock is running */
  var cx = 96, cy = 44, R = 11;
  for (var yy = -R - 1; yy <= R + 1; yy++) for (var xx = -R - 1; xx <= R + 1; xx++) { var d = xx * xx + yy * yy;
    if (d <= R * R) { g.fillStyle = dk ? "#ffe6a8" : "#f3ead8"; g.fillRect(cx + xx, cy + yy, 1, 1); } else if (d <= (R + 1.6) * (R + 1.6)) { g.fillStyle = "#3a2214"; g.fillRect(cx + xx, cy + yy, 1, 1); } }
  g.fillStyle = "#3a2214"; [[0, -9], [9, 0], [0, 9], [-9, 0]].forEach(function (p) { g.fillRect(cx + p[0], cy + p[1], 1, 1); });
  if (!SC.down && Date.now() % 7000 < 1300) { g.fillStyle = "#fffbe8"; g.fillRect(cx + 7, cy - 9, 2, 1); g.fillRect(cx + 8, cy - 10, 1, 3); }   /* a glint: it asks to be touched */
  var m = (h * 60 - SC.slow + 1440) % 1440, ha = (m / 720) * Math.PI * 2, ma = ((m % 60) / 60) * Math.PI * 2;
  line(g, cx, cy, ha, 5.5, "#1a1410"); line(g, cx, cy, ma, 8.5, "#8a2a3a"); g.fillStyle = "#1a1410"; g.fillRect(cx, cy, 1, 1);
  g.fillStyle = dk ? "#2a1810" : "#5a3820"; g.fillRect(90, 86, 12, 18); g.fillRect(91, 85, 10, 1); g.fillStyle = dk ? "#f6b73c" : "#c8a040"; g.fillRect(99, 95, 1, 1);
  /* cobbles, a lamp */
  g.fillStyle = dk ? "#2e2830" : "#6c6258"; g.fillRect(0, 104, Wd, 16); g.fillStyle = dk ? "#3a3440" : "#80766a";
  for (var cy2 = 106; cy2 < 120; cy2 += 4) for (var cx2 = (cy2 % 8 ? 0 : 3); cx2 < Wd; cx2 += 7) g.fillRect(cx2, cy2, 4, 2);
  if (dk) { g.fillStyle = "rgba(246,183,60,.18)"; g.fillRect(84, 104, 24, 4); }
  if (se === "autumn") { g.fillStyle = "#c8702a"; [[12, 112], [40, 116], [118, 110], [176, 115], [150, 118]].forEach(function (p) { g.fillRect(p[0], p[1], 2, 1); }); }
  g.fillStyle = "#1a1410"; g.fillRect(128, 80, 2, 24); g.fillRect(125, 78, 8, 3); g.fillStyle = dk ? "#ffd27a" : "#e8dcc0"; g.fillRect(126, 81, 6, 4);
  /* the animals, as animals, asleep at their own hours (or once the phone goes down) */
  if (FW().drawPet) {
    var zz = function (w) { return SC.down || asleep(w); };
    FW().drawPet(g, "dog", 64, 110, 1, { asleep: zz("mantou") });
    FW().drawPet(g, "miso", 146, 110, 1, { asleep: zz("miso"), flip: true });
    FW().drawPet(g, "yuzu", 166, 111, 1, { asleep: zz("yuzu"), flip: true });
    ["mantou", "miso", "yuzu"].forEach(function (w, i) { if (zz(w)) { g.fillStyle = "#f3ead8"; var zx = [74, 152, 172][i], zy = 92 - ((Date.now() / 600 + i) % 3 | 0); g.fillRect(zx, zy, 3, 1); g.fillRect(zx + 1, zy + 1, 1, 1); g.fillRect(zx, zy + 2, 3, 1); } });
  }
}
/* Josep's clock runs slow: the minute hand eases back a few minutes */
function slowDown(done) {
  var t0 = performance.now(), D = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 1800, to = SC.slow + 7;
  (function step(t) { var k = Math.min(1, (t - t0) / D); SC.slow = to - 7 * (1 - k * (2 - k)); draw(); if (k < 1) requestAnimationFrame(step); else done && done(); })(t0);
}
var timer = setInterval(draw, 1200);
document.addEventListener("visibilitychange", function () { clearInterval(timer); if (!document.hidden) { draw(); timer = setInterval(draw, 1200); } });

/* ---------- the flow (still.js) ---------- */
var ENDS = { home: 1, end: 1 };   /* the footer shows on the first and last screens only */
var HD = null;
var F = FBStill.mount($("flow"), {
  root: $("head"),
  slow: slowDown,
  dim: function (on) { SC.down = on; $("stage").classList.toggle("down", on); draw(); },
  screen: function (s) { $("foot").hidden = !ENDS[s]; foot(); if (HD) HD.back(s === "home" || s === "down" ? null : function () { F.home(); }); window.scrollTo(0, 0); }
});
HD = window.FBC && FBC.head ? FBC.head($("head"), { px: 1, icon: '<img src="./icon.svg" alt="">', name: function () { return T(W.title); },
  home: function () { F.home(); }, steps: W.steps }) : null;
$("face").onclick = function () { FBStill.log(); };
function foot() {
  var f = $("foot"); if (!f || f.hidden) return;
  var _k = function (k, d) { return window.FBC && FBC.W && FBC.W[k] ? FBC.t(FBC.W[k]) : d; };
  var x = "<span>" + esc(_k("fDevice", T(W.device))) + '</span><a href="https://www.after-hours.work/?fbl=' + LANGS[li()] + '" target="_blank" rel="noopener">' + esc(_k("fAh", T(W.ah))) + "</a>";
  if (window.FBC && FBC.foot) FBC.foot(f, { px: 1, extra: x }); else f.innerHTML = x;
}

  $("stage").setAttribute("aria-label", T(W.sceneA)); $("face").setAttribute("aria-label", T(W.turnRound));
  if (HD) HD.paint(); foot(); draw();

addEventListener("fbl:lang", render);

/* offline copy (sw.js: network first, own files only); a new version reloads an open page once */

    document.addEventListener("visibilitychange", function () { if (!document.hidden) reg.update().catch(function () {}); });
  }).catch(function () {});
});

render(); F.home();
try { if (!localStorage.getItem("sl_seen")) { localStorage.setItem("sl_seen", "1"); if (HD && HD.steps) setTimeout(function () { HD.steps(); }, 500); } } catch (e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
window.SL = { W: W, F: F, log: FBStill.log, draw: draw, hour: hourNow };
})();
</script>
