    else if (K === "heart") { px(g, gr, x + (dir > 0 ? 1 : -6), y - 2, 6, 5); px(g, dk, x + (dir > 0 ? 3 : -4), y, 1, 1); }
    else if (K === "narrow") { px(g, gr, x + (dir > 0 ? 1 : -6), y, 6, 1); px(g, gr, x + (dir > 0 ? 2 : -5), y - 1, 3, 1); }
    else if (K === "tendril") { px(g, gr, x + (dir > 0 ? 1 : -3), y, 3, 2); px(g, gr, x + dir * 4, y - 2, 1, 2); px(g, gr, x + dir * 5, y - 3, 1, 1); }
    else if (K === "fern") { for (var i = 0; i < 5; i++) px(g, i % 2 ? dk : gr, x + dir * (i + 1), y - (i % 2), 1, 2); }
    else { px(g, gr, x + (dir > 0 ? 1 : -5), y - 2, 5, 5); px(g, "#9ad07a", x + (dir > 0 ? 3 : -3), y, 1, 1); }
  }
  if (st === 1) { px(g, gr, tx - 1, top, 3, 1); return; }
  var pairs = st === 2 ? 1 : st === 3 ? 3 : 4;
  for (var p = 0; p < pairs; p++) { var ly = y0 - Math.round(((p + 1) / (pairs + 1)) * tall), ll = cx + Math.round(((y0 - ly) / tall) * droop); leaf(ll, ly, p % 2 ? 1 : -1); leaf(ll, ly + 1, p % 2 ? -1 : 1); }
  if (st === 4) { px(g, gr, tx - 1, top - 2, 3, 3); px(g, L.fc, tx, top - 2, 1, 1); }

function flower(g, x, y, L) {

  else if (L.flower === "pea") { px(g, c, x - 3, y - 4, 4, 3); px(g, c, x, y - 6, 4, 4); px(g, "#a84890", x + 1, y - 5); px(g, c, x + 3, y + 6, 3, 3); }
  else if (L.flower === "toms") { [[-5, 6], [4, 10], [-3, 14], [5, 4]].forEach(function (p) { px(g, c, x + p[0], y + p[1], 3, 3); px(g, "#4a8a34", x + p[0] + 1, y + p[1] - 1); }); px(g, "#f2d230", x - 1, y - 2, 3, 2); }

}

/* ---------- the pot in a link: compact, deflated where the browser can, base64url; nothing is stored anywhere else ---------- */
function b64(bytes) { var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

  var c = JSON.parse(JSON.stringify(o)); delete c.me; c.log = (c.log || []).slice(-40); c.notes = (c.notes || []).slice(-12);
  var raw = new TextEncoder().encode(JSON.stringify(c));
  if (!window.CompressionStream) return Promise.resolve("j" + b64(raw));
  var cs = new CompressionStream("deflate-raw"), w = cs.writable.getWriter(); w.write(raw); w.close();
  return new Response(cs.readable).arrayBuffer().then(function (buf) { return "z" + b64(new Uint8Array(buf)); }, function () { return "j" + b64(raw); });
}
function unpack(s) {
  try {
    var bytes = unb64(s.slice(1));
    if (s[0] === "j") return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
    if (s[0] !== "z" || !window.DecompressionStream) return Promise.resolve(null);
    var ds = new DecompressionStream("deflate-raw"), w = ds.writable.getWriter(); w.write(bytes); w.close();

}
function copyText(text) { try { navigator.clipboard.writeText(text); return true; } catch (e) { return false; } }
/* send: the share card first (a picture with a QR for WeChat, or WhatsApp), else the share sheet, else a copy */
function sendLink(text, after) {

}

  on("back", function () { home(); });
}

    (others.some(function (n) { return held.indexOf(n) < 0; }) ? '<p class="dim">' + esc(T(W.notHeld)) + "</p>" : "") +
    '<input class="line" id="nn" maxlength="20" aria-label="' + esc(T(W.newPh)) + '" placeholder="' + esc(T(W.newPh)) + '">' +

  document.querySelectorAll("#nx [data-n]").forEach(function (b) { b.onclick = function () { to = b.getAttribute("data-n"); $("nn").value = ""; document.querySelectorAll("#nx [data-n]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); }; });

/* ---------- arriving with a pot ---------- */
function arrive() {
  var m = /#p=([\w-]+)/.exec(location.hash); if (!m) return false;
  history.replaceState(null, "", location.pathname + location.search);
  unpack(m[1]).then(function (o) {

    o.names = o.names.slice(0, 12).map(function (n) { return String(n).slice(0, 20); });
    var to = o.hands && o.hands.length ? o.hands[o.hands.length - 1].n : "";
    if (o.from && to && o.names.indexOf(to) >= 0) {
      var kn = o.names.filter(function (n) { return n !== to; }), list = kn.length > 1 ? kn.slice(0, -1).join(", ") + T(W.and) + kn[kn.length - 1] : kn[0];
      show(card(asleep("popo") ? "wei" : "popo", asleep("popo") ? T(W.tag, { n: to }) : T(W.handed, { f: o.from })) +
        '<p class="plain">' + esc(T(kn.length > 1 ? W.youre : W.youre1, { n: to, s: stage(o.seed.stage), l: list })) + "</p>" +
        '<div class="row"><button class="fbb fbb-pri fbb-lg" id="take" data-first>' + esc(T(W.take)) + '</button></div><button class="quiet" id="notme">' + esc(T(W.notMe)) + "</button>", "setup");
      on("take", function () { take(o, to); }); on("notme", function () { pickMe(o); });
      return;
    }
    pickMe(o);
  });
  return true;
}
function pickMe(o) {
  show(card(asleep("popo") ? "wei" : "popo", T(W.friends)) +
    '<p class="plain">' + esc(T(W.whichOne)) + '</p><div class="chips" id="wh">' + o.names.map(function (n, i) { return '<button class="fbb" data-n="' + esc(n) + '"' + (i ? "" : " data-first") + ">" + esc(n) + "</button>"; }).join("") + "</div>", "setup");
  document.querySelectorAll("#wh [data-n]").forEach(function (b) { b.onclick = function () { take(o, b.getAttribute("data-n")); }; });
}
/* merge with this device's copy of the same pot: the further-grown wins; notes, guesses, the log, the names and the trail are joined */
function take(o, me) {
  var mine = D.pots[o.id];
  if (mine) {
    var u = function (a, b, key) { var seen = {}; return (a || []).concat(b || []).filter(function (x) { var k = key(x); if (seen[k]) return false; seen[k] = 1; return true; }); };
    o.notes = u(mine.notes, o.notes, function (n) { return n.n + n.d + n.t; }).slice(-30);
    o.log = u(mine.log, o.log, function (l) { return l.d + l.k + (l.who || []).join(); }).slice(-80);
    o.guesses = Object.assign({}, mine.guesses, o.guesses);
    if (mine.seed.stage > o.seed.stage || (mine.seed.stage === o.seed.stage && mine.seed.pts > o.seed.pts)) o.seed = mine.seed;
    if ((mine.hands || []).length > (o.hands || []).length) o.hands = mine.hands;
    (mine.names || []).forEach(function (n) { if (o.names.indexOf(n) < 0 && o.names.length < 12) o.names.push(n); });
  }
  delete o.from; o.me = me; S = o; save(); home();
}

/* ---------- it blooms: Josep's label is read out, the guesses come out of the pot, and it ends with a real one ---------- */
function bloom(fresh) {
  var sp = W.SP[S.seed.sp], g = S.guesses || {}, ks = Object.keys(g), re = new RegExp(sp.g, "i");
  var right = ks.filter(function (n) { return re.test(g[n]); });
  var nm = T(sp.n);
  show((fresh ? '<p class="plain big">' + esc(T(W.bloomed)) + "</p>" : "") +
    '<div class="reveal"><div class="k">' + esc(T(W.label)) + '</div><div class="nm">' + esc(nm) + "</div>" +
    (ks.length ? "<p>" + esc(right.length ? T(W.guessed, { n: right.join(T(W.and)) }) : T(W.nobody)) + "</p>" : "") + "</div>" +
    (asleep("popo") ? "" : card("popo", T(right.length ? W.popoRight : W.popoNone))) +
    (ks.length ? '<div class="sticks">' + ks.map(function (n) { return '<div class="stick"><b>' + esc(n) + "</b>" + esc(g[n]) + "</div>"; }).join("") + "</div>" : "") +
    '<p class="plain big">' + esc(T(W.real)) + '</p><p class="plain">' + esc(T(W.getSeeds, { p: nm })) + "</p>" +
    '<div class="row"><button class="fbb fbb-pri fbb-lg" id="plan" data-first>' + esc(T(W.plan)) + "</button></div>" +
    '<button class="quiet" id="again">' + esc(T(W.again)) + "</button>", "end");
  on("plan", function () {
    var text = T(W.planMsg, { p: nm }), end = function () { putDown(); };
    if (window.FBC && FBC.tell) FBC.tell({ px: 1, root: $("head"), title: T(W.plan), choices: [{ label: T(W.plan), text: text, done: end }] });
    else shareText(text).then(function (ok) { if (ok) end(); });
  });
  on("again", function () { S.seed = newSeed(); S.guesses = {}; S.log = []; save(); SC.down = false; $("stage").classList.remove("down"); home(asleep("popo") ? "" : card("popo", T(W.popoAgain))); });
}
function putDown() {
  SC.down = true; $("stage").classList.add("down");
  show(card("mantou", T(W.dig)) + '<p class="plain big">' + esc(T(W.down)) + '</p><p class="plain">' + esc(T(W.getSome)) + "</p>" +
    '<button class="quiet" id="again">' + esc(T(W.again)) + "</button>", "end");
  on("again", function () { S.seed = newSeed(); S.guesses = {}; S.log = []; save(); SC.down = false; $("stage").classList.remove("down"); home(asleep("popo") ? "" : card("popo", T(W.popoAgain))); });
}

/* ---------- header, footer, language ---------- */
function others() { return Object.keys(D.pots).filter(function (id) { return S && id !== S.id; }); }
HD = window.FBC && FBC.head ? FBC.head($("head"), { px: 1, icon: '<img src="./icon.svg" alt="">', name: function () { return T(W.title); },
  home: function () { home(); }, steps: W.steps,
  items: function () {
    var it = [];
    if (S && S.seed.stage < 5) it.push({ label: function () { return T(W.all); }, on: sendAll });
    others().forEach(function (id) { var p = D.pots[id]; it.push({ label: function () { return T(W.pots) + ": " + p.names.slice(0, 3).join(", ") + (p.names.length > 3 ? "…" : ""); }, on: function () { S = p; save(); SC.miso = false; home(); } }); });
    return it;
  } }) : null;
function foot() {
  var f = $("foot"); if (!f || f.hidden) return;
  var _k = function (k, d) { return window.FBC && FBC.W && FBC.W[k] ? FBC.t(FBC.W[k]) : d; };
  var x = "<span>" + esc(_k("fLink", T(W.link))) + '</span><a href="https://www.after-hours.work/?fbl=' + LANGS[li()] + '" target="_blank" rel="noopener">' + esc(_k("fAh", T(W.ah))) + "</a>";
  if (window.FBC && FBC.foot) FBC.foot(f, { px: 1, extra: x }); else f.innerHTML = x;
}
var last = null;
function render() {
  document.documentElement.lang = LANGS[li()]; document.title = T(W.title);
  $("stage").setAttribute("aria-label", T(W.sceneA)); $("miso").setAttribute("aria-label", T(W.liftA));
  if (HD) HD.paint(); foot(); draw();
}
addEventListener("fbl:lang", function () { render(); if (S) home(); else setup(); });
addEventListener("hashchange", function () { arrive(); });

/* offline copy (sw.js: network first, own files only) */
if ("serviceWorker" in navigator && window.isSecureContext) addEventListener("load", function () {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
    document.addEventListener("visibilitychange", function () { if (!document.hidden) reg.update().catch(function () {}); });
  }).catch(function () {});
});

render();
var came = arrive(); if (!came) home();
/* the three steps once, to someone who opens the app fresh; someone arriving with a pot sees Popo hand it over instead */
try { if (!localStorage.getItem("gb_seen")) { localStorage.setItem("gb_seen", "1"); if (HD && HD.steps && !S && !came) setTimeout(function () { HD.steps(); }, 500); } } catch (e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
window.GB = { W: W, S: function () { return S; }, D: function () { return D; }, home: home, pack: pack, unpack: unpack, draw: draw,
  grow: function () { if (!S) return; S.seed.pts = 2; S.seed.stageAt = now() - 3 * 864e5; S.seed.last = now(); save(); home(); } };
})();
</script>
