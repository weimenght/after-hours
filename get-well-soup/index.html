    return '<section class="screen">' + potArt() + "<h1>" + esc(T(W.makeTitle)) + '</h1><p class="lede">' + esc(T(W.makeLead)) + "</p>" +

      '<div><label for="me">' + esc(T(W.fromLabel)) + '</label><input id="me" maxlength="24" autocomplete="nickname" placeholder="' + esc(T(W.fromPh)) + '" value="' + esc(st.me) + '"></div>' +
      '<div><label for="nt">' + esc(T(W.noteLabel)) + '</label><textarea id="nt" maxlength="160" placeholder="' + esc(T(W.notePh)) + '"></textarea></div>' +
      '<button type="button" class="btn" id="go1" disabled>' + esc(T(W.next)) + "</button>" +
      (st.pots.length ? '<button type="button" class="link" id="seePots">' + esc(T(W.myPots)) + "</button>" : "") + "</section>";
  },
  offers: function () {
    return '<section class="screen"><h2>' + esc(T(W.offerTitle)) + '</h2><p class="lede">' + esc(T(W.offerLead)) + '</p><div class="offers" id="pick">' +
      OFFERS.map(function (k) { return card(k, st.offers.indexOf(k) >= 0); }).join("") + "</div>" +
      '<div class="grow"></div><button type="button" class="btn" id="go2"' + (st.offers.length ? "" : " disabled") + ">" + esc(T(W.makeLink)) + "</button>" +
      '<button type="button" class="link" id="back">' + esc(T(W.back)) + "</button></section>";
  },
  share: function () {
    var p = st.pots[0];
    return '<section class="screen">' + potArt({ tag: 1 }) + "<h2>" + esc(F(W.shareTitle, { n: p.to })) + '</h2><p class="lede">' + esc(T(W.shareLead)) + "</p>" +
      '<div class="linkbox">' + esc(p.url) + '</div><div class="grow"></div>' +
      '<button type="button" class="btn" id="send">' + esc(T(W.send)) + '</button><button type="button" class="btn quiet" id="cp">' + esc(T(W.copy)) + "</button>" +
      '<button type="button" class="link" id="seePots">' + esc(T(W.myPots)) + "</button></section>";
  },
  pots: function () {
    var fmt = function (t) { try { return new Date(t).toLocaleDateString(T(W.locale), { month: "short", day: "numeric" }); } catch (e) { return ""; } };
    return '<section class="screen"><h2>' + esc(T(W.potsTitle)) + '</h2><p class="lede">' + esc(T(W.potsLead)) + "</p><div>" +
      (st.pots.length ? st.pots.map(function (p, i) {
        return '<div class="pot"><div><b>' + esc(p.to) + "</b><small>" + esc(F(W.sentOn, { d: fmt(p.at) })) + "</small></div>" +
          (p.done ? '<span class="pill done">' + esc(T(W.delivered)) + "</span>" : '<button type="button" class="pill" data-i="' + i + '">' + esc(T(W.onWay)) + "</button>") + "</div>";
      }).join("") : '<p class="lede">' + esc(T(W.potsEmpty)) + "</p>") +
      '</div><div class="grow"></div><button type="button" class="btn quiet" id="newPot">' + esc(T(W.newPot)) + "</button></section>";
  },
  go: function () {
    return '<section class="screen">' + doorArt() + "<h1>" + esc(F(W.goTitle, { n: goName })) + '</h1><p class="lede">' + esc(T(W.goLead)) + "</p>" +
      '<div class="grow"></div><button type="button" class="btn sage" id="away">' + esc(T(W.goBtn)) + "</button></section>";
  },
  open: function () {
    return '<section class="screen">' + potArt({ tag: 1 }) + "<h1>" + esc(F(W.openTitle, { n: pot.t })) + "</h1>" +
      (pot.n ? '<div class="note">' + esc(pot.n) + "<span>" + esc(pot.f) + "</span></div>" : "") +
      '<div class="grow"></div><button type="button" class="btn" id="lift">' + esc(T(W.lift)) + "</button></section>";
  },
  choose: function () {
    return '<section class="screen"><h2>' + esc(T(W.chooseTitle)) + '</h2><p class="lede">' + esc(F(W.chooseLead, { f: pot.f })) + '</p><div class="offers" id="pick">' +
      pot.o.map(function (k) { return card(k, pick === k); }).join("") + '</div><div class="grow"></div>' +
      '<button type="button" class="btn" id="this"' + (pick ? "" : " disabled") + ">" + esc(T(W.thisOne)) + "</button></section>";
  },
  tell: function () {
    return '<section class="screen">' + potArt({ open: 1, tag: 1 }) + "<h2>" + esc(F(W.tellTitle, { f: pot.f, o: O(pick, "p") })) + '</h2><p class="lede">' + esc(T(W.tellLead)) + "</p>" +
      '<div class="grow"></div><button type="button" class="btn" id="tellGo">' + esc(F(W.tellBtn, { f: pot.f })) + '</button>' +
      '<button type="button" class="btn quiet" id="tellCp">' + esc(T(W.copyReply)) + '</button><button type="button" class="link" id="again">' + esc(T(W.changeMind)) + "</button></section>";
  },
  rest: function () {
    return '<section class="screen">' + bedArt() + "<h1>" + esc(T(W.restTitle)) + '</h1><p class="lede">' + esc(F(W.restLead, { f: pot.f })) + "</p>" +
      '<div class="grow"></div><button type="button" class="link" id="again">' + esc(T(W.changeMind)) + "</button></section>";

var B = {
  make: function () {
    var chk = function () { $("go1").disabled = !($("to").value.trim() && $("me").value.trim()); };
    on("to", "input", chk); on("me", "input", chk); chk();
    on("go1", null, function () { st.me = $("me").value.trim(); save(); draft = { t: $("to").value.trim(), n: $("nt").value.trim() }; show("offers"); });
    on("seePots", null, function () { show("pots"); });
  },
  offers: function () {
    on("pick", null, function (e) { var b = e.target.closest(".card"); if (!b) return; var k = b.getAttribute("data-k"), i = st.offers.indexOf(k);
      if (i >= 0) st.offers.splice(i, 1); else st.offers.push(k); st.offers = OFFERS.filter(function (x) { return st.offers.indexOf(x) >= 0; }); save(); show("offers"); });
    on("back", null, function () { show("make"); });
    on("go2", null, function () {
      var p = { v: 1, id: Math.random().toString(36).slice(2, 9), t: draft.t, f: st.me, n: draft.n, o: st.offers.slice() };
      st.pots.unshift({ id: p.id, to: p.t, at: Date.now(), url: base() + "#s=" + enc(p), done: false });
      st.pots = st.pots.slice(0, 30); save(); draft = null; show("share");
    });
  },
  share: function () {
    var p = st.pots[0];
    on("send", null, function () { share(F(W.shareText, { t: p.to, f: st.me }) + "\n" + p.url); });
    on("cp", null, function () { copy(p.url); });
    on("seePots", null, function () { show("pots"); });
  },
  pots: function () {
    Array.prototype.forEach.call(document.querySelectorAll(".pill[data-i]"), function (b) { b.addEventListener("click", function () {
      var p = st.pots[+b.getAttribute("data-i")]; if (!p) return; p.done = true; save(); goName = p.to; show("go"); }); });
    on("newPot", null, function () { show("make"); });
  },
  go: function () { on("away", null, function () { toast(T(W.bye)); setTimeout(function () { show("make"); }, 900); }); },
  open: function () { on("lift", null, function () { show("choose"); }); },
  choose: function () {
    on("pick", null, function (e) { var b = e.target.closest(".card"); if (!b) return; pick = b.getAttribute("data-k"); show("choose"); });
    on("this", null, function () { if (pick) show("tell"); });
  },
  tell: function () {
    var txt = F(W.reply, { f: pot.f, o: O(pick, "p") });
    var sent = function (ok) { if (ok) { chose(pot.id, pick); show("rest"); } };
    on("tellGo", null, function () { share(txt).then(sent); });
    on("tellCp", null, function () { copy(txt).then(sent); });
    on("again", null, function () { chose(pot.id, null); show("choose"); });
  },
  rest: function () { on("again", null, function () { chose(pot.id, null); show("choose"); }); }
};
var draft = null;

function show(sc) {
  if (sc === "share" && !st.pots.length) sc = "make";
  if (sc === "go" && !goName) sc = "pots";
  cur = sc; document.body.className = MID[sc] ? "mid" : "";
  $("app").innerHTML = V[sc](); if (B[sc]) B[sc](); scrollTo(0, 0); chrome();
}

/* ---------- language, footer ---------- */
/* the after-hours header (handoff/DESIGN.md §3): name home · ? three steps · ⋯ language, privacy */
var HD = window.FBC && FBC.head ? FBC.head($("head"), { icon: '<img src="./icon.svg" alt="">', name: function () { return T(W.app); }, home: function () { scrollTo({ top: 0, behavior: "smooth" }); }, steps: [

  ["Choose what you'd really bring: soup, tissues and honey, something to watch, a quiet call. Send the link.", "选你真的会带去的：汤、纸巾和蜂蜜、可以看的东西、一通安静的电话。把链接发过去。", "選你真的會帶去的：湯、紙巾和蜂蜜、可以看的東西、一通安靜的電話。把連結傳過去。", "Elige lo que de verdad llevarías: sopa, pañuelos y miel, algo que ver, una llamada tranquila. Envía el enlace.", "Tria el que de debò portaries: sopa, mocadors i mel, alguna cosa per mirar, una trucada tranquil·la. Envia l'enllaç."],

/* a language change redraws the screen but keeps what was typed on the first one */
function redraw() {
  if (cur === "make") { var v = { to: $("to").value, me: $("me").value, nt: $("nt").value }; show("make"); $("to").value = v.to; $("me").value = v.me; $("nt").value = v.nt; $("to").dispatchEvent(new Event("input")); }
  else show(cur);
}
addEventListener("fbl:lang", redraw);

/* ---------- start: a pot in the link is for the one with the cold; otherwise you're putting one on ---------- */
function boot() {
  var p = readHash(); pot = null; pick = null;
  if (p === false) { show("make"); toast(T(W.bad)); return; }
  if (p) { pot = p; var c = chose(p.id); if (c && p.o.indexOf(c) >= 0) { pick = c; show("rest"); } else show("open"); return; }
  show("make");
}
addEventListener("hashchange", boot);   /* a pot opened in a tab where the app is already open */
window.GW = { state: function () { return st; }, screen: function () { return cur; }, pot: function () { return pot; }, show: show };
boot();
