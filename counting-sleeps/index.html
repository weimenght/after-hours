<style>
  /* the after-hours paper (handoff/DESIGN.md §2): one paper, a lamplit dark, one accent (the chain's red); Fraunces for what's
     said, Figtree for the interface, Caveat only for what's handwritten (the jar's slips, Popo's note, the printed strips) */
  :root {
    --paper:#F5EEE3; --paper2:#ECE2D2; --card:#FFFBF4; --field:#FFFDF8; --ink:#2B231C; --soft:#6E6156; --line:#DDD0BC; --line2:#C9B89E;
    --acc:#C8412F; --accd:#A8331F; --acc-ink:#FFFFFF; --soft-acc:#F6E2DB; --gold:#E2A93B;
    --shadow:0 1px 2px rgba(70,45,20,.06), 0 6px 20px rgba(70,45,20,.08); color-scheme:light;
    --say:"Fraunces","Songti SC","Noto Serif SC","Noto Serif CJK SC",Georgia,serif;
    --ui:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --hand:"Caveat","Figtree",cursive;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#17130F; --paper2:#211B16; --card:#251E18; --field:#1C1612; --ink:#F3EADB; --soft:#B8A992; --line:#3B3128; --line2:#54463A; --accd:#E07A68; --soft-acc:#3A221C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28); color-scheme:dark; } }
  :root[data-theme="dark"] { --paper:#17130F; --paper2:#211B16; --card:#251E18; --field:#1C1612; --ink:#F3EADB; --soft:#B8A992; --line:#3B3128; --line2:#54463A; --accd:#E07A68; --soft-acc:#3A221C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28); color-scheme:dark; }
  :lang(zh-Hant) { --say:"Fraunces","Songti TC","Noto Serif TC","Noto Serif CJK TC",Georgia,serif; --ui:"Figtree","PingFang HK","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--paper); color:var(--ink); }
  body { font:17px/1.45 var(--ui); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  header { --ahh-bg:var(--card); --ahh-ink:var(--ink); --ahh-line:var(--line); --ahh-name:var(--say); max-width:380px; margin:0 auto; padding:max(4px, env(safe-area-inset-top)) 16px 0; }
  header .ahh-nm { font-size:20px; font-weight:600; }
  header .ahh-b { width:44px; height:44px; padding:0; font:600 17px/1 var(--ui); color:var(--ink); background:var(--card); border:1px solid var(--line2); border-radius:999px; cursor:pointer; }
  header .ahh-b svg { width:18px; height:18px; }
  #app { max-width:380px; margin:0 auto; padding:0 16px; }
  .screen { min-height:calc(100vh - 60px); min-height:calc(100dvh - 60px); display:flex; flex-direction:column; justify-content:center; gap:16px; padding:12px 0 32px; animation:in .35s ease; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation:none; } }
  h1, h2 { font-family:var(--say); font-weight:600; color:var(--ink); letter-spacing:-.005em; }
  h1 { font-size:32px; line-height:1.12; white-space:pre-line; }
  h2 { font-size:21px; line-height:1.2; }
  html:lang(zh) h1, html:lang(zh-Hant) h1 { font-size:28px; line-height:1.3; }
  .lede { font-size:17px; color:var(--soft); }
  .note { font-size:15px; color:var(--soft); }
  .err { color:var(--accd); font-size:15px; min-height:1.3em; }
  .center { text-align:center; align-items:center; }
  /* a host's line: the name in the accent, the words in Fraunces; asleep, Popo's note on the fridge in her hand */
  .say { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:12px 16px; }
  .say b { display:block; font:700 11px/1.4 var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--accd); margin-bottom:2px; }
  .say p { font:500 17px/1.45 var(--say); }
  .say.paper { background:#FFFBF0; color:#3a2a1c; border-color:#E2D3B8; border-radius:4px; transform:rotate(-.6deg); box-shadow:0 1px 3px rgba(70,45,20,.15); }
  .say.paper b { color:#9a5a3a; }
  .say.paper p { font:600 22px/1.25 var(--hand); }
  .say.mei b { color:var(--soft); }
  .say.mei p { font-style:italic; }
  /* the scene: a pixel picture framed like a print (18 px corners, a hairline) */
  .scene { width:100%; height:auto; display:block; image-rendering:pixelated; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); background:var(--paper2); }
  label, .lbl { display:block; font:600 15px/1.3 var(--ui); margin-bottom:6px; }
  label small { font-weight:400; color:var(--soft); margin-left:6px; }
  input, textarea { width:100%; font:inherit; font-size:17px; color:var(--ink); background:var(--field); border:1px solid var(--line2); border-radius:12px; padding:12px 14px; outline:none; }
  textarea { min-height:96px; resize:vertical; line-height:1.35; }
  input:focus, textarea:focus { outline:2px solid color-mix(in oklab, var(--acc) 60%, transparent); outline-offset:1px; }
  ::placeholder { color:color-mix(in oklab, var(--soft) 75%, transparent); }
  /* pill buttons: one filled main action, one quieter */
  .btn { display:block; width:100%; min-height:50px; font:600 17px/1.2 var(--ui); padding:13px 18px; border-radius:999px; border:1px solid var(--acc); background:var(--acc); color:var(--acc-ink); cursor:pointer; box-shadow:0 1px 2px rgba(70,45,20,.12); transition:background .15s, transform .1s; }
  .btn:hover { background:var(--accd); border-color:var(--accd); }
  .btn:active { transform:translateY(1px); }
  .btn.ghost { background:var(--card); color:var(--ink); border-color:var(--line2); box-shadow:none; }
  .btn.ghost:hover { background:var(--paper2); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btns { display:flex; flex-direction:column; gap:10px; width:100%; }
  .link { background:none; border:0; font:600 15px var(--ui); color:var(--accd); cursor:pointer; padding:10px 6px; text-decoration:underline; text-underline-offset:3px; }
  .btn:focus-visible, .row:focus-visible, .day:focus-visible, .link:focus-visible, .calh button:focus-visible, .nick:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .row { display:flex; align-items:center; gap:14px; width:100%; text-align:left; min-height:64px; padding:12px 16px; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); cursor:pointer; }
  .row:hover { border-color:var(--line2); }
  .row .ic { width:38px; height:30px; flex:none; }
  .row b { display:block; font:600 18px/1.2 var(--say); }
  .row small { display:block; font-size:14px; color:var(--soft); line-height:1.3; margin-top:2px; }
  /* you are here: three dots over the three questions of a new chain */
  .steps { display:flex; gap:6px; }
  .steps i { width:8px; height:8px; border-radius:50%; background:var(--line2); }
  .steps i.on { background:var(--acc); }
  .steps i.done { background:color-mix(in oklab, var(--acc) 45%, var(--line2)); }
  /* your name, typed once: a chip that opens into the field */
  .nick { display:inline-flex; align-items:center; gap:6px; font:600 15px var(--ui); color:var(--ink); background:var(--card); border:1px solid var(--line2); border-radius:999px; padding:8px 14px; cursor:pointer; }
  /* the calendar */
  .cal { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:8px 10px 10px; }
  .calh { display:flex; align-items:center; justify-content:space-between; font:600 18px var(--say); }
  .calh button { border:0; background:none; font:400 28px/1 var(--ui); color:var(--ink); width:44px; height:44px; border-radius:999px; cursor:pointer; }
  .calh button:hover { background:var(--paper2); }
  .calh button:disabled { opacity:.25; cursor:default; background:none; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .grid .wd { font-size:12px; font-weight:700; color:var(--soft); padding:4px 0; text-transform:uppercase; }
  .day { height:42px; border:0; border-radius:999px; background:none; font:16px var(--ui); color:var(--ink); cursor:pointer; font-variant-numeric:tabular-nums; }
  .day:hover:not(:disabled) { background:var(--paper2); }
  .day:disabled { opacity:.28; cursor:default; }
  .day.today { box-shadow:inset 0 0 0 1px var(--line2); }
  .day[aria-pressed=true], .day[aria-pressed=true]:hover { background:var(--acc); color:var(--acc-ink); font-weight:700; }
  /* the chain */
  .big { font:600 76px/.95 var(--say); color:var(--acc); font-variant-numeric:lining-nums; }
  .big small { font:500 24px var(--say); color:var(--ink); margin-left:8px; }
  .meta { color:var(--soft); font-size:15px; margin-top:4px; }
  .jarbox { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .jar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; min-height:44px; padding:10px; background:var(--paper2); border:1px dashed var(--line2); border-radius:12px; }
  .slip { width:36px; height:20px; border-radius:3px; background:#FFF8E8; border:1px solid #CDB894; box-shadow:0 1px 1px rgba(0,0,0,.12); }
  .said { list-style:none; display:flex; flex-direction:column; gap:10px; }
  .said li { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font:600 23px/1.15 var(--hand); }
  html:lang(zh) .said li, html:lang(zh-Hant) .said li { font:500 17px/1.45 var(--say); }
  .said li small { display:block; font:700 11px var(--ui); color:var(--soft); text-transform:uppercase; letter-spacing:.1em; margin-bottom:2px; }
  .said li.th { background:var(--soft-acc); border-color:color-mix(in oklab, var(--acc) 30%, var(--line)); }
  .qr { background:#fff; padding:10px; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); line-height:0; align-self:center; }
  .qr svg { width:230px; height:230px; display:block; }
  /* a sheet over the page (a slip for the jar) */
  .sheet { position:fixed; inset:0; z-index:20; background:rgba(30,20,12,.45); display:flex; align-items:flex-end; justify-content:center; }
  .sheet .in { width:100%; max-width:440px; background:var(--paper); border:1px solid var(--line); border-bottom:0; border-radius:22px 22px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
  @media (min-width:720px) { .sheet { align-items:center; } .sheet .in { border-bottom:1px solid var(--line); border-radius:22px; } }
  /* the phone put down */
  .down { position:fixed; inset:0; z-index:30; background:#0d0a08; color:#efe5d4; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; cursor:pointer; }
  .down p { font:500 26px var(--say); }
  .down small { font-size:14px; opacity:.55; }
  .down .pets { display:flex; gap:22px; align-items:flex-end; }
  .down .pets svg { height:46px; width:auto; }
  footer { max-width:380px; margin:0 auto; padding:0 16px 24px; font-size:13px; color:var(--soft); text-align:center; }
  footer a { color:inherit; }
  body.mid footer { display:none; }
  #print { display:none; }
  /* handoff/DESIGN.md §5: phone one column; tablet centred at 560; computer the scene (560) beside the flow (480) */
  @media (min-width: 720px) { header, #app, footer { max-width:592px; } }
  @media (min-width: 1024px) {
    header, #app, footer { max-width:1112px; }
    .screen:not(:has(> .scene)) { max-width:480px; margin-left:auto; margin-right:auto; width:100%; }
    .screen:has(> .scene) { display:grid; grid-template-columns:minmax(0, 560px) minmax(0, 480px); justify-content:space-between; column-gap:40px; row-gap:0; align-content:center; }
    .screen:has(> .scene) > .scene { grid-column:1; grid-row:1 / span 30; align-self:center; width:100%; margin:0; position:sticky; top:80px; }
    .screen:has(> .scene) > :not(.scene) { grid-column:2; margin-bottom:14px; }
  }
  /* the printed chain: strips to cut, number 1 at the bottom of the chain */
  @page { size:A4; margin:12mm; }
  @media print {
    html, body { background:#fff !important; color:#000; }
    body > *:not(#print) { display:none !important; }
    #print { display:block !important; font-family:var(--ui); color:#222; }
    #print h3 { font:600 20pt/1.1 var(--say); margin:0 0 2mm; }
    #print p { font-size:10pt; color:#555; margin:0 0 5mm; }
    #print .strips { display:grid; grid-template-columns:1fr 1fr; gap:0 6mm; }
    #print .strip { height:19mm; border:.5mm dashed #999; border-top-width:0; display:flex; align-items:center; justify-content:space-between; padding:0 5mm; break-inside:avoid; }
    #print .strip:nth-child(1), #print .strip:nth-child(2) { border-top-width:.5mm; }
    #print .strip b { font:700 20pt var(--hand); }
    #print .strip span { font:15pt var(--hand); color:#555; }
    #print .strip.r { background:#fbe3dc; } #print .strip.g { background:#fbefd4; } #print .strip.w { background:#fff; }
    #print .strip, #print .strip.r, #print .strip.g { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
