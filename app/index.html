", "visitar", "visitar"], "pSite": ["website", "网站", "網站", "web", "web"], "pAwake": ["awake", "醒着", "醒著", "despierto", "despert"], "pAsleep": ["asleep", "在睡觉", "在睡覺", "durmiendo", "dormint"], "pCalling": ["calling…", "呼叫中…", "呼叫中…", "llamando…", "trucant…"], "pEnded": ["Call ended", "通话结束", "通話結束", "Llamada finalizada", "Trucada finalitzada"], "pReal": ["Now call someone real", "现在，打给一个真实的人", "現在，打給一個真實的人", "Ahora llama a alguien de verdad", "Ara truca a algú de veritat"], "pHang": ["Hang up", "挂断", "結束通話", "Colgar", "Penjar"], "pKeyHint": ["Who haven't you called in a while?", "有谁很久没打电话了？", "有誰很久沒打電話了？", "¿A quién hace tiempo que no llamas?", "A qui fa temps que no truques?"], "pKeyNote": ["This opens your real phone. That's the point.", "这会打开你真正的电话。这就是重点。", "這會開啟你真正的電話。這就是重點。", "Esto abre tu teléfono de verdad. Esa es la idea.", "Això obre el teu telèfon de veritat. Aquesta és la idea."], "vmWM": ["Hi, it's Wei. I'm probably out with people right now. Leave me a note instead, I read every one.", "你好，我是 Wei。我现在大概正和人在一起。给我写封信吧，每封我都会读。", "你好，我是 Wei。我現在大概正和人在一起。給我寫封信吧，每封我都會讀。", "Hola, soy Wei. Seguramente estoy con gente ahora mismo. Déjame una nota, las leo todas.", "Hola, sóc en Wei. Segurament ara estic amb gent. Deixa'm una nota, les llegeixo totes."], "vmTitle": ["Voicemail", "语音信箱", "語音信箱", "Buzón de voz", "Bústia de veu"], "vmWrite": ["Write to Wei", "写信给 Wei", "寫信給 Wei", "Escribir a Wei", "Escriure a en Wei"], "cWei": ["Next Door, Wei speaking. Your seat's free. Come by, and bring someone with you this time.", "隔壁，我是 Wei。你的位子空着呢。过来坐坐吧，这次带个人一起来。", "隔壁，我是 Wei。你的位子空著呢。過來坐坐吧，這次帶個人一起來。", "Al Lado, habla Wei. Tu sitio está libre. Pásate, y esta vez trae a alguien.", "Al Costat, parla en Wei. El teu lloc és lliure. Passa, i aquesta vegada porta algú."], "cWeiZ": ["z z z… (Wei's asleep. Try him after six.)", "呼……呼……（Wei 在睡觉。六点以后再打。）", "呼……呼……（Wei 在睡覺。六點以後再打。）", "z z z… (Wei duerme. Prueba después de las seis.)", "z z z… (En Wei dorm. Prova-ho després de les sis.)"], "cMei": ["ugh, who calls? text me. jk. go call someone who'd actually be happy to hear you.", "啊，谁还打电话啊？发信息啦。开玩笑的。去打给一个真的会很高兴听到你声音的人。", "啊，誰還打電話啊？發信息啦。開玩笑的。去打給一個真的會很高興聽到你聲音的人。", "ugh, ¿quién llama hoy en día? escríbeme. es broma. llama a alguien que se alegre de oírte.", "ugh, qui truca encara? escriu-me. és broma. truca a algú que s'alegri de sentir-te."], "cMeiZ": ["(voicemail) it's mei. i'm asleep. obviously.", "（语音信箱）我是 Mei。我在睡觉。很明显吧。", "（語音信箱）我是 Mei。我在睡覺。很明顯吧。", "(buzón) soy mei. estoy durmiendo. obvio.", "(bústia) sóc la mei. estic dormint. òbviament."], "cPopo": ["Wah, you call me! Eat already or not? Now call your own grandma also lah.", "哎呀，你打给我呀！吃饭了没有？现在也打给你自己的婆婆啦。", "哎呀，你打給我呀！吃飯了沒有？現在也打給你自己的婆婆啦。", "¡Ay, me llamas! ¿Comiste ya o no? Ahora llama a tu abuela también, eh.", "Ai, em truques! Ja has menjat o no? Ara truca a la teva àvia també, eh."], "cPopoZ": ["Shh. Popo's asleep. Nobody wakes Popo.", "嘘。婆婆睡了。谁都不许吵醒婆婆。", "噓。婆婆睡了。誰都不許吵醒婆婆。", "Shh. Popo duerme. A Popo no la despierta nadie.", "Xxt. La Popo dorm. Ningú desperta la Popo."], "cMiso": ["Mrrp. (She sat on the phone. The call ended.)", "咪呜。（她坐在了电话上。通话结束了。）", "咪嗚。（她坐在了電話上。通話結束了。）", "Mrrp. (Se ha sentado encima del teléfono. Se cortó.)", "Mrrp. (S'ha assegut sobre el telèfon. S'ha tallat.)"], "cYuzu": ["Mew? (purring, very close to the microphone)", "喵？（贴着话筒呼噜呼噜）", "喵？（貼著話筒呼嚕呼嚕）", "¿Miau? (ronroneando, muy cerca del micrófono)", "Miau? (roncant, molt a prop del micròfon)"], "cCatsZ": ["(purring in their sleep)", "（睡梦中呼噜呼噜）", "（睡夢中呼嚕呼嚕）", "(ronronean dormidas)", "(roncs adormits)"], "cMantou": ["Woof! Woof! (his tail is hitting the floor)", "汪！汪！（尾巴拍着地板）", "汪！汪！（尾巴拍著地板）", "¡Guau! ¡Guau! (la cola golpea el suelo)", "Bup! Bup! (la cua pica a terra)"], "cMantouZ": ["(a small, sleepy snore)", "（小小的、困困的呼噜声）", "（小小的、困困的呼嚕聲）", "(un ronquido pequeño y dormido)", "(un ronc petit i adormit)"], "mPick": ["Last thing: what would help most right now? I'll put a few apps on your home screen to start. The rest wait in the Store.", "最后一件事：你现在最需要什么？我先在你的主屏幕上放几个应用，其他的在商店里等着。", "最後一件事：你現在最需要什麼？我先在你的主螢幕上放幾個應用，其他的在商店裡等著。", "Una última cosa: ¿qué te vendría mejor ahora? Pondré unas pocas apps en tu pantalla de inicio para empezar. El resto esperan en la Tienda.", "Una última cosa: què et aniria millor ara? Posaré unes poques apps a la teva pantalla d'inici per començar. La resta esperen a la Botiga."], "pk1": ["People near me", "身边的人", "身邊的人", "La gente cerca de mí", "La gent a prop meu"], "pk2": ["Someone far away", "远方的某个人", "遠方的某個人", "Alguien lejos", "Algú lluny"], "pk3": ["My family", "我的家人", "我的家人", "Mi familia", "La meva família"], "pk4": ["Something small, just for me", "一点小事，给我自己", "一點小事，給我自己", "Algo pequeño, solo para mí", "Alguna cosa petita, només per a mi"], "pkAll": ["Show me everything", "全部都给我看看", "全部都給我看看", "Enséñamelo todo", "Ensenya-m'ho tot"], "mPicked": ["Done. They're on your home screen. Everything else is in the Store, whenever you want it.", "好了。它们在你的主屏幕上了。其他的都在商店里，随时可以拿。", "好了。它們在你的主螢幕上了。其他的都在商店裡，隨時可以拿。", "Hecho. Ya están en tu pantalla de inicio. Todo lo demás está en la Tienda, cuando quieras.", "Fet. Ja són a la teva pantalla d'inici. Tota la resta és a la Botiga, quan vulguis."], "mGot": ["Got it, thanks", "知道了，谢谢", "知道了，謝謝", "Entendido, gracias", "Entesos, gràcies"], "mWM7": ["One more thing: what would you like here? An app you wish existed, something that's off, anything at all. Reply below; only I read it.", "还有一件事：你希望这里有什么？一个你想要的应用、哪里不对劲，什么都行。在下面回复我，只有我会看。", "還有一件事：你希望這裡有什麼？一個你想要的應用、哪裡不對勁，什麼都行。在下面回覆我，只有我會看。", "Una cosa más: ¿qué te gustaría encontrar aquí? Una app que echas de menos, algo que no va bien, lo que sea. Respóndeme abajo; solo lo leo yo.", "Una cosa més: què t'agradaria trobar aquí? Una app que trobes a faltar, alguna cosa que no va bé, el que sigui. Respon-me a sota; només ho llegeixo jo."], "fbPh": ["Tell Wei what you think…", "跟 Wei 说说你的想法……", "跟 Wei 說說你的想法……", "Dile a Wei lo que piensas…", "Digues a en Wei què en penses…"], "fbIdea": ["💡 An idea", "💡 一个点子", "💡 一個點子", "💡 Una idea", "💡 Una idea"], "fbOff": ["🔧 Something's off", "🔧 有地方不对", "🔧 有地方不對", "🔧 Algo no va bien", "🔧 Alguna cosa no va bé"], "fbWish": ["✨ I wish…", "✨ 我希望……", "✨ 我希望……", "✨ Ojalá…", "✨ Tant de bo…"], "fbNote": ["No name needed. Only Wei reads it.", "不用留名字。只有 Wei 会看。", "不用留名字。只有 Wei 會看。", "No hace falta nombre. Solo lo lee Wei.", "No cal nom. Només ho llegeix en Wei."], "fbThanks": ["*folds it and puts it in his pocket* Thank you. I read every one, usually after the last cup.", "*折好，放进口袋* 谢谢。每一条我都会看，通常是在最后一杯之后。", "*摺好，放進口袋* 謝謝。每一條我都會看，通常是在最後一杯之後。", "*lo dobla y se lo guarda en el bolsillo* Gracias. Las leo todas, normalmente después de la última taza.", "*el plega i se'l guarda a la butxaca* Gràcies. Les llegeixo totes, normalment després de l'última tassa."], "fbSlow": ["That's plenty for today, thank you. Write again tomorrow?", "今天已经够多啦，谢谢。明天再写？", "今天已經夠多啦，謝謝。明天再寫？", "Por hoy ya es mucho, gracias. ¿Me escribes mañana?", "Per avui ja n'hi ha prou, gràcies. M'escrius demà?"], "fbFail": ["Couldn't send it just now. Your words are still in the box; try again in a moment.", "刚才没发出去。你的话还在框里，等一下再试试。", "剛才沒發出去。你的話還在框裡，等一下再試試。", "No se ha podido enviar ahora. Tus palabras siguen en la caja; prueba en un momento.", "No s'ha pogut enviar ara. Les teves paraules encara són a la capsa; torna-ho a provar d'aquí a un moment."], "fbKept": ["Kept on this phone (your privacy choice). Nothing was sent.", "按你的隐私选择，留在了这部手机上。什么都没有发送。", "按你的隱私選擇，留在了這部手機上。什麼都沒有傳送。", "Guardado en este móvil (tu elección de privacidad). No se ha enviado nada.", "Desat en aquest mòbil (la teva elecció de privacitat). No s'ha enviat res."], "sTell": ["Tell Wei what you think", "跟 Wei 说说你的想法", "跟 Wei 說說你的想法", "Dile a Wei lo que piensas", "Digues a en Wei què en penses"], "mSay": ["Say it in person", "当面说吧", "當面說吧", "Dilo en persona", "Digues-ho en persona"], "mSaid": ["Better said in person.", "这句话，当面说更好。", "這句話，當面說更好。", "Mejor dicho en persona.", "Millor dit en persona."], "mWM1": ["Hi, I'm Wei. This phone holds everything I make after hours.", "你好，我是 Wei。这部手机里装着我下班后做的所有东西。", "你好，我是 Wei。這部手機裡裝著我下班後做的所有東西。", "Hola, soy Wei. Este móvil guarda todo lo que hago fuera de horas.", "Hola, sóc en Wei. Aquest mòbil guarda tot el que faig fora d'hores."], "mWM2": ["Sixteen small, free things. Each one ends with you putting the phone down, next to someone.", "十六个小小的、免费的东西。每一个的结尾，都是你放下手机，待在某个人身边。", "十六個小小的、免費的東西。每一個的結尾，都是你放下手機，待在某個人身邊。", "Dieciséis cosas pequeñas y gratis. Todas terminan contigo dejando el móvil, junto a alguien.", "Setze coses petites i gratis. Totes acaben amb tu deixant el mòbil, al costat d'algú."], "mWM3": ["Tap any icon to open it. No account, nothing to install, and nothing you do is sent anywhere.", "点任何一个图标就能打开。不用注册，不用安装，你做的任何事都不会发送出去。", "點任何一個圖示就能開啟。不用註冊，不用安裝，你做的任何事都不會發送出去。", "Toca cualquier icono para abrirlo. Sin cuenta, nada que instalar, y nada de lo que hagas se envía.", "Toca qualsevol icona per obrir-la. Sense compte, res a instal·lar, i res del que facis s'envia."], "mNav": ["Two ways around: ‹ at the top goes back one page. The bar at the bottom takes you home from anywhere; tap it or swipe it up when you're done with an app, or lost.", "两种走法：顶上的 ‹ 回到上一页。最下面那条横杠，在哪里都能带你回主屏幕；用完一个应用，或者迷路了，就点它或往上滑。", "兩種走法：頂上的 ‹ 回到上一頁。最下面那條橫槓，在哪裡都能帶你回主螢幕；用完一個應用，或者迷路了，就點它或往上滑。", "Dos maneras de moverte: ‹ arriba vuelve a la página anterior. La barra de abajo te lleva al inicio desde cualquier sitio; tócala o deslízala hacia arriba cuando acabes con una app, o si te pierdes.", "Dues maneres de moure't: ‹ a dalt torna a la pàgina anterior. La barra de baix et porta a l'inici des de qualsevol lloc; toca-la o llisca-la amunt quan acabis amb una app, o si et perds."], "mNavBack": ["back one page", "回上一页", "回上一頁", "una página atrás", "una pàgina enrere"], "mNavHome": ["home, from anywhere", "在哪里都能回主屏幕", "在哪裡都能回主螢幕", "al inicio, desde donde sea", "a l'inici, des d'on sigui"], "mWM4": ["The card at the top changes with the hour, and lights up what's already yours today.", "最上面的卡片会随着时间变化，也会点亮今天已经属于你的东西。", "最上面的卡片會隨著時間變化，也會點亮今天已經屬於你的東西。", "La tarjeta de arriba cambia con la hora y enciende lo que ya es tuyo hoy.", "La targeta de dalt canvia amb l'hora i encén el que ja és teu avui."], "mWM5": ["Settings has your language, your name and what this phone keeps, for every app at once.", "设置里有语言、你的名字，和这部手机保存的东西，所有应用一起管。", "設定裡有語言、你的名字，和這部手機儲存的東西，所有應用一起管。", "En Ajustes están tu idioma, tu nombre y lo que guarda este móvil, para todas las apps a la vez.", "A Configuració hi ha el teu idioma, el teu nom i el que guarda aquest mòbil, per a totes les apps alhora."], "mWM6": ["When you're done, press Put the phone down. That part is the whole point.", "用完了，就按“放下手机”。那一步才是全部的意义。", "用完了，就按“放下手機”。那一步才是全部的意義。", "Cuando termines, pulsa Deja el móvil. Esa parte es lo importante.", "Quan acabis, prem Deixa el mòbil. Aquesta part és el que importa."], "mPopo1": ["Eat already or not?", "吃饭了没有？", "吃飯了沒有？", "¿Comiste ya o no?", "Ja has menjat o no?"], "mPopo2": ["Every day I got one small thing for you. Open my jar, take one paper. {app:lt}", "我每天都有一件小事给你。打开我的罐子，拿一张纸条。{app:lt}", "我每天都有一件小事給你。開啟我的罐子，拿一張紙條。{app:lt}", "Cada día tengo una cosita para ti. Abre mi tarro, coge un papel. {app:lt}", "Cada dia tinc una coseta per a tu. Obre el meu pot, agafa un paper. {app:lt}"], "mPopo3": ["One question a week, ask your grandma in person. Write two lines, keep the answer lor. {app:ap}", "一个星期一个问题，当面问你的婆婆。写两行字，把答案留下来。{app:ap}", "一個星期一個問題，當面問你的婆婆。寫兩行字，把答案留下來。{app:ap}", "Una pregunta por semana, pregúntale a tu abuela en persona. Dos líneas para guardar la respuesta. {app:ap}", "Una pregunta per setmana, pregunta-la a la teva àvia en persona. Dues línies per guardar la resposta. {app:ap}"], "mPopo4": ["Want people come your house? Pick a day, send them the link. {app:co}", "想请人来家里？选个日子，把链接发给他们。{app:co}", "想請人來家裡？選個日子，把連結發給他們。{app:co}", "¿Quieres gente en casa? Elige un día y mándales el enlace. {app:co}", "Vols gent a casa? Tria un dia i envia'ls l'enllaç. {app:co}"], "mPopo5": ["New Year's Eve, twelve grapes at my table. Don't be late ah. {app:tg}", "年三十晚上……不对，是除夕夜，来我桌上吃十二颗葡萄。别迟到啊。{app:tg}", "年三十晚上……不對，是除夕夜，來我桌上吃十二顆葡萄。別遲到啊。{app:tg}", "Nochevieja, doce uvas en mi mesa. No llegues tarde, eh. {app:tg}", "Cap d'any, dotze grans de raïm a la meva taula. No arribis tard, eh. {app:tg}"], "mMei1": ["ok quick tour bc wei is slow", "好，快速导览，因为 Wei 太慢了", "好，快速導覽，因為 Wei 太慢了", "ok tour rápido porque wei es lento", "ok tour ràpid perquè en wei és lent"], "mMei2": ["someone far away? book dinner for two. same night, two cities, two candles. my mom's in new york, we do sundays {app:tc}", "有人在远方？订一顿两个人的晚饭。同一晚，两座城市，两根蜡烛。我妈在纽约，我们每个星期天都吃 {app:tc}", "有人在遠方？訂一頓兩個人的晚飯。同一晚，兩座城市，兩根蠟燭。我媽在紐約，我們每個星期天都吃 {app:tc}", "¿alguien lejos? reserva cena para dos. misma noche, dos ciudades, dos velas. mi madre está en nueva york, lo hacemos los domingos {app:tc}", "algú lluny? reserva sopar per a dos. mateixa nit, dues ciutats, dues espelmes. la meva mare és a nova york, ho fem els diumenges {app:tc}"], "mMei3": ["for two people who live apart: {app:ho}", "给分隔两地的两个人：{app:ho}", "給分隔兩地的兩個人：{app:ho}", "para dos personas que viven lejos: {app:ho}", "per a dues persones que viuen lluny: {app:ho}"], "mMei4": ["a postcard that opens on its day. a bunch of flowers in a link. {app:sh} {app:fs}", "一张到了那天才打开的明信片。一束装在链接里的花。{app:sh} {app:fs}", "一張到了那天才開啟的明信片。一束裝在連結裡的花。{app:sh} {app:fs}", "una postal que se abre el día que toca. un ramo de flores en un enlace. {app:sh} {app:fs}", "una postal que s'obre el dia que toca. un ram de flors en un enllaç. {app:sh} {app:fs}"], "mMei5": ["and three words in someone's language > three hundred on duolingo {app:vo}", "还有，用别人的语言说三个词 > 背三百个单词 {app:vo}", "還有，用別人的語言說三個詞 > 背三百個單詞 {app:vo}", "y tres palabras en el idioma de alguien > trescientas en una app {app:vo}", "i tres paraules en l'idioma d'algú > tres-centes en una app {app:vo}"], "mMei6": ["language is in settings. you're welcome", "语言在设置里。不用谢", "語言在設定裡。不用謝", "el idioma está en ajustes. de nada", "l'idioma és a configuració. de res"], "mWei1": ["Evening. The lamps are on.", "晚上好。灯都亮了。", "晚上好。燈都亮了。", "Buenas noches. Las lámparas están encendidas.", "Bon vespre. Els llums són encesos."], "mWei2": ["Nearby is a little town. Walk in, sit at the counter, lie in the park, do nothing for a while. Then go back to yours. {app:nb}", "近邻是一个小镇。走进来，坐在吧台边，躺在公园里，什么都不做待一会儿。然后回到你自己的生活。{app:nb}", "近鄰是一個小鎮。走進來，坐在吧檯邊，躺在公園裡，什麼都不做待一會兒。然後回到你自己的生活。{app:nb}", "Cerca es un pueblecito. Entra, siéntate en la barra, túmbate en el parque, no hagas nada un rato. Luego vuelve al tuyo. {app:nb}", "A Prop és un poblet. Entra, seu a la barra, estira't al parc, no facis res una estona. Després torna al teu. {app:nb}"], "mWei3": ["If you can't sleep, there's a slow train with a window seat. {app:st}", "睡不着的话，有一列慢车，靠窗的位子给你留着。{app:st}", "睡不著的話，有一列慢車，靠窗的位子給你留著。{app:st}", "Si no puedes dormir, hay un tren lento con asiento de ventanilla. {app:st}", "Si no pots dormir, hi ha un tren lent amb seient de finestra. {app:st}"], "mWei4": ["Lend a book by hand, or build a little town with your own people. {app:bp} {app:hg}", "亲手借出一本书，或者和你自己的人一起建一座小镇。{app:bp} {app:hg}", "親手借出一本書，或者和你自己的人一起建一座小鎮。{app:bp} {app:hg}", "Presta un libro en mano, o construye un pueblecito con los tuyos. {app:bp} {app:hg}", "Deixa un llibre en mà, o construeix un poblet amb els teus. {app:bp} {app:hg}"], "mCats1": ["meow.", "喵。", "喵。", "miau.", "miau."], "mCats2": ["*Yuzu puts one paw on a card. One card a day, the same for everyone.* {app:pw}", "*柚子把一只爪子放在一张牌上。一天一张，每个人都是同一张。* {app:pw}", "*柚子把一隻爪子放在一張牌上。一天一張，每個人都是同一張。* {app:pw}", "*Yuzu pone una pata sobre una carta. Una al día, la misma para todos.* {app:pw}", "*La Yuzu posa una pota sobre una carta. Una al dia, la mateixa per a tothom.* {app:pw}"], "mCats3": ["*Miso pushes your phone off the table*", "*味噌把你的手机推下了桌子*", "*味噌把你的手機推下了桌子*", "*Miso tira tu móvil de la mesa*", "*La Miso tira el teu mòbil de la taula*"], "mDog1": ["woof!", "汪！", "汪！", "¡guau!", "bup!"], "mDog2": ["*brings you the leash* Twenty minutes, one corner, phones in pockets. {app:ww}", "*把牵绳叼给你* 二十分钟，一个街角，手机放口袋。{app:ww}", "*把牽繩叼給你* 二十分鐘，一個街角，手機放口袋。{app:ww}", "*te trae la correa* Veinte minutos, una esquina, móviles en el bolsillo. {app:ww}", "*et porta la corretja* Vint minuts, una cantonada, mòbils a la butxaca. {app:ww}"], "mDog3": ["*sits by the door, tail going*", "*坐在门边，尾巴摇个不停*", "*坐在門邊，尾巴搖個不停*", "*se sienta junto a la puerta, moviendo la cola*", "*s'asseu a la porta, movent la cua*"], "eFrom": ["from", "来自", "來自", "de", "de"], "eOpen": ["Open {app}", "打开{app}", "開啟{app}", "Abrir {app}", "Obre {app}"], "eUnsub": ["To unsubscribe, put the phone down.", "退订方法：放下手机。", "退訂方法：放下手機。", "Para darte de baja, deja el móvil.", "Per donar-te de baixa, deixa el mòbil."], "eInbox": ["Inbox", "收件箱", "收件箱", "Recibidos", "Safata d'entrada"], "e_nb_s": ["Your seat at the counter is free", "吧台边你的位子空着", "吧檯邊你的位子空著", "Tu sitio en la barra está libre", "El teu lloc a la barra és lliure"], "e_nb_b": ["Nearby is a little world that sends you back to yours. Lie in the park, borrow a book, play the jukebox, or just sit. Nobody counts how long you stay.\nThe drinks are on the house. The company is the point.", "近邻是一个会把你送回自己生活的小世界。躺在公园里，借一本书，点一首歌，或者就坐着。没有人会数你待了多久。\n饮料免费。陪伴才是重点。", "近鄰是一個會把你送回自己生活的小世界。躺在公園裡，借一本書，點一首歌，或者就坐著。沒有人會數你待了多久。\n飲料免費。陪伴才是重點。", "Cerca es un mundo pequeño que te devuelve al tuyo. Túmbate en el parque, toma un libro prestado, pon la gramola o simplemente siéntate. Nadie cuenta cuánto te quedas.\nLas bebidas corren de nuestra cuenta. Lo importante es la compañía.", "A Prop és un món petit que et torna al teu. Estira't al parc, agafa un llibre en préstec, posa el tocadiscos o simplement seu. Ningú compta quanta estona et quedes.\nLes begudes van a compte de la casa. El que importa és la companyia."], "e_st_s": ["A window seat on the slow train", "慢车上靠窗的位子", "慢車上靠窗的位子", "Asiento de ventanilla en el tren lento", "Seient de finestra al tren lent"], "e_st_b": ["The night train leaves whenever you board it. Watch the lights go by, listen to the rails, and get off when you're ready to call someone.", "夜车在你上车的时候出发。看窗外的灯一盏盏过去，听铁轨的声音，等你想打电话给谁了，就下车。", "夜車在你上車的時候出發。看窗外的燈一盞盞過去，聽鐵軌的聲音，等你想打電話給誰了，就下車。", "El tren nocturno sale cuando subes. Mira pasar las luces, escucha las vías y bájate cuando tengas ganas de llamar a alguien.", "El tren de nit surt quan hi puges. Mira passar els llums, escolta les vies i baixa quan tinguis ganes de trucar a algú."], "e_bp_s": ["Real books, lent by hand", "真正的书，亲手借出", "真正的書，親手借出", "Libros de verdad, prestados en mano", "Llibres de veritat, deixats en mà"], "e_bp_b": ["Put the books from your shelf on a little list and let your neighbours borrow them. You hand each one over in person. That's the whole system, and it works.", "把你书架上的书列成一张小清单，让邻居来借。每一本都亲手交过去。整个系统就这样，而且行得通。", "把你書架上的書列成一張小清單，讓鄰居來借。每一本都親手交過去。整個系統就這樣，而且行得通。", "Pon los libros de tu estantería en una lista y deja que tus vecinos los tomen prestados. Cada uno se entrega en mano. Ese es todo el sistema, y funciona.", "Posa els llibres del teu prestatge en una llista i deixa que els veïns els agafin. Cadascun es dona en mà. Aquest és tot el sistema, i funciona."], "e_hg_s": ["A town your people build together", "一座由你的人一起建起来的小镇", "一座由你的人一起建起來的小鎮", "Un pueblo que construyen los tuyos", "Un poble que construeixen els teus"], "e_hg_b": ["Start a little town with your family or friends. Each place is something you do for each other: showing up, saying it, looking after, having fun. Then meet in a real one.", "和家人或朋友一起开一座小镇。每个地方都是你们为彼此做的一件事：出现、说出口、照顾、一起玩。然后在真实的地方见面。", "和家人或朋友一起開一座小鎮。每個地方都是你們為彼此做的一件事：出現、說出口、照顧、一起玩。然後在真實的地方見面。", "Empieza un pueblecito con tu familia o amigos. Cada lugar es algo que hacéis el uno por el otro: estar, decirlo, cuidar, divertirse. Luego quedad en uno de verdad.", "Comença un poblet amb la teva família o amics. Cada lloc és una cosa que feu l'un per l'altre: ser-hi, dir-ho, cuidar, divertir-se. Després quedeu en un de veritat."], "e_lt_s": ["One small thing for you today", "今天给你的一件小事", "今天給你的一件小事", "Una cosita para ti hoy", "Una coseta per a tu avui"], "e_lt_b": ["Open my jar, take one paper. Small thing to do offline today: call your auntie, cook one egg for somebody, sit outside ten minutes.\nThen go do lah, don't keep reading.", "打开我的罐子，拿一张纸条。今天做一件离线的小事：打电话给你阿姨，给谁煎一个蛋，在外面坐十分钟。\n然后就去做啦，别一直看手机。", "開啟我的罐子，拿一張紙條。今天做一件離線的小事：打電話給你阿姨，給誰煎一個蛋，在外面坐十分鐘。\n然後就去做啦，別一直看手機。", "Abre mi tarro, coge un papel. Una cosita para hacer hoy sin pantalla: llama a tu tía, fríe un huevo para alguien, siéntate fuera diez minutos.\nLuego ve a hacerlo, eh, no sigas leyendo.", "Obre el meu pot, agafa un paper. Una coseta per fer avui sense pantalla: truca a la teva tieta, fregeix un ou per a algú, seu fora deu minuts.\nDesprés vés a fer-ho, eh, no continuïs llegint."], "e_ap_s": ["This week's question", "这个星期的问题", "這個星期的問題", "La pregunta de esta semana", "La pregunta d'aquesta setmana"], "e_ap_b": ["Every week one question. Ask your grandma, your dad, your old auntie. In person, not on the phone ah. Write two lines to keep the answer.\nEnd of the year, print a small book. Very nice one.", "每个星期一个问题。问你的婆婆、你爸爸、你家的老阿姨。要当面问，不要在电话里问啊。写两行字，把答案留下。\n到了年底，印成一本小书。很漂亮的。", "每個星期一個問題。問你的婆婆、你爸爸、你家的老阿姨。要當面問，不要在電話裡問啊。寫兩行字，把答案留下。\n到了年底，印成一本小書。很漂亮的。", "Cada semana una pregunta. Pregúntale a tu abuela, a tu padre, a tu tía mayor. En persona, no por teléfono, eh. Dos líneas para guardar la respuesta.\nA final de año, imprime un librito. Muy bonito.", "Cada setmana una pregunta. Pregunta-la a la teva àvia, al teu pare, a la teva tieta gran. En persona, no per telèfon, eh. Dues línies per guardar la resposta.\nA final d'any, imprimeix un llibret. Molt bonic."], "e_tg_s": ["Twelve grapes at midnight", "午夜的十二颗葡萄", "午夜的十二顆葡萄", "Doce uvas a medianoche", "Dotze grans de raïm a mitjanit"], "e_tg_b": ["New Year's Eve, one grape for every bell, one month for every grape. Say a wish for each month to the people at your table, not to the phone.", "除夕夜，钟响一下吃一颗葡萄，一颗葡萄代表一个月。把每个月的愿望说给你桌上的人听，不是说给手机听。", "除夕夜，鐘響一下吃一顆葡萄，一顆葡萄代表一個月。把每個月的願望說給你桌上的人聽，不是說給手機聽。", "Nochevieja, una uva por campanada, un mes por uva. Di un deseo para cada mes a la gente de tu mesa, no al móvil.", "Cap d'any, un gra per campanada, un mes per gra. Digues un desig per a cada mes a la gent de la teva taula, no al mòbil."], "e_co_s": ["Come over this week?", "这周来我家坐坐？", "這週來我家坐坐？", "¿Vienes a casa esta semana?", "Vens a casa aquesta setmana?"], "e_co_b": ["Have people over. Pick a day, write what you're cooking, send the link. Guests open it and say if they're coming. No group chat needed.\nI cook, you wash up.", "请人来家里。选个日子，写上你要做什么菜，把链接发出去。客人打开就能说来不来。不用建群。\n我做饭，你洗碗。", "請人來家裡。選個日子，寫上你要做什麼菜，把連結發出去。客人開啟就能說來不來。不用建群。\n我做飯，你洗碗。", "Invita a gente a casa. Elige un día, escribe qué cocinas y manda el enlace. Los invitados lo abren y dicen si vienen. Sin grupo de chat.\nYo cocino, tú friegas.", "Convida gent a casa. Tria un dia, escriu què cuines i envia l'enllaç. Els convidats l'obren i diuen si vénen. Sense grup de xat.\nJo cuino, tu rentes els plats."], "e_pw_s": ["*one paw on today's card*", "*一只爪子按在今天的牌上*", "*一隻爪子按在今天的牌上*", "*una pata sobre la carta de hoy*", "*una pota sobre la carta d'avui*"], "e_pw_b": ["*Miso sits on the deck. Yuzu turns one card over.*\nOne card a day, from two cats, the same card for everyone. It usually asks you to go and see someone.\n*mrrp.*", "*味噌坐在牌堆上。柚子翻开一张牌。*\n一天一张，两只猫给的，每个人都是同一张。它通常是让你去见一个人。\n*咪呜。*", "*味噌坐在牌堆上。柚子翻開一張牌。*\n一天一張，兩隻貓給的，每個人都是同一張。它通常是讓你去見一個人。\n*咪嗚。*", "*Miso se sienta sobre la baraja. Yuzu da la vuelta a una carta.*\nUna carta al día, de dos gatas, la misma para todos. Normalmente te pide que vayas a ver a alguien.\n*mrrp.*", "*La Miso s'asseu sobre la baralla. La Yuzu gira una carta.*\nUna carta al dia, de dues gates, la mateixa per a tothom. Normalment et demana que vagis a veure algú.\n*mrrp.*"], "e_ww_s": ["WALK? WALK??", "散步？散步？？", "散步？散步？？", "¿PASEO? ¿¿PASEO??", "PASSEIG? PASSEIG??"], "e_ww_b": ["Two people, one corner, one time, twenty minutes. No map, no tracking. Phones stay in pockets.\n*Mantou is already at the door.*", "两个人，一个街角，一个时间，二十分钟。没有地图，没有定位。手机放在口袋里。\n*馒头已经在门口等着了。*", "兩個人，一個街角，一個時間，二十分鐘。沒有地圖，沒有定位。手機放在口袋裡。\n*饅頭已經在門口等著了。*", "Dos personas, una esquina, una hora, veinte minutos. Sin mapa, sin rastreo. Los móviles en el bolsillo.\n*Mantou ya está en la puerta.*", "Dues persones, una cantonada, una hora, vint minuts. Sense mapa, sense seguiment. Els mòbils a la butxaca.\n*En Mantou ja és a la porta.*"], "e_aw_s": ["Three small things", "三件小事", "三件小事", "Tres cosas pequeñas", "Tres coses petites"], "e_aw_b": ["Every night, three things only. What weather inside you, one rose, one thorn, one bud. Then who make your day better. Mei ask the weather, I ask the flowers, Wei ask the people.\nEnd of the month, make a little book. Then go tell that person thank you ah, in person.", "每天晚上，三件小事就好。你心里什么天气，一朵玫瑰，一根刺，一个花苞。还有谁让你今天好过一点。Mei问天气，我问花，Wei问人。\n到了月底，做成一本小书。然后去跟那个人说声谢谢啦，要当面讲。", "每天晚上，三件小事就好。你心裡什麼天氣，一朵玫瑰，一根刺，一個花苞。還有誰讓你今天好過一點。Mei問天氣，我問花，Wei問人。\n到了月底，做成一本小書。然後去跟那個人說聲謝謝啦，要當面講。", "Cada noche, solo tres cosas. Qué tiempo dentro de ti, una rosa, una espina, un brote. Luego quién hace mejor tu día. Mei pregunta el tiempo, yo las flores, Wei la gente.\nFin de mes, haces librito. Luego ve a decir gracias a esa persona, en persona, ¿eh?", "Cada nit, només tres coses. Quin temps fa dins teu, una rosa, una espina, un brot. Després, qui t'ha fet millor el dia. La Mei pregunta pel temps, jo per les flors, en Wei per la gent.\nA final de mes, en fas un llibret. I després ves a dir gràcies a aquella persona, en persona, eh."], "e_tc_s": ["dinner for two, however far apart", "两个人的晚饭，不管隔多远", "兩個人的晚飯，不管隔多遠", "cena para dos, aunque estéis lejos", "sopar per a dos, encara que sigueu lluny"], "e_tc_b": ["book a table for two people in different cities. you each see the time in your own zone, cook the same dish, light a candle, and eat together.\nmy mom's in new york. sunday dinner, every week. it's honestly nice.", "给在不同城市的两个人订一张桌子。你们各自看到自己时区的时间，做同一道菜，点一根蜡烛，一起吃饭。\n我妈在纽约。每个星期天一起吃晚饭。说真的，挺好的。", "給在不同城市的兩個人訂一張桌子。你們各自看到自己時區的時間，做同一道菜，點一根蠟燭，一起吃飯。\n我媽在紐約。每個星期天一起吃晚飯。說真的，挺好的。", "reserva una mesa para dos personas en ciudades distintas. cada uno ve la hora en su zona, cocináis el mismo plato, encendéis una vela y cenáis juntos.\nmi madre está en nueva york. cena del domingo, cada semana. la verdad, está bien.", "reserva una taula per a dues persones en ciutats diferents. cadascú veu l'hora a la seva zona, cuineu el mateix plat, enceneu una espelma i soparu junts.\nla meva mare és a nova york. sopar de diumenge, cada setmana. la veritat, està bé."], "e_ho_s": ["for two people in different cities", "给在不同城市的两个人", "給在不同城市的兩個人", "para dos personas en ciudades distintas", "per a dues persones en ciutats diferents"], "e_ho_b": ["when your day ends, theirs is starting. handoff shows you each other's day and sleep, and lets you leave a note or a voice message that arrives at the right hour.", "你的一天结束时，对方的一天才刚开始。Handoff 让你们看到彼此的白天和睡眠，还能留一张字条或一段语音，在对的时间送到。", "你的一天結束時，對方的一天才剛開始。Handoff 讓你們看到彼此的白天和睡眠，還能留一張字條或一段語音，在對的時間送到。", "cuando tu día termina, el suyo empieza. handoff os enseña el día y el sueño del otro, y te deja una nota o un audio que llega a la hora justa.", "quan el teu dia s'acaba, el seu comença. handoff us mostra el dia i la son de l'altre, i et deixa una nota o un àudio que arriba a l'hora justa."], "e_sh_s": ["a postcard that waits for its day", "一张等着它那天的明信片", "一張等著它那天的明信片", "una postal que espera su día", "una postal que espera el seu dia"], "e_sh_b": ["write it today, seal it, and it opens on their birthday. or the day they start the new job. or whenever. you pick the day.", "今天写好，封起来，等到对方生日那天才打开。或者是开始新工作那天。或者随便哪天。日子你来定。", "今天寫好，封起來，等到對方生日那天才開啟。或者是開始新工作那天。或者隨便哪天。日子你來定。", "escríbela hoy, ciérrala, y se abre el día de su cumpleaños. o el día que empiece el trabajo nuevo. o cuando sea. tú eliges el día.", "escriu-la avui, tanca-la, i s'obre el dia del seu aniversari. o el dia que comenci la feina nova. o quan sigui. tu tries el dia."], "e_fs_s": ["a few flowers, for someone real", "几枝花，送给一个真实的人", "幾枝花，送給一個真實的人", "unas flores, para alguien de verdad", "unes flors, per a algú de veritat"], "e_fs_b": ["tie up to nine stems, pick the paper, write a little card, send it as a link. they untie the ribbon.\nthe card ends with: call me and say you got it.", "最多扎九枝花，选好包装纸，写一张小卡片，用链接寄出去。对方会解开丝带。\n卡片的最后一句是：打电话告诉我你收到了。", "最多扎九枝花，選好包裝紙，寫一張小卡片，用連結寄出去。對方會解開絲帶。\n卡片的最後一句是：打電話告訴我你收到了。", "ata hasta nueve flores, elige el papel, escribe una tarjeta y mándala como enlace. le toca desatar la cinta.\nla tarjeta acaba así: llámame y dime que te ha llegado.", "lliga fins a nou flors, tria el paper, escriu una targeta i envia-la com a enllaç. li toca deslligar la cinta.\nla targeta acaba així: truca'm i digues que t'ha arribat."], "e_vo_s": ["three words in someone's language", "用别人的语言说三个词", "用別人的語言說三個詞", "tres palabras en el idioma de alguien", "tres paraules en l'idioma d'algú"], "e_vo_b": ["a few words in someone else's language. not to pass a test. to say good morning to the neighbour, or thank you to your friend's grandma, and watch their face.", "学几个别人语言里的词。不是为了考试。是为了跟邻居说早安，跟朋友的婆婆说谢谢，然后看看他们的表情。", "學幾個別人語言裡的詞。不是為了考試。是為了跟鄰居說早安，跟朋友的婆婆說謝謝，然後看看他們的表情。", "unas pocas palabras en el idioma de otra persona. no para aprobar. para darle los buenos días al vecino, o las gracias a la abuela de tu amiga, y ver su cara.", "unes poques paraules en l'idioma d'una altra persona. no per aprovar. per donar el bon dia al veí, o les gràcies a l'àvia de la teva amiga, i veure-li la cara."], "kPhoto": ["Photo", "照片", "照片", "Foto", "Foto"], "kRoll": ["Camera roll", "相机胶卷", "相機膠捲", "Carrete", "Rodet"], "kSnapped": ["Kept on this phone", "保存在这部手机上", "儲存在這部手機上", "Guardada en este móvil", "Guardada en aquest mòbil"], "kReal": ["The best photos have you in them. Take one with your real camera, with someone.", "最好的照片里都有你。用你真正的相机，和某个人一起拍一张吧。", "最好的照片裡都有
