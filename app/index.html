<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="referrer" content="same-origin" data-fbr><script data-fbl data-mode="game" src="/fbkit/fb.js?v=b8492e21ce"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>after-hours</title>
<meta name="description" content="Everything Wei makes after hours, in one place on your phone. Small, free things that end off the screen, next to someone.">
<meta name="theme-color" content="#120F18">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="after-hours"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* after-hours.work/app/: one phone, one screen (the owner, Nov 6). On a phone it IS the screen; on anything wider it stands
   in the middle as a phone. Home: the line, the hour's card, the works and Settings; the dock: Phone, Messages, Mail, Camera. */
:root{--ink:#120F18;--ink2:#1B1624;--ink3:#251E31;--paper:#ECE6DA;--dim:#9C93A8;--lamp:#F2A33A;--line:rgba(236,230,218,.12);--ic:58px;--serif:'Instrument Serif',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--mono:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B090F;color:var(--paper);overflow:hidden}
body{font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:8px}
.room{position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 40%,#21192E,#0B090F 75%);z-index:-1}
.room p{position:absolute;left:0;right:0;bottom:10px;text-align:center;margin:0;font:12px/1.4 var(--mono);color:var(--dim);letter-spacing:.03em;padding:0 16px}
/* the phone: on a real phone it fills the screen */
.phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--ink)}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate}
html.framed .phone{width:390px;height:844px;flex:none;border-radius:56px;background:#050407;padding:12px;box-shadow:0 0 0 2px #2E2738,0 0 0 9px #0E0B12,0 40px 90px -20px rgba(0,0,0,.8),0 0 120px -30px rgba(242,163,58,.25);transform-origin:center}
html.framed .screen{inset:12px;border-radius:44px}
html.framed .phone::before,html.framed .phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#2E2738;left:-11px}
html.framed .phone::before{top:150px;height:60px;box-shadow:0 80px 0 #2E2738}
html.framed .phone::after{left:auto;right:-11px;top:200px;height:90px}
/* wallpaper: the sky follows the hour, stars after dark, a row of lit windows along the bottom */
.sky{position:absolute;inset:0;z-index:-1;transition:background 1.2s}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.55;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.day .sky i{display:none}
.skyline{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:-1;opacity:.9;pointer-events:none}
/* top row */
.top{position:absolute;top:0;left:0;right:0;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:space-between;z-index:50;font:600 14px/1 var(--sans);pointer-events:none}
.top>*{pointer-events:auto}
html.framed .top{height:54px;padding:6px 28px 0}
.clock{display:none;font-variant-numeric:tabular-nums}
html.framed .clock{display:block}
.mark{display:inline-flex;align-items:center;gap:.4em;font:italic 400 19px/1 var(--serif)}
.mark svg{width:18px;height:18px}
html.framed .mark{display:none}
.chip{font:700 11px/1 var(--mono);letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:7px 10px;min-height:30px;background:rgba(18,15,24,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* home */
.home{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(48px + env(safe-area-inset-top)) 16px 0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .35s}
html.framed .home{padding-top:58px}
.home.away{transform:scale(.92);opacity:.25;filter:blur(2px)}
.lock h2 em{color:var(--lamp);font-style:italic}
.stack{flex:none;display:flex;gap:10px;margin:6px -16px 0;padding:0 16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.stack::-webkit-scrollbar{display:none}
.stack>.w{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;min-width:0}
.w:not(.now){padding:12px 14px;border-radius:22px;background:rgba(27,22,36,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column}
.w h2{margin:0;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.w .wl{margin:auto 0 0;font:400 16px/1.25 var(--serif);color:var(--paper)}
.sdots{flex:none;display:flex;justify-content:center;gap:6px;padding:7px 0 0}
.sdots i{width:6px;height:6px;border-radius:50%;background:rgba(236,230,218,.25);transition:background .2s}
.sdots i.on{background:var(--paper)}
.faces{display:flex;justify-content:space-between;margin:12px 0 10px;gap:4px}
.faces button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1;font:600 11px/1 var(--sans);color:var(--paper)}
.faces .av{width:42px;height:42px;position:relative;overflow:visible}
.faces .av canvas,.faces .av svg{border-radius:50%}
.faces button.z .av{opacity:.45;filter:grayscale(.5)}
.faces button.z .av::after{content:"z";position:absolute;top:-6px;right:-3px;font:italic 700 14px/1 var(--serif);color:var(--dim)}
.faces button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wmoon .mrow{display:flex;gap:14px;align-items:center;margin:10px 0}
.wmoon svg{flex:none;width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(255,236,190,.35))}
.wmoon b{display:block;font:400 26px/1.05 var(--serif)}
.wmoon small{display:block;margin-top:4px;font:11px/1.2 var(--mono);color:var(--dim)}
.w p.who{margin:10px 0 0;font:italic 400 24px/1.12 var(--serif)}
.w .acts2{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.w .acts2 a,.w .acts2 button{flex:1;justify-content:center;padding:9px 10px;min-height:0;font-size:13px}
.now{margin:0;padding:12px 14px;border-radius:22px;background:linear-gradient(160deg,rgba(242,163,58,.14),rgba(242,163,58,0) 60%),rgba(27,22,36,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.now-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.now h2{margin:0;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.down{font:600 11.5px/1 var(--sans);padding:7px 10px;border-radius:999px;background:var(--lamp);color:var(--ink);white-space:nowrap}
.quote{display:block;width:100%;text-align:left;margin:10px 0 0;padding:0}
.quote q{display:block;quotes:"\201C" "\201D";font:italic 400 21px/1.22 var(--serif)}
.quote q i{font-style:normal;color:var(--dim)}
.qrow{display:flex;align-items:baseline;gap:12px;margin-top:5px;min-width:0}
.qrow small{font:11px/1 var(--mono);color:var(--lamp);letter-spacing:.04em;white-space:nowrap}
.quote:active{opacity:.7}
.qapp{display:none;font:600 12px/1 var(--sans);color:var(--lamp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qapp.on{display:inline-block}
.banner{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:85;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:rgba(46,38,64,.94);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.85,.25,1);text-align:left}
html.framed .banner{top:12px}
.banner.on{transform:none}
.banner .av{width:38px;height:38px}
.banner .tx{flex:1;min-width:0}
.banner b{display:block;font:600 14px/1.2 var(--sans)}
.banner b small{font:500 11px/1 var(--mono);color:var(--dim);margin-left:6px;letter-spacing:.04em}
.banner .pv{display:block;font:13.5px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .two{display:flex;gap:46px;justify-content:center}
.call .two div{display:flex;flex-direction:column;align-items:center;gap:8px;font:600 13px/1 var(--sans)}
.ok,.no{width:70px;height:70px;border-radius:50%;display:grid;place-items:center}
.ok{background:#4FA466}.no{background:#D9534A}
.ok svg,.no svg{width:30px;height:30px}
.now ul{list-style:none;margin:10px 0 0;padding:9px 0 0;border-top:1px solid var(--line);display:grid;gap:4px}
.now li{font:400 16px/1.25 var(--serif)}
.now li a{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.now li small{font:11px/1 var(--mono);color:var(--dim);white-space:nowrap}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:0 4px;padding:10px 0 6px;align-content:center}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;border-radius:16px;transition:transform .2s}
.tile:active{transform:scale(.92)}
.ico{position:relative;width:var(--ic);height:var(--ic);border-radius:calc(var(--ic) * .25);background:var(--ink3);box-shadow:0 6px 16px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.ico img,.ico svg{width:100%;height:100%;display:block}
.tile.lit .ico{box-shadow:0 0 0 2px var(--g),0 8px 26px -6px var(--g)}
.tile.lit .ico::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.tile b{font:500 11.5px/1.15 var(--sans);max-width:100%;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dock{margin:0 -4px calc(10px + env(safe-area-inset-bottom));padding:12px 14px;display:flex;justify-content:space-around;border-radius:30px;background:rgba(37,30,49,.62);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
html.framed .dock{margin-bottom:22px}
.dock .ico{--ic:58px}
.dock .tile b{display:none}
/* the apps: full-screen sheets over home */
.app{position:absolute;inset:0;z-index:40;background:var(--ink);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.app.open{transform:none;visibility:visible}
.bar{flex:none;padding:calc(48px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:var(--ink);position:relative;z-index:2}
html.framed .bar{padding-top:58px}
.bar h3{margin:0;font:400 34px/1 var(--serif);letter-spacing:-.01em}
.bar .bk{font:600 15px/1 var(--sans);color:var(--lamp);padding:6px 0;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.bar .sp{flex:1}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 0 14px}
.hb{flex:none;height:calc(26px + env(safe-area-inset-bottom));display:flex;align-items:flex-start;justify-content:center;padding-top:9px;cursor:pointer}
.hb::before{content:"";width:134px;height:5px;border-radius:3px;background:rgba(236,230,218,.55)}
html.framed .hb{height:30px}
.hb{touch-action:none}
.hb.glow::before{background:var(--lamp);animation:hbg 1.2s ease-in-out 3}
@keyframes hbg{50%{transform:scaleX(1.12);box-shadow:0 0 12px var(--lamp)}}
.bk.glow{animation:bkg 1.2s ease-in-out 3;border-radius:999px}
@keyframes bkg{50%{background:rgba(242,163,58,.18);box-shadow:0 0 0 6px rgba(242,163,58,.18)}}
.navg{display:grid;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22)}
.navg>div{display:flex;align-items:center;gap:10px;font:13px/1.3 var(--sans);color:var(--dim)}
.navg .nk{flex:none;min-width:96px;font:600 14px/1 var(--sans);color:var(--lamp)}
.navg .nb{flex:none;min-width:96px;display:flex;justify-content:center}
.navg .nb i{display:block;width:70px;height:5px;border-radius:3px;background:rgba(236,230,218,.7)}
html.light .navg{background:rgba(0,0,0,.06)}
html.light .navg .nb i{background:rgba(40,30,20,.55)}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.on{display:flex}
.sec{margin:16px 18px 6px;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.list{margin:0 12px;border-radius:18px;background:var(--ink2);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:600 15px/1.25 var(--sans)}
.row .tx small{display:block;font:13px/1.3 var(--sans);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{font:11px/1 var(--mono);color:var(--dim);white-space:nowrap;align-self:flex-start;padding-top:3px}
.row .chev{color:var(--dim);font-size:18px}
.av{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--ink3);display:grid;place-items:center}
.av canvas,.av svg{width:100%;height:100%;image-rendering:pixelated;display:block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:#7FC98A}
.dot.z{background:#6B6478}
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--ink)}
.tabs button{flex:1;padding:9px 0 3px;font:600 11px/1.2 var(--sans);color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected=true]{color:var(--lamp)}
/* contact card */
.card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 18px 4px}
.card .av{width:104px;height:104px}
.card h4{margin:12px 0 2px;font:400 32px/1 var(--serif)}
.card p{margin:4px 0 0;color:var(--dim);font-size:14px}
.acts{display:flex;justify-content:center;gap:10px;margin:16px 12px 6px;flex-wrap:wrap}
.act{flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border-radius:14px;background:var(--ink2);border:1px solid var(--line);font:600 11.5px/1 var(--sans);color:var(--lamp)}
.act svg{width:22px;height:22px}
.act[disabled]{opacity:.35}
/* the call */
.call{position:absolute;inset:0;z-index:70;background:radial-gradient(70% 50% at 50% 30%,#2E2340,#0E0B14);display:none;flex-direction:column;align-items:center;padding:calc(90px + env(safe-area-inset-top)) 26px calc(40px + env(safe-area-inset-bottom));text-align:center}
.call.on{display:flex}
.call .av{width:120px;height:120px;box-shadow:0 0 0 6px rgba(242,163,58,.12)}
.call.ring .av{animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 16px rgba(242,163,58,.04)}}
.call h4{margin:18px 0 4px;font:400 34px/1 var(--serif)}
.call .st{font:12px/1 var(--mono);color:var(--dim);letter-spacing:.06em}
.call q{display:block;margin:28px 0 0;font:400 22px/1.3 var(--serif);quotes:none;min-height:4em}
.call .end{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.hang{width:70px;height:70px;border-radius:50%;background:#D9534A;display:grid;place-items:center}
.hang svg{width:30px;height:30px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--lamp);color:var(--ink);font:600 15px/1 var(--sans);min-height:46px}
.pill.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
/* keypad */
.keyp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 20px}
.keyp input{width:100%;text-align:center;font:400 34px/1.2 var(--sans);letter-spacing:.04em;background:none;border:0;color:var(--paper);outline:none;min-height:46px}
.keyp input::placeholder{font:400 19px/1.3 var(--serif);color:var(--dim);letter-spacing:0}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px 22px;margin:12px 0}
.keys button{width:72px;height:72px;border-radius:50%;background:var(--ink3);font:400 30px/1 var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys button small{font:700 8.5px/1 var(--sans);letter-spacing:.14em;color:var(--dim);margin-top:2px;min-height:8px}
.dial{width:72px;height:72px;border-radius:50%;background:#4FA466;display:grid;place-items:center}
.dial svg{width:30px;height:30px}
.keyp .note{margin:12px 0 0;font:12px/1.4 var(--mono);color:var(--dim);text-align:center}
/* messages */
.thread{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.when{align-self:center;font:11px/1 var(--mono);color:var(--dim);margin:8px 0 4px}
.bub{max-width:80%;align-self:flex-start;padding:9px 13px;border-radius:20px 20px 20px 6px;background:var(--ink3);font:15px/1.4 var(--sans);animation:pop .3s both}
.typing{align-self:flex-start;padding:12px 14px;border-radius:20px 20px 20px 6px;background:var(--ink3);display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{30%{transform:translateY(-4px);opacity:1}0%,60%,100%{opacity:.45}}
.got{align-self:center;margin-top:10px}
.bub.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:var(--lamp);color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.bub i{color:var(--dim);margin-right:.2em}
.achip{display:inline-flex;align-items:center;gap:7px;margin:6px 4px 2px 0;padding:5px 11px 5px 5px;border-radius:999px;background:rgba(236,230,218,.08);border:1px solid var(--line);font:600 13px/1 var(--sans);color:var(--paper);vertical-align:middle}
.achip img{width:22px;height:22px;border-radius:6px}
.kinds{flex:none;display:none;gap:6px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none}
.kinds.on{display:flex}
.kinds button{flex:none;padding:7px 11px;border-radius:999px;border:1px solid var(--line);font:600 12.5px/1 var(--sans);color:var(--paper);white-space:nowrap}
.kinds button[aria-pressed=true]{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
@media (max-width:359px){.kinds{flex-wrap:wrap;overflow:visible}.kinds button{padding:7px 9px;font-size:12px}}   /* the smallest phones: three chips wrap rather than cut off */
.fbnote{flex:none;display:none;margin:0;padding:0 16px 2px;font:11px/1.3 var(--mono);color:var(--dim)}
.fbnote.on{display:block}
.dock .tile .ico.pdot::after{content:"";position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:#E0604A;box-shadow:0 0 0 2px rgba(37,30,49,.9)}
.reply{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.reply input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--ink2);color:var(--paper);font:15px/1.2 var(--sans);outline:none}
.reply input::placeholder{color:var(--dim)}
.reply button{width:36px;height:36px;border-radius:50%;background:var(--lamp);display:grid;place-items:center;color:var(--ink)}
.reply button svg{width:18px;height:18px}
/* mail */
.mail h4{margin:4px 18px 12px;font:400 27px/1.12 var(--serif)}
.from{display:flex;gap:10px;align-items:center;margin:0 18px 14px}
.from .av{width:38px;height:38px}
.from b{display:block;font:600 14.5px/1.2 var(--sans)}
.from small{display:block;font:12px/1.2 var(--mono);color:var(--dim)}

.vf .grid3{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%),linear-gradient(transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%);pointer-events:none}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.shut{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 28px 6px}

.flip{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}

.roll button{aspect-ratio:3/4;overflow:hidden;background:#111}

.photo{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 12px}

.tog{position:relative;flex:none;width:50px;height:30px;border-radius:999px;background:#3A3346;transition:background .2s}

.foot{margin:16px 12px 0;color:var(--dim);font-size:12.5px}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:80;padding:18px;border-radius:22px;background:#2A2236;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.6);display:none;max-height:calc(100% - 70px - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain}

.toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;padding:10px 16px;border-radius:20px;background:#2E2640;border:1px solid var(--line);font:600 13.5px/1.3 var(--sans);width:max-content;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}

/* Put the phone down: the screen goes dark */
.lock{position:absolute;inset:0;z-index:95;background:#07060A;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;opacity:0;visibility:hidden;transition:opacity 1.1s,visibility 1.1s}

/* moving and removing apps: hold an icon; it jiggles; drag to move, − to remove (kept on this phone, ah_app_layout) */
.done{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top));right:14px;z-index:60;padding:8px 16px;border-radius:999px;background:var(--lamp);color:var(--ink);font:700 14px/1 var(--sans)}

.stack>.w[hidden]{display:none !important}

.wmv{display:none;position:absolute;bottom:8px;z-index:5;width:34px;height:30px;border-radius:15px;background:#5A5266;color:#fff;font:700 18px/30px var(--sans);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}

.wgr .row .ctl{display:flex;align-items:center;gap:6px;flex:none}

.wgr .row.off b{color:var(--dim)}
.home.edit .stack>.w{animation:jig2 .4s ease-in-out infinite alternate}
@keyframes jig2{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.home.edit .stack>.w>*:not(.wrm):not(.wmv){pointer-events:none}
.home.nowg .stack,.home.nowg .sdots{display:none}
.home.onew .sdots{visibility:hidden}
.downrow{display:none;flex:none;justify-content:flex-end;padding:8px 2px 0}
.home.nonow .downrow{display:flex}
.home.edit .downrow{visibility:hidden}
.wsheet .list{margin:4px 0 12px}
.wsheet h3{margin:0 0 4px;font:400 22px/1.2 var(--serif)}
.wsheet .hint{margin:0 0 12px;font:12px/1.4 var(--mono);color:var(--dim)}
.home.edit #lang,.home.edit .down{visibility:hidden}

.home.edit .grid .tile{animation:jig .32s ease-in-out infinite alternate;cursor:grab}
.home.edit .grid .tile:nth-child(2n){animation-delay:-.16s;animation-direction:alternate-reverse}
@keyframes jig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.home.edit .grid .tile.drag{animation:none;opacity:.35}

.farR{display:flex;flex-direction:column;gap:6px;margin-top:10px}

/* day mode (Settings → Appearance; html.light): paper screens and cards; the calls and the lock screen stay dark, like a phone's */
html.light{--ink:#F3EDE2;--ink2:#FFFFFF;--ink3:#E9E1D3;--paper:#221C2E;--dim:#6E6680;--line:rgba(34,28,46,.13)}
html.light .now{background:linear-gradient(160deg,rgba(242,163,58,.16),rgba(242,163,58,0) 60%),rgba(255,252,246,.86)}
html.light .w:not(.now){background:rgba(255,252,246,.86)}
html.light .dock{background:rgba(255,252,246,.55)}
html.light .banner{background:rgba(255,252,246,.96)}
html.light .toast,html.light .sheet{background:#FFFDF8;color:var(--paper)}
html.light .hb::before{background:rgba(34,28,46,.35)}
html.light .bub.me{color:#221C2E}
html.light.inapp .top{color:var(--paper)}
html.light.inapp .chip{background:rgba(255,255,255,.6)}
html.light .wmoon svg circle:first-child{fill:#3A3150}
html.light .call,html.light .lock{--paper:#ECE6DA;--dim:#9C93A8;color:#ECE6DA}
html.light .cam{--paper:#ECE6DA;--dim:#9C93A8;--line:rgba(236,230,218,.12);color:#ECE6DA}

/* the desktop (the owner, Nov 7): on a computer /app/ is a desktop, not a phone standing in the middle. The works are icons
   on the left, the widgets a column on the right, the dock along the bottom; an app opens as a window over it (✕ or Esc).
   The Store is the "what" of after-hours.work: a grid of every work, and each one's page in two columns. */
html.desk .room{display:none}
html.desk .phone{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none;transform:none!important;background:var(--ink)}
html.desk .phone::before,html.desk .phone::after{display:none}
html.desk .screen{inset:0;border-radius:0}
html.desk .top{height:42px;padding:0 22px;justify-content:flex-start;gap:16px;background:rgba(18,15,24,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
html.desk .mark{display:inline-flex;order:-1}
html.desk .clock{display:block;margin-left:auto}
html.desk .skyline{height:220px}
html.desk .home{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"grid stack" "down stack" "dock dock";gap:0 36px;padding:70px max(32px,calc((100vw - 1320px) / 2)) 0}
html.desk #grid{grid-area:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));grid-template-rows:none!important;grid-auto-rows:118px;align-content:start;gap:6px;padding:6px 0;overflow-y:auto;scrollbar-width:none;--ic:64px}
html.desk #grid .tile b{font-size:12.5px}
html.desk #stack{grid-area:stack;flex-direction:column;gap:12px;margin:0;padding:0 0 18px;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none;align-self:stretch}
html.desk #stack>.w{flex:none}
html.desk #sdots{display:none}
html.desk #downrow{grid-area:down}
html.desk .dock{grid-area:dock;justify-self:center;margin:6px 0 22px;padding:10px 18px;gap:22px}
html.desk .home.away{transform:none;opacity:.4;filter:blur(1.5px)}

un grup. el grup és la gent. vés a buscar-la"], "q3": ["*sits on your keyboard* meow. (translation: that's enough.)", "*坐在你的键盘上* 喵。（翻译：够了。）", "*坐在你的鍵盤上* 喵。（翻譯：夠了。）", "*se sienta en tu teclado* miau. (traducción: ya basta.)", "*s'asseu al teu teclat* miau. (traducció: ja n'hi ha prou.)"], "q4": ["*drops the leash at your feet* The best app is a walk.", "*把牵绳放在你脚边* 最好的应用，是散步。", "*把牽繩放在你腳邊* 最好的應用，是散步。", "*deja la correa a tus pies* La mejor app es un paseo.", "*et deixa la corretja als peus* La millor app és un passeig."], "q5": ["The moon is free tonight. No download required.", "今晚的月亮免费。不用下载。", "今晚的月亮免費。不用下載。", "La luna es gratis esta noche. No hace falta descargarla.", "La lluna és gratis aquesta nit. No cal descarregar-la."], "q6": ["Wifi weak? Never mind. Hug must be strong one.", "网络不好？没关系。抱抱要用力就好啦。", "網路不好？沒關係。抱抱要用力就好啦。", "¿El wifi va flojo? No pasa nada. El abrazo, fuerte.", "El wifi va fluix? No hi fa res. L'abraçada, ben forta."], "q7": ["Every lit window is someone's whole evening.", "每一扇亮着的窗，都是某个人的整个夜晚。", "每一扇亮著的窗，都是某個人的整個夜晚。", "Cada ventana encendida es la noche entera de alguien.", "Cada finestra encesa és el vespre sencer d'algú."], "q8": ["plot twist: the main character was the friend you forgot to text back", "剧情反转：主角是你忘了回消息的那个朋友", "劇情反轉：主角是你忘了回訊息的那個朋友", "giro de guion: la protagonista era la amiga a la que olvidaste contestar", "gir de guió: la protagonista era l'amiga a qui vas oblidar de contestar"], "q9": ["*knocks your phone off the table* Mrrp. You're welcome.", "*把你的手机推下桌子* 咪呜。不客气。", "*把你的手機推下桌子* 咪嗚。不客氣。", "*tira tu móvil de la mesa* Mrrp. De nada.", "*tira el teu mòbil de la taula* Mrrp. De res."], "q10": ["Tea tastes better when someone else pours it.", "别人倒的茶，总是更好喝。", "別人倒的茶，總是更好喝。", "El té sabe mejor cuando te lo sirve otra persona.", "El te és més bo quan te'l serveix una altra persona."], "q11": ["Screen time? Aiya. Dumpling time is better.", "屏幕时间？哎呀。包饺子的时间比较好啦。", "螢幕時間？哎呀。包餃子的時間比較好啦。", "¿Tiempo de pantalla? Ay. Mejor tiempo de hacer dumplings.", "Temps de pantalla? Ai, ai. Més val temps de fer dumplings."], "q12": ["Woof. (He means: whoever you're thinking of would love a call.)", "汪。（他的意思是：你正想着的那个人，会很高兴接到你的电话。）", "汪。（他的意思是：你正想著的那個人，會很高興接到你的電話。）", "Guau. (Quiere decir: esa persona en la que piensas se alegraría de una llamada.)", "Bup. (Vol dir: aquella persona en qui penses s'alegraria d'una trucada.)"], "q13": ["touch grass. or a dog. dogs count", "去摸摸草。或者摸摸狗。狗也算", "去摸摸草。或者摸摸狗。狗也算", "toca césped. o un perro. los perros cuentan", "toca gespa. o un gos. els gossos compten"], "q14": ["Nothing on this phone is as good as the person across the table.", "这部手机里没有什么，比得上桌子对面的那个人。", "這部手機裡沒有什麼，比得上桌子對面的那個人。", "Nada en este móvil es tan bueno como la persona al otro lado de la mesa.", "Res d'aquest mòbil és tan bo com la persona de l'altra banda de la taula."], "qMore": ["Another line", "再来一句", "再來一句", "Otra frase", "Una altra frase"], "fNye": ["Tonight twelve grapes, one for each bell. Don't eat too fast ah, cannot make wish with mouth full.", "今晚十二颗葡萄，钟响一下吃一颗。别吃太快呀，嘴巴满满的怎么许愿。", "今晚十二顆葡萄，鐘響一下吃一顆。別吃太快呀，嘴巴滿滿的怎麼許願。", "Esta noche doce uvas, una por campanada. No comas rápido, eh, con la boca llena no se pide deseo.", "Aquesta nit dotze grans de raïm, un per campanada. No mengis de pressa, eh, amb la boca plena no es demanen desitjos."], "fNewYear": ["New year, same counter. Who's the first person you'll call this year?", "新的一年，还是这张吧台。今年你第一个打给谁？", "新的一年，還是這張吧檯。今年你第一個打給誰？", "Año nuevo, la misma barra. ¿A quién llamarás primero este año?", "Any nou, la mateixa barra. A qui trucaràs primer aquest any?"], "fLunar": ["New year coming. Go home, make dumplings, give red packet. Phone can wait one.", "要过年啦。回家包饺子，派红包。手机可以等的。", "要過年啦。回家包餃子，派紅包。手機可以等的。", "Viene el año nuevo. Ve a casa, haz dumplings, da sobres rojos. El móvil puede esperar.", "Ve l'any nou. Ves a casa, fes dumplings, dona sobres vermells. El mòbil pot esperar."], "fMoon": ["full moon tonight. send someone a photo of it. or better, stand under it together", "今晚月亮好圆。拍一张发给某个人。或者更好，一起站在月亮下面", "今晚月亮好圓。拍一張發給某個人。或者更好，一起站在月亮下面", "luna llena esta noche. mándale una foto a alguien. o mejor, mirarla juntos", "lluna plena aquesta nit. envia-li una foto a algú. o millor, mireu-la junts"], "fJordi": ["Sant Jordi: a book and a rose. Lend one, give the other.", "圣乔治节：一本书，一枝玫瑰。借出一本，送出一枝。", "聖喬治節：一本書，一枝玫瑰。借出一本，送出一枝。", "Sant Jordi: un libro y una rosa. Presta uno, regala la otra.", "Sant Jordi: un llibre i una rosa. Deixa'n un, regala l'altra."], "fJoan": ["Sant Joan: the shortest night of the year. Find a bonfire and the people around it.", "圣胡安节：一年里最短的一夜。去找一堆篝火，和围着它的人。", "聖胡安節：一年裡最短的一夜。去找一堆篝火，和圍著它的人。", "Sant Joan: la noche más corta del año. Busca una hoguera y la gente que hay alrededor.", "Sant Joan: la nit més curta de l'any. Busca una foguera i la gent que hi ha al voltant."], "fValentine": ["valentine's: flowers for your mum count. trust me, she'll love it", "情人节：送花给妈妈也算。相信我，她会很开心的", "情人節：送花給媽媽也算。相信我，她會很開心的", "san valentín: las flores para tu madre cuentan. créeme, le encantarán", "sant valentí: les flors per a la teva mare compten. creu-me, li encantaran"], "fHalloween": ["*hides in a pumpkin* Boo. (She means: knock on a neighbour's door tonight.)", "*躲进南瓜里* 嘘。（她的意思是：今晚去敲敲邻居的门。）", "*躲進南瓜裡* 噓。（她的意思是：今晚去敲敲鄰居的門。）", "*se esconde en una calabaza* Bu. (Quiere decir: llama a la puerta de un vecino esta noche.)", "*s'amaga dins una carbassa* Bu. (Vol dir: truca a la porta d'un veí aquesta nit.)"], "fXmas": ["Christmas, everybody come my table. Bring nothing, just bring yourself.", "圣诞节，大家都来我桌上吃饭。什么都不用带，人来就好啦。", "聖誕節，大家都來我桌上吃飯。什麼都不用帶，人來就好啦。", "Navidad: todos a mi mesa. No traigas nada, solo tráete a ti.", "Nadal: tothom a la meva taula. No portis res, porta't a tu."], "sSpring": ["*rolls in the new grass* Woof. (It's warm enough for a walk with someone.)", "*在新长的草里打滚* 汪。（天气暖了，够跟谁一起散步了。）", "*在新長的草裡打滾* 汪。（天氣暖了，夠跟誰一起散步了。）", "*se revuelca en la hierba nueva* Guau. (Ya hace bueno para pasear con alguien.)", "*es rebolca a l'herba nova* Bup. (Ja fa bo per passejar amb algú.)"], "sSummer": ["summer rule: if it's still light at nine, you text someone 'outside?'", "夏天规则：如果九点天还亮着，就给某个人发一句“出来吗？”", "夏天規則：如果九點天還亮著，就給某個人發一句“出來嗎？”", "regla de verano: si a las nueve aún es de día, le escribes a alguien «¿salimos?»", "regla d'estiu: si a les nou encara és de dia, escrius a algú «sortim?»"], "sAutumn": ["Weather turn cold already. Make soup, invite one person. Soup for one is waste.", "天气凉了。煲个汤，请一个人来喝。一个人喝汤，浪费。", "天氣涼了。煲個湯，請一個人來喝。一個人喝湯，浪費。", "Ya hace frío. Haz sopa e invita a alguien. Sopa para uno es un desperdicio.", "Ja fa fred. Fes sopa i convida algú. Sopa per a un és malbaratar-la."], "sWinter": ["Cold out. The best heater is a full table.", "外面冷。最好的暖气，是一张坐满人的桌子。", "外面冷。最好的暖氣，是一張坐滿人的桌子。", "Fuera hace frío. La mejor calefacción es una mesa llena.", "A fora fa fred. La millor calefacció és una taula plena."], "hLate": ["*curls up on your phone* Mrrp. (Bed. Now.)", "*蜷在你的手机上* 咪呜。（睡觉。现在。）", "*蜷在你的手機上* 咪嗚。（睡覺。現在。）", "*se acurruca sobre tu móvil* Mrrp. (A la cama. Ya.)", "*s'arrauleix sobre el teu mòbil* Mrrp. (A dormir. Ara.)"], "hMorn": ["Morning! Drink water first, phone later.", "早晨！先喝水，手机等一下。", "早晨！先喝水，手機等一下。", "¡Buenos días! Primero agua, el móvil después.", "Bon dia! Primer aigua, el mòbil després."], "hAft": ["*sits by the door* The afternoon is long enough for a walk.", "*坐在门边* 下午很长，够散一次步了。", "*坐在門邊* 下午很長，夠散一次步了。", "*se sienta junto a la puerta* La tarde da para un paseo.", "*s'asseu a la porta* La tarda dona per a un passeig."], "hEve": ["Evening's the best hour to call someone. Everyone's home.", "傍晚是打电话最好的时候。大家都在家。", "傍晚是打電話最好的時候。大家都在家。", "La tarde-noche es la mejor hora para llamar. Todo el mundo está en casa.", "El vespre és la millor hora per trucar. Tothom és a casa."], "hNight": ["it's late. text the person you're thinking about. or don't, and tell them tomorrow in person", "很晚了。给你正在想的那个人发个消息。或者别发，明天当面告诉他", "很晚了。給你正在想的那個人發個訊息。或者別發，明天當面告訴他", "es tarde. escríbele a la persona en la que piensas. o no, y díselo mañana en persona", "és tard. escriu a la persona en qui penses. o no, i digues-li demà en persona"], "dSun": ["Sunday. Soup day. Who you eating with?", "星期天。饮汤日。你跟谁吃饭？", "星期天。飲湯日。你跟誰吃飯？", "Domingo. Día de sopa. ¿Con quién comes?", "Diumenge. Dia de sopa. Amb qui menges?"], "dFri": ["Friday. Make a plan with an actual person. I'll wait.", "星期五。跟一个真实的人约点什么吧。我等你。", "星期五。跟一個真實的人約點什麼吧。我等你。", "Viernes. Haz un plan con una persona de verdad. Te espero.", "Divendres. Fes un pla amb una persona de veritat. T'espero."], "dMon": ["*sits on your to-do list* Mew. (Mondays need a coffee with someone.)", "*坐在你的待办清单上* 喵。（星期一需要和谁喝杯咖啡。）", "*坐在你的待辦清單上* 喵。（星期一需要和誰喝杯咖啡。）", "*se sienta sobre tu lista de tareas* Miau. (Los lunes piden un café con alguien.)", "*s'asseu sobre la teva llista de tasques* Miau. (Els dilluns demanen un cafè amb algú.)"], "oOff": ["A day off today. Spend it on someone, not on a screen.", "今天放假。把它花在某个人身上，别花在屏幕上。", "今天放假。把它花在某個人身上，別花在螢幕上。", "Hoy es festivo. Gástalo en alguien, no en una pantalla.", "Avui és festiu. Gasta'l en algú, no en una pantalla."], "uPancake": ["pancake day. make too many and knock on a neighbour's door", "煎饼日。多做一些，去敲敲邻居的门", "煎餅日。多做一些，去敲敲鄰居的門", "día de las tortitas. haz demasiadas y llama a la puerta de un vecino", "dia de les creps. fes-ne massa i truca a la porta d'un veí"], "uMum": ["Today Mothering Sunday. Call your mum. Not text. Call.", "今天是英国的母亲节。打给你妈妈。不是发信息，是打电话。", "今天是英國的母親節。打給你媽媽。不是發信息，是打電話。", "Hoy es el Día de la Madre británico. Llama a tu madre. No le escribas. Llámala.", "Avui és el Dia de la Mare britànic. Truca a la teva mare. No li escriguis. Truca-la."], "uBonfire": ["Bonfire Night. Find the fireworks, and someone to stand next to while they go off.", "篝火之夜。去找烟花，再找一个人，烟花升起时站在他旁边。", "篝火之夜。去找煙花，再找一個人，煙花升起時站在他旁邊。", "Noche de las hogueras. Busca los fuegos artificiales, y a alguien a tu lado mientras estallan.", "Nit de les fogueres. Busca els focs artificials, i algú al teu costat mentre esclaten."], "uBoxing": ["Boxing Day. Leftovers taste better shared. Take some next door.", "节礼日。剩菜分着吃更好味。拿一些给隔壁。", "節禮日。剩菜分著吃更好味。拿一些給隔壁。", "Boxing Day. Las sobras saben mejor compartidas. Lleva un poco a los vecinos.", "Boxing Day. Les sobres són més bones compartides. Porta'n una mica als veïns."], "eReyes": ["Three Kings today. Roscón for everybody. Who find the little king, buy the next one.", "今天三王节。大家吃国王蛋糕。吃到小国王的，下次请客。", "今天三王節。大家吃國王蛋糕。吃到小國王的，下次請客。", "Hoy Reyes. Roscón para todos. Al que le toque el rey, paga el próximo.", "Avui Reis. Tortell per a tothom. A qui li toqui el rei, paga el pròxim."], "eMadre": ["Mother's Day. Call your mother, or go eat her food. Both is best.", "母亲节。打给你妈妈，或者回去吃她做的饭。两样都做最好。", "母親節。打給你媽媽，或者回去吃她做的飯。兩樣都做最好。", "Día de la Madre. Llama a tu madre, o ve a comer lo que cocina. Las dos cosas, mejor.", "Dia de la Mare. Truca a la teva mare, o vés a menjar el que cuina. Les dues coses, millor."], "cMona": ["Mona de Pasqua today. If you are somebody's godparent, the cake is your job.", "今天吃复活节蛋糕“莫娜”。如果你是谁的教父教母，蛋糕要你送哦。", "今天吃復活節蛋糕“莫娜”。如果你是誰的教父教母，蛋糕要你送哦。", "Hoy toca mona de Pascua. Si eres padrino o madrina de alguien, el pastel te toca a ti.", "Avui toca mona de Pasqua. Si ets padrí o padrina d'algú, el pastís et toca a tu."], "cCastanyada": ["Castanyada! Roast chestnuts, sweet potato, panellets. Better eat with neighbours.", "烤栗子节！烤栗子、烤番薯、杏仁小饼。跟邻居一起吃更好。", "烤栗子節！烤栗子、烤番薯、杏仁小餅。跟鄰居一起吃更好。", "¡Castañada! Castañas asadas, boniato, panellets. Mejor con los vecinos.", "Castanyada! Castanyes, moniatos i panellets. Millor amb els veïns."], "cMerce": ["La Mercè: castells in the square. Somebody always holds the bottom row. Go stand in the crowd with someone.", "圣母慈悲节：广场上叠人塔。总有人在最下面撑着。和某个人一起去人群里站着看吧。", "聖母慈悲節：廣場上疊人塔。總有人在最下面撐著。和某個人一起去人群裡站著看吧。", "La Mercè: castells en la plaza. Siempre hay alguien aguantando la base. Ve a verlo con alguien.", "La Mercè: castells a la plaça. Sempre hi ha algú aguantant la pinya. Vés-hi amb algú."], "cEsteve": ["Sant Esteve: canelons from yesterday's leftovers. Family dinner, round two.", "圣艾斯特万节：用昨天的剩菜做卡内罗尼。家庭聚餐，第二轮。", "聖艾斯特萬節：用昨天的剩菜做卡內羅尼。家庭聚餐，第二輪。", "San Esteban: canelones con lo que sobró ayer. Comida familiar, segunda ronda.", "Sant Esteve: canelons amb el que va sobrar ahir. Dinar familiar, segona ronda."], "zLantern": ["Lantern Festival. Make tangyuan, round like a family. Guess the riddles together.", "元宵节。煮汤圆，圆圆的像一家人。一起猜灯谜。", "元宵節。煮湯圓，圓圓的像一家人。一起猜燈謎。", "Festival de los Faroles. Haz tangyuan, redondos como una familia. Adivinad los acertijos juntos.", "Festa dels Fanals. Fes tangyuan, rodons com una família. Endevineu les endevinalles junts."], "zQingming": ["Ching Ming today. Remember the old ones, then go visit the ones still here lah.", "清明节。记住走了的人，然后去看看还在的人啦。", "清明節。記住走了的人，然後去看看還在的人啦。", "Hoy es Qingming. Recuerda a los que se fueron, y luego visita a los que siguen aquí.", "Avui és Qingming. Recorda els que se'n van anar, i després visita els que encara hi són."], "zDragon": ["Dragon Boat Festival: make zongzi with someone. Wrapping them alone takes forever.", "端午节：和谁一起包粽子吧。一个人包，包到天荒地老。", "端午節：和誰一起包粽子吧。一個人包，包到天荒地老。", "Festival del Barco Dragón: haz zongzi con alguien. Envolverlos solo lleva una eternidad.", "Festa del Vaixell Drac: fes zongzi amb algú. Embolicar-los sol és etern."], "zQixi": ["qixi: the cowherd and the weaver girl meet once a year. you can do better than once a year", "七夕：牛郎织女一年才见一次。你可以比一年一次更好", "七夕：牛郎織女一年才見一次。你可以比一年一次更好", "qixi: el pastor y la tejedora se ven una vez al año. tú puedes hacerlo mejor", "qixi: el pastor i la teixidora es veuen un cop l'any. tu ho pots fer millor"], "zNinth": ["Double Ninth. Climb a hill, visit the old people. Me included.", "重阳节。去登登高，去看看老人家。包括我。", "重陽節。去登登高，去看看老人家。包括我。", "Doble Nueve. Sube una colina y visita a los mayores. Yo incluida.", "Doble Nou. Puja un turó i visita la gent gran. Jo inclosa."], "zDongzhi": ["Dongzhi bigger than New Year! Go home for dinner tonight.", "冬至大过年！今晚回家吃饭。", "冬至大過年！今晚回家吃飯。", "¡Dongzhi es más que Año Nuevo! Esta noche, a cenar a casa.", "Dongzhi és més que Any Nou! Aquesta nit, a sopar a casa."], "zChildren": ["*brings you a ball* Woof. (Children's Day: be a kid for one afternoon, with a kid.)", "*把球叼给你* 汪。（儿童节：和一个小朋友一起，当一下午的小孩。）", "*把球叼給你* 汪。（兒童節：和一個小朋友一起，當一下午的小孩。）", "*te trae una pelota* Guau. (Día del Niño: sé niño una tarde, con un niño.)", "*et porta una pilota* Bup. (Dia dels Infants: sigues infant una tarda, amb un infant.)"], "iCall": ["incoming call", "来电", "來電", "llamada entrante", "trucada entrant"], "iAccept": ["Accept", "接听", "接聽", "Aceptar", "Accepta"], "iDecline": ["Decline", "拒绝", "拒絕", "Rechazar", "Rebutja"], "iMissed": ["Missed call", "未接来电", "未接來電", "Llamada perdida", "Trucada perduda"], "iLater": ["{n} will try again some other day.", "{n}改天再打给你。", "{n}改天再打給你。", "{n} lo intentará otro día.", "{n} ho tornarà a provar un altre dia."], "iText": ["Message", "信息", "資訊", "Mensaje", "Missatge"], "iMail": ["New mail", "新邮件", "新郵件", "Correo nuevo", "Correu nou"], "pPopoC": ["Wah, you pick up! I just want to say: eat properly today. Okay, bye bye.", "哎呀，你接了！我只是想说：今天好好吃饭。好啦，拜拜。", "哎呀，你接了！我只是想說：今天好好吃飯。好啦，拜拜。", "¡Ay, contestas! Solo quería decirte: hoy come bien. Vale, adiós, adiós.", "Ai, contestes! Només et volia dir: avui menja bé. Au, adéu, adéu."], "pPopoNye": ["Grapes ready already! Twelve, all washed. Come lah, the bells don't wait.", "葡萄准备好了！十二颗，都洗好了。快来啦，钟声不等人的。", "葡萄準備好了！十二顆，都洗好了。快來啦，鐘聲不等人的。", "¡Las uvas ya están! Doce, lavadas. Ven, que las campanadas no esperan.", "El raïm ja és a punt! Dotze grans, rentats. Vine, que les campanades no esperen."], "pMantouC": ["Woof! Woof! (He has the leash in his mouth.)", "汪！汪！（他嘴里叼着牵绳。）", "汪！汪！（他嘴裡叼著牽繩。）", "¡Guau! ¡Guau! (Lleva la correa en la boca.)", "Bup! Bup! (Porta la corretja a la boca.)"], "pWeiC": ["Hey, it's Wei. Nothing urgent. Just wondering who you've been meaning to call. Go on, I'll hang up first.", "嘿，我是 Wei。没什么急事。就是想问问，你一直想打给谁？去吧，我先挂了。", "嘿，我是 Wei。沒什麼急事。就是想問問，你一直想打給誰？去吧，我先掛了。", "Hola, soy Wei. Nada urgente. Solo me preguntaba a quién llevas tiempo queriendo llamar. Venga, cuelgo yo primero.", "Hola, sóc en Wei. Res urgent. Només em preguntava a qui fa temps que vols trucar. Au, penjo jo primer."], "pMeiT": ["hey. random thought: when did you last call your grandma", "嘿。突然想到：你上次给外婆打电话是什么时候", "嘿。突然想到：你上次給外婆打電話是什麼時候", "oye. pensamiento random: ¿cuándo llamaste a tu abuela por última vez?", "ei. pensament random: quan vas trucar a la teva àvia per última vegada?"], "pMeiEve": ["doing Two Candles with my mom later. you should book one with someone {app:tc}", "等下要和我妈吃双烛晚饭。你也约一个人吧 {app:tc}", "等下要和我媽吃雙燭晚飯。你也約一個人吧 {app:tc}", "luego hago Two Candles con mi madre. deberías reservar una con alguien {app:tc}", "després faig Two Candles amb la meva mare. n'hauries de reservar una amb algú {app:tc}"], "pWeiT": ["Saved you a seat at the counter. No rush. {app:nb}", "吧台边给你留了个位子。不急。{app:nb}", "吧檯邊給你留了個位子。不急。{app:nb}", "Te he guardado un sitio en la barra. Sin prisa. {app:nb}", "T'he guardat un lloc a la barra. Sense pressa. {app:nb}"], "pMisoT": ["*sends a photo of an empty food bowl*", "*发来一张空饭碗的照片*", "*發來一張空飯碗的照片*", "*manda una foto de un cuenco vacío*", "*envia una foto d'un bol buit*"], "pYuzuT": ["*walked across the keyboard* ;;;;;;;;;;;;mrrp", "*从键盘上走过* ；；；；；；；；咪呜", "*從鍵盤上走過* ；；；；；；；；咪嗚", "*ha cruzado el teclado* ;;;;;;;;;;;;mrrp", "*ha travessat el teclat* ;;;;;;;;;;;;mrrp"], "pPopoMs": ["TEST TEST is this working", "测试 测试 这个有用吗", "測試 測試 這個有用嗎", "PRUEBA PRUEBA esto funciona", "PROVA PROVA això funciona"], "pPopoMb": ["Mei say this is email. Ok.\nEat already or not?\nPopo", "Mei 说这个叫电邮。好。\n吃饭了没有？\n婆婆", "Mei 說這個叫電郵。好。\n吃飯了沒有？\n婆婆", "Mei dice que esto es un correo. Vale.\n¿Comiste ya o no?\nPopo", "La Mei diu que això és un correu. D'acord.\nJa has menjat o no?\nPopo"], "pMeiMs": ["go look outside", "去外面看看", "去外面看看", "sal a mirar", "surt a mirar"], "pMeiMb": ["the moon is huge tonight. go look. don't take a photo, just look.\nok maybe one photo. send it to someone.", "今晚月亮超大。去看。别拍照，就看着。\n好吧，拍一张也行。发给某个人。", "今晚月亮超大。去看。別拍照，就看著。\n好吧，拍一張也行。發給某個人。", "la luna está enorme esta noche. ve a mirarla. no le hagas foto, solo mírala.\nvale, quizá una foto. mándasela a alguien.", "la lluna és enorme aquesta nit. vés a mirar-la. no li facis foto, només mira-la.\nva, potser una foto. envia-la a algú."], "pWeiMs": ["Nothing to sell, I promise", "没有要卖的东西，我保证", "沒有要賣的東西，我保證", "No vendo nada, lo prometo", "No venc res, ho prometo"], "pWeiMb": ["Just checking in. If you're reading this, maybe text someone you miss instead.\nI'll still be here after.\nWei", "就是来问候一下。如果你正在看这封信，也许可以改成给你想念的人发个消息。\n之后我还在这里。\nWei", "就是來問候一下。如果你正在看這封信，也許可以改成給你想念的人發個訊息。\n之後我還在這裡。\nWei", "Solo pasaba a saludar. Si estás leyendo esto, quizá mejor escríbele a alguien a quien echas de menos.\nYo seguiré aquí después.\nWei", "Només passava a saludar. Si estàs llegint això, potser millor escriu a algú que trobes a faltar.\nJo encara seré aquí després.\nWei"], "wUpT": ["Who's up in town", "镇上谁还醒着", "鎮上誰還醒著", "Quién está despierto", "Qui és despert"], "wUpSome": ["Tap a face to call. Then call someone real.", "点一张脸打给他们。然后，打给一个真实的人。", "點一張臉打給他們。然後，打給一個真實的人。", "Toca una cara para llamar. Luego llama a alguien de verdad.", "Toca una cara per trucar. Després truca a algú de veritat."], "wUpNone": ["The whole town's asleep. You should be too.", "整个小镇都睡了。你也该睡了。", "整個小鎮都睡了。你也該睡了。", "Todo el pueblo duerme. Tú también deberías.", "Tot el poble dorm. Tu també hauries de dormir."], "wMoonT": ["Tonight's moon", "今晚的月亮", "今晚的月亮", "La luna de esta noche", "La lluna d'aquesta nit"], "wMoonL": ["Look up. Someone you love is under the same one.", "抬头看看。你爱的某个人，也在同一个月亮下面。", "抬頭看看。你愛的某個人，也在同一個月亮下面。", "Mira arriba. Alguien a quien quieres está bajo la misma.", "Mira amunt. Algú que estimes és sota la mateixa."], "mo0": ["New moon", "新月", "新月", "Luna nueva", "Lluna nova"], "mo1": ["Waxing crescent", "娥眉月", "娥眉月", "Luna creciente", "Lluna creixent"], "mo2": ["First quarter", "上弦月", "上弦月", "Cuarto creciente", "Quart creixent"], as cartas mejor que la adivina de Mong Kok. Y más barato.", "La gata llegeix les cartes millor que l'endevina de Mong Kok. I més barat."], "c_pw2": ["Yuzu told me to call my mum. Yuzu was right.", "柚子让我打给我妈。柚子是对的。", "柚子讓我打給我媽。柚子是對的。", "Yuzu me dijo que llamara a mi madre. Yuzu tenía razón.", "La Yuzu em va dir que truqués a la meva mare. La Yuzu tenia raó."], "c_co1": ["I cook for twelve, eight come. Next time I invite twenty.", "我煮十二个人的饭，来了八个。下次我请二十个。", "我煮十二個人的飯，來了八個。下次我請二十個。", "Cocino para doce, vienen ocho. La próxima invito a veinte.", "Cuino per a dotze, en vénen vuit. La propera en convido vint."], "c_co2": ["the bring list stopped three people bringing chips. revolutionary", "“带什么”清单让三个人不再都带薯片。革命性的", "“帶什麼”清單讓三個人不再都帶薯片。革命性的", "la lista de qué traer evitó que tres personas trajeran patatas fritas. revolucionario", "la llista de què portar va evitar que tres persones portessin patates. revolucionari"], "c_fs1": ["sent my mom flowers that open on her birthday. she cried. good crying", "给我妈寄了一束到她生日才打开的花。她哭了。是好的那种哭", "給我媽寄了一束到她生日才打開的花。她哭了。是好的那種哭", "le mandé a mi madre flores que se abren en su cumpleaños. lloró. del bueno", "vaig enviar a la meva mare flors que s'obren el dia del seu aniversari. va plorar. del bo"], "c_fs2": ["The card says 'call me when you get it'. She did.", "卡片上写着“收到了就打给我”。她打了。", "卡片上寫著“收到了就打給我”。她打了。", "La tarjeta dice 'llámame cuando te llegue'. Llamó.", "La targeta diu 'truca'm quan t'arribi'. Va trucar."], "c_bp1": ["Lent my old Murakami to a neighbour. Got it back with a pressed flower in it.", "把我那本旧村上春树借给了邻居。还回来时里面夹着一朵压花。", "把我那本舊村上春樹借給了鄰居。還回來時裡面夾著一朵壓花。", "Le presté mi viejo Murakami a una vecina. Me lo devolvió con una flor prensada dentro.", "Vaig deixar el meu vell Murakami a una veïna. Me'l va tornar amb una flor premsada a dins."], "c_bp2": ["*sleeps on the poetry shelf, approving*", "*睡在诗歌那层书架上，表示认可*", "*睡在詩歌那層書架上，表示認可*", "*duerme en el estante de poesía, con aprobación*", "*dorm al prestatge de poesia, amb aprovació*"], "c_sh1": ["Thirty years I send postcard. Now the postcard wait for the right day. Very clever.", "我寄了三十年明信片。现在明信片会等到对的那天。好聪明。", "我寄了三十年明信片。現在明信片會等到對的那天。好聰明。", "Treinta años mandando postales. Ahora la postal espera el día justo. Muy listo.", "Trenta anys enviant postals. Ara la postal espera el dia just. Molt enginyós."], "c_sh2": ["scheduled one for my best friend's 17th. she has no idea", "给我最好的朋友定了一张，她十七岁生日那天才打开。她完全不知道", "給我最好的朋友定了一張，她十七歲生日那天才開啟。她完全不知道", "programé una para el 17 cumpleaños de mi mejor amiga. no tiene ni idea", "n'he programat una per als 17 anys de la meva millor amiga. no en té ni idea"], "c_hg1": ["the cousins built a town. there's a whole street called 'call grandma'.", "表兄妹们建了一座小镇。有一整条街叫“打给外婆”。", "表兄妹們建了一座小鎮。有一整條街叫“打給外婆”。", "los primos construimos un pueblo. hay una calle entera que se llama 'llama a la abuela'.", "els cosins vam construir un poble. hi ha un carrer sencer que es diu 'truca a l'àvia'."], "c_hg2": ["My grandchildren build a town. I am the soup shop.", "我的孙子孙女建了一座小镇。我是那家汤铺。", "我的孫子孫女建了一座小鎮。我是那家湯鋪。", "Mis nietos construyen un pueblo. Yo soy la tienda de sopa.", "Els meus néts construeixen un poble. Jo sóc la botiga de sopa."], "c_tg1": ["Twelve grape, twelve month, one family. Don't choke ah.", "十二颗葡萄，十二个月，一家人。别噎着啊。", "十二顆葡萄，十二個月，一家人。別噎著啊。", "Doce uvas, doce meses, una familia. No te atragantes, eh.", "Dotze grans, dotze mesos, una família. No t'ennuegis, eh."], "c_tg2": ["*under the table, waiting for a dropped grape*", "*在桌子底下，等着掉下来的葡萄*", "*在桌子底下，等著掉下來的葡萄*", "*debajo de la mesa, esperando que caiga una uva*", "*sota la taula, esperant que caigui un gra*"], "c_ap1": ["Wei ask me where I grew up. I talk two hours. He write two lines only!", "Wei 问我在哪里长大。我讲了两个钟头。他只写了两行！", "Wei 問我在哪裡長大。我講了兩個鐘頭。他只寫了兩行！", "Wei me preguntó dónde crecí. Hablé dos horas. ¡Y él escribió solo dos líneas!", "En Wei em va preguntar on vaig créixer. Vaig parlar dues hores. I ell només va escriure dues línies!"], "c_ap2": ["Fifty-two questions. I've learned more about Popo than in thirty years.", "五十二个问题。我对婆婆的了解比过去三十年还多。", "五十二個問題。我對婆婆的瞭解比過去三十年還多。", "Cincuenta y dos preguntas. He aprendido más de Popo que en treinta años.", "Cinquanta-dues preguntes. He après més de la Popo que en trenta anys."], "c_aw1": ["my weather was stormy, my rose was a croissant, my thanks went to Wei. he said that's the nicest thing on the internet", "我心里是雷雨，玫瑰是一个可颂，感谢给了 Wei。他说这是网上最温暖的东西", "我心裡是雷雨，玫瑰是一個可頌，感謝給了 Wei。他說這是網上最溫暖的東西", "mi tiempo era tormenta, mi rosa un cruasán, mi gracias para Wei. dijo que es lo más bonito de internet", "el meu temps era tempesta, la meva rosa un croissant, el meu gràcies per a en Wei. va dir que és el més bonic d'internet"], "c_aw2": ["*sits on the PDF until you go and say thank you*", "*趴在那本 PDF 上，直到你去说谢谢*", "*趴在那本 PDF 上，直到你去說謝謝*", "*se sienta encima del PDF hasta que vas a dar las gracias*", "*s'asseu damunt del PDF fins que vas a donar les gràcies*"], "c_ww1": ["*already at the door with the leash*", "*已经叼着牵绳等在门口了*", "*已經叼著牽繩等在門口了*", "*ya está en la puerta con la correa*", "*ja és a la porta amb la corretja*"], "c_ww2": ["twenty minutes, no phones, came back with gossip and a pastry", "二十分钟，没有手机，回来时带着八卦和一个面包", "二十分鐘，沒有手機，回來時帶著八卦和一個麵包", "veinte minutos, sin móviles, volví con cotilleos y un bollo", "vint minuts, sense mòbils, vaig tornar amb xafarderies i un pastisset"], "c_nb1": ["I work here. Come say hi, then go home and say hi to someone else.", "我在这里上班。来打个招呼，然后回家，跟别人也打个招呼。", "我在這裡上班。來打個招呼，然後回家，跟別人也打個招呼。", "Trabajo aquí. Ven a saludar, y luego vuelve a casa y saluda a alguien más.", "Treballo aquí. Vine a saludar, i després torna a casa i saluda algú altre."], "c_nb2": ["*naps on the counter, unbothered*", "*在吧台上午睡，毫不在意*", "*在吧檯上午睡，毫不在意*", "*duerme la siesta en la barra, sin inmutarse*", "*fa la migdiada a la barra, sense immutar-se*"], "c_st1": ["The slow train is where I think. Get off when you know who to call.", "慢车是我想事情的地方。等你知道该打给谁了，就下车。", "慢車是我想事情的地方。等你知道該打給誰了，就下車。", "El tren lento es donde pienso. Bájate cuando sepas a quién llamar.", "El tren lent és on penso. Baixa quan sàpigues a qui trucar."], "c_st2": ["rode it to hong kong at 2am. didn't sleep. worth it", "凌晨两点坐到了香港。没睡。值了", "凌晨兩點坐到了香港。沒睡。值了", "lo cogí hasta hong kong a las 2 de la mañana. no dormí. valió la pena", "el vaig agafar fins a hong kong a les 2 de la matinada. no vaig dormir. va valer la pena"], "c_ho1": ["my mom's morning is my night. we leave each other notes. it's kind of perfect", "我妈的早晨是我的夜晚。我们互相留言。有点完美", "我媽的早晨是我的夜晚。我們互相留言。有點完美", "la mañana de mi madre es mi noche. nos dejamos notas. es casi perfecto", "el matí de la meva mare és la meva nit. ens deixem notes. és gairebé perfecte"], "c_ho2": ["For two people in two time zones. It fills the gap; it doesn't replace the call.", "给在两个时区的两个人。它填补空隙，不代替电话。", "給在兩個時區的兩個人。它填補空隙，不代替電話。", "Para dos personas en dos husos horarios. Llena el hueco; no sustituye la llamada.", "Per a dues persones en dues zones horàries. Omple el buit; no substitueix la trucada."], "c_tc1": ["sunday dinner with my mom: me in barcelona, her in new york. same soup. same candle.", "和我妈的星期天晚饭：我在巴塞罗那，她在纽约。同一道汤，同一根蜡烛。", "和我媽的星期天晚飯：我在巴塞羅那，她在紐約。同一道湯，同一根蠟燭。", "cena del domingo con mi madre: yo en barcelona, ella en nueva york. la misma sopa. la misma vela.", "sopar de diumenge amb la meva mare: jo a barcelona, ella a nova york. la mateixa sopa. la mateixa espelma."], "c_tc2": ["Two city, one soup. Good. But come home sometime also.", "两座城市，一锅汤。好。但是也要回家啊。", "兩座城市，一鍋湯。好。但是也要回家啊。", "Dos ciudades, una sopa. Bien. Pero ven a casa alguna vez también.", "Dues ciutats, una sopa. Bé. Però vine a casa alguna vegada també."], "c_vo1": ["I learn English from one dictionary. You have this. No excuse lah.", "我是靠一本字典学英文的。你有这个。没借口啦。", "我是靠一本字典學英文的。你有這個。沒借口啦。", "Yo aprendí inglés con un diccionario. Tú tienes esto. Sin excusas, eh.", "Jo vaig aprendre anglès amb un diccionari. Tu tens això. Sense excuses, eh."], "c_vo2": ["taught my friend 'bon dia'. she says it to the baker now. growth", "教了我朋友说“bon dia”。她现在每天对面包师傅说。成长了", "教了我朋友說“bon dia”。她現在每天對面包師傅說。成長了", "le enseñé a mi amiga 'bon dia'. ahora se lo dice al panadero. progreso", "vaig ensenyar a la meva amiga 'bon dia'. ara li ho diu al forner. creixement"], "wgT": ["Widgets", "小组件", "小元件", "Widgets", "Ginys"], "wgAdd": ["Widgets", "小组件", "小元件", "Widgets", "Ginys"], "wgHint": ["Pick the ones you want, or none at all, and put them in your order.", "想要哪些就留哪些，一个不要也行，顺序也由你排。", "想要哪些就留哪些，一個不要也行，順序也由你排。", "Elige los que quieras, o ninguno, y ponlos en tu orden.", "Tria els que vulguis, o cap, i posa'ls en el teu ordre."], "wgLeft": ["Move left", "往左移", "往左移", "Mover a la izquierda", "Mou a l'esquerra"], "wgRight": ["Move right", "往右移", "往右移", "Mover a la derecha", "Mou a la dreta"], "wgUp": ["Move up", "往前移", "往前移", "Subir", "Puja"], "wgDown": ["Move down", "往后移", "往後移", "Bajar", "Baixa"], "wgRm": ["Remove", "移除", "移除", "Quitar", "Treure"], "wgGone": ["Widget removed. + Widgets brings it back.", "小组件已移除。可以从“+ 小组件”或设置里加回来。", "小元件已移除。可以從“+ 小元件”或設定里加回來。", "Widget quitado. Vuelve a añadirlo desde + Widgets o Ajustes.", "Giny tret. Torna'l a afegir des de + Ginys o Configuració."], "wg_now": ["The hour", "此刻", "此刻", "La hora", "L'hora"], "wgh_now": ["A line for the moment, and Put the phone down.", "此刻的一句话，还有“放下手机”。", "此刻的一句話，還有“放下手機”。", "Una frase para el momento, y Deja el móvil.", "Una frase per al moment, i Deixa el mòbil."], "wg_week": ["This week", "这一周", "這一週", "Esta semana", "Aquesta setmana"], "wgh_week": ["Who you're seeing, walking or asking, from the apps.", "从各个应用里看：这周见谁、和谁散步、问谁。", "從各個應用裡看：這週見誰、和誰散步、問誰。", "A quién ves, con quién caminas o a quién preguntas, desde las apps.", "A qui veus, amb qui camines o a qui preguntes, des de les apps."], "wg_far": ["Weather there", "那边的天气", "那邊的天氣", "El tiempo allí", "El temps allà"], "wgh_far": ["The sky over someone far away.", "远方那个人头顶的天空。", "遠方那個人頭頂的天空。", "El cielo sobre alguien que está lejos.", "El cel sobre algú que és lluny."], "wg_up": ["Who's up in town", "镇上谁还醒着", "
