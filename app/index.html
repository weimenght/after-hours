que això és una entrevista, no una visita. {app:ap}"], "q_b22": ["Somebody got a cold? Don't send \"get well soon\". Send what you will carry to the door. {app:gw}", "有人感冒了？不要发“早日康复”。发你会亲手送到门口的东西。{app:gw}", "有人感冒了？不要發“早日康復”。發你會親手送到門口的東西。{app:gw}", "¿Alguien tiene resfriado? No mandes «que te mejores». Manda lo que tú llevas a la puerta. {app:gw}", "Algú està refredat? No li enviïs «que et milloris». Envia-li allò que li portaràs a la porta. {app:gw}"], "q_b25": ["flowers in a link is cute. flowers in a hand is better. the app literally tells you where the florist is {app:fs}", "链接里的花很可爱。手里的花更好。那个应用真的会告诉你花店在哪 {app:fs}", "連結裡的花很可愛。手裡的花更好。那個應用真的會告訴你花店在哪 {app:fs}", "flores en un enlace: monas. flores en la mano: mejor. la app literalmente te dice dónde está la floristería {app:fs}", "flors en un enllaç: boniques. flors a la mà: millor. l'app literalment et diu on és la floristeria {app:fs}"], "q_b27": ["The train has no destination you need to reach. That's the feature. {app:st}", "这趟火车没有你非到不可的站。它就是这么设计的。{app:st}", "這趟火車沒有你非到不可的站。它就是這麼設計的。{app:st}", "El tren no tiene ningún destino al que debas llegar. Esa es la gracia. {app:st}", "El tren no té cap destinació on hagis d'arribar. Aquesta és la gràcia. {app:st}"], "q_b32": ["Tidy one drawer only. Whose things inside? Give back by hand. That one is the game. {app:pb}", "只收拾一个抽屉。里面是谁的东西？亲手还给人家。这个才是游戏啦。{app:pb}", "只收拾一個抽屜。裡面是誰的東西？親手還給人家。這個才是遊戲啦。{app:pb}", "Ordena un cajón solo. ¿De quién son las cosas? Devuelve en mano. Ese es el juego. {app:pb}", "Endreça només un calaix. De qui són les coses? Torna-les en mà. Aquest és el joc. {app:pb}"], "q_b37": ["I work in learning. The thing I've seen change people is rarely the course. It's the moment two of them really talk.", "我做的是培训设计。我看到真正改变人的，很少是课程本身，而是两个人真正聊起来的那一刻。", "我做的是培訓設計。我看到真正改變人的，很少是課程本身，而是兩個人真正聊起來的那一刻。", "Trabajo en formación. Lo que he visto cambiar a la gente rara vez es el curso. Es el momento en que dos de ellos hablan de verdad.", "Treballo en formació. El que he vist canviar la gent poques vegades és el curs. És el moment en què dos d'ells parlen de debò."], "q_b38": ["Screens took a lot of that away. I'm trying small things to see if a screen can hand people back to each other.", "屏幕拿走了很多这样的时刻。我在试一些小东西，看屏幕能不能把人还给彼此。", "螢幕拿走了很多這樣的時刻。我在試一些小東西，看螢幕能不能把人還給彼此。", "Las pantallas se llevaron mucho de eso. Pruebo cosas pequeñas para ver si una pantalla puede devolvernos los unos a los otros.", "Les pantalles se'n van endur molt, d'això. Provo coses petites per veure si una pantalla ens pot tornar els uns als altres."], "q_b39": ["That's why most of these end with \"put the phone down\". It isn't a joke. It's the last screen, and the one I designed first.", "所以这里大多数东西都以“放下手机”结束。这不是玩笑。那是最后一个画面，也是我最先设计的那个。", "所以這裡大多數東西都以“放下手機”結束。這不是玩笑。那是最後一個畫面，也是我最先設計的那個。", "Por eso casi todas acaban con «deja el móvil». No es broma. Es la última pantalla, y la que diseñé primero.", "Per això gairebé totes acaben amb «deixa el mòbil». No és broma. És l'última pantalla, i la que vaig dissenyar primer."], "q_b40": ["Nothing here keeps score. If you used one of these once and then called your sister, that's a perfect record.", "这里什么都不记分。如果你只用过一次，然后给你姐姐打了电话，那就是满分。", "這裡什麼都不記分。如果你只用過一次，然後給你姐姐打了電話，那就是滿分。", "Aquí nada lleva la cuenta. Si usaste una de estas una vez y luego llamaste a tu hermana, es un historial perfecto.", "Aquí res porta el compte. Si en vas fer servir una un sol cop i després vas trucar a la teva germana, és un historial perfecte."], "q_b41": ["I use AI to build all this. It drafts, I check, a good part goes in the bin. The point was never the AI.", "这些都是我用 AI 做的。它起草，我检查，不少都进了废纸篓。重点从来不是 AI。", "這些都是我用 AI 做的。它起草，我檢查，不少都進了廢紙簍。重點從來不是 AI。", "Uso IA para construir todo esto. Ella hace el borrador, yo reviso, y una buena parte va a la papelera. Lo importante nunca fue la IA.", "Faig servir IA per construir tot això. Ella fa l'esborrany, jo reviso, i una bona part va a la paperera. L'important no ha estat mai la IA."], "q_b42": ["People aren't the means. People are the point. If something here ever feels like it wants your time more than it wants you with someone, tell me.", "人不是手段，人才是目的。如果这里有什么东西让你觉得它想要你的时间，多过想让你去陪某个人，请告诉我。", "人不是手段，人才是目的。如果這裡有什麼東西讓你覺得它想要你的時間，多過想讓你去陪某個人，請告訴我。", "Las personas no son el medio. Son el fin. Si algo aquí parece querer tu tiempo más que verte con alguien, dímelo.", "Les persones no són el mitjà. Són el fi. Si alguna cosa d'aquí sembla voler el teu temps més que veure't amb algú, digues-m'ho."], "q_b43": ["What's missing? What would you want one of these to do for you and someone? Write here. Only I read it.", "还缺什么？你希望这里有个东西能为你和某个人做点什么？写在这里。只有我会看。", "還缺什麼？你希望這裡有個東西能為你和某個人做點什麼？寫在這裡。只有我會看。", "¿Qué falta? ¿Qué te gustaría que una de estas hiciera por ti y por alguien? Escríbelo aquí. Solo lo leo yo.", "Què hi falta? Què t'agradaria que una d'aquestes fes per tu i per algú? Escriu-ho aquí. Només ho llegeixo jo."], "q_b44": ["ok don't be weird but call your mom. that's it. that's the call. bye", "好，别多想，给你妈打个电话。就这样。这通电话就为这个。拜", "好，別多想，給你媽打個電話。就這樣。這通電話就為這個。拜", "vale, no te rayes, pero llama a tu madre. ya está. esa era la llamada. chao", "va, no et ratllis, però truca a la teva mare. ja està. aquesta era la trucada. adeu"], "q_b45": ["I only call to hear you eat already. Good. Now call somebody who worry about you.", "我打来只是要听你说吃过了。好。现在打给一个挂念你的人啦。", "我打來只是要聽你說吃過了。好。現在打給一個掛念你的人啦。", "Solo llamo para oír que ya comiste. Bien. Ahora llama a alguien que se preocupa por ti.", "Només truco per sentir que ja has menjat. Bé. Ara truca a algú que pateix per tu."], "q_b46": ["*purring. A thump. The call ends.*", "*呼噜呼噜。咚的一声。通话结束了。*", "*呼嚕呼嚕。咚的一聲。通話結束了。*", "*ronroneo. Un golpe. Se corta la llamada.*", "*ronc de gata. Un cop. S'acaba la trucada.*"], "q_c1": ["*Both cats on the sill, watching the rain. Nobody is going anywhere.*", "*两只猫都在窗台上看雨。谁也不打算出门。*", "*兩隻貓都在窗臺上看雨。誰也不打算出門。*", "*Las dos gatas en el alféizar, mirando la lluvia. Nadie va a ninguna parte.*", "*Les dues gates a l'ampit, mirant la pluja. Ningú no va enlloc.*"], "q_c11": ["Good dinner? Text one person to say thank you. One is enough.", "饭吃得好吗？发消息谢谢一个人。一个就够啦。", "飯吃得好嗎？發訊息謝謝一個人。一個就夠啦。", "¿Buena cena? Escribe a una persona para dar gracias. Una basta.", "Bon sopar? Escriu a una persona per donar-li les gràcies. Amb una n'hi ha prou."], "q_c12": ["*still tired. Still happy. Same corner?*", "*还是累。还是开心。老地方？*", "*還是累。還是開心。老地方？*", "*sigue cansado. Sigue feliz. ¿La misma esquina?*", "*encara cansat. Encara content. La mateixa cantonada?*"], "q_c13": ["I saw your paper in the jar. Good. I don't count. I only look.", "我看到你放进罐子的纸条了。好。我不数的。我只是看看。", "我看到你放進罐子的紙條了。好。我不數的。我只是看看。", "Vi tu papel en el tarro. Bien. Yo no cuento. Solo miro.", "He vist el teu paper al pot. Bé. Jo no compto. Només miro."], "q_c15": ["Got your note. Thank you. I read every one.", "收到你的留言了。谢谢。每一条我都会看。", "收到你的留言了。謝謝。每一條我都會看。", "Recibí tu nota. Gracias. Las leo todas.", "He rebut la teva nota. Gràcies. Les llegeixo totes."], "q_c2": ["Sunday. Soup is on. Who is at your table today?", "礼拜天。汤煲上了。今天谁坐你那张桌子呀？", "禮拜天。湯煲上了。今天誰坐你那張桌子呀？", "Domingo. Sopa en el fuego. ¿Quién está en tu mesa hoy?", "Diumenge. La sopa ja és al foc. Qui tens a taula avui?"], "q_c3": ["it's friday. who are you seeing. \"nobody\" is not an answer, ask somebody", "星期五了。你要见谁。“没人”不算答案，去约一个", "星期五了。你要見誰。“沒人”不算答案，去約一個", "es viernes. ¿a quién vas a ver? «a nadie» no es respuesta, pregúntale a alguien", "és divendres. a qui veuràs? «ningú» no és cap resposta, pregunta-ho a algú"], "q_c4": ["Weather turn cold already. Wear jacket. And bring one for somebody who never does.", "天气转凉了。穿外套啦。再带一件给那个从来不穿的人。", "天氣轉涼了。穿外套啦。再帶一件給那個從來不穿的人。", "Ya hace frío. Ponte chaqueta. Y lleva una para alguien que nunca se pone.", "Ja fa fred. Posa't la jaqueta. I porta'n una per a algú que mai se'n posa."], "q_c5": ["The plane trees on the Plaza are out. Take the long way home.", "广场上的梧桐发新叶了。回家绕远一点走。", "廣場上的梧桐發新葉了。回家繞遠一點走。", "Los plátanos de la Plaza ya han brotado. Vuelve a casa por el camino largo.", "Els plàtans de la Plaça ja han brotat. Torna a casa pel camí llarg."], "q_c6": ["Tonight the moon is round. Whoever is far, look at the same one. Then call.", "今晚月亮圆。人在远处的，看的也是同一个。看完就打电话啦。", "今晚月亮圓。人在遠處的，看的也是同一個。看完就打電話啦。", "Esta noche la luna es redonda. Quien está lejos mira la misma. Luego llama.", "Aquesta nit la lluna és rodona. Qui és lluny mira la mateixa. Després, truca."], "q_c7": ["Sant Jordi. A book and a rose. Josep never missed one.", "圣乔治节。一本书，一枝玫瑰。Josep 一年都没落下过。", "聖喬治節。一本書，一枝玫瑰。Josep 一年都沒落下過。", "Sant Jordi. Un libro y una rosa. Josep no falló ni un año.", "Sant Jordi. Un llibre i una rosa. En Josep no en va fallar mai cap."], "q_c9": ["Tonight everybody come home. If you cannot, call before dinner, not after.", "今晚人人都回家。回不来的，饭前打电话，不要饭后。", "今晚人人都回家。回不來的，飯前打電話，不要飯後。", "Esta noche todos vuelven a casa. Si no puedes, llama antes de cena, no después.", "Aquesta nit tothom torna a casa. Si no pots, truca abans de sopar, no després."], "q_c10": ["*Yuzu taps the card again. Did you do it? She will know.*", "*柚子又拍了拍那张牌。你做了吗？她会知道的。*", "*柚子又拍了拍那張牌。你做了嗎？她會知道的。*", "*Yuzu vuelve a tocar la carta. ¿Lo hiciste? Ella lo sabrá.*", "*La Yuzu torna a tocar la carta. Ho has fet? Ella ho sabrà.*"], "kn1": ["Popo taught Mantou \"sit\". Mantou taught Popo \"treat\".", "婆婆教会了馒头“坐下”。馒头教会了婆婆“给零食”。", "婆婆教會了饅頭“坐下”。饅頭教會了婆婆“給零食”。", "Popo le enseñó a Mantou «siéntate». Mantou le enseñó a Popo «premio».", "La Popo va ensenyar a en Mantou «seu». En Mantou va ensenyar a la Popo «premi»."], "kn2": ["Mei did Wei's nails. He opens in ten minutes.", "Mei 给 Wei 涂了指甲。他十分钟后开门营业。", "Mei 給 Wei 塗了指甲。他十分鐘後開門營業。", "Mei le ha pintado las uñas a Wei. Abre en diez minutos.", "La Mei ha pintat les ungles a en Wei. Obre d'aquí a deu minuts."], "kn3": ["Miso is helping with the accounts", "味噌在帮忙对账", "味噌在幫忙對賬", "Miso ayuda con las cuentas", "La Miso ajuda amb els comptes"], "kn4": ["Yuzu supervises the dumplings", "柚子在监督包饺子", "柚子在監督包餃子", "Yuzu supervisa los dumplings", "La Yuzu supervisa els dumplings"], "kn5": ["Three on the sill. Nobody is going anywhere.", "窗台上三个。谁也不打算走。", "窗臺上三個。誰也不打算走。", "Tres en el alféizar. Nadie se va a ninguna parte.", "Tres a l'ampit. Ningú no se'n va enlloc."], "kn6": ["Sunday. Nobody leaves until the soup is gone.", "礼拜天。汤没喝完，谁也不许走。", "禮拜天。湯沒喝完，誰也不許走。", "Domingo. Nadie se va hasta que se acabe la sopa.", "Diumenge. Ningú no marxa fins que s'acabi la sopa."], "kn7": ["Mei fell asleep. Yuzu took the hoodie.", "Mei 睡着了。柚子占了她的卫衣。", "Mei 睡著了。柚子佔了她的衛衣。", "Mei se durmió. Yuzu se quedó con la sudadera.", "La Mei s'ha adormit. La Yuzu s'ha quedat la dessuadora."], "kn8": ["Wei walks Mantou. Mantou walks Wei.", "Wei 遛馒头。馒头遛 Wei。", "Wei 遛饅頭。饅頭遛 Wei。", "Wei pasea a Mantou. Mantou pasea a Wei.", "En Wei passeja en Mantou. En Mantou passeja en Wei."], "sSnd1": ["Sound", "声音", "聲音", "Sonido", "So"], "sSnd1H": ["The phone's chimes and ringtone, and the music in Nearby.", "手机的提示音和铃声，还有近邻里的音乐。", "手機的提示音和鈴聲，還有近鄰里的音樂。", "Los avisos y el tono del móvil, y la música de Cerca.", "Els avisos i el to del mòbil, i la música d'A Prop."], "sSnd": ["Phone sounds", "手机声音", "手機聲音", "Sonidos del móvil", "Sons del mòbil"], "sSndHint": ["Ringtone, chimes and the camera's click.", "铃声、提示音和相机的咔嚓声。", "鈴聲、提示音和相機的咔嚓聲。", "Tono de llamada, avisos y el clic de la cámara.", "To de trucada, avisos i el clic de la càmera."], "a_lt": ["Popo's jar, almost full of little papers", "婆婆的罐子，快装满小纸条了", "婆婆的罐子，快裝滿小紙條了", "El tarro de Popo, casi lleno de papelitos", "El pot de la Popo, gairebé ple de paperets"], "a_pw": ["Yuzu picked today's card. Nobody argues with Yuzu.", "柚子选了今天的牌。没人敢跟柚子争。", "柚子選了今天的牌。沒人敢跟柚子爭。", "Yuzu eligió la carta de hoy. Nadie discute con Yuzu.", "La Yuzu ha triat la carta d'avui. Ningú discuteix amb la Yuzu."], "a_co": ["Sunday lunch. Someone brought too much bread.", "星期天午饭。有人带了太多面包。", "星期天午飯。有人帶了太多面包。", "Comida del domingo. Alguien trajo demasiado pan.", "Dinar de diumenge. Algú ha portat massa pa."], "a_fs": ["Nine stems, one ribbon, for Mei's mum", "九枝花，一条丝带，送给 Mei 的妈妈", "九枝花，一條絲帶，送給 Mei 的媽媽", "Nueve flores, un lazo, para la madre de Mei", "Nou flors, una cinta, per a la mare de la Mei"], "a_bp": ["Miso is guarding the poetry shelf", "味噌在看守诗歌那一层书架", "味噌在看守詩歌那一層書架", "Miso vigila el estante de poesía", "La Miso vigila el prestatge de poesia"], "a_sh": ["A postcard that waits for its day", "一张等着它那天的明信片", "一張等著它那天的明信片", "Una postal que espera su día", "Una postal que espera el seu dia"], "a_hg": ["The little town the cousins built", "表兄妹们一起建的小镇", "表兄妹們一起建的小鎮", "El pueblecito que construyeron los primos", "El poblet que van construir els cosins"], "a_tg": ["23:59. Twelve grapes. Nobody breathe.", "23:59。十二颗葡萄。谁都别出声。", "23:59。十二顆葡萄。誰都別出聲。", "23:59. Doce uvas. Que nadie respire.", "23:59. Dotze grans. Que ningú respiri."], "a_ap": ["This week's question: what was your first job?", "这周的问题：你的第一份工作是什么？", "這週的問題：你的第一份工作是什麼？", "La pregunta de esta semana: ¿cuál fue tu primer trabajo?", "La pregunta d'aquesta setmana: quina va ser la teva primera feina?"], "a_ww": ["The corner. Twenty minutes. Phones away.", "那个街角。二十分钟。手机收起来。", "那個街角。二十分鐘。手機收起來。", "La esquina. Veinte minutos. Móviles guardados.", "La cantonada. Vint minuts. Mòbils guardats."], "a_nb": ["Next Door, just before the lamps go on", "隔壁，正好在亮灯之前", "隔壁，正好在亮燈之前", "Al Lado, justo antes de encender las lámparas", "Al Costat, just abans d'encendre els llums"], "a_st": ["Window seat, somewhere between two cities", "靠窗的位子，在两座城市之间的某处", "靠窗的位子，在兩座城市之間的某處", "Asiento de ventanilla, en algún lugar entre dos ciudades", "Seient de finestra, en algun lloc entre dues ciutats"], "a_ho": ["Her morning, his night", "她的早晨，他的夜晚", "她的早晨，他的夜晚", "Su mañana, su noche", "El seu matí, la seva nit"], "a_tc": ["Two candles, two cities, one dinner", "两根蜡烛，两座城市，一顿晚饭", "兩根蠟燭，兩座城市，一頓晚飯", "Dos velas, dos ciudades, una cena", "Dues espelmes, dues ciutats, un sopar"], "a_vo": ["Three words in someone else's language", "用别人的语言说三个词", "用別人的語言說三個詞", "Tres palabras en el idioma de otra persona", "Tres paraules en l'idioma d'una altra persona"], "aStore": ["Store", "商店", "商店", "Tienda", "Botiga"], "stToday": ["Today", "今天", "今天", "Hoy", "Avui"], "stFeat": ["Pick of the day", "今日之选", "今日之選", "La de hoy", "La d'avui"], "stAll": ["All the apps", "所有应用", "所有應用", "Todas las apps", "Totes les apps"], "stOpen": ["Open", "打开", "開啟", "Abrir", "Obrir"], "stSend": ["Send to someone", "发给一个人", "發給一個人", "Envíalo a alguien", "Envia-ho a algú"], "stSendT": ["this made me think of you", "看到这个想到你", "看到這個想到你", "esto me hizo pensar en ti", "això m'ha fet pensar en tu"], "sSendPhone": ["Send this phone to someone", "把这部手机发给一个人", "把這部手機發給一個人", "Envía este teléfono a alguien", "Envia aquest telèfon a algú"], "sSendPhoneT": ["a phone that sends you outside", "一部让你出门的手机", "一部讓你出門的手機", "un teléfono que te saca de casa", "un telèfon que et fa sortir"], "sSendPhoneL": ["Small free apps for walks, soup, dinners and asking Popo things. No feed, no streaks.", "几个免费的小应用：散步、煮汤、一起吃饭、问婆婆问题。没有信息流，没有打卡。", "幾個免費的小應用：散步、煮湯、一起吃飯、問婆婆問題。沒有資訊流，沒有打卡。", "Pequeñas apps gratis para pasear, hacer sopa, cenar juntos y preguntarle cosas a Popo. Sin feed, sin rachas.", "Petites apps gratuïtes per passejar, fer sopa, sopar junts i preguntar coses a la Popo. Sense feed, sense ratxes."], "stGet": ["Get", "获取", "獲取", "Obtener", "Obtenir"], "stFree": ["Free · No account · Five languages", "免费 · 不用注册 · 五种语言", "免費 · 不用註冊 · 五種語言", "Gratis · Sin cuenta · Cinco idiomas", "Gratis · Sense compte · Cinc idiomes"], "stAbout": ["About", "介绍", "介紹", "Acerca de", "Quant a"], "stShots": ["Screenshots", "截图", "截圖", "Capturas", "Captures"], "stTown": ["What the town says", "镇上的人怎么说", "鎮上的人怎麼說", "Lo que dice el pueblo", "El que diu el poble"], "stNo": ["No stars or ratings here. Just what people in town say.", "这里没有星星，也没有评分。只有镇上的人说的话。", "這裡沒有星星，也沒有評分。只有鎮上的人說的話。", "Aquí no hay estrellas ni puntuaciones. Solo lo que dice la gente del pueblo.", "Aquí no hi ha estrelles ni puntuacions. Només el que diu la gent del poble."], "stYour": ["Leave a comment for Wei", "给 Wei 留个评论", "給 Wei 留個評論", "Deja un comentario para Wei", "Deixa un comentari per a en Wei"], "stYourPh": ["What did you think? Only Wei reads it.", "你觉得怎么样？只有 Wei 会看。", "你覺得怎麼樣？只有 Wei 會看。", "¿Qué te ha parecido? Solo lo lee Wei.", "Què t'ha semblat? Només ho llegeix en Wei."], "stSent": ["Thank you. Wei reads every one.", "谢谢。每一条 Wei 都会看。", "謝謝。每一條 Wei 都會看。", "Gracias. Wei las lee todas.", "Gràcies. En Wei les llegeix totes."], "stAdded": ["On your home screen again.", "已经回到你的主屏幕上了。", "已經回到你的主螢幕上了。", "Ya está otra vez en tu pantalla de inicio.", "Ja torna a ser a la teva pantalla d'inici."], "stApp": ["App", "应用", "應用", "App", "App"], "c_lt1": ["she gave me 'call your aunt'. i called my aunt. we talked for an hour. ok fine.", "她给我的纸条是“给你阿姨打电话”。我打了。聊了一个小时。好吧。", "她給我的紙條是“給你阿姨打電話”。我打了。聊了一個小時。好吧。", "me tocó 'llama a tu tía'. llamé a mi tía. hablamos una hora. vale, bien.", "em va tocar 'truca a la teva tieta'. vaig trucar a la meva tieta. vam parlar una hora. d'acord, bé."], "c_lt2": ["*sits in the jar*", "*坐进了罐子里*", "*坐進了罐子裡*", "*se mete en el tarro*", "*s'asseu dins el pot*"], "c_pw1": ["Cat read card better than fortune teller in Mong Kok. And cheaper.", "猫看牌比旺角的算命师还准。还便宜。", "貓看牌比旺角的算命師還準。還便宜。", "La gata lee las cartas mejor que la adivina de Mong Kok. Y más barato.", "La gata llegeix les cartes millor que l'endevina de Mong Kok. I més barat."], "c_pw2": ["Yuzu told me to call my mum. Yuzu was right.", "柚子让我打给我妈。柚子是对的。", "柚子讓我打給我媽。柚子是對的。", "Yuzu me dijo que llamara a mi madre. Yuzu tenía razón.", "La Yuzu em va dir que truqués a la meva mare. La Yuzu tenia raó."], "c_co1": ["I cook for twelve, eight come. Next time I invite twenty.", "我煮十二个人的饭，来了八个。下次我请二十个。", "我煮十二個人的飯，來了八個。下次我請二十個。", "Cocino para doce, vienen ocho. La próxima invito a veinte.", "Cuino per a dotze, en vénen vuit. La propera en convido vint."], "c_co2": ["the bring list stopped three people bringing chips. revolutionary", "“带什么”清单让三个人不再都带薯片。革命性的", "“帶什麼”清單讓三個人不再都帶薯片。革命性的", "la lista de qué traer evitó que tres personas trajeran patatas fritas. revolucionario", "la llista de què portar va evitar que tres persones portessin patates. revolucionari"], "c_fs1": ["sent my mom flowers that open on her birthday. she cried. good crying", "给我妈寄了一束到她生日才打开的花。她哭了。是好的那种哭", "給我媽寄了一束到她生日才打開的花。她哭了。是好的那種哭", "le mandé a mi madre flores que se abren en su cumpleaños. lloró. del bueno", "vaig enviar a la meva mare flors que s'obren el dia del seu aniversari. va plorar. del bo"], "c_fs2": ["The card says 'call me when you get it'. She did.", "卡片上写着“收到了就打给我”。她打了。", "卡片上寫著“收到了就打給我”。她打了。", "La tarjeta dice 'llámame cuando te llegue'. Llamó.", "La targeta diu 'truca'm quan t'arribi'. Va trucar."], "c_bp1": ["Lent my old Murakami to a neighbour. Got it back with a pressed flower in it.", "把我那本旧村上春树借给了邻居。还回来时里面夹着一朵压花。", "把我那本舊村上春樹借給了鄰居。還回來時裡面夾著一朵壓花。", "Le presté mi viejo Murakami a una vecina. Me lo devolvió con una flor prensada dentro.", "Vaig deixar el meu vell Murakami a una veïna. Me'l va tornar amb una flor premsada a dins."], "c_bp2": ["*sleeps on the poetry shelf, approving*", "*睡在诗歌那层书架上，表示认可*", "*睡在詩歌那層書架上，表示認可*", "*duerme en el estante de poesía, con aprobación*", "*dorm al prestatge de poesia, amb aprovació*"], "c_sh1": ["Thirty years I send postcard. Now the postcard wait for the right day. Very clever.", "我寄了三十年明信片。现在明信片会等到对的那天。好聪明。", "我寄了三十年明信片。現在明信片會等到對的那天。好聰明。", "Treinta años mandando postales. Ahora la postal espera el día justo. Muy listo.", "Trenta anys enviant postals. Ara la postal espera el dia just. Molt enginyós."], "c_sh2": ["scheduled one for my best friend's 17th. she has no idea", "给我最好的朋友定了一张，她十七岁生日那天才打开。她完全不知道", "給我最好的朋友定了一張，她十七歲生日那天才開啟。她完全不知道", "programé una para el 17 cumpleaños de mi mejor amiga. no tiene ni idea", "n'he programat una per als 17 anys de la meva millor amiga. no en té ni idea"], "c_hg1": ["the cousins built a town. there's a whole street called 'call grandma'.", "表兄妹们建了一座小镇。有一整条街叫“打给外婆”。", "表兄妹們建了一座小鎮。有一整條街叫“打給外婆”。", "los primos construimos un pueblo. hay una calle entera que se llama 'llama a la abuela'.", "els cosins vam construir un poble. hi ha un carrer sencer que es diu 'truca a l'àvia'."], "c_hg2": ["My grandchildren build a town. I am the soup shop.", "我的孙子孙女建了一座小镇。我是那家汤铺。", "我的孫子孫女建了一座小鎮。我是那家湯鋪。", "Mis nietos construyen un pueblo. Yo soy la tienda de sopa.", "Els meus néts construeixen un poble. Jo sóc la botiga de sopa."], "c_tg1": ["Twelve grape, twelve month, one family. Don't choke ah.", "十二颗葡萄，十二个月，一家人。别噎着啊。", "十二顆葡萄，十二個月，一家人。別噎著啊。", "Doce uvas, doce meses, una familia. No te atragantes, eh.", "Dotze grans, dotze mesos, una família. No t'ennuegis, eh."], "c_tg2": ["*under the table, waiting for a dropped grape*", "*在桌子底下，等着掉下来的葡萄*", "*在桌子底下，等著掉下來的葡萄*", "*debajo de la mesa, esperando que caiga una uva*", "*sota la taula, esperant que caigui un gra*"], "c_ap1": ["Wei ask me where I grew up. I talk two hours. He write two lines only!", "Wei 问我在哪里长大。我讲了两个钟头。他只写了两行！", "Wei 問我在哪裡長大。我講了兩個鐘頭。他只寫了兩行！", "Wei me preguntó dónde crecí. Hablé dos horas. ¡Y él escribió solo dos líneas!", "En Wei em va preguntar on vaig créixer. Vaig parlar dues hores. I ell només va escriure dues línies!"], "c_ap2": ["Fifty-two questions. I've learned more about Popo than in thirty years.", "五十二个问题。我对婆婆的了解比过去三十年还多。", "五十二個問題。我對婆婆的瞭解比過去三十年還多。", "Cincuenta y dos preguntas. He aprendido más de Popo que en treinta años.", "Cinquanta-dues preguntes. He après més de la Popo que en trenta anys."], "c_aw1": ["my weather was stormy, my rose was a croissant, my thanks went to Wei. he said that's the nicest thing on the internet", "我心里是雷雨，玫瑰是一个可颂，感谢给了 Wei。他说这是网上最温暖的东西", "我心裡是雷雨，玫瑰是一個可頌，感謝給了 Wei。他說這是網上最溫暖的東西", "mi tiempo era tormenta, mi rosa un cruasán, mi gracias para Wei. dijo que es lo más bonito de internet", "el meu temps era tempesta, la meva rosa un croissant, el meu gràcies per a en Wei. va dir que és el més bonic d'internet"], "c_aw2": ["*sits on the PDF until you go and say thank you*", "*趴在那本 PDF 上，直到你去说谢谢*", "*趴在那本 PDF 上，直到你去說謝謝*", "*se sienta encima del PDF hasta que vas a dar las gracias*", "*s'asseu damunt del PDF fins que vas a donar les gràcies*"], "c_ww1": ["*already at the door with the leash*", "*已经叼着牵绳等在门口了*", "*已經叼著牽繩等在門口了*", "*ya está en la puerta con la correa*", "*ja és a la porta amb la corretja*"], "c_ww2": ["twenty minutes, no phones, came back with gossip and a pastry", "二十分钟，没有手机，回来时带着八卦和一个面包", "二十分鐘，沒有手機，回來時帶著八卦和一個麵包", "veinte minutos, sin móviles, volví con cotilleos y un bollo", "vint minuts, sense mòbils, vaig tornar amb xafarderies i un pastisset"], "c_nb1": ["I work here. Come say hi, then go home and say hi to someone else.", "我在这里上班。来打个招呼，然后回家，跟别人也打个招呼。", "我在這裡上班。來打個招呼，然後回家，跟別人也打個招呼。", "Trabajo aquí. Ven a saludar, y luego vuelve a casa y saluda a alguien más.", "Treballo aquí. Vine a saludar, i després torna a casa i saluda algú altre."], "c_nb2": ["*naps on the counter, unbothered*", "*在吧台上午睡，毫不在意*", "*在吧檯上午睡，毫不在意*", "*duerme la siesta en la barra, sin inmutarse*", "*fa la migdiada a la barra, sense immutar-se*"], "c_st1": ["The slow train is where I think. Get off when you know who to call.", "慢车是我想事情的地方。等你知道该打给谁了，就下车。", "慢車是我想事情的地方。等你知道該打給誰了，就下車。", "El tren lento es donde pienso. Bájate cuando sepas a quién llamar.", "El tren lent és on penso. Baixa quan sàpigues a qui trucar."], "c_st2": ["rode it to hong kong at 2am. didn't sleep. worth it", "凌晨两点坐到了香港。没睡。值了", "凌晨兩點坐到了香港。沒睡。值了", "lo cogí hasta hong kong a las 2 de la mañana. no dormí. valió la pena", "el vaig agafar fins a hong kong a les 2 de la matinada. no vaig dormir. va valer la pena"], "c_ho1": ["my mom's morning is my night. we leave each other notes. it's kind of perfect", "我妈的早晨是我的夜晚。我们互相留言。有点完美", "我媽的早晨是我的夜晚。我們互相留言。有點完美", "la mañana de mi madre es mi noche. nos dejamos notas. es casi perfecto", "el matí de la meva mare és la meva nit. ens deixem notes. és gairebé perfecte"], "c_ho2": ["For two people in two time zones. It fills the gap; it doesn't replace the call.", "给在两个时区的两个人。它填补空隙，不代替电话。", "給在兩個時區的兩個人。它填補空隙，不代替電話。", "Para dos personas en dos husos horarios. Llena el hueco; no sustituye la llamada.", "Per a dues persones en dues zones horàries. Omple el buit; no substitueix la trucada."], "c_tc1": ["sunday dinner with my mom: me in barcelona, her in new york. same soup. same candle.", "和我妈的星期天晚饭：我在巴塞罗那，她在纽约。同一道汤，同一根蜡烛。", "和我媽的星期天晚飯：我在巴塞羅那，她在紐約。同一道湯，同一根蠟燭。", "cena del domingo con mi madre: yo en barcelona, ella en nueva york. la misma sopa. la misma vela.", "sopar de diumenge amb la meva mare: jo a barcelona, ella a nova york. la mateixa sopa. la mateixa espelma."], "c_tc2": ["Two city, one soup. Good. But come home sometime also.", "两座城市，一锅汤。好。但是也要回家啊。", "兩座城市，一鍋湯。好。但是也要回家啊。", "Dos ciudades, una sopa. Bien. Pero ven a casa alguna vez también.", "Dues ciutats, una sopa. Bé. Però vine a casa alguna vegada també."], "c_vo1": ["I learn English from one dictionary. You have this. No excuse lah.", "我是靠一本字典学英文的。你有这个。没借口啦。", "我是靠一本字典學英文的。你有這個。沒借口啦。", "Yo aprendí inglés con un diccionario. Tú tienes esto. Sin excusas, eh.", "Jo vaig aprendre anglès amb un diccionari. Tu tens això. Sense excuses, eh."], "c_vo2": ["taught my friend 'bon dia'. she says it to the baker now. growth", "教了我朋友说“bon dia”。她现在每天对面包师傅说。成长了", "教了我朋友說“bon dia”。她現在每天對面包師傅說。成長了", "le enseñé a mi amiga 'bon dia'. ahora se lo dice al panadero. progreso", "vaig ensenyar a la meva amiga 'bon dia'. ara li ho diu al forner. creixement"], "fdAdd": ["Folder", "文件夹", "資料夾", "Carpeta", "Carpeta"], "fdOne": ["Folder", "文件夹", "資料夾", "Carpeta", "Carpeta"], "fdNew": ["Folder", "文件夹", "資料夾", "Carpeta", "Carpeta"], "fdN1": ["Together", "一起", "一起", "Juntos", "Junts"], "fdN2": ["Far away", "远方", "遠方", "Lejos", "Lluny"], "fdN3": ["Family", "家人", "家人", "Familia", "Família"], "fdN4": ["Just me", "我自己", "我自己", "Solo yo", "Només jo"], "fdName": ["Folder name", "文件夹名字", "資料夾名字", "Nombre de la carpeta", "Nom de la carpeta"], "fdEdit": ["Add or take out apps", "加入或移出应用", "加入或移出應用", "Añadir o quitar ap 他是抱著筆記本的書呆子，我是會萃濃縮、會調一杯像樣尼格羅尼的那個。", "*sacando brillo a un vaso* No soy Wei Meng, antes de que preguntes. Él es el friki del portátil. Yo soy el que sabe sacar un espresso y hacerte un Negroni como Dios manda.", "*abrillantant un got* No soc en Wei Meng, abans que ho preguntis. Ell és el friqui del portàtil. Jo soc el que sap treure un espresso i fer-te un Negroni com cal."], "twoWM": ["Not the bartender, find the real one at Next Door.", "不是调酒师，真正的在隔壁。", "不是調酒師，真正的在隔壁。", "No es el camarero, el de verdad está en Al Lado.", "No és el cambrer, el de veritat és a Al Costat."], "cWei2": ["Next Door, Wei speaking. …No, the other Wei. Wei Meng's the one with the laptop and the cold coffee; I made the coffee. Come by, I'll make you one he'd never manage.", "隔壁，我是 Wei。……不是，是另一个 Wei。抱着笔记本、咖啡放凉的那个是孟玮；咖啡是我做的。过来吧，给你做一杯他这辈子都做不出来的。", "隔壁，我是 Wei。……不是，是另一個 Wei。抱著筆記本、咖啡放涼的那個是孟瑋；咖啡是我做的。過來吧，給你做一杯他這輩子都做不出來的。", "Al Lado, habla Wei. …No, el otro Wei. Wei Meng es el del portátil y el café frío; el café lo hice yo. Pásate, te hago uno que él jamás sabría hacer.", "Al Costat, parla en Wei. …No, l'altre Wei. En Wei Meng és el del portàtil i el cafè fred; el cafè el vaig fer jo. Passa, que te'n faig un que ell no sabria fer mai."], "cWei": ["Next Door, Wei speaking. Your seat's free. Come by, and bring someone with you this time.", "隔壁，我是 Wei。你的位子空着呢。过来坐坐吧，这次带个人一起来。", "隔壁，我是 Wei。你的位子空著呢。過來坐坐吧，這次帶個人一起來。", "Al Lado, habla Wei. Tu sitio está libre. Pásate, y esta vez trae a alguien.", "Al Costat, parla en Wei. El teu lloc és lliure. Passa, i aquesta vegada porta algú."], "cWeiZ": ["z z z… (Wei's asleep. Try him after six.)", "呼……呼……（Wei 在睡觉。六点以后再打。）", "呼……呼……（Wei 在睡覺。六點以後再打。）", "z z z… (Wei duerme. Prueba después de las seis.)", "z z z… (En Wei dorm. Prova-ho després de les sis.)"], "cMei": ["ugh, who calls? text me. jk. go call someone who'd actually be happy to hear you.", "啊，谁还打电话啊？发信息啦。开玩笑的。去打给一个真的会很高兴听到你声音的人。", "啊，誰還打電話啊？發信息啦。開玩笑的。去打給一個真的會很高興聽到你聲音的人。", "ugh, ¿quién llama hoy en día? escríbeme. es broma. llama a alguien que se alegre de oírte.", "ugh, qui truca encara? escriu-me. és broma. truca a algú que s'alegri de sentir-te."], "cMeiZ": ["(voicemail) it's mei. i'm asleep. obviously.", "（语音信箱）我是 Mei。我在睡觉。很明显吧。", "（語音信箱）我是 Mei。我在睡覺。很明顯吧。", "(buzón) soy mei. estoy durmiendo. obvio.", "(bústia) sóc la mei. estic dormint. òbviament."], "cPopo": ["Wah, you call me! Eat already or not? Now call your own grandma also lah.", "哎呀，你打给我呀！吃饭了没有？现在也打给你自己的婆婆啦。", "哎呀，你打給我呀！吃飯了沒有？現在也打給你自己的婆婆啦。", "¡Ay, me llamas! ¿Comiste ya o no? Ahora llama a tu abuela también, eh.", "Ai, em truques! Ja has menjat o no? Ara truca a la teva àvia també, eh."], "cPopoZ": ["Shh. Popo's asleep. Nobody wakes Popo.", "嘘。婆婆睡了。谁都不许吵醒婆婆。", "噓。婆婆睡了。誰都不許吵醒婆婆。", "Shh. Popo duerme. A Popo no la despierta nadie.", "Xxt. La Popo dorm. Ningú desperta la Popo."], "cMiso": ["Mrrp. (She sat on the phone. The call ended.)", "咪呜。（她坐在了电话上。通话结束了。）", "咪嗚。（她坐在了電話上。通話結束了。）", "Mrrp. (Se ha sentado encima del teléfono. Se cortó.)", "Mrrp. (S'ha assegut sobre el telèfon. S'ha tallat.)"], "cYuzu": ["Mew? (purring, very close to the microphone)", "喵？（贴着话筒呼噜呼噜）", "喵？（貼著話筒呼嚕呼嚕）", "¿Miau? (ronroneando, muy cerca del micrófono)", "Miau? (roncant, molt a prop del micròfon)"], "cCatsZ": ["(purring in their sleep)", "（睡梦中呼噜呼噜）", "（睡夢中呼嚕呼嚕）", "(ronronean dormidas)", "(roncs adormits)"], "cMantou": ["Woof! Woof! (his tail is hitting the floor)", "汪！汪！（尾巴拍着地板）", "汪！汪！（尾巴拍著地板）", "¡Guau! ¡Guau! (la cola golpea el suelo)", "Bup! Bup! (la cua pica a terra)"], "cMantouZ": ["(a small, sleepy snore)", "（小小的、困困的呼噜声）", "（小小的、困困的呼嚕聲）", "(un ronquido pequeño y dormido)", "(un ronc petit i adormit)"], "mPick": ["Last thing: what would help most right now? I'll put a few apps on your home screen.", "最后一件事：你现在最需要什么？我先放几个应用到你的主屏幕上。", "最後一件事：你現在最需要什麼？我先放幾個應用到你的主螢幕上。", "Lo último: ¿qué te vendría mejor ahora? Te pongo unas apps en la pantalla de inicio.", "L'última cosa: què t'aniria millor ara? Et poso unes apps a la pantalla d'inici."], "pk1": ["People near me", "身边的人", "身邊的人", "La gente cerca de mí", "La gent a prop meu"], "pk2": ["Someone far away", "远方的某个人", "遠方的某個人", "Alguien lejos", "Algú lluny"], "pk3": ["My family", "我的家人", "我的家人", "Mi familia", "La meva família"], "pk4": ["Something small, just for me", "一点小事，给我自己", "一點小事，給我自己", "Algo pequeño, solo para mí", "Alguna cosa petita, només per a mi"], "pkAll": ["Show me everything", "全部都给我看看", "全部都給我看看", "Enséñamelo todo", "Ensenya-m'ho tot"], "mPicked": ["Done. They're on your home screen. Everything else is in the Store, whenever you want it.", "好了。它们在你的主屏幕上了。其他的都在商店里，随时可以拿。", "好了。它們在你的主螢幕上了。其他的都在商店裡，隨時可以拿。", "Hecho. Ya están en tu pantalla de inicio. Todo lo demás está en la Tienda, cuando quieras.", "Fet. Ja són a la teva pantalla d'inici. Tota la resta és a la Botiga, quan vulguis."], "mGot": ["Got it, thanks", "知道了，谢谢", "知道了，謝謝", "Entendido, gracias", "Entesos, gràcies"], "mWM7": ["What would you like here? Tell me below. Only I read it.", "你希望这里有什么？在下面告诉我，只有我会看。", "你希望這裡有什麼？在下面告訴我，只有我會看。", "¿Qué te gustaría encontrar aquí? Dímelo abajo. Solo lo leo yo.", "Què t'agradaria trobar aquí? Digues-m'ho a sota. Només ho llegeixo jo."], "fbPh": ["Tell Wei Meng what you think…", "跟孟玮说说你的想法……", "跟孟瑋說說你的想法……", "Dile a Wei Meng lo que piensas…", "Digues a en Wei Meng què en penses…"], "fbIdea": ["💡 An idea", "💡 一个点子", "💡 一個點子", "💡 Una idea", "💡 Una idea"], "fbOff": ["🔧 Something's off", "🔧 有地方不对", "🔧 有地方不對", "🔧 Algo no va bien", "🔧 Alguna cosa no va bé"], "fbWish": ["✨ I wish…", "✨ 我希望……", "✨ 我希望……", "✨ Ojalá…", "✨ Tant de bo…"], "fbNote": ["No name needed. Only Wei Meng reads it.", "不用留名字。只有孟玮会看。", "不用留名字。只有孟瑋會看。", "No hace falta nombre. Solo lo lee Wei Meng.", "No cal nom. Només ho llegeix en Wei Meng."], "fbThanks": ["*folds it and puts it in his pocket* Thank you. I read every one, usually after the last cup.", "*折好，放进口袋* 谢谢。每一条我都会看，通常是在最后一杯之后。", "*摺好，放進口袋* 謝謝。每一條我都會看，通常是在最後一杯之後。", "*lo dobla y se lo guarda en el bolsillo* Gracias. Las leo todas, normalmente después de la última taza.", "*el plega i se'l guarda a la butxaca* Gràcies. Les llegeixo totes, normalment després de l'última tassa."], "fbSlow": ["That's plenty for today, thank you. Write again tomorrow?", "今天已经够多啦，谢谢。明天再写？", "今天已經夠多啦，謝謝。明天再寫？", "Por hoy ya es mucho, gracias. ¿Me escribes mañana?", "Per avui ja n'hi ha prou, gràcies. M'escrius demà?"], "fbFail": ["Couldn't send it just now. Your words are still in the box; try again in a moment.", "刚才没发出去。你的话还在框里，等一下再试试。", "剛才沒發出去。你的話還在框裡，等一下再試試。", "No se ha podido enviar ahora. Tus palabras siguen en la caja; prueba en un momento.", "No s'ha pogut enviar ara. Les teves paraules encara són a la capsa; torna-ho a provar d'aquí a un moment."], "fbKept": ["Kept on this phone (your privacy choice). Nothing was sent.", "按你的隐私选择，留在了这部手机上。什么都没有发送。", "按你的隱私選擇，留在了這部手機上。什麼都沒有傳送。", "Guardado en este móvil (tu elección de privacidad). No se ha enviado nada.", "Desat en aquest mòbil (la teva elecció de privacitat). No s'ha enviat res."], "sTell": ["Tell Wei what you think", "跟 Wei 说说你的想法", "跟 Wei 說說你的想法", "Dile a Wei lo que piensas", "Digues a en Wei què en penses"], "mSay": ["Say it in person", "当面说吧", "當面說吧", "Dilo en persona", "Digues-ho en persona"], "mSaid": ["Better said in person.", "这句话，当面说更好。", "這句話，當面說更好。", "Mejor dicho en persona.", "Millor dit en persona."], "oHi": ["Hi, I'm Wei Meng. This phone holds the small things I make after hours.", "你好，我是孟玮。这部手机里，是我下班后做的小东西。", "你好，我是孟瑋。這部手機裡，是我下班後做的小東西。", "Hola, soy Wei Meng. Este móvil guarda las cosas pequeñas que hago fuera de horas.", "Hola, soc en Wei Meng. Aquest mòbil guarda les coses petites que faig fora d'hores."], "oTap": ["Tap one. It opens. Free, no account.", "点一下就打开。免费，不用注册。", "點一下就開啟。免費，不用註冊。", "Toca una. Se abre. Gratis, sin cuenta.", "Toca'n una. S'obre. Gratis, sense compte."], "oTop": ["Up top, three buttons.", "顶上有三个按钮。", "頂上有三個按鈕。", "Arriba, tres botones.", "A dalt, tres botons."], "oTopM": ["who wrote to you", "谁给你留了话", "誰給你留了話", "quién te escribió", "qui t'ha escrit"], "oTopS": ["every app", "所有应用", "所有應用", "todas las apps", "totes les apps"], "oTopG": ["language, your name", "语言、你的名字", "語言、你的名字", "idioma, tu nombre", "llengua, el teu nom"], "oDown": ["Done? Slide. Then go find someone. That's the point.", "用完了？滑一下，然后去找个人。这才是重点。", "用完了？滑一下，然後去找個人。這才是重點。", "¿Ya está? Desliza. Y ve a buscar a alguien. De eso se trata.", "Ja està? Llisca. I ves a buscar algú. D'això es tracta."], "mWM1": ["Hi, I'm Wei. This phone holds everything I make after hours.", "你好，我是 Wei。这部手机里装着我下班后做的所有东西。", "你好，我是 Wei。這部手機裡裝著我下班後做的所有東西。", "Hola, soy Wei. Este móvil guarda todo lo que hago fuera de horas.", "Hola, sóc en Wei. Aquest mòbil guarda tot el que faig fora d'hores."], "mWM2": ["Twenty-seven small, free things. Each one ends with you putting the phone down, next to someone.", "二十七个小小的、免费的东西。每一个的结尾，都是你放下手机，待在某个人身边。", "二十七個小小的、免費的東西。每一個的結尾，都是你放下手機，待在某個人身邊。", "Veintisiete cosas pequeñas y gratis. Todas terminan contigo dejando el móvil, junto a alguien.", "Vint-i-set coses petites i gratis. Totes acaben amb tu deixant el mòbil, al costat d'algú."], "mWM3": ["Tap any icon to open it. No account, nothing to install, and nothing you do is sent anywhere.", "点任何一个图标就能打开。不用注册，不用安装，你做的任何事都不会发送出去。", "點任何一個圖示就能開啟。不用註冊，不用安裝，你做的任何事都不會發送出去。", "Toca cualquier icono para abrirlo. Sin cuenta, nada que instalar, y nada de lo que hagas se envía.", "Toca qualsevol icona per obrir-la. Sense compte, res a instal·lar, i res del que facis s'envia."], "mNav": ["‹ goes back. The bar takes you home.", "‹ 返回上一页。横杠带你回主屏幕。", "‹ 返回上一頁。橫槓帶你回主螢幕。", "‹ vuelve atrás. La barra te lleva al inicio.", "‹ torna enrere. La barra et porta a l'inici."], "mNavBack": ["back one page", "回上一页", "回上一頁", "una página atrás", "una pàgina enrere"], "mNavHome": ["home, from anywhere", "回主屏幕", "回主螢幕", "al inicio, desde donde sea", "a l'inici, des d'on sigui"], "mWM4": ["The card at the top changes with the hour, and lights up what's already yours today.", "最上面的卡片会随着时间变化，也会点亮今天已经属于你的东西。", "最上面的卡片會隨著時間變化，也會點亮今天已經屬於你的東西。", "La tarjeta de arriba cambia con la hora y enciende lo que ya es tuyo hoy.", "La targeta de dalt canvia amb l'hora i encén el que ja és teu avui."], "mWM5": ["Settings has your language, your name and what this phone keeps, for every app at once.", "设置里有语言、你的名字，和这部手机保存的东西，所有应用一起管。", "設定裡有語言、你的名字，和這部手機儲存的東西，所有應用一起管。", "En Ajustes están tu idioma, tu nombre y lo que guarda este móvil, para todas las apps a la vez.", "A Configuració hi ha el teu idioma, el teu nom i el que guarda aquest mòbil, per a totes les apps alhora."], "mWM6": ["When you're done, press Put the phone down. That part is the whole point.", "用完了，就按“放下手机”。那一步才是全部的意义。", "用完了，就按“放下手機”。那一步才是全部的意義。", "Cuando termines, pulsa Deja el móvil. Esa parte es lo importante.", "Quan acabis, prem Deixa el mòbil. Aquesta part és el que importa."], "mPopo1": ["Eat already or not? I am not asking the phone, asking you lah.", "吃饭了没有？我不是问手机，是问你啦。", "吃飯了沒有？我不是問手機，是問你啦。", "¿Comiste ya o no? No pregunto al móvil, pregunto a ti.", "Ja has menjat o no? No ho pregunto al mòbil, t'ho pregunto a tu."], "mPopo2": ["Every day I got one small thing for you. Open my jar, take one paper. {app:lt}", "我每天都有一件小事给你。打开我的罐子，拿一张纸条。{app:lt}", "我每天都有一件小事給你。開啟我的罐子，拿一張紙條。{app:lt}", "Cada día tengo una cosita para ti. Abre mi tarro, coge un papel. {app:lt}", "Cada dia tinc una coseta per a tu. Obre el meu pot, agafa un paper. {app:lt}"], "mPopo3": ["One question a week, ask your grandma in person. Write two lines, keep the answer lor. {app:ap}", "一个星期一个问题，当面问你的婆婆。写两行字，把答案留下来。{app:ap}", "一個星期一個問題，當面問你的婆婆。寫兩行字，把答案留下來。{app:ap}", "Una pregunta por semana, pregúntale a tu abuela en persona. Dos líneas para guardar la respuesta. {app:ap}", "Una pregunta per setmana, pregunta-la a la teva àvia en persona. Dues línies per guardar la resposta. {app:ap}"], "mPopo4": ["Want people come your house? Pick a day, send them the link. {app:co}", "想请人来家里？选个日子，把链接发给他们。{app:co}", "想請人來家裡？選個日子，把連結發給他們。{app:co}", "¿Quieres gente en casa? Elige un día y mándales el enlace. {app:co}", "Vols gent a casa? Tria un dia i envia'ls l'enllaç. {app:co}"], "mPopo5": ["New Year's Eve, twelve grapes at my table. Don't be late ah. {app:tg}", "年三十晚上……不对，是除夕夜，来我桌上吃十二颗葡萄。别迟到啊。{app:tg}", "年三十晚上……不對，是除夕夜，來我桌上吃十二顆葡萄。別遲到啊。{app:tg}", "Nochevieja, doce uvas en mi mesa. No llegues tarde, eh. {app:tg}", "Cap d'any, dotze grans de raïm a la meva taula. No arribis tard, eh. {app:tg}"], "mMei1": ["ok quick tour bc wei is slow", "好，快速导览，因为 Wei 太慢了", "好，快速導覽，因為 Wei 太慢了", "ok tour rápido porque wei es lento", "ok tour ràpid perquè en wei és lent"], "mMei2": ["someone far away? book dinner for two. same night, two cities, two candles. my mom's in new york, we do sundays {app:tc}", "有人在远方？订一顿两个人的晚饭。同一晚，两座城市，两根蜡烛。我妈在纽约，我们每个星期天都吃 {app:tc}", "有人在遠方？訂一頓兩個人的晚飯。同一晚，兩座城市，兩根蠟燭。我媽在紐約，我們每個星期天都吃 {app:tc}", "¿alguien lejos? reserva cena para dos. misma noche, dos ciudades, dos velas. mi madre está en nueva york, lo hacemos los domingos {app:tc}", "algú lluny? reserva sopar per a dos. mateixa nit, dues ciutats, dues espelmes. la meva mare és a nova york, ho fem els diumenges {app:tc}"], "mMei3": ["for two people who live apart: {app:ho}", "给分隔两地的两个人：{app:ho}", "給分隔兩地的兩個人：{app:ho}", "para dos personas que viven lejos: {app:ho}", "per a dues persones que viuen lluny: {app:ho}"], "mMei4": ["a postcard that opens on its day. a bunch of flowers in a link. {app:sh} {app:fs}", "一张到了那天才打开的明信片。一束装在链接里的花。{app:sh} {app:fs}", "一張到了那天才開啟的明信片。一束裝在連結裡的花。{app:sh} {app:fs}", "una postal que se abre el día que toca. un ramo de flores en un enlace. {app:sh} {app:fs}", "una postal que s'obre el dia que toca. un ram de flors en un enllaç. {app:sh} {app:fs}"], "mMei5": ["and three words in someone's language > three hundred on duolingo {app:vo}", "还有，用别人的语言说三个词 > 背三百个单词 {app:vo}", "還有，用別人的語言說三個詞 > 背三百個單詞 {app:vo}", "y tres palabras en el idioma de alguien > trescientas en una app {app:vo}", "i tres paraules en l'idioma d'algú > tres-centes en una app {app:vo}"], "mMei6": ["language is in settings. you're welcome", "语言在设置里。不用谢", "語言在設定裡。不用謝", "el idioma está en ajustes. de nada", "l'idioma és a configuració. de res"], "mWei1": ["Evening. The lamps are on.", "晚上好。灯都亮了。", "晚上好。燈都亮了。", "Buenas noches. Las lámparas están encendidas.", "Bon vespre. Els llums són encesos."], "mWei2": ["Nearby is a little town. Walk in, sit at the counter, lie in the park, do nothing for a while. Then go back to yours. {app:nb}", "近邻是一个小镇。走进来，坐在吧台边，躺在公园里，什么都不做待一会儿。然后回到你自己的生活。{app:nb}", "近鄰是一個小鎮。走進來，坐在吧檯邊，躺在公園裡，什麼都不做待一會兒。然後回到你自己的生活。{app:nb}", "Cerca es un pueblecito. Entra, siéntate en la barra, túmbate en el parque, no hagas nada un rato. Luego vuelve al tuyo. {app:nb}", "A Prop és un poblet. Entra, seu a la barra, estira't al parc, no facis res una estona. Després torna al teu. {app:nb}"], "mWei3": ["If you can't sleep, there's a slow train with a window seat. {app:st}", "睡不着的话，有一列慢车，靠窗的位子给你留着。{app:st}", "睡不著的話，有一列慢車，靠窗的位子給你留著。{app:st}", "Si no puedes dormir, hay un tren lento con asiento de ventanilla. {app:st}", "Si no pots dormir, hi ha un tren lent amb seient de finestra. {app:st}"], "mWei4": ["Lend a book by hand, or build a little town with your own people. {app:bp} {app:hg}", "亲手借出一本书，或者和你自己的人一起建一座小镇。{app:bp} {app:hg}", "親手借出一本書，或者和你自己的人一起建一座小鎮。{app:bp} {app:hg}", "Presta un libro en mano, o construye un pueblecito con los tuyos. {app:bp} {app:hg}", "Deixa un llibre en mà, o construeix un poblet amb els teus. {app:bp} {app:hg}"], "mCats1": ["meow.", "喵。", "喵。", "miau.", "miau."], "mCats2": ["*Yuzu puts one paw on a card. One card a day, the same for everyone.* {app:pw}", "*柚子把一只爪子放在一张牌上。一天一张，每个人都是同一张。* {app:pw}", "*柚子把一隻爪子放在一張牌上。一天一張，每個人都是同一張。* {app:pw}", "*Yuzu pone una pata sobre una carta. Una al día, la misma para todos.* {app:pw}", "*La Yuzu posa una pota sobre una carta. Una al dia, la mateixa per a tothom.* {app:pw}"], "mCats3": ["*Miso pushes your phone off the table*", "*味噌把你的手机推下了桌子*", "*味噌把你的手機推下了桌子*", "*Miso tira tu móvil de la mesa*", "*La Miso tira el teu mòbil de la taula*"], "mDog1": ["woof!", "汪！", "汪！", "¡guau!", "bup!"], "mDog2": ["*brings you the leash* Twenty minutes, one corner, phones in pockets. {app:ww}", "*把牵绳叼给你* 二十分钟，一个街角，手机放口袋。{app:ww}", "*把牽繩叼給你* 二十分鐘，一個街角，手機放口袋。{app:ww}", "*te trae la correa* Veinte minutos, una esquina, móviles en el bolsillo. {app:ww}", "*et porta la corretja* Vint minuts, una cantonada, mòbils a la butxaca. {app:ww}"], "mDog3": ["*sits by the door, tail going*", "*坐在门边，尾巴摇个不停*", "*坐在門邊，尾巴搖個不停*", "*se sienta junto a la puerta, moviendo la cola*", "*s'asseu a la porta, movent la cua*"], "eFrom": ["from", "来自", "來自", "de", "de"], "eOpen": ["Open {app}", "打开{app}", "開啟{app}", "Abrir {app}", "Obre {app}"], "eUnsub": ["To unsubscribe, put the phone down.", "退订方法：放下手机。", "退訂方法：放下手機。", "Para darte de baja, deja el móvil.", "Per donar-te de baixa, deixa el mòbil."], "eInbox": ["Inbox", "收件箱", "收件箱", "Recibidos", "Safata d'entrada"], "e_nb_s": ["Your seat at the counter is free", "吧台边你的位子空着", "吧檯邊你的位子空著", "Tu sitio en la barra está libre", "El teu lloc a la barra és lliure"], "e_nb_b": ["Nearby is a little world that sends you back to yours. Lie in the park, borrow a book, play the jukebox, or just sit. Nobody counts how long you stay.\nThe drinks are on the house. The company is the point.", "近邻是一个会把你送回自己生活的小世界。躺在公园里，借一本书，点一首歌，或者就坐着。没有人会数你待了多久。\n饮料免费。陪伴才是重点。", "近鄰是一個會把你送回自己生活的小世界。躺在公園裡，借一本書，點一首歌，或者就坐著。沒有人會數你待了多久。\n飲料免費。陪伴才是重點。", "Cerca es un mundo pequeño que te devuelve al tuyo. Túmbate en el parque, toma un libro prestado, pon la gramola o simplemente siéntate. Nadie cuenta cuánto te quedas.\nLas bebidas corren de nuestra cuenta. Lo importante es la compañía.", "A Prop és un món petit que et torna al teu. Estira't al parc, agafa un llibre en préstec, posa el tocadiscos o simplement seu. Ningú compta quanta estona et quedes.\nLes begudes van a compte de la casa. El que importa és la companyia."], "e_st_s": ["A window seat on the slow train", "慢车上靠窗的位子", "慢車上靠窗的位子", "Asiento de ventanilla en el tren lento", "Seient de finestra al tren lent"], "e_st_b": ["The night train leaves whenever you board it. Watch the lights go by, listen to the rails, and get off when you're ready to call someone.", "夜车在你上车的时候出发。看窗外的灯一盏盏过去，听铁轨的声音，等你想打电话给谁了，就下车。", "夜車在你上車的時候出發。看窗外的燈一盞盞過去，聽鐵軌的聲音，等你想打電話給誰了，就下車。", "El tren nocturno sale cuando subes. Mira pasar las luces, escucha las vías y bájate cuando tengas ganas de llamar a alguien.", "El tren de nit surt quan hi puges. Mira passar els llums, escolta les vies i baixa quan tinguis ganes de trucar a algú."], "e_bp_s": ["Real books, lent by hand", "真正的书，亲手借出", "真正的書，親手借出", "Libros de verdad, prestados en mano", "Llibres de veritat, deixats en mà"], "e_bp_b": ["Put the books from your shelf on a little list and let your neighbours borrow them. You hand each one over in person. That's the whole system, and it works.", "把你书架上的书列成一张小清单，让邻居来借。每一本都亲手交过去。整个系统就这样，而且行得通。", "把你書架上的書列成一張小清單，讓鄰居來借。每一本都親手交過去。整個系統就這樣，而且行得通。", "Pon los libros de tu estantería en una lista y deja que tus vecinos los tomen prestados. Cada uno se entrega en mano. Ese es todo el sistema, y funciona.", "Posa els llibres del teu prestatge en una llista i deixa que els veïns els agafin. Cadascun es dona en mà. Aquest és tot el sistema, i funciona."], "e_hg_s": ["A town your people build together", "一座由你的人一起建起来的小镇", "一座由你的人一起建起來的小鎮", "Un pueblo que construyen los tuyos", "Un poble que construeixen els teus"], "e_hg_b": ["Start a little town with your family or friends. Each place is something you do for each other: showing up, saying it, looking after, having fun. Then meet in a real one.", "和家人或朋友一起开一座小镇。每个地方都是你们为彼此做的一件事：出现、说出口、照顾、一起玩。然后在真实的地方见面。", "和家人或朋友一起開一座小鎮。每個地方都是你們為彼此做的一件事：出現、說出口、照顧、一起玩。然後在真實的地方見面。", "Empieza un pueblecito con tu familia o amigos. Cada lugar es algo que hacéis el uno por el otro: estar, decirlo, cuidar, divertirse. Luego quedad en uno de verdad.", "Comença un poblet amb la teva família o amics. Cada lloc és una cosa que feu l'un per l'altre: ser-hi, dir-ho, cuidar, divertir-se. Després quedeu en un de veritat."], "e_lt_s": ["One small thing for you today", "今天给你的一件小事", "今天給你的一件小事", "Una cosita para ti hoy", "Una coseta per a tu avui"], "e_lt_b": ["Open my jar, take one paper. Small thing to do offline today: call your auntie, cook one egg for somebody, sit outside ten minutes.\nThen go do lah, don't keep reading.", "打开我的罐子，拿一张纸条。今天做一件离线的小事：打电话给你阿姨，给谁煎一个蛋，在外面坐十分钟。\n然后就去做啦，别一直看手机。", "開啟我的罐子，拿一張紙條。今天做一件離線的小事：打電話給你阿姨，給誰煎一個蛋，在外面坐十分鐘。\n然後就去做啦，別一直看手機。", "Abre mi tarro, coge un papel. Una cosita para hacer hoy sin pantalla: llama a tu tía, fríe un huevo para alguien, siéntate fuera diez minutos.\nLuego ve a hacerlo, eh, no sigas leyendo.", "Obre el meu pot, agafa un paper. Una coseta per fer avui sense pantalla: truca a la teva tieta, fregeix un ou per a algú, seu fora deu minuts.\nDesprés vés a fer-ho, eh, no continuïs llegint."], "e_ap_s": ["This week's question", "这个星期的问题", "這個星期的問題", "La pregunta de esta semana", "La pregunta d'aquesta setmana"], "e_ap_b": ["Every week one question. Ask your grandma, your dad, your old auntie. In person, not on the phone ah. Write two lines to keep the answer.\nEnd of the year, print a small book. Very nice one.", "每个星期一个问题。问你的婆婆、你爸爸、你家的老阿姨。要当面问，不要在电话里问啊。写两行字，把答案留下。\n到了年底，印成一本小书。很漂亮的。", "每個星期一個問題。問你的婆婆、你爸爸、你家的老阿姨。要當面問，不要在電話裡問啊。寫兩行字，把答案留下。\n到了年底，印成一本小書。很漂亮的。", "Cada semana una pregunta. Pregúntale a tu abuela, a tu padre, a tu tía mayor. En persona, no por teléfono, eh. Dos líneas para guardar la respuesta.\nA final de año, imprime un librito. Muy bonito.", "Cada setmana una pregunta. Pregunta-la a la teva àvia, al teu pare, a la teva tieta gran. En persona, no per telèfon, eh. Dues línies per guardar la resposta.\nA final d'any, imprimeix un llibret. Molt bonic."], "e_tg_s": ["Twelve grapes at midnight", "午夜的十二颗葡萄", "午夜的十二顆葡萄", "Doce uvas a medianoche", "Dotze grans de raïm a mitjanit"], "e_tg_b": ["New Year's Eve, one grape for every bell, one month for every grape. Say a wish for each month to the people at your table, not to the phone.", "除夕夜，钟响一下吃一颗葡萄，一颗葡萄代表一个月。把每个月的愿望说给你桌上的人听，不是说给手机听。", "除夕夜，鐘響一下吃一顆葡萄，一顆葡萄代表一個月。把每個月的願望說給你桌上的人聽，不是說給手機聽。", "Nochevieja, una uva por campanada, un mes por uva. Di un deseo para cada mes a la gente de tu mesa, no al móvil.", "Cap d'any, un gra per campanada, un mes per gra. Digues un desig per a cada mes a la gent de la teva taula, no al mòbil."], "e_co_s": ["Come over this week?", "这周来我家坐坐？", "這週來我家坐坐？", "¿Vienes a casa esta semana?", "Vens a casa aquesta setmana?"], "e_co_b": ["Have people over. Pick a day, write what you're cooking, send the link. Guests open it and say if they're coming. No group chat needed.\nI cook, you wash up.", "请人来家里。选个日子，写上你要做什么菜，把链接发出去。客人打开就能说来不来。不用建群。\n我做饭，你洗碗。", "請人來家裡。選個日子，寫上你要做什麼菜，把連結發出去。客人開啟就能說來不來。不用建群。\n我做飯，你洗碗。", "Invita a gente a casa. Elige un día, escribe qué cocinas y manda el enlace. Los invitados lo abren y dicen si vienen. Sin grupo de chat.\nYo cocino, tú friegas.", "Convida gent a casa. Tria un dia, escriu què cuines i envia l'enllaç. Els convidats l'obren i diuen si vénen. Sense grup de xat.\nJo cuino, tu rentes els plats."], "e_pw_s": ["*one paw on today's card*", "*一只爪子按在今天的牌上*", "*一隻爪子按在今天的牌上*", "*una pata sobre la carta de hoy*", "*una pota sobre la carta d'avui*"], "e_pw_b": ["*Miso sits on the deck. Yuzu turns one card over.*\nOne card a day, from two cats, the same card for everyone. It usually asks you to go and see someone.\n*mrrp.*", "*味噌坐在牌堆上。柚子翻开一张牌。*\n一天一张，两只猫给的，每个人都是同一张。它通常是让你去见一个人。\n*咪呜。*", "*味噌坐在牌堆上。柚子翻開一張牌。*\n一天一張，兩隻貓給的，每個人都是同一張。它通常是讓你去見一個人。\n*咪嗚。*", "*Miso se sienta sobre la baraja. Yuzu da la vuelta a una carta.*\nUna carta al día, de dos gatas, la misma para todos. Normalmente te pide que vayas a ver a alguien.\n*mrrp.*", "*La Miso s'asseu sobre la baralla. La Yuzu gira una carta.*\nUna carta al dia, de dues gates, la mateixa per a tothom. Normalment et demana que vagis a veure algú.\n*mrrp.*"], "e_ww_s": ["WALK? WALK??", "散步？散步？？", "散步？散步？？", "¿PASEO? ¿¿PASEO??", "PASSEIG? PASSEIG??"], "e_ww_b": ["Two people, one corner, one time, twenty minutes. No map, no tracking. Phones stay in pockets.\n*Mantou is already at the door.*", "两个人，一个街角，一个时间，二十分钟。没有地图，没有定位。手机放在口袋里。\n*馒头已经在门口等着了。*", "兩個人，一個街角，一個時間，二十分鐘。沒有地圖，沒有定位。手機放在口袋裡。\n*饅頭已經在門口等著了。*", "Dos personas, una esquina, una hora, veinte minutos. Sin mapa, sin rastreo. Los móviles en el bolsillo.\n*Mantou ya está en la puerta.*", "Dues persones, una cantonada, una hora, vint minuts. Sense mapa, sense seguiment. Els mòbils a la butxaca.\n*En Mantou ja és a la porta.*"], "e_wr_s": ["*asleep on the warm tape player*", "*趴在暖暖的录音机旁边睡着了*", "*趴在暖暖的錄音機旁邊睡著了*", "*dormida junto al radiocasete calentito*", "*adormida al costat del radiocasset calentó*"], "e_wr_b": ["*Yuzu found the warm spot on the desk, right next to the little tape player.*\nIt plays what today sounds like: the weekday, the hour, the sky outside, how you feel. Same picks on the same day make the same tape, so play it with whoever is home.\n*When the tape stops, Yuzu opens one eye and looks at the kettle.*", "*柚子在桌上找到了最暖的位置，就在小录音机旁边。*\n它放的是今天的声音：星期几、几点钟、窗外的天、你的心情。同一天、同样的选择，就是同一盘磁带，所以和家里的人一起听吧。\n*磁带一停，柚子就睁开一只眼睛，看着水壶。*", "*柚子在桌上找到了最暖的位置，就在小錄音機旁邊。*\n它放的是今天的聲音：星期幾、幾點鐘、窗外的天、你的心情。同一天、同樣的選擇，就是同一盤磁帶，所以和家裡的人一起聽吧。\n*磁帶一停，柚子就睜開一隻眼睛，看著水壺。*", "*Yuzu encontró el rincón calentito del escritorio, justo al lado del pequeño radiocasete.*\nSuena a lo que suena hoy: el día de la semana, la hora, el cielo de fuera, cómo te sientes. Las mismas respuestas el mismo día dan la misma cinta, así que ponla con quien esté en casa.\n*Cuando la cinta se para, Yuzu abre un ojo y mira la tetera.*", "*La Yuzu ha trobat el racó calentó de l'escriptori, just al costat del petit radiocasset.*\nSona com sona avui: el dia de la setmana, l'hora, el cel de fora, com et sents. Les mateixes respostes el mateix dia fan la mateixa cinta, així que posa-la amb qui sigui a casa.\n*Quan la cinta s'atura, la Yuzu obre un ull i mira la tetera.*"], "e_aw_s": ["Three small things", "三件小事", "三件小事", "Tres cosas pequeñas", "Tres coses petites"], "e_aw_b": ["Every night, three things only. What weather inside you, one rose, one thorn, one bud. Then who make your day better. Mei ask the weather, I ask the flowers, Wei ask the people.\nEnd of the month, make a little book. Then go tell that person thank you ah, in person.", "每天晚上，三件小事就好。你心里什么天气，一朵玫瑰，一根刺，一个花苞。还有谁让你今天好过一点。Mei问天气，我问花，Wei问人。\n到了月底，做成一本小书。然后去跟那个人说声谢谢啦，要当面讲。", "每天晚上，三件小事就好。你心裡什麼天氣，一朵玫瑰，一根刺，一個花苞。還有誰讓你今天好過一點。Mei問天氣，我問花，Wei問人。\n到了月底，做成一本小書。然後去跟那個人說聲謝謝啦，要當面講。", "Cada noche, solo tres cosas. Qué tiempo dentro de ti, una rosa, una espina, un brote. Luego quién hace mejor tu día. Mei pregunta el tiempo, yo las flores, Wei la gente.\nFin de mes, haces librito. Luego ve a decir gracias a esa persona, en persona, ¿eh?", "Cada nit, només tres coses. Quin temps fa dins teu, una rosa, una espina, un brot. Després, qui t'ha fet millor el dia. La Mei pregunta pel temps, jo per les flors, en Wei per la gent.\nA final de mes, en fas un llibret. I després ves a dir gràcies a aquella persona, en persona, eh."], "e_gw_s": ["Somebody sick?", "有人生病了？", "有人生病了？", "¿Alguien malito?", "Algú malalt?"], "e_gw_b": ["Somebody sick? Aiya. Don't just send 'get well soon', no use one. Ask what they need: soup, tissue, honey lemon, a film, a short call. They pick one, you bring it lor.\nBest is soup lah. If they sleeping, leave at the door. Then go home, wash your hands.", "有人生病了？哎呀。不要只发一句“早日康复”，没有用的。问他要什么：汤、纸巾、蜂蜜柠檬、一部电影、一个短短的电话。他选一样，你就带过去咯。\n最好是汤啦。睡着了就放门口。然后回家，洗手喔。", "有人生病了？哎呀。不要只發一句“早日康復”，沒有用的。問他要什麼：湯、紙巾、蜂蜜檸檬、一部電影、一個短短的電話。他選一樣，你就帶過去咯。\n最好是湯啦。睡著了就放門口。然後回家，洗手喔。", "¿Alguien malito? Aiya. No mandes solo 'mejórate', no sirve. Pregunta qué necesita: sopa, pañuelo, miel limón, una película, llamada cortita. Elige una, tú llevas.\nMejor sopa. Si duerme, dejas en la puerta. Luego a casa, lavar manos, ¿eh?", "Algú malalt? Aiya. No enviïs només un 'que et milloris', que no serveix de res. Pregunta-li què necessita: sopa, mocadors, mel amb llimona, una pel·lícula, una trucada curteta. Que en triï una, i tu l'hi portes.\nEl millor és la sopa. Si dorm, deixa-la a la porta. Després cap a casa, i renta't les mans."], "e_cf_s": ["Who you cooking for?", "你做饭给谁吃？", "你做飯給誰吃？", "¿Para quién cocinas?", "Per a qui cuines?"], "e_cf_b": ["My recipe box from Next Door, now in your pocket. Tell me who is eating, I give you one card. Somebody's grandmother write it, you cook it like her.\nThen call them lah. Food is for sharing one.", "我在“隔壁”的食谱盒，现在放进你口袋了。告诉我谁要吃，我给你一张卡。是谁家外婆写的，你就照她那样做。\n然后打电话叫他们来啦。饭是要一起吃的嘛。", "我在“隔壁”的食譜盒，現在放進你口袋了。告訴我誰要吃，我給你一張卡。是誰家外婆寫的，你就照她那樣做。\n然後打電話叫他們來啦。飯是要一起吃的嘛。", "Mi caja de recetas de Al Lado, ahora en tu bolsillo. Dime quién come, te doy una ficha. La escribió la abuela de alguien, tú cocina como ella.\nLuego llámales. La comida es para compartir.", "La meva capsa de receptes d'Al Costat, ara a la teva butxaca. Digues-me qui menja i et dono una fitxa. L'ha escrita l'àvia d'algú: cuina-la com ella.\nDesprés truca'ls. El menjar és per compartir."], "e_mx_s": ["The House book, to go", "酒谱本，外带", "酒譜本，外帶", "El libro de la casa, para llevar", "El llibre de la casa, per emportar"], "e_mx_b": ["*slides a coaster over*\nThe book behind the counter, on your phone. Tell me what kind of evening it is and I'll pick something; zero-proof's in there too. Or mix your own and I'll write it in.\nMake two. And a glass of water each.", "*推过来一个杯垫*\n吧台后面那本酒谱，现在在你手机上。告诉我今晚是什么样的晚上，我帮你挑一杯；无酒精的也有。或者你自己调，我帮你写进去。\n调两杯。再每人一杯水。", "*推過來一個杯墊*\n吧檯後面那本酒譜，現在在你手機上。告訴我今晚是什麼樣的晚上，我幫你挑一杯；無酒精的也有。或者你自己調，我幫你寫進去。\n調兩杯。再每人一杯水。", "*te acerca un posavasos*\nEl libro de detrás de la barra, en tu móvil. Dime qué tipo de noche es y elijo algo; también hay sin alcohol. O prepara la tuya y la apunto.\nHaz dos. Y un vaso de agua cada uno.", "*t'acosta un posagots*\nEl llibre de darrere la barra, al teu mòbil. Digues-me quina mena de nit és i en trio una; també n'hi ha sense alcohol. O prepara la teva i l'apunto.\nFes-ne dos. I un got d'aigua cadascú."], "e_ch_s": ["Three short one", "三缺一", "三缺一", "Tres falta uno", "Tres i en falta un"], "e_ch_b": ["Before we play mahjong, everybody find something same same. One phone in the middle, draw a tile, read it out. Who grow up near the sea? Who cannot stand durian? Two people same is pung, four is kong.\nWhen every two people at the table have something, hu! Then phone face down, wash the tiles, we play properly.", "打麻将之前，大家先找找有什么一样的。一部手机放中间，摸一张牌，念出来。谁在海边长大？谁受不了榴莲？两个人一样就是碰，四个人就是杠。\n桌上每两个人都找到了，就胡了！然后手机扣过来，洗牌，正经开打。", "打麻將之前，大家先找找有什麼一樣的。一部手機放中間，摸一張牌，念出來。誰在海邊長大？誰受不了榴槤？兩個人一樣就是碰，四個人就是槓。\n桌上每兩個人都找到了，就胡了！然後手機扣過來，洗牌，正經開打。", "Antes de jugar mahjong, todos buscan algo igual. Un móvil en medio, roba ficha, lee en voz alta. ¿Quién crece cerca del mar? ¿Quién no soporta durián? Dos iguales es pung, cuatro es kong.\nCuando cada dos de la mesa tienen algo, ¡hu! Luego móvil boca abajo, lava fichas, jugamos de verdad.", "Abans de jugar al mahjong, busqueu tots alguna cosa en comú. Un mòbil al mig, roba una fitxa, llegeix-la en veu alta. Qui va créixer a prop del mar? Qui no suporta el durian? Dos iguals és un pung, quatre és un kong.\nQuan cada parella de la taula té alguna cosa, hu! Després mòbil cap per avall, renteu les fitxes i juguem de debò."], "e_pb_s": ["Everything got its home", "每样东西都有家", "每樣東西都有家", "Cada cosa tiene su casa", "Cada cosa té la seva casa"], "e_pb_b": ["Today so messy. My glasses on the floor, Mei book under sofa, sock on the lamp, aiya. You help me put back, one thing one thing. Miso will knock something down again, never mind lah.\nAfter, you choose one place in your house. One song only. Call somebody to help, two people faster. If you find something nice, keep it.", "今天好乱啊。我的眼镜在地上，Mei 的书在沙发底下，台灯上还挂着一只袜子，哎呀。你帮我一样一样放回去。Miso 又会拍东西下来，没关系啦。\n然后你在自己家挑一个地方，就一首歌。叫个人来帮忙，两个人快一点。找到什么好东西，就留着。", "今天好亂啊。我的眼鏡在地上，Mei 的書在沙發底下，檯燈上還掛著一隻襪子，哎呀。你幫我一樣一樣放回去。Miso 又會拍東西下來，沒關係啦。\n然後你在自己家挑一個地方，就一首歌。叫個人來幫忙，兩個人快一點。找到什麼好東西，就留著。", "Hoy muy desorden. Mis gafas en el suelo, libro de Mei bajo sofá, calcetín en la lámpara, aiya. Tú ayudas a poner todo en su sitio, una cosa, una cosa. Miso tira algo otra vez, no pasa nada.\nDespués tú eliges un sitio en tu casa. Una canción solo. Llama a alguien para ayudar, dos personas más rápido. Si encuentras algo bonito, guárdalo.", "Avui quin desordre. Les meves ulleres per terra, el llibre de la Mei sota el sofà, un mitjó al llum, aiya. M'ajudes a desar-ho tot, una cosa i una altra. En Miso tornarà a tirar alguna cosa, no passa res.\nDesprés tries un racó de casa teva. Només una cançó. Truca algú perquè t'ajudi, entre dos va més de pressa. I si trobes alguna cosa bonica, guarda-la."], "e_pf_s": ["The roastery shelf, to go", "烘焙架，外带", "烘焙架，外帶", "La estantería del tostadero, para llevar", "La prestatgeria del torrador, per emportar"], "e_pf_b": ["*sets the kettle on*\nThe shelf behind the counter, on your phone. Tell me how you want it and I'll pick a brew; Mei even supervised an iced one. Press Pour and I'll call every pour by the gram, so all you watch is the scale.\nMake two cups. The second one's the point.", "*把水壶放上炉子*\n吧台后面那排架子，现在在你手机上。告诉我你想喝什么样的，我帮你挑一款；Mei 还监督出了一款冰的。按下冲煮，我按克数喊每一次注水，你只要盯着秤。\n冲两杯。第二杯才是重点。", "*把水壺放上爐子*\n吧檯後面那排架子，現在在你手機上。告訴我你想喝什麼樣的，我幫你挑一款；Mei 還監督出了一款冰的。按下沖煮，我按克數喊每一次注水，你只要盯著秤。\n沖兩杯。第二杯才是重點。", "*pone el hervidor al fuego*\nLa estantería de detrás de la barra, en tu móvil. Dime cómo lo quieres y elijo un café; Mei hasta supervisó uno con hielo. Pulsa Servir y te canto cada vertido al gramo, tú solo mira la báscula.\nHaz dos tazas. La segunda es lo importante.", "*posa el bullidor al foc*\nLa prestatgeria de darrere la barra, al teu mòbil. Digues-me com el vols i en trio un; la Mei fins i tot en va supervisar un amb gel. Prem Serveix i et canto cada abocada al gram, tu només mira la bàscula.\nFes dues tasses. La segona és el que importa."], "e_ac_s": ["Seeds, never money", "押瓜子，不押钱", "押瓜子，不押錢", "Pipas, nunca dinero", "Pipes, mai diners"], "e_ac_b": ["Tonight my back room is a casino, aiya. No money! Sunflower seeds only, I already bought one big bag.\nWei watch the slot machine, Mei watch the cards, Miso watch nothing, she cheat. Mantou eat the seeds, I know.\nBring your people, sit around one phone. When I say last call, you go home lah, with a plan to meet again.", "今晚我后面那间房变成赌场了，哎呀。不准用钱！只押瓜子，我买了一大包。\nWei 看老虎机，Mei 看牌，Miso 什么都不看，她作弊的。馒头偷吃瓜子，我知道的啦。\n带你的人来，围着一部手机坐。我说最后一轮，你们就回家，约好下次见面。", "今晚我後面那間房變成賭場了，哎呀。不準用錢！只押瓜子，我買了一大包。\nWei 看老虎機，Mei 看牌，Miso 什麼都不看，她作弊的。饅頭偷吃瓜子，我知道的啦。\n帶你的人來，圍著一部手機坐。我說最後一輪，你們就回家，約好下次見面。", "Esta noche mi cuarto de atrás es casino, aiya. ¡Nada de dinero! Solo pipas, ya compré bolsa grande.\nWei mira la tragaperras, Mei mira las cartas, Miso no mira nada, ella hace trampa. Mantou come las pipas, ya sé.\nTrae tu gente, sentados alrededor de un móvil. Cuando digo última ronda, a casa, ¿eh? Con un plan para veros otra vez.", "Aquesta nit la meva habitació del darrere és un casino, aiya. Res de diners! Només pipes, ja n'he comprat una bossa ben grossa.\nEn Wei vigila la màquina, la Mei les cartes, i la Miso no vigila res: fa trampes. En Mantou es menja les pipes, ja ho sé.\nPorta la teva gent i seieu al voltant d'un sol mòbil. Quan dic última ronda, cap a casa, amb un pla per tornar-vos a veure."], "e_sl_s": ["The clock is slow tonight", "钟今晚走得慢", "鍾今晚走得慢", "El reloj va lento esta noche", "El rellotge va lent aquesta nit"], "e_sl_b": ["Josep build one clock that go slow, you know why? He say, so the good hours last longer.\nNow his game is on your phone. Pretend today is your last day, one minute only. Who you never call? What you never say? Then good news: not the last day. Still got time.\nGo do it, ah. Not tomorrow.", "Josep 做了一座走得慢的钟，你知道为什么吗？他说，这样好时光可以长一点。\n现在手机里也可以玩他的游戏。假装今天是最后一天，一分钟就好。谁还没打电话？什么话还没说？然后好消息：不是最后一天。还有时间啦。\n去做喔。不要等明天。", "Josep 做了一座走得慢的鐘，你知道為什麼嗎？他說，這樣好時光可以長一點。\n現在手機裡也可以玩他的遊戲。假裝今天是最後一天，一分鐘就好。誰還沒打電話？什麼話還沒說？然後好訊息：不是最後一天。還有時間啦。\n去做喔。不要等明天。", "Josep hace un reloj que va lento, ¿sabes por qué? Él dice: así las horas buenas duran más.\nAhora su juego está en tu móvil. Imagina hoy último día, un minuto solo. ¿A quién no llamas? ¿Qué no dices? Luego buena noticia: no es último día. Todavía tiempo.\nVe a hacerlo. No mañana.", "En Josep va fer un rellotge que va lent, saps per què? Deia que així les hores bones duren més.\nAra pots jugar al seu joc des del mòbil. Fes veure que avui és l'últim dia, només un minut. A qui no has trucat? Què no has dit? I després la bona notícia: no és l'últim dia. Encara hi ha temps.\nVés a fer-ho. No demà."], "e_gb_s": ["One more packet, no name", "又一包种子，没有名字", "又一包種子，沒有名字", "Otro sobre, sin nombre", "Un altre sobre, sense nom"], "e_gb_b": ["Aiya, I find one more seed packet in my tin. Josep write the name, rain wash it off. Fifty years, still don't know what is.\nYou take, grow with your friends. Not with water only, ah. You call each other, you eat together, you go outside. Then it grow. Pass the pot around, everybody hold a little.\nWhen it flower, you tell me what it is. Then go plant a real one. — Popo", "哎呀，我在饼干罐里又找到一包种子。Josep 写了名字，下雨洗掉了。五十年了，还是不知道是什么。\n你拿去，跟朋友一起种。不是只浇水喔。你们打电话、一起吃饭、一起出门，它才会长。花盆传来传去，每个人都抱一下。\n开花了告诉我是什么。然后去种一棵真的。——婆婆", "哎呀，我在餅乾罐裡又找到一包種子。Josep 寫了名字，下雨洗掉了。五十年了，還是不知道是什麼。\n你拿去，跟朋友一起種。不是隻澆水喔。你們打電話、一起吃飯、一起出門，它才會長。花盆傳來傳去，每個人都抱一下。\n開花了告訴我是什麼。然後去種一棵真的。——婆婆", "Aiya, encuentro otro sobre de semillas en mi lata. Josep escribe nombre, lluvia borra. Cincuenta años, todavía no sé qué es.\nTú coge, planta con amigos. No solo agua, ¿eh? Os llamáis, coméis juntos, salís fuera. Entonces crece. Pasad la maceta, todos cogen un poco.\nCuando florece, me dices qué es. Luego planta una de verdad. — Popo", "Aiya, he trobat un altre sobre de llavors a la capsa. En Josep hi va escriure el nom i la pluja el va esborrar. Cinquanta anys i encara no sé què és.\nAgafa-les i planta-les amb els teus amics. I no només amb aigua, eh. Truqueu-vos, mengeu junts, sortiu. Així creix. Passeu-vos el test, que tothom el tingui una mica.\nQuan floreixi, em dius què és. I després aneu a plantar-ne una de debò. — Popo"], "e_tf_s": ["The kettle's on", "水烧上了", "水燒上了", "El agua ya está al fuego", "L'aigua ja és al foc"], "e_tf_b": ["*taps two fingers on the table*\nNow got tea on your phone also. Hong Kong, Chaozhou, London, Morocco, all the tables Wei bring back. Clock tell you when to pour.\nBut listen: other person cup first, always. Then you sit. — Popo", "*用两根手指敲了敲桌子*\n现在手机里也有茶啦。香港、潮州、伦敦、摩洛哥，Wei 带回来的茶桌都在。时间到了会提醒你倒。\n不过听着：先给别人倒，每次都是。然后你再坐下。——婆婆", "*用兩根手指敲了敲桌子*\n現在手機裡也有茶啦。香港、潮州、倫敦、摩洛哥，Wei 帶回來的茶桌都在。時間到了會提醒你倒。\n不過聽著：先給別人倒，每次都是。然後你再坐下。——婆婆", "*da dos golpecitos en la mesa*\nAhora té en tu móvil también. Hong Kong, Chaozhou, Londres, Marruecos, todas las mesas que trae Wei. El reloj dice cuándo servir.\nPero escucha: taza de la otra persona primero, siempre. Luego tú te sientas. — Popo", "*fa dos copets a la taula*\nAra també tens te al mòbil. Hong Kong, Chaozhou, Londres, el Marroc, totes les taules que porta en Wei. El rellotge et diu quan has de servir.\nPerò escolta: primer la tassa de l'altra persona, sempre. Després seus tu. — Popo"], "e_tc_s": ["dinner for two, however far apart", "两个人的晚饭，不管隔多远", "兩個人的晚飯，不管隔多遠", "cena para dos, aunque estéis lejos", "sopar per a dos, encara que sigueu lluny"], "e_tc_b": ["book a table for two people in different cities. you each see the time in your own zone, cook the same dish, light a candle, and eat together.\nmy mom's in new york. sunday dinner, every week. it's honestly nice.", "给在不同城市的两个人订一张桌子。你们各自看到自己时区的时间，做同一道菜，点一根蜡烛，一起吃饭。\n我妈在纽约。每个星期天一起吃晚饭。说真的，挺好的。", "給在不同城市的兩個人訂一張桌子。你們各自看到自己時區的時間，做同一道菜，點一根蠟燭，一起吃飯。\n我媽在紐約。每個星期天一起吃晚飯。說真的，挺好的。", "reserva una mesa para dos personas en ciudades distintas. cada uno ve la hora en su zona, cocináis el mismo plato, encendéis una vela y cenáis juntos.\nmi madre está en nueva york. cena del domingo, cada semana. la verdad, está bien.", "reserva una taula per a dues persones en ciutats diferents. cadascú veu l'hora a la seva zona, cuineu el mateix plat, enceneu una espelma i soparu junts.\nla meva mare és a nova york. sopar de diumenge, cada setmana. la veritat, està bé."], "e_ho_s": ["for two people in different cities", "给在不同城市的两个人", "給在不同城市的兩個人", "para dos personas en ciudades distintas", "per a dues persones en ciutats diferents"], "e_ho_b": ["when your day ends, theirs is starting. handoff shows you each other's day and sleep, and lets you leave a note or a voice message that arrives at the right hour.", "你的一天结束时，对方的一天才刚开始。Handoff 让你们看到彼此的白天和睡眠，还能留一张字条或一段语音，在对的时间送到。", "你的一天結束時，對方的一天才剛開始。Handoff 讓你們看到彼此的白天和睡眠，還能留一張字條或一段語音，在對的時間送到。", "cuando tu día termina, el suyo empieza. handoff os enseña el día y el sueño del otro, y te deja una nota o un audio que llega a la hora justa.", "quan el teu dia s'acaba, el seu comença. handoff us mostra el dia i la son de l'altre, i et deixa una nota o un àudio que arriba a l'hora justa."], "e_sh_s": ["a postcard that waits for its day", "一张等着它那天的明信片", "一張等著它那天的明信片", "una postal que espera su día", "una postal que espera el seu dia"], "e_sh_b": ["write it today, seal it, and it opens on their birthday. or the day they start the new job. or whenever. you pick the day.", "今天写好，封起来，等到对方生日那天才打开。或者是开始新工作那天。或者随便哪天。日子你来定。", "今天寫好，封起來，等到對方生日那天才開啟。或者是開始新工作那天。或者隨便哪天。日子你來定。", "escríbela hoy, ciérrala, y se abre el día de su cumpleaños. o el día que empiece el trabajo nuevo. o cuando sea. tú eliges el día.", "escriu-la avui, tanca-la, i s'obre el dia del seu aniversari. o el dia que comenci la feina nova. o quan sigui. tu tries el dia."], "e_fs_s": ["a few flowers, for someone real", "几枝花，送给一个真实的人", "幾枝花，送給一個真實的人", "unas flores, para alguien de verdad", "unes flors, per a algú de veritat"], "e_fs_b": ["tie up to nine stems, pick the paper, write a little card, send it as a link. they untie the ribbon.\nthe card ends with: call me and say you got it.", "最多扎九枝花，选好包装纸，写一张小卡片，用链接寄出去。对方会解开丝带。\n卡片的最后一句是：打电话告诉我你收到了。", "最多扎九枝花，選好包裝紙，寫一張小卡片，用連結寄出去。對方會解開絲帶。\n卡片的最後一句是：打電話告訴我你收到了。", "ata hasta nueve flores, elige el papel, escribe una tarjeta y mándala como enlace. le toca desatar la cinta.\nla tarjeta acaba así: llámame y dime que te ha llegado.", "lliga fins a nou flors, tria el paper, escriu una targeta i envia-la com a enllaç. li toca deslligar la cinta.\nla targeta acaba així: truca'm i digues que t'ha arribat."], "e_vo_s": ["three words in someone's language", "用别人的语言说三个词", "用別人的語言說三個詞", "tres palabras en el idioma de alguien", "tres paraules en l'idioma d'algú"], "e_vo_b": ["a few words in someone else's language. not to pass a test. to say good morning to the neighbour, or thank you to your friend's grandma, and watch their face.", "学几个别人语言里的词。不是为了考试。是为了跟邻居说早安，跟朋友的婆婆说谢谢，然后看看他们的表情。", "學幾個別人語言裡的詞。不是為了考試。是為了跟鄰居說早安，跟朋友的婆婆說謝謝，然後看看他們的表情。", "unas pocas palabras en el idioma de otra persona. no para aprobar. para darle los buenos días al vecino, o las gracias a la abuela de tu amiga, y ver su cara.", "unes poques paraules en l'idioma d'una altra persona. no per aprovar. per donar el bon dia al veí, o les gràcies a l'àvia de la teva amiga, i veure-li la cara."], "kPhoto": ["Photo", "照片", "照片", "Foto", "Foto"], "kRoll": ["Camera roll", "相机胶卷", "相機膠捲", "Carrete", "Rodet"], "kSnapped": ["Kept on this phone", "保存在这部手机上", "儲存在這部手機上", "Guardada en este móvil", "Guardada en aquest mòbil"], "kReal": ["The best photos have you in them. Take one with your real camera, with someone.", "最好的照片里都有你。用你真正的相机，和某个人一起拍一张吧。", "最好的照片裡都有你。用你真正的相機，和某個人一起拍一張吧。", "Las mejores fotos salen contigo. Hazte una con tu cámara de verdad, con alguien.", "Les millors fotos surten amb tu. Fes-te'n una amb la teva càmera de veritat, amb algú."], "k13": ["Blowing out the candles", "吹蜡烛", "吹蠟燭", "Soplando las velas", "Bufant les espelmes"], "k14": ["Jumping in every puddle", "每个水坑都要踩", "每個水坑都要踩", "Saltando en todos los charcos", "Saltant a tots els bassals"], "k15": ["They still dance in the kitchen", "他们还在厨房里跳舞", "他們還在廚房裡跳舞", "Todavía bailan en la
