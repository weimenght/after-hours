<style>
/* after-hours.work/app/: one phone, one screen (the owner, Nov 6). On a phone it IS the screen; on anything wider it stands
   in the middle as a phone. Home: the line, the hour's card, the works and Settings; the dock: Phone, Messages, Mail, Camera. */
:root{--ink:#120F18;--ink2:#1B1624;--ink3:#251E31;--paper:#ECE6DA;--dim:#9C93A8;--lamp:#F2A33A;--line:rgba(236,230,218,.12);--ic:58px;--serif:'Instrument Serif',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--mono:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B090F;color:var(--paper);overflow:hidden}
body{font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:8px}
.room{position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 40%,#21192E,#0B090F 75%);z-index:-1}
.room p{position:absolute;left:0;right:0;bottom:10px;text-align:center;margin:0;font:12px/1.4 var(--mono);color:var(--dim);letter-spacing:.03em;padding:0 16px}
/* the phone: on a real phone it fills the screen */
.phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--ink)}
/* a real phone (the owner, Nov 11: the dock was cut off and black showed under it, in the Home Screen app): the screen is the
   whole window, pinned to its four edges, never a height worked out from vh, which iOS gets wrong when standing alone */
html:not(.framed):not(.desk) .phone{position:fixed;inset:0;width:auto;height:auto}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate}
html.framed .phone{width:390px;height:844px;flex:none;border-radius:56px;background:#050407;padding:12px;box-shadow:0 0 0 2px #2E2738,0 0 0 9px #0E0B12,0 40px 90px -20px rgba(0,0,0,.8),0 0 120px -30px rgba(242,163,58,.25);transform-origin:center}
html.framed .screen{inset:12px;border-radius:44px}
html.framed .phone::before,html.framed .phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#2E2738;left:-11px}
html.framed .phone::before{top:150px;height:60px;box-shadow:0 80px 0 #2E2738}
html.framed .phone::after{left:auto;right:-11px;top:200px;height:90px}
/* wallpaper: the sky follows the hour, stars after dark, a row of lit windows along the bottom */
.sky{position:absolute;inset:0;z-index:-1;transition:background 1.2s}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.55;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.day .sky i,.glow .sky i{display:none}
#orb{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;transition:left 2s,top 2s}
#orb.sun{background:#FFE9A6;box-shadow:0 0 0 10px rgba(255,233,166,.22),0 0 46px 18px rgba(255,226,150,.5)}
#orb.sun.low{background:#FFC27A;box-shadow:0 0 0 10px rgba(255,180,110,.2),0 0 54px 22px rgba(255,160,90,.5)}
#orb.moon{width:34px;height:34px;margin:-17px 0 0 -17px}
#orb.moon svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,236,190,.4))}
#orb.moon svg circle:first-child{fill:rgba(60,52,84,.5)}
.cl{position:absolute;left:-40%;width:120px;height:30px;border-radius:30px;background:#fff;opacity:0;animation:cl 150s linear infinite;transition:opacity 2s}
.cl::before,.cl::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cl::before{left:18px;top:-16px;width:46px;height:46px}.cl::after{left:54px;top:-10px;width:38px;height:38px}
html.desk .cl{width:230px;height:56px;border-radius:56px}html.desk .cl::before{left:34px;top:-30px;width:88px;height:88px}html.desk .cl::after{left:104px;top:-20px;width:72px;height:72px}html.desk .cl.st{width:460px;height:22px}
.cl.st{width:240px;height:13px;border-radius:13px}.cl.st::before,.cl.st::after{display:none}
.day .cl{opacity:.92}.day .cl.st{opacity:0}
.glow .cl{opacity:.95}.glow .cl.st{opacity:.85}
.dawn .cl{background:linear-gradient(180deg,#B79AD6 0%,#F4A9B8 55%,#FFD3A0 100%)}
.dawn .cl.st{background:linear-gradient(90deg,rgba(255,196,160,0),#FFB7A8 25%,#F58FA8 60%,rgba(190,140,210,0))}
.dusk .cl{background:linear-gradient(180deg,#7C62B0 0%,#E0688A 50%,#FFB25E 100%)}
.dusk .cl.st{background:linear-gradient(90deg,rgba(255,170,90,0),#FF9B5E 25%,#E85A7E 60%,rgba(120,90,180,0))}
@keyframes cl{from{transform:translateX(0)}to{transform:translateX(150vw)}}
@media (prefers-reduced-motion:reduce){.cl{animation:none;left:14%}.cl+.cl{left:58%}.cl+.cl+.cl{left:36%}}
.day .tile>b,.glow .tile>b{text-shadow:0 1px 3px rgba(10,24,56,.6)}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;z-index:-1;opacity:.9;pointer-events:none}
/* top row */
.top{position:absolute;top:0;left:0;right:0;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:space-between;z-index:50;font:600 14px/1 var(--sans);pointer-events:none}
.top>*{pointer-events:auto}
html.framed .top{height:54px;padding:6px 28px 0}
.clock{display:none;font-variant-numeric:tabular-nums}
html.framed .clock{display:block}
.mark{display:inline-flex;align-items:center;gap:.4em;font:italic 400 19px/1 var(--serif)}
.mark svg{width:18px;height:18px}
html.framed .mark{display:none}
.chip{font:700 11px/1 var(--mono);letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:7px 10px;min-height:30px;background:rgba(18,15,24,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* home */
.home{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(48px + env(safe-area-inset-top)) 16px 0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .35s}
html.framed .home{padding-top:58px}
.home.away{transform:scale(.92);opacity:.25;filter:blur(2px)}
.lock h2 em{color:var(--lamp);font-style:italic}
.stack{flex:none;display:flex;gap:10px;margin:6px -16px 0;padding:0 16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.stack::-webkit-scrollbar{display:none}
.stack>.w{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;min-width:0}
.w:not(.now){padding:12px 14px;border-radius:22px;background:rgba(27,22,36,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column}
.w h2{margin:0;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.w .wl{margin:auto 0 0;font:400 16px/1.25 var(--serif);color:var(--paper)}
.sdots{flex:none;display:flex;justify-content:center;gap:6px;padding:7px 0 0}
.sdots i{width:6px;height:6px;border-radius:50%;background:rgba(236,230,218,.25);transition:background .2s}
.sdots i.on{background:var(--paper)}
.faces{display:flex;justify-content:space-between;margin:12px 0 10px;gap:4px}
.faces button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1;font:600 11px/1 var(--sans);color:var(--paper)}
.faces .av{width:42px;height:42px;position:relative;overflow:visible}
.faces .av canvas,.faces .av svg{border-radius:50%}
.faces button.z .av{opacity:.45;filter:grayscale(.5)}
.faces button.z .av::after{content:"z";position:absolute;top:-6px;right:-3px;font:italic 700 14px/1 var(--serif);color:var(--dim)}
.faces button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wmoon .mrow{display:flex;gap:14px;align-items:center;margin:10px 0}
.wmoon svg{flex:none;width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(255,236,190,.35))}
.wmoon b{display:block;font:400 26px/1.05 var(--serif)}
.wmoon small{display:block;margin-top:4px;font:11px/1.2 var(--mono);color:var(--dim)}
.w p.who{margin:10px 0 0;font:italic 400 24px/1.12 var(--serif)}
.w .acts2{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.w .acts2 a,.w .acts2 button{flex:1;justify-content:center;padding:9px 10px;min-height:0;font-size:13px}
/* more widgets (the owner, Nov 8): each points off the screen, at someone. Read from this phone's own apps, nothing sent. */
.w .wsm{display:block;margin-top:6px;font:11px/1.3 var(--mono);color:var(--dim);letter-spacing:.02em}
.wpaw .prow{display:flex;gap:14px;align-items:center;margin:10px 0 0}
.wpaw .prow img{flex:none;width:52px;height:auto;aspect-ratio:300/419;border-radius:5px;image-rendering:pixelated;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:rotate(-4deg)}
.wpaw .prow p.who{margin:0;font-size:20px}
.wlt p.who,.wask p.who{font-size:19px;line-height:1.18;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wcook p.who{font-size:22px}
.wradio .key{display:inline-block;margin:0 1px;padding:2px 8px;border-radius:8px;background:var(--lamp);color:var(--ink);font:700 15px/1.2 var(--mono);font-style:normal}
.wroad .wsky{flex:none;display:flex;gap:6px;margin:12px 0 0}
.wroad .wsky span{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:10px/1 var(--mono);color:var(--dim)}
.wroad .wsky i{display:block;flex:none;width:min(100%,30px);height:24px;border-radius:7px;border:1px dashed var(--line)}
.wroad .wsky i.k{border:0}
.wroad .wsky span.td{color:var(--lamp)}
.wroad .wsky span.td i{outline:2px solid var(--lamp);outline-offset:2px}
.now{margin:0;padding:12px 14px;border-radius:22px;background:linear-gradient(160deg,rgba(242,163,58,.14),rgba(242,163,58,0) 60%),rgba(27,22,36,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.now-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.now h2{margin:0;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lamp)}
.down{font:600 11.5px/1 var(--sans);padding:7px 10px;border-radius:999px;background:var(--lamp);color:var(--ink);white-space:nowrap}
.quote{display:block;width:100%;text-align:left;margin:10px 0 0;padding:0}
.quote q{display:block;quotes:"\201C" "\201D";font:italic 400 21px/1.22 var(--serif)}
/* a new line never moves the icons (the owner, Nov 9): the quote always keeps room for three lines, and never takes more */
.quote q{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:calc(3 * 1.22em)}
.quote q i{font-style:normal;color:var(--dim)}
.qrow{display:flex;align-items:baseline;gap:12px;margin-top:5px;min-width:0}
.qrow small{font:11px/1 var(--mono);color:var(--lamp);letter-spacing:.04em;white-space:nowrap}
.quote:active{opacity:.7}
.qapp{display:none;font:600 12px/1 var(--sans);color:var(--lamp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qapp.on{display:inline-block}
.banner{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:85;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:rgba(46,38,64,.94);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.85,.25,1);text-align:left}
html.framed .banner{top:12px}
.banner.on{transform:none}
.banner .av{width:38px;height:38px}
.banner .tx{flex:1;min-width:0}
.banner b{display:block;font:600 14px/1.2 var(--sans)}
.banner b small{font:500 11px/1 var(--mono);color:var(--dim);margin-left:6px;letter-spacing:.04em}
.banner .pv{display:block;font:13.5px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .two{display:flex;gap:46px;justify-content:center}
.call .two div{display:flex;flex-direction:column;align-items:center;gap:8px;font:600 13px/1 var(--sans)}
.ok,.no{width:70px;height:70px;border-radius:50%;display:grid;place-items:center}
.ok{background:#4FA466}.no{background:#D9534A}
.ok svg,.no svg{width:30px;height:30px}
.now ul{list-style:none;margin:10px 0 0;padding:9px 0 0;border-top:1px solid var(--line);display:grid;gap:4px}
.now li{font:400 16px/1.25 var(--serif)}
.now li a{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.now li a span{flex:1 1 auto}
.now ul{grid-template-columns:minmax(0,1fr)}
.now li{min-width:0}
.now li small{flex:none;font:11px/1 var(--mono);color:var(--dim);white-space:nowrap}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:0 4px;padding:10px 0 6px;align-content:center}
.grid.paged{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.grid.paged::-webkit-scrollbar{display:none}
.grid.paged .tile.pg0{scroll-snap-align:start}
.gdots{padding:0 0 4px}
.gdots:empty{display:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;border-radius:16px;transition:transform .2s}
.tile:active{transform:scale(.92)}
.ico{position:relative;width:var(--ic);height:var(--ic);border-radius:calc(var(--ic) * .25);background:var(--ink3);box-shadow:0 6px 16px -6px rgba(0,0,0,.6)}
.ico:not(.fico){background:none}   /* no hairline round the edge: no ring, and no ground peeping out at the rounded corners (the owner, Nov 8) */
.ico img,.ico svg{width:100%;height:100%;display:block}
.tile.lit .ico{box-shadow:0 0 0 2px var(--g),0 8px 26px -6px var(--g)}
.tile.lit .ico::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.tile b{font:500 11.5px/1.15 var(--sans);max-width:100%;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dock{margin:0 -4px calc(10px + env(safe-area-inset-bottom));padding:12px 14px;display:flex;justify-content:space-around;border-radius:30px;background:rgba(37,30,49,.62);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
html.framed .dock{margin-bottom:22px}
.dock .tile b{display:none}
/* one size for every icon, on the home screen or in the dock (the owner, Nov 7): the dock reads the same --ic as the grid */
/* the apps: full-screen sheets over home */
.app{position:absolute;inset:0;z-index:40;background:var(--ink);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.app.open{transform:none;visibility:visible}
.bar{flex:none;padding:calc(48px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:var(--ink);position:relative;z-index:2}
html.framed .bar{padding-top:58px}
.bar h3{margin:0;font:400 34px/1 var(--serif);letter-spacing:-.01em}
.bar .bk{font:600 15px/1 var(--sans);color:var(--lamp);padding:6px 0;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.bar .sp{flex:1}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 0 14px}
.hb{flex:none;height:calc(26px + env(safe-area-inset-bottom));display:flex;align-items:flex-start;justify-content:center;padding-top:9px;cursor:pointer}
.hb::before{content:"";width:134px;height:5px;border-radius:3px;background:rgba(236,230,218,.55)}
html.framed .hb{height:30px}
.hb{touch-action:none}
.hb.glow::before{background:var(--lamp);animation:hbg 1.2s ease-in-out 3}
@keyframes hbg{50%{transform:scaleX(1.12);box-shadow:0 0 12px var(--lamp)}}
.bk.glow{animation:bkg 1.2s ease-in-out 3;border-radius:999px}
/* text buttons become a full chip under the cursor or the finger (the owner, Nov 13): ‹ back, the Store's "A note from",
   Settings' links, the album's arrows, the starter picks. At rest they are amber words; the chip's room is already there
   (padding, pulled back by the same margin), so nothing moves when it fills. */
.bar .bk,.snoteL summary,.set .lnk,.set .acct .lnk2,.pnav button{border-radius:999px;transition:background .14s,color .14s;-webkit-tap-highlight-color:transparent}
.bar .bk{padding:6px 14px 6px 11px;margin-left:-11px}
.snoteL summary{display:inline-block;padding:7px 13px;margin:0 -13px}
.set .lnk,.set .acct .lnk2{display:inline-block;padding:5px 12px;margin:0 -12px}   /* its own height, never over the line under it (the owner, Nov 13) */
.set .lnk+small{margin-top:4px}
.set .row .tx .lnk{display:block;width:fit-content;max-width:calc(100% + 24px)}   /* a chip round the words, not a bar across the row */
.set .row:active .lnk,.set .row:focus-visible .lnk{background:var(--lamp);color:#1B1408}
@media (hover:hover){.set .row:hover .lnk{background:var(--lamp);color:#1B1408}}
.bar .bk:active,.snoteL summary:active,.set .lnk:active,.set .acct .lnk2:active,.pnav button:active,.picks button:active,
.bar .bk:focus-visible,.snoteL summary:focus-visible,.set .lnk:focus-visible,.set .acct .lnk2:focus-visible,.pnav button:focus-visible,.picks button:focus-visible{background:var(--lamp);color:#1B1408;outline:0}
@media (hover:hover){.bar .bk:hover,.snoteL summary:hover,.set .lnk:hover,.set .acct .lnk2:hover,.pnav button:hover,.picks button:hover{background:var(--lamp);color:#1B1408}}
@keyframes bkg{50%{background:rgba(242,163,58,.18);box-shadow:0 0 0 6px rgba(242,163,58,.18)}}
.opic{margin-top:10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22)}
html.light .opic{background:rgba(0,0,0,.06)}
.otap{display:flex;gap:14px;justify-content:center}
.otap .oi{position:relative;width:52px;height:52px;border-radius:14px;overflow:hidden;display:block}
.otap .oi>*{width:100%;height:100%;display:block}
.otap .oi img,.otap .oi svg{width:100%;height:100%;display:block}
.otap .oi.tap{overflow:visible;animation:otap 2.4s ease-in-out infinite}
.otap .oi.tap::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;border:2.5px solid var(--lamp);animation:oring 2.4s ease-out infinite}
@keyframes otap{0%,18%,60%,100%{transform:scale(1)}30%{transform:scale(.9)}}
@keyframes oring{0%,22%{opacity:0;transform:scale(.5)}30%{opacity:1}60%,100%{opacity:0;transform:scale(2.3)}}
.otop{display:grid;gap:9px}
.otop>div{display:flex;align-items:center;gap:12px;font:13.5px/1.25 var(--sans);color:var(--dim)}
.otop .oc{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(236,230,218,.12);color:var(--paper)}
html.light .otop .oc{background:rgba(34,28,46,.1)}
.otop .oc svg{width:18px;height:18px}
.otop b{display:block;font-weight:600;color:var(--paper)}
.odown{position:relative;height:44px;padding:0;border-radius:999px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.odown .ok{position:absolute;left:5px;top:5px;width:34px;height:34px;border-radius:50%;background:var(--lamp);color:var(--ink);display:grid;place-items:center;animation:oslide 3.2s cubic-bezier(.5,0,.3,1) infinite}
html.light .odown .ok{color:#1B1408}
.odown .ok svg{width:17px;height:17px}
.odown .ot{padding-left:40px;font:500 13.5px/1 var(--sans);color:var(--dim);white-space:nowrap}

o": ["Have a lovely time at <em>{t}</em>. The phone can stay here.", "<em>{t}</em>，好好玩。手机留在这儿就好。", "<em>{t}</em>，好好玩。手機留在這兒就好。", "Que lo pases bien en <em>{t}</em>. El móvil se queda aquí.", "Que t'ho passis bé a <em>{t}</em>. El mòbil es queda aquí."], "by_ww": ["Twenty minutes at <em>{c}</em>. The phone stays in your pocket.", "<em>{c}</em>，二十分钟。手机放口袋里。", "<em>{c}</em>，二十分鐘。手機放口袋裡。", "Veinte minutos en <em>{c}</em>. El móvil, en el bolsillo.", "Vint minuts a <em>{c}</em>. El mòbil, a la butxaca."], "by_tc": ["Light the candle. <em>{n}</em> is on the other side of the table.", "点上蜡烛。<em>{n}</em>在桌子的另一边。", "點上蠟燭。<em>{n}</em>在桌子的另一邊。", "Enciende la vela. <em>{n}</em> está al otro lado de la mesa.", "Encén l'espelma. <em>{n}</em> és a l'altra banda de la taula."], "by_ap": ["Thank <em>{n}</em> for the story.", "谢谢<em>{n}</em>讲的故事。", "謝謝<em>{n}</em>講的故事。", "Dale las gracias a <em>{n}</em> por la historia.", "Dona-li les gràcies a <em>{n}</em> per la història."], "by_cf": ["Now cook it for <em>someone</em>.", "现在去做给<em>某个人</em>吃吧。", "現在去做給<em>某個人</em>吃吧。", "Ahora cocínalo para <em>alguien</em>.", "Ara cuina-ho per a <em>algú</em>."], "by_pw": ["Go and do what <em>the card</em> asked.", "去做<em>那张牌</em>让你做的事吧。", "去做<em>那張牌</em>讓你做的事吧。", "Ve a hacer lo que te pidió <em>la carta</em>.", "Vés a fer el que et demanava <em>la carta</em>."], "by_lt": ["One little thing done. <em>Popo</em> would be pleased.", "做完了一件小事。<em>婆婆</em>会很高兴的。", "做完了一件小事。<em>婆婆</em>會很高興的。", "Una cosa pequeña hecha. <em>Popo</em> estaría contenta.", "Una petita cosa feta. <em>La Popo</em> estaria contenta."], "by_f_nye": ["Twelve grapes, then hug <em>whoever's next to you</em>.", "吃完十二颗葡萄，抱抱<em>身边的人</em>。", "吃完十二顆葡萄，抱抱<em>身邊的人</em>。", "Doce uvas, y luego abraza a <em>quien tengas al lado</em>.", "Dotze grans, i després abraça <em>qui tinguis al costat</em>."], "by_f_lunar": ["Go home for the reunion dinner. <em>Someone</em> saved you a seat.", "回家吃团圆饭吧。<em>有人</em>给你留了位子。", "回家吃團圓飯吧。<em>有人</em>給你留了位子。", "Vuelve a casa para la cena de reunión. <em>Alguien</em> te guardó sitio.", "Torna a casa per al sopar de retrobament. <em>Algú</em> t'ha guardat lloc."], "by_f_moon": ["Go and look at the moon with <em>someone</em>.", "和<em>某个人</em>一起去看看月亮吧。", "和<em>某個人</em>一起去看看月亮吧。", "Sal a mirar la luna con <em>alguien</em>.", "Surt a mirar la lluna amb <em>algú</em>."], "by_f_xmas": ["The lights can wait. Go and be with <em>your people</em>.", "灯可以等。去陪<em>你的人</em>吧。", "燈可以等。去陪<em>你的人</em>吧。", "Las luces pueden esperar. Ve a estar con <em>los tuyos</em>.", "Els llums poden esperar. Vés a estar amb <em>els teus</em>."], "by_f_jordi": ["A rose and a book, given <em>by hand</em>.", "一枝玫瑰，一本书，<em>亲手</em>送。", "一枝玫瑰，一本書，<em>親手</em>送。", "Una rosa y un libro, dados <em>en mano</em>.", "Una rosa i un llibre, donats <em>en mà</em>."], "by_f_love": ["Go and say it to <em>their face</em>.", "去<em>当面</em>说吧。", "去<em>當面</em>說吧。", "Ve a decírselo <em>a la cara</em>.", "Vés a dir-li-ho <em>a la cara</em>."], "by_f_joan": ["Go to the bonfire. Bring <em>someone</em>.", "去看篝火吧，带上<em>一个人</em>。", "去看篝火吧，帶上<em>一個人</em>。", "Ve a la hoguera. Lleva a <em>alguien</em>.", "Vés a la foguera. Porta <em>algú</em>."], "by_f_pumpkin": ["Roast chestnuts with <em>someone</em> tonight.", "今晚和<em>某个人</em>一起烤栗子吧。", "今晚和<em>某個人</em>一起烤栗子吧。", "Asa castañas con <em>alguien</em> esta noche.", "Torra castanyes amb <em>algú</em> aquesta nit."], "by_f_dragon": ["Unwrap a zongzi with <em>your family</em>.", "和<em>家人</em>一起剥个粽子吧。", "和<em>家人</em>一起剝個粽子吧。", "Desenvuelve un zongzi con <em>tu familia</em>.", "Desembolica un zongzi amb <em>la teva família</em>."], "by_f_dongzhi": ["The longest night. Share a bowl of tangyuan with <em>someone</em>.", "一年最长的夜。和<em>某个人</em>分一碗汤圆。", "一年最長的夜。和<em>某個人</em>分一碗湯圓。", "La noche más larga. Comparte un cuenco de tangyuan con <em>alguien</em>.", "La nit més llarga. Comparteix un bol de tangyuan amb <em>algú</em>."], "by_f_qingming": ["Remember <em>someone</em>, with someone.", "和一个人一起，想念<em>一个人</em>。", "和一個人一起，想念<em>一個人</em>。", "Recuerda a <em>alguien</em>, con alguien.", "Recorda <em>algú</em>, amb algú."], "by_w_sunny": ["It's bright out. Go and stand in it with <em>someone</em>.", "外面阳光很好。和<em>某个人</em>出去晒晒。", "外面陽光很好。和<em>某個人</em>出去曬曬。", "Hace sol. Sal a disfrutarlo con <em>alguien</em>.", "Fa sol. Surt a gaudir-ne amb <em>algú</em>."], "by_w_cloudy": ["A grey sky. Good for a long talk with <em>someone</em>.", "天阴阴的，适合和<em>某个人</em>慢慢聊。", "天陰陰的，適合和<em>某個人</em>慢慢聊。", "Cielo gris. Bueno para una charla larga con <em>alguien</em>.", "Cel gris. Bo per a una xerrada llarga amb <em>algú</em>."], "by_w_rain": ["It's raining. Make tea for <em>whoever's home</em>.", "下雨了。给<em>家里的人</em>泡杯茶。", "下雨了。給<em>家裡的人</em>泡杯茶。", "Llueve. Prepara un té para <em>quien esté en casa</em>.", "Plou. Fes un te per a <em>qui sigui a casa</em>."], "by_w_storm": ["Stay in, stay close. Call <em>someone</em> and listen to the rain together.", "待在家里，靠近一点。打给<em>某个人</em>，一起听雨。", "待在家裡，靠近一點。打給<em>某個人</em>，一起聽雨。", "Quédate dentro, cerca. Llama a <em>alguien</em> y escuchad la lluvia juntos.", "Queda't a dins, a prop. Truca a <em>algú</em> i escolteu la pluja junts."], "by_w_snow": ["It's snowing. Go and look at it with <em>someone</em>.", "下雪了。和<em>某个人</em>一起去看看。", "下雪了。和<em>某個人</em>一起去看看。", "Está nevando. Sal a verlo con <em>alguien</em>.", "Neva. Surt a veure-ho amb <em>algú</em>."], "by_w_windy": ["Windy out. Hold on to <em>someone's</em> arm.", "外面风大。挽着<em>谁的</em>胳膊走。", "外面風大。挽著<em>誰的</em>胳膊走。", "Hace viento. Agárrate del brazo de <em>alguien</em>.", "Fa vent. Agafa't del braç d'<em>algú</em>."], "by_w_misty": ["A misty one. Walk close enough to <em>see each other</em>.", "起雾了。走得近一点，<em>看得见彼此</em>。", "起霧了。走得近一點，<em>看得見彼此</em>。", "Hay niebla. Caminad lo bastante cerca para <em>veros</em>.", "Hi ha boira. Camineu prou a prop per <em>veure-us</em>."], "by_morn": ["Good morning. Say it out loud to <em>someone</em>.", "早上好。对<em>某个人</em>说出声来。", "早上好。對<em>某個人</em>說出聲來。", "Buenos días. Díselo en voz alta a <em>alguien</em>.", "Bon dia. Digues-ho en veu alta a <em>algú</em>."], "by_aft": ["The afternoon's yours. Spend some of it with <em>someone</em>.", "下午是你的。分一点给<em>某个人</em>。", "下午是你的。分一點給<em>某個人</em>。", "La tarde es tuya. Pasa un rato con <em>alguien</em>.", "La tarda és teva. Passa'n una estona amb <em>algú</em>."], "by_eve": ["Evening. Go and find <em>your people</em>.", "傍晚了。去找<em>你的人</em>吧。", "傍晚了。去找<em>你的人</em>吧。", "Ya es de tarde. Ve a buscar a <em>los tuyos</em>.", "Ja és vespre. Vés a trobar <em>els teus</em>."], "by_late": ["Goodnight. The phone sleeps here; <em>you</em> sleep there.", "晚安。手机睡这儿，<em>你</em>睡那儿。", "晚安。手機睡這兒，<em>你</em>睡那兒。", "Buenas noches. El móvil duerme aquí; <em>tú</em>, allí.", "Bona nit. El mòbil dorm aquí; <em>tu</em>, allà."], "by_s_spring": ["Something's blooming outside. Show <em>someone</em>.", "外面有花开了。带<em>某个人</em>去看看。", "外面有花開了。帶<em>某個人</em>去看看。", "Algo está floreciendo fuera. Enséñaselo a <em>alguien</em>.", "Alguna cosa floreix a fora. Ensenya-ho a <em>algú</em>."], "by_s_summer": ["Long light tonight. Eat outside with <em>someone</em>.", "今晚天黑得晚。和<em>某个人</em>在外面吃饭吧。", "今晚天黑得晚。和<em>某個人</em>在外面吃飯吧。", "Hoy anochece tarde. Cena fuera con <em>alguien</em>.", "Avui es fa fosc tard. Sopa a fora amb <em>algú</em>."], "by_s_autumn": ["The leaves are turning. Walk through them with <em>someone</em>.", "叶子黄了。和<em>某个人</em>踩着落叶走走。", "葉子黃了。和<em>某個人</em>踩著落葉走走。", "Las hojas cambian de color. Pasea entre ellas con <em>alguien</em>.", "Les fulles canvien de color. Passeja-hi amb <em>algú</em>."], "by_s_winter": ["Cold out. Warm your hands on a cup with <em>someone</em>.", "外面冷。和<em>某个人</em>捧着杯子暖暖手。", "外面冷。和<em>某個人</em>捧著杯子暖暖手。", "Hace frío. Caliéntate las manos con una taza, con <em>alguien</em>.", "Fa fred. Escalfa't les mans amb una tassa, amb <em>algú</em>."], "moT_late": ["Still up? What's it like?", "还没睡？现在感觉怎么样？", "還沒睡？現在感覺怎麼樣？", "¿Sigues despierto? ¿Cómo estás?", "Encara despert? Com estàs?"], "moT_morn": ["What's this morning like?", "今天上午感觉怎么样？", "今天上午感覺怎麼樣？", "¿Cómo va esta mañana?", "Com va aquest matí?"], "moT_aft": ["What's this afternoon like?", "今天下午感觉怎么样？", "今天下午感覺怎麼樣？", "¿Cómo va esta tarde?", "Com va aquesta tarda?"], "moT_eve": ["What's this evening like?", "今晚感觉怎么样？", "今晚感覺怎麼樣？", "¿Cómo va la noche?", "Com va aquest vespre?"], "moT_night": ["What's tonight like?", "今夜感觉怎么样？", "今夜感覺怎麼樣？", "¿Cómo va esta noche?", "Com va aquesta nit?"], "moSub": ["Pick the one closest. Someone from Nearby will help.", "选最接近的那个。近邻的人会帮你。", "選最接近的那個。近鄰的人會幫你。", "Elige la que más se parezca. Alguien de Cerca te ayudará.", "Tria la que s'hi assembli més. Algú d'A Prop t'ajudarà."], "moD_lonely": ["I feel a bit lonely", "我有点孤单", "我有點孤單", "Me siento un poco solo", "Em sento una mica sol"], "moD_friends": ["I want to do something with friends", "想和朋友们做点什么", "想和朋友們做點什麼", "Quiero hacer algo con amigos", "Vull fer alguna cosa amb amics"], "moD_far": ["Someone I care about is far away", "我在乎的人在远方", "我在乎的人在遠方", "Alguien que me importa está lejos", "Algú que m'importa és lluny"], "moD_quiet": ["I want a quiet moment", "想安静一会儿", "想安靜一會兒", "Quiero un momento tranquilo", "Vull un moment tranquil"], "moD_air": ["I need to get out of the house", "我想出门透透气", "我想出門透透氣", "Necesito salir de casa", "Necessito sortir de casa"], "moL_popo": ["Aiya, sit first. Lonely is just hungry for people lah. Now, or later?", "哎呀，先坐下。孤单就是想人了嘛。现在，还是晚点？", "哎呀，先坐下。孤單就是想人了嘛。現在，還是晚點？", "Aiya, siéntate primero. Solo es hambre de gente, ya. ¿Ahora, o más tarde?", "Aiya, seu primer. Sentir-se sol és tenir gana de gent. Ara, o més tard?"], "moL_mei": ["ok social butterfly. how many of you?", "好啦社交达人。你们几个人？", "好啦社交達人。你們幾個人？", "ok mariposa social. ¿cuántos sois?", "ok papallona social. quants sou?"], "moL_wei": ["*slides a coaster across* Who's far away?", "*推过来一张杯垫* 谁在远方？", "*推過來一張杯墊* 誰在遠方？", "*te acerca un posavasos* ¿Quién está lejos?", "*t'acosta un sotagot* Qui és lluny?"], "moL_cats": ["*Miso curls up beside you. Yuzu blinks, slowly.*", "*Miso 蜷在你身边。Yuzu 慢慢眨了眨眼。*", "*Miso 蜷在你身邊。Yuzu 慢慢眨了眨眼。*", "*Miso se acurruca a tu lado. Yuzu parpadea, despacio.*", "*La Miso s'arrauleix al teu costat. La Yuzu parpelleja, a poc a poc.*"], "moL_mantou": ["*brings you his lead. Tail going.* Woof?", "*叼来了牵绳，尾巴摇个不停。* 汪？", "*叼來了牽繩，尾巴搖個不停。* 汪？", "*te trae la correa. Mueve la cola.* ¿Guau?", "*et porta la corretja. Mou la cua.* Bub?"], "moZ_popo": ["Popo's asleep in her armchair. Miso answers for her: *a paw on your hand*", "婆婆在扶手椅上睡着了。Miso 替她回答：*一只爪子搭在你手上*", "婆婆在扶手椅上睡著了。Miso 替她回答：*一隻爪子搭在你手上*", "Popo duerme en su butaca. Miso contesta por ella: *una pata en tu mano*", "La Popo dorm a la butaca. La Miso respon per ella: *una pota a la teva mà*"], "moZ_mei": ["*Mei's asleep, phone on her face. A text comes in anyway:* how many of you?", "*Mei 睡着了，手机盖在脸上。还是发来一条：* 你们几个人？", "*Mei 睡著了，手機蓋在臉上。還是發來一條：* 你們幾個人？", "*Mei duerme con el móvil en la cara. Aun así llega un mensaje:* ¿cuántos sois?", "*La Mei dorm amb el mòbil a la cara. Tot i així arriba un missatge:* quants sou?"], "moZ_wei": ["Wei's dozing behind the counter. The cats push a coaster your way.", "Wei 在吧台后面打盹。猫把一张杯垫推了过来。", "Wei 在吧檯後面打盹。貓把一張杯墊推了過來。", "Wei dormita detrás de la barra. Las gatas te acercan un posavasos.", "En Wei fa una becaina darrere la barra. Les gates t'acosten un sotagot."], "moZ_cats": ["*Both asleep. One paw twitches, as if to say: stay a while.*", "*两只都睡着了。一只爪子动了动，像在说：多待一会儿。*", "*兩隻都睡著了。一隻爪子動了動，像在說：多待一會兒。*", "*Las dos duermen. Una pata se mueve, como diciendo: quédate un rato.*", "*Totes dues dormen. Una pota es mou, com dient: queda't una estona.*"], "moZ_mantou": ["*Mantou's asleep on his cushion. One ear lifts at the word walk.*", "*馒头在垫子上睡着了。听到“散步”，一只耳朵竖了起来。*", "*饅頭在墊子上睡著了。聽到“散步”，一隻耳朵豎了起來。*", "*Mantou duerme en su cojín. Una oreja se levanta al oír paseo.*", "*En Mantou dorm al coixí. Una orella s'aixeca en sentir passeig.*"], "moA_now": ["Right now", "就现在", "就現在", "Ahora mismo", "Ara mateix"], "moA_later": ["Later this week", "这周晚点", "這週晚點", "Más adelante esta semana", "Més endavant aquesta setmana"], "moA_two": ["Two of us", "两个人", "兩個人", "Dos", "Dos"], "moA_few": ["A few", "几个人", "幾個人", "Unos cuantos", "Uns quants"], "moA_four": ["Four, around a table", "四个人，围一张桌子", "四個人，圍一張桌子", "Cuatro, alrededor de una mesa", "Quatre, al voltant d'una taula"], "moA_love": ["Someone I love", "我爱的人", "我愛的人", "Alguien a quien quiero", "Algú que estimo"], "moA_family": ["Family", "家人", "家人", "Familia", "Família"], "moA_unwell": ["A friend who's not well", "生病的朋友", "生病的朋友", "Un amigo que no está bien", "Un amic que no es troba bé"], "moA_some": ["A little energy", "还有点力气", "還有點力氣", "Un poco de energía", "Una mica d'energia"], "moA_low": ["Hardly any", "几乎没有", "幾乎沒有", "Casi nada", "Gairebé gens"], "moA_alone": ["On my own", "一个人", "一個人", "Solo", "Sol"], "moA_with": ["With someone", "和别人一起", "和別人一起", "Con alguien", "Amb algú"], "moR_lt_now": ["Take one paper from Popo's jar. It's always something small, and usually with someone.", "从婆婆的罐子里拿一张纸条。总是件小事，通常和某个人有关。", "從婆婆的罐子裡拿一張紙條。總是件小事，通常和某個人有關。", "Saca un papelito del tarro de Popo. Siempre es algo pequeño, casi siempre con alguien.", "Treu un paperet del pot de la Popo. Sempre és una cosa petita, gairebé sempre amb algú."], "moR_sh_now": ["Write a postcard to someone you miss. It can open today.", "给想念的人写一张明信片。今天就能打开。", "給想念的人寫一張明信片。今天就能開啟。", "Escribe una postal a alguien a quien echas de menos. Puede abrirse hoy.", "Escriu una postal a algú que trobes a faltar. Es pot obrir avui."], "moR_ww_now": ["Ask one person for a twenty-minute walk today. Pick a corner and a time.", "约一个人今天走二十分钟。定一个街角、一个时间。", "約一個人今天走二十分鐘。定一個街角、一個時間。", "Pídele a alguien un paseo de veinte minutos hoy. Elige una esquina y una hora.", "Demana a algú un passeig de vint minuts avui. Tria una cantonada i una hora."], "moR_wr_now": ["Play a tape, then send it to someone so you both press play.", "放一盘磁带，再发给一个人，一起按下播放。", "放一盤磁帶，再發給一個人，一起按下播放。", "Pon una cinta y mándasela a alguien para darle al play a la vez.", "Posa una cinta i envia-la a algú per prémer play alhora."], "moR_co_later": ["Invite one person over this week. One is enough.", "这周请一个人来家里。一个就够了。", "這週請一個人來家裡。一個就夠了。", "Invita a una persona a casa esta semana. Con una basta.", "Convida una persona a casa aquesta setmana. Amb una n'hi ha prou."], "moR_cf_later": ["Pick a dish to cook for someone, then ask them over.", "选一道菜做给某个人，再请他过来。", "選一道菜做給某個人，再請他過來。", "Elige un plato para cocinar para alguien y luego invítalo.", "Tria un plat per cuinar per a algú i després convida'l."], "moR_ww_two": ["Pick a corner and a time for a twenty-minute walk.", "约一个街角、一个时间，走二十分钟。", "約一個街角、一個時間，走二十分鐘。", "Elige una esquina y una hora para un paseo de veinte minutos.", "Tria una cantonada i una hora per a un passeig de vint minuts."], "moR_mx_two": ["Mix the same drink for the two of you.", "给你们俩调同一杯。", "給你們倆調同一杯。", "Prepara la misma bebida para los dos.", "Prepara la mateixa beguda per a tots dos."], "moR_co_few": ["Plan a get-together. Everyone brings one thing.", "办个小聚会。每人带一样东西。", "辦個小聚會。每人帶一樣東西。", "Organiza una quedada. Cada uno trae una cosa.", "Organitza una trobada. Cadascú porta una cosa."], "moR_cf_few": ["Cook one dish that feeds everyone.", "做一道够大家吃的菜。", "做一道夠大家吃的菜。", "Cocina un plato que alcance para todos.", "Cuina un plat que n'hi hagi per a tothom."], "moR_ch_four": ["Deal the tiles and find what each pair has in common.", "洗牌摸牌，找出每两个人的共同点。", "洗牌摸牌，找出每兩個人的共同點。", "Reparte las fichas y descubrid qué tiene en común cada pareja.", "Repartiu les fitxes i descobriu què té en comú cada parella."], "moR_co_four": ["Fix the night: who's hosting, who brings the snacks.", "定个晚上：谁做东，谁带零食。", "定個晚上：誰做東，誰帶零食。", "Poned fecha: quién invita, quién trae algo de picar.", "Poseu data: qui convida, qui porta alguna cosa per picar."], "moR_tc_love": ["Book a dinner for two, each at your own table, same candle.", "订一顿两个人的晚餐，各在各的桌前，点同一支蜡烛。", "訂一頓兩個人的晚餐，各在各的桌前，點同一支蠟燭。", "Reserva una cena para dos, cada uno en su mesa, la misma vela.", "Reserva un sopar per a dos, cadascú a la seva taula, la mateixa espelma."], "moR_ho_love": ["Keep each other in step between calls.", "在两次通话之间，保持彼此的节奏。", "在兩次通話之間，保持彼此的節奏。", "Seguid al mismo paso entre llamada y llamada.", "Seguiu al mateix pas entre trucada i trucada."], "moR_ap_family": ["One question a week to ask them on a call, and two lines to keep the answer.", "每周一个问题，打电话时问，再用两行记下回答。", "每週一個問題，打電話時問，再用兩行記下回答。", "Una pregunta a la semana para hacerles en una llamada, y dos líneas para guardar la respuesta.", "Una pregunta a la setmana per fer-los en una trucada, i dues línies per guardar la resposta."], "moR_sh_family": ["Send a postcard that opens on a day you choose.", "寄一张在你选的那天才能打开的明信片。", "寄一張在你選的那天才能開啟的明信片。", "Manda una postal que se abra el día que elijas.", "Envia una postal que s'obri el dia que triïs."], "moR_gw_unwell": ["Send soup: they pick what would help, you bring it.", "送一碗汤：他们选需要什么，你送过去。", "送一碗湯：他們選需要什麼，你送過去。", "Manda sopa: ellos eligen qué les ayudaría, tú lo llevas.", "Envia sopa: ells trien què els ajudaria, tu ho portes."], "moR_fs_unwell": ["Send a few stems now, real ones when you can.", "先送几枝花，有空再送真的。", "先送幾枝花，有空再送真的。", "Manda unas flores ahora, de verdad cuando puedas.", "Envia unes flors ara, de veritat quan puguis."], "moR_aw_some": ["Keep today: the weather inside, a rose, who made it better.", "记下今天：心里的天气、一件好事、谁让它更好。", "記下今天：心裡的天氣、一件好事、誰讓它更好。", "Guarda el día: el tiempo por dentro, una rosa, quién lo mejoró.", "Guarda el dia: el temps per dins, una rosa, qui el va millorar."], "moR_pw_some": ["Draw today's card and do the small thing it asks.", "抽今天的牌，做它让你做的那件小事。", "抽今天的牌，做它讓你做的那件小事。", "Saca la carta de hoy y haz lo poco que te pide.", "Treu la carta d'avui i fes la petita cosa que et demana."], "moR_wr_low": ["Play a tape by the window, then put the phone face down.", "在窗边放一盘磁带，然后把手机扣过来。", "在窗邊放一盤磁帶，然後把手機扣過來。", "Pon una cinta junto a la ventana y deja el móvil boca abajo.", "Posa una cinta a la finestra i deixa el mòbil de cap per avall."], "moR_nb_low": ["Lie back in the grass in Nearby for a little while.", "在近邻的草地上躺一会儿。", "在近鄰的草地上躺一會兒。", "Túmbate un rato en la hierba de Cerca.", "Estira't una estona a l'herba d'A Prop."], "moR_fs_alone": ["Walk to a real flower stall and bring a few stems home.", "走到真的花摊，带几枝花回家。", "走到真的花攤，帶幾枝花回家。", "Camina hasta un puesto de flores de verdad y llévate unas cuantas a casa.", "Camina fins a una parada de flors de veritat i emporta-te'n unes quantes a casa."], "moR_lt_alone": ["Take a paper from Popo's jar. Most of them are outside.", "从婆婆的罐子里拿一张纸条。大多是要出门做的。", "從婆婆的罐子裡拿一張紙條。大多是要出門做的。", "Saca un papelito del tarro de Popo. Casi todos son fuera de casa.", "Treu un paperet del pot de la Popo. Gairebé tots són fora de casa."], "moR_ww_with": ["Ask someone to meet you at a corner for twenty minutes.", "约一个人在街角见，走二十分钟。", "約一個人在街角見，走二十分鐘。", "Pide a alguien que quede contigo en una esquina veinte minutos.", "Demana a algú que quedi amb tu a una cantonada vint minuts."], "moR_co_with": ["After the walk, ask them in for tea.", "散完步，请他进来喝杯茶。", "散完步，請他進來喝杯茶。", "Después del paseo, invítale a un té.", "Després del passeig, convida'l a un te."], "moGo": ["Open", "打开", "開啟", "Abrir", "Obrir"], "moBack": ["‹ Another", "‹ 换一个", "‹ 換一個", "‹ Otra", "‹ Una altra"], "moAll": ["Show me the whole phone", "给我看整部手机", "給我看整部手機", "Enséñame todo el móvil", "Ensenya'm tot el mòbil"], "moAsk": ["What's the moment?", "此刻想做什么？", "此刻想做什麼？", "¿Qué te pide el momento?", "Què et demana el moment?"], "sMoment": ["Start with a question", "先问一个问题", "先問一個問題", "Empezar con una pregunta", "Començar amb una pregunta"], "sMomentT": ["Instead of the apps, the phone opens on what this moment is like, and someone from Nearby suggests what to do.", "手机打开时先问你此刻怎么样，由近邻的人建议做什么，而不是先列出应用。", "手機開啟時先問你此刻怎麼樣，由近鄰的人建議做什麼，而不是先列出應用。", "En vez de las apps, el móvil empieza preguntando cómo es este momento, y alguien de Cerca te sugiere qué hacer.", "En lloc de les apps, el mòbil comença preguntant com és aquest moment, i algú d'A Prop et suggereix què fer."], "winFull": ["Full page ↗", "完整页面 ↗", "完整頁面 ↗", "Página completa ↗", "Pàgina completa ↗"], "winClose": ["Close", "关闭", "關閉", "Cerrar", "Tancar"], "down": ["Put the phone down", "放下手机", "放下手機", "Deja el móvil", "Deixa el mòbil"], "on": ["Lights back on", "把灯打开", "把燈開啟", "Enciende las luces", "Torna a encendre els llums"], "bye": ["Goodnight. Go find <em>your people</em>.", "晚安。去找<em>你的人</em>吧。", "晚安。去找<em>你的人</em>吧。", "Buenas noches. Ve a buscar a <em>los tuyos</em>.", "Bona nit. Vés a trobar <em>els teus</em>."], "none": ["Nothing is sent anywhere", "不会发送任何内容", "不會發送任何內容", "No se envía nada a ningún sitio", "No s'envia res enlloc"], "home": ["Home", "主屏幕", "主螢幕", "Inicio", "Inici"], "back": ["Back", "返回", "返回", "Atrás", "Enrere"], "aMoment": ["The moment", "此刻", "此刻", "El momento", "El moment"], "aXtra": ["Extras", "其他", "其他", "Extras", "Extres"], "aPhone": ["Phone", "电话", "電話", "Teléfono", "Telèfon"], "aMsg": ["Messages", "信息", "資訊", "Mensajes", "Missatges"], "aMail": ["Mail", "邮件", "郵件", "Correo", "Correu"], "aCam": ["Camera", "相机", "相機", "Cámara", "Càmera"], "aSet": ["Settings", "设置", "設定", "Ajustes", "Configuració"], "wide": ["Made for your phone. Open it there and add it to your home screen.", "为手机而做。用手机打开，加到主屏幕上。", "為手機而做。用手機開啟，加到主螢幕上。", "Hecho para tu móvil. Ábrelo allí y añádelo a la pantalla de inicio.", "Fet per al teu mòbil. Obre'l allà i afegeix-lo a la pantalla d'inici."], "q1": ["Phone cannot eat soup. You can. Come eat lah.", "手机不会喝汤，你会。快来喝啦。", "手機不會喝湯，你會。快來喝啦。", "El móvil no puede tomar sopa. Tú sí. Ven a comer, eh.", "El mòbil no es pot prendre la sopa. Tu sí. Vine a taula."], "q2": ["the group chat is not a group. the group is the people. go find them", "群聊不是一群人。人才是。去找他们吧", "群聊不是一群人。人才是。去找他們吧", "el grupo de chat no es un grupo. el grupo es la gente. ve a buscarla", "el grup de xat no és un grup. el grup és la gent. vés a buscar-la"], "q3": ["*sits on your keyboard* meow. (translation: that's enough.)", "*坐在你的键盘上* 喵。（翻译：够了。）", "*坐在你的鍵盤上* 喵。（翻譯：夠了。）", "*se sienta en tu teclado* miau. (traducción: ya basta.)", "*s'asseu al teu teclat* miau. (traducció: ja n'hi ha prou.)"], "q4": ["*drops the leash at your feet* The best app is a walk.", "*把牵绳放在你脚边* 最好的应用，是散步。", "*把牽繩放在你腳邊* 最好的應用，是散步。", "*deja la correa a tus pies* La mejor app es un paseo.", "*et deixa la corretja als peus* La millor app és un passeig."], "q5": ["The moon is free tonight. No download required.", "今晚的月亮免费。不用下载。", "今晚的月亮免費。不用下載。", "La luna es gratis esta noche. No hace falta descargarla.", "La lluna és gratis aquesta nit. No cal descarregar-la."], "q6": ["Wifi weak? Never mind. Hug must be strong one.", "网络不好？没关系。抱抱要用力就好啦。", "網路不好？沒關係。抱抱要用力就好啦。", "¿El wifi va flojo? No pasa nada. El abrazo, fuerte.", "El wifi va fluix? No hi fa res. L'abraçada, ben forta."], "q7": ["Every lit window is someone's whole evening.", "每一扇亮着的窗，都是某个人的整个夜晚。", "每一扇亮著的窗，都是某個人的整個夜晚。", "Cada ventana encendida es la noche entera de alguien.", "Cada finestra encesa és el vespre sencer d'algú."], "q8": ["plot twist: the main character was the friend you forgot to text back", "剧情反转：主角是你忘了回消息的那个朋友", "劇情反轉：主角是你忘了回訊息的那個朋友", "giro de guion: la protagonista era la amiga a la que olvidaste contestar", "gir de guió: la protagonista era l'amiga a qui vas oblidar de contestar"], "q9": ["*knocks your phone off the table* Mrrp. You're welcome.", "*把你的手机推下桌子* 咪呜。不客气。", "*把你的手機推下桌子* 咪嗚。不客氣。", "*tira tu móvil de la mesa* Mrrp. De nada.", "*tira el teu mòbil de la taula* Mrrp. De res."], "q10": ["Tea tastes better when someone else pours it.", "别人倒的茶，总是更好喝。", "別人倒的茶，總是更好喝。", "El té sabe mejor cuando te lo sirve otra persona.", "El te és més bo quan te'l serveix una altra persona."], "q11": ["Screen time? Aiya. Dumpling time is better.", "屏幕时间？哎呀。包饺子的时间比较好啦。", "螢幕時間？哎呀。包餃子的時間比較好啦。", "¿Tiempo de pantalla? Ay. Mejor tiempo de hacer dumplings.", "Temps de pantalla? Ai, ai. Més val temps de fer dumplings."], "q12": ["Woof. (He means: whoever you're thinking of would love a call.)", "汪。（他的意思是：你正想着的那个人，会很高兴接到你的电话。）", "汪。（他的意思是：你正想著的那個人，會很高興接到你的電話。）", "Guau. (Quiere decir: esa persona en la que piensas se alegraría de una llamada.)", "Bup. (Vol dir: aquella persona en qui penses s'alegraria d'una trucada.)"], "q13": ["touch grass. or a dog. dogs count", "去摸摸草。或者摸摸狗。狗也算", "去摸摸草。或者摸摸狗。狗也算", "toca césped. o un perro. los perros cuentan", "toca gespa. o un gos. els gossos compten"], "q14": ["Nothing on this phone is as good as the person across the table.", "这部手机里没有什么，比得上桌子对面的那个人。", "這部手機裡沒有什麼，比得上桌子對面的那個人。", "Nada en este móvil es tan bueno como la persona al otro lado de la mesa.", "Res d'aquest mòbil és tan bo com la persona de l'altra banda de la taula."], "qMore": ["Another line", "再来一句", "再來一句", "Otra frase", "Una altra frase"], "fNye": ["Tonight twelve grapes, one for each bell. Don't eat too fast ah, cannot make wish with mouth full.", "今晚十二颗葡萄，钟响一下吃一颗。别吃太快呀，嘴巴满满的怎么许愿。", "今晚十二顆葡萄，鐘響一下吃一顆。別吃太快呀，嘴巴滿滿的怎麼許願。", "Esta noche doce uvas, una por campanada. No comas rápido, eh, con la boca llena no se pide deseo.", "Aquesta nit dotze grans de raïm, un per campanada. No mengis de pressa, eh, amb la boca plena no es demanen desitjos."], "fNewYear": ["New year, same counter. Who's the first person you'll call this year?", "新的一年，还是这张吧台。今年你第一个打给谁？", "新的一年，還是這張吧檯。今年你第一個打給誰？", "Año nuevo, la misma barra. ¿A quién llamarás primero este año?", "Any nou, la mateixa barra. A qui trucaràs primer aquest any?"], "fLunar": ["New year coming. Go home, make dumplings, give red packet. Phone can wait one.", "要过年啦。回家包饺子，派红包。手机可以等的。", "要過年啦。回家包餃子，派紅包。手機可以等的。", "Viene el año nuevo. Ve a casa, haz dumplings, da sobres rojos. El móvil puede esperar.", "Ve l'any nou. Ves a casa, fes dumplings, dona sobres vermells. El mòbil pot esperar."], "fMoon": ["full moon tonight. send someone a photo of it. or better, stand under it together", "今晚月亮好圆。拍一张发给某个人。或者更好，一起站在月亮下面", "今晚月亮好圓。拍一張發給某個人。或者更好，一起站在月亮下面", "luna llena esta noche. mándale una foto a alguien. o mejor, mirarla juntos", "lluna plena aquesta nit. envia-li una foto a algú. o millor, mireu-la junts"], "fJordi": ["Sant Jordi: a book and a rose. Lend one, give the other.", "圣乔治节：一本书，一枝玫瑰。借出一本，送出一枝。", "聖喬治節：一本書，一枝玫瑰。借出一本，送出一枝。", "Sant Jordi: un libro y una rosa. Presta uno, regala la otra.", "Sant Jordi: un llibre i una rosa. Deixa'n un, regala l'altra."], "fJoan": ["Sant Joan: the shortest night of the year. Find a bonfire and the people around it.", "圣胡安节：一年里最短的一夜。去找一堆篝火，和围着它的人。", "聖胡安節：一年裡最短的一夜。去找一堆篝火，和圍著它的人。", "Sant Joan: la noche más corta del año. Busca una hoguera y la gente que hay alrededor.", "Sant Joan: la nit més curta de l'any. Busca una foguera i la gent que hi ha al voltant."], "fValentine": ["valentine's: flowers for your mum count. trust me, she'll love it", "情人节：送花给妈妈也算。相信我，她会很开心的", "情人節：送花給媽媽也算。相信我，她會很開心的", "san valentín: las flores para tu madre cuentan. créeme, le encantarán", "sant valentí: les flors per a la teva mare compten. creu-me, li encantaran"], "fHalloween": ["*hides in a pumpkin* Boo. (She means: knock on a neighbour's door tonight.)", "*躲进南瓜里* 嘘。（她的意思是：今晚去敲敲邻居的门。）", "*躲進南瓜裡* 噓。（她的意思是：今晚去敲敲鄰居的門。）", "*se esconde en una calabaza* Bu. (Quiere decir: llama a la puerta de un vecino esta noche.)", "*s'amaga dins una carbassa* Bu. (Vol dir: truca a la porta d'un veí aquesta nit.)"], "fXmas": ["Christmas, everybody come my table. Bring nothing, just bring yourself.", "圣诞节，大家都来我桌上吃饭。什么都不用带，人来就好啦。", "聖誕節，大家都來我桌上吃飯。什麼都不用帶，人來就好啦。", "Navidad: todos a mi mesa. No traigas nada, solo tráete a ti.", "Nadal: tothom a la meva taula. No portis res, porta't a tu."], "sSpring": ["*rolls in the new grass* Woof. (It's warm enough for a walk with someone.)", "*在新长的草里打滚* 汪。（天气暖了，够跟谁一起散步了。）", "*在新長的草裡打滾* 汪。（天氣暖了，夠跟誰一起散步了。）", "*se revuelca en la hierba nueva* Guau. (Ya hace bueno para pasear con alguien.)", "*es rebolca a l'herba nova* Bup. (Ja fa bo per passejar amb algú.)"], "sSummer": ["summer rule: if it's still light at nine, you text someone 'outside?'", "夏天规则：如果九点天还亮着，就给某个人发一句“出来吗？”", "夏天規則：如果九點天還亮著，就給某個人發一句“出來嗎？”", "regla de verano: si a las nueve aún es de día, le escribes a alguien «¿salimos?»", "regla d'estiu: si a les nou encara és de dia, escrius a algú «sortim?»"], "sAutumn": ["Weather turn cold already. Make soup, invite one person. Soup for one is waste.", "天气凉了。煲个汤，请一个人来喝。一个人喝汤，浪费。", "天氣涼了。煲個湯，請一個人來喝。一個人喝湯，浪費。", "Ya hace frío. Haz sopa e invita a alguien. Sopa para uno es un desperdicio.", "Ja fa fred. Fes sopa i convida algú. Sopa per a un és malbaratar-la."], "sWinter": ["Cold out. The best heater is a full table.", "外面冷。最好的暖气，是一张坐满人的桌子。", "外面冷。最好的暖氣，是一張坐滿人的桌子。", "Fuera hace frío. La mejor calefacción es una mesa llena.", "A fora fa fred. La millor calefacció és una taula plena."], "hLate": ["*curls up on your phone* Mrrp. (Bed. Now.)", "*蜷在你的手机上* 咪呜。（睡觉。现在。）", "*蜷在你的手機上* 咪嗚。（睡覺。現在。）", "*se acurruca sobre tu móvil* Mrrp. (A la cama. Ya.)", "*s'arrauleix sobre el teu mòbil* Mrrp. (A dormir. Ara.)"], "hMorn": ["Morning! Drink water first, phone later.", "早晨！先喝水，手机等一下。", "早晨！先喝水，手機等一下。", "¡Buenos días! Primero agua, el móvil después.", "Bon dia! Primer aigua, el mòbil després."], "hAft": ["*sits by the door* The afternoon is long enough for a walk.", "*坐在门边* 下午很长，够散一次步了。", "*坐在門邊* 下午很長，夠散一次步了。", "*se sienta junto a la puerta* La tarde da para un paseo.", "*s'asseu a la porta* La tarda dona per a un passeig."], "hEve": ["Evening's the best hour to call someone. Everyone's home.", "傍晚是打电话最好的时候。大家都在家。", "傍晚是打電話最好的時候。大家都在家。", "La tarde-noche es la mejor hora para llamar. Todo el mundo está en casa.", "El vespre és la millor hora per trucar. Tothom és a casa."], "hNight": ["it's late. text the person you're thinking about. or don't, and tell them tomorrow in person", "很晚了。给你正在想的那个人发个消息。或者别发，明天当面告诉他", "很晚了。給你正在想的那個人發個訊息。或者別發，明天當面告訴他", "es tarde. escríbele a la persona en la que piensas. o no, y díselo mañana en persona", "és tard. escriu a la persona en qui penses. o no, i digues-li demà en persona"], "dSun": ["Sunday. Soup day. Who you eating with?", "星期天。饮汤日。你跟谁吃饭？", "星期天。飲湯日。你跟誰吃飯？", "Domingo. Día de sopa. ¿Con quién comes?", "Diumenge. Dia de sopa. Amb qui menges?"], "dFri": ["Friday. Make a plan with an actual person. I'll wait.", "星期五。跟一个真实的人约点什么吧。我等你。", "星期五。跟一個真實的人約點什麼吧。我等你。", "Viernes. Haz un plan con una persona de verdad. Te espero.", "Divendres. Fes un pla amb una persona de veritat. T'espero."], "dMon": ["*sits on your to-do list* Mew. (Mondays need a coffee with someone.)", "*坐在你的待办清单上* 喵。（星期一需要和谁喝杯咖啡。）", "*坐在你的待辦清單上* 喵。（星期一需要和誰喝杯咖啡。）", "*se sienta sobre tu lista de tareas* Miau. (Los lunes piden un café con alguien.)", "*s'asseu sobre la teva llista de tasques* Miau. (Els dilluns demanen un cafè amb algú.)"], "oOff": ["A day off today. Spend it on someone, not on a screen.", "今天放假。把它花在某个人身上，别花在屏幕上。", "今天放假。把它花在某個人身上，別花在螢幕上。", "Hoy es festivo. Gástalo en alguien, no en una pantalla.", "Avui és festiu. Gasta'l en algú, no en una pantalla."], "uPancake": ["pancake day. make too many and knock on a neighbour's door", "煎饼日。多做一些，去敲敲邻居的门", "煎餅日。多做一些，去敲敲鄰居的門", "día de las tortitas. haz demasiadas y llama a la puerta de un vecino", "dia de les creps. fes-ne massa i truca a la porta d'un veí"], "uMum": ["Today Mothering Sunday. Call your mum. Not text. Call.", "今天是英国的母亲节。打给你妈妈。不是发信息，是打电话。", "今天是英國的母親節。打給你媽媽。不是發信息，是打電話。", "Hoy es el Día de la Madre británico. Llama a tu madre. No le escribas. Llámala.", "Avui és el Dia de la Mare britànic. Truca a la teva mare. No li escriguis. Truca-la."], "uBonfire": ["Bonfire Night. Find the fireworks, and someone to stand next to while they go off.", "篝火之夜。去找烟花，再找一个人，烟花升起时站在他旁边。", "篝火之夜。去找煙花，再找一個人，煙花升起時站在他旁邊。", "Noche de las hogueras. Busca los fuegos artificiales, y a alguien a tu lado mientras estallan.", "Nit de les fogueres. Busca els focs artificials, i algú al teu costat mentre esclaten."], "uBoxing": ["Boxing Day. Leftovers taste better shared. Take some next door.", "节礼日。剩菜分着吃更好味。拿一些给隔壁。", "節禮日。剩菜分著吃更好味。拿一些給隔壁。", "Boxing Day. Las sobras saben mejor compartidas. Lleva un poco a los vecinos.", "Boxing Day. Les sobres són més bones compartides. Porta'n una mica als veïns."], "eReyes": ["Three Kings today. Roscón for everybody. Who find the little king, buy the next one.", "今天三王节。大家吃国王蛋糕。吃到小国王的，下次请客。", "今天三王節。大家吃國王蛋糕。吃到小國王的，下次請客。", "Hoy Reyes. Roscón para todos. Al que le toque el rey, paga el próximo.", "Avui Reis. Tortell per a tothom. A qui li toqui el rei, paga el pròxim."], "eMadre": ["Mother's Day. Call your mother, or go eat her food. Both is best.", "母亲节。打给你妈妈，或者回去吃她做的饭。两样都做最好。", "母親節。打給你媽媽，或者回去吃她做的飯。兩樣都做最好。", "Día de la Madre. Llama a tu madre, o ve a comer lo que cocina. Las dos cosas, mejor.", "Dia de la Mare. Truca a la teva mare, o vés a menjar el que cuina. Les dues coses, millor."], "cMona": ["Mona de Pasqua today. If you are somebody's godparent, the cake is your job.", "今天吃复活节蛋糕“莫娜”。如果你是谁的教父教母，蛋糕要你送哦。", "今天吃復活節蛋糕“莫娜”。如果你是誰的教父教母，蛋糕要你送哦。", "Hoy toca mona de Pascua. Si eres padrino o madrina de alguien, el pastel te toca a ti.", "Avui toca mona de Pasqua. Si ets padrí o padrina d'algú, el pastís et toca a tu."], "cCastanyada": ["Castanyada! Roast chestnuts, sweet potato, panellets. Better eat with neighbours.", "烤栗子节！烤栗子、烤番薯、杏仁小饼。跟邻居一起吃更好。", "烤栗子節！烤栗子、烤番薯、杏仁小餅。跟鄰居一起吃更好。", "¡Castañada! Castañas asadas, boniato, panellets. Mejor con los vecinos.", "Castanyada! Castanyes, moniatos i panellets. Millor amb els veïns."], "cMerce": ["La Mercè: castells in the square. Somebody always holds the bottom row. Go stand in the crowd with someone.", "圣母慈悲节：广场上叠人塔。总有人在最下面撑着。和某个人一起去人群里站着看吧。", "聖母慈悲節：廣場上疊人塔。總有人在最下面撐著。和某個人一起去人群裡站著看吧。", "La Mercè: castells en la plaza. Siempre hay alguien aguantando la base. Ve a verlo con alguien.", "La Mercè: castells a la plaça. Sempre hi ha algú aguantant la pinya. Vés-hi amb algú."], "cEsteve": ["Sant Esteve: canelons from yesterday's leftovers. Family dinner, round two.", "圣艾斯特万节：用昨天的剩菜做卡内罗尼。家庭聚餐，第二轮。", "聖艾斯特萬節：用昨天的剩菜做卡內羅尼。家庭聚餐，第二輪。", "San Esteban: canelones con lo que sobró ayer. Comida familiar, segunda ronda.", "Sant Esteve: canelons amb el que va sobrar ahir. Dinar familiar, segona ronda."], "zLantern": ["Lantern Festival. Make tangyuan, round like a family. Guess the riddles together.", "元宵节。煮汤圆，圆圆的像一家人。一起猜灯谜。", "元宵節。煮湯圓，圓圓的像一家人。一起猜燈謎。", "Festival de los Faroles. Haz tangyuan, redondos como una familia. Adivinad los acertijos juntos.", "Festa dels Fanals. Fes tangyuan, rodons com una família. Endevineu les endevinalles junts."], "zQingming": ["Ching Ming today. Remember the old ones, then go visit the ones still here lah.", "清明节。记住走了的人，然后去看看还在的人啦。", "清明節。記住走了的人，然後去看看還在的人啦。", "Hoy es Qingming. Recuerda a los que se fueron, y luego visita a los que siguen aquí.", "Avui és Qingming. Recorda els que se'n van anar, i després visita els que encara hi són."], "zDragon": ["Dragon Boat Festival: make zongzi with someone. Wrapping them alone takes forever.", "端午节：和谁一起包粽子吧。一个人包，包到天荒地老。", "端午節：和誰一起包粽子吧。一個人包，包到天荒地老。", "Festival del Barco Dragón: haz zongzi con alguien. Envolverlos solo lleva una eternidad.", "Festa del Vaixell Drac: fes zongzi amb algú. Embolicar-los sol és etern."], "zQixi": ["qixi: the cowherd and the weaver girl meet once a year. you can do better than once a year", "七夕：牛郎织女一年才见一次。你可以比一年一次更好", "七夕：牛郎織女一年才見一次。你可以比一年一次更好", "qixi: el pastor y la tejedora se ven una vez al año. tú puedes hacerlo mejor", "qixi: el pastor i la teixidora es veuen un cop l'any. tu ho pots fer millor"], "zNinth": ["Double Ninth. Climb a hill, visit the old people. Me included.", "重阳节。去登登高，去看看老人家。包括我。", "重陽節。去登登高，去看看老人家。包括我。", "Doble Nueve. Sube una colina y visita a los mayores. Yo incluida.", "Doble Nou. Puja un turó i visita la gent gran. Jo inclosa."], "zDongzhi": ["Dongzhi bigger than New Year! Go home for dinner tonight.", "冬至大过年！今晚回家吃饭。", "冬至大過年！今晚回家吃飯。", "¡Dongzhi es más que Año Nuevo! Esta noche, a cenar a casa.", "Dongzhi és més que Any Nou! Aquesta nit, a sopar a casa."], "zChildren": ["*brings you a ball* Woof. (Children's Day: be a kid for one afternoon, with a kid.)", "*把球叼给你* 汪。（儿童节：和一个小朋友一起，当一下午的小孩。）", "*把球叼給你* 汪。（兒童節：和一個小朋友一起，當一下午的小孩。）", "*te trae una pelota* Guau. (Día del Niño: sé niño una tarde, con un niño.)", "*et porta una pilota* Bup. (Dia dels Infants: sigues infant una tarda, amb un infant.)"], "iCall": ["incoming call", "来电", "來電", "llamada entrante", "trucada entrant"], "iAccept": ["Accept", "接听", "接聽", "Aceptar", "Accepta"], "iDecline": ["Decline", "拒绝", "拒絕", "Rechazar", "Rebutja"], "iMissed": ["Missed call", "未接来电", "未接來電", "Llamada perdida", "Trucada perduda"], "iLater": ["{n} will try again some other day.", "{n}改天再打给你。", "{n}改天再打給你。", "{n} lo intentará otro día.", "{n} ho tornarà a provar un altre dia."], "iText": ["Message", "信息", "資訊", "Mensaje", "Missatge"], "iMail": ["New mail", "新邮件", "新郵件", "Correo nuevo", "Correu nou"], "pPopoC": ["Wah, you pick up! I just want to say: eat properly today. Okay, bye bye.", "哎呀，你接了！我只是想说：今天好好吃饭。好啦，拜拜。", "哎呀，你接了！我只是想說：今天好好吃飯。好啦，拜拜。", "¡Ay, contestas! Solo quería decirte: hoy come bien. Vale, adiós, adiós.", "Ai, contestes! Només et volia dir: avui menja bé. Au, adéu, adéu."], "pPopoNye": ["Grapes ready already! Twelve, all washed. Come lah, the bells don't wait.", "葡萄准备好了！十二颗，都洗好了。快来啦，钟声不等人的。", "葡萄準備好了！十二顆，都洗好了。快來啦，鐘聲不等人的。", "¡Las uvas ya están! Doce, lavadas. Ven, que las campanadas no esperan.", "El raïm ja és a punt! Dotze grans, rentats. Vine, que les campanades no esperen."], "pMantouC": ["Woof! Woof! (He has the leash in his mouth.)", "汪！汪！（他嘴里叼着牵绳。）", "汪！汪！（他嘴裡叼著牽繩。）", "¡Guau! ¡Guau! (Lleva la correa en la boca.)", "Bup! Bup! (Porta la corretja a la boca.)"], "pWeiC": ["Hey, it's Wei. Nothing urgent. Just wondering who you've been meaning to call. Go on, I'll hang up first.", "嘿，我是 Wei。没什么急事。就是想问问，你一直想打给谁？去吧，我先挂了。", "嘿，我是 Wei。沒什麼急事。就是想問問，你一直想打給誰？去吧，我先掛了。", "Hola, soy Wei. Nada urgente. Solo me preguntaba a quién llevas tiempo queriendo llamar. Venga, cuelgo yo primero.", "Hola, sóc en Wei. Res urgent. Només em preguntava a qui fa temps que vols trucar. Au, penjo jo primer."], "pMeiT": ["hey. random thought: when did you last call your grandma", "嘿。突然想到：你上次给外婆打电话是什么时候", "嘿。突然想到：你上次給外婆打電話是什麼時候", "oye. pensamiento random: ¿cuándo llamaste a tu abuela por última vez?", "ei. pensament random: quan vas trucar a la teva àvia per última vegada?"], "pMeiEve": ["doing Two Candles with my mom later. you should book one with someone {app:tc}", "等下要和我妈吃双烛晚饭。你也约一个人吧 {app:tc}", "等下要和我媽吃雙燭晚飯。你也約一個人吧 {app:tc}", "luego hago Two Candles con mi madre. deberías reservar una con alguien {app:tc}", "després faig Two Candles amb la meva mare. n'hauries de reservar una amb algú {app:tc}"], "pWeiMix": ["Got another text meant for Wei Meng. Something about a bug on the site. Wrong Wei: I fix drinks, he fixes code. Forwarded it. Your usual's on the counter whenever.", "又收到一条发给孟玮的信息，说网站有个 bug。找错 Wei 了：我修的是酒，他修的是代码。已经转给他了。你的老样子随时在吧台上等你。", "又收到一條發給孟瑋的資訊，說網站有個 bug。找錯 Wei 了：我修的是酒，他修的是程式碼。已經轉給他了。你的老樣子隨時在吧檯上等你。", "Me ha llegado otro mensaje para Wei Meng. Algo de un fallo en la web. Wei equivocado: yo arreglo copas, él arregla código. Se lo he reenviado. Lo de siempre te espera en la barra.", "M'ha arribat un altre missatge per a en Wei Meng. Una cosa d'un error a la web. Wei equivocat: jo arreglo copes, ell arregla codi. L'hi he reenviat. El de sempre t'espera a la barra."], "pWeiT": ["Saved you a seat at the counter. No rush. {app:nb}", "吧台边给你留了个位子。不急。{app:nb}", "吧檯邊給你留了個位子。不急。{app:nb}", "Te he guardado un sitio en la barra. Sin prisa. {app:nb}", "T'he guardat un lloc a la barra. Sense pressa. {app:nb}"], "pMisoT": ["*sends a photo of an empty food bowl*", "*发来一张空饭碗的照片*", "*發來一張空飯碗的照片*", "*manda una foto de un cuenco vacío*", "*envia una foto d'un bol buit*"], "pYuzuT": ["*walked across the keyboard* ;;;;;;;;;;;;mrrp", "*从键盘上走过* ；；；；；；；；咪呜", "*從鍵盤上走過* ；；；；；；；；咪嗚", "*ha cruzado el teclado* ;;;;;;;;;;;;mrrp", "*ha travessat el teclat* ;;;;;;;;;;;;mrrp"], "pPopoMs": ["TEST TEST is this working", "测试 测试 这个有用吗", "測試 測試 這個有用嗎", "PRUEBA PRUEBA esto funciona", "PROVA PROVA això funciona"], "pPopoMb": ["Mei say this is email. Ok.\nEat already or not?\nPopo", "Mei 说这个叫电邮。好。\n吃饭了没有？\n婆婆", "Mei 說這個叫電郵。好。\n吃飯了沒有？\n婆婆", "Mei dice que esto es un correo. Vale.\n¿Comiste ya o no?\nPopo", "La Mei diu que això és un correu. D'acord.\nJa has menjat o no?\nPopo"], "pMeiMs": ["go look outside", "去外面看看", "去外面看看", "sal a mirar", "surt a mirar"], "pMeiMb": ["the moon is huge tonight. go look. don't take a photo, just look.\nok maybe one photo. send it to someone.", "今晚月亮超大。去看。别拍照，就看着。\n好吧，拍一张也行。发给某个人。", "今晚月亮超大。去看。別拍照，就看著。\n好吧，拍一張也行。發給某個人。", "la luna está enorme esta noche. ve a mirarla. no le hagas foto, solo mírala.\nvale, quizá una foto. mándasela a alguien.", "la lluna és enorme aquesta nit. vés a mirar-la. no li facis foto, només mira-la.\nva, potser una foto. envia-la a algú."], "pWeiMs": ["Nothing to sell, I promise", "没有要卖的东西，我保证", "沒有要賣的東西，我保證", "No vendo nada, lo prometo", "No venc res, ho prometo"], "pWeiMb": ["Just checking in. If you're reading this, maybe text someone you miss instead.\nI'll still be here after.\nWei", "就是来问候一下。如果你正在看这封信，也许可以改成给你想念的人发个消息。\n之后我还在这里。\nWei", "就是來問候一下。如果你正在看這封信，也許可以改成給你想念的人發個訊息。\n之後我還在這裡。\nWei", "Solo pasaba a saludar. Si estás leyendo esto, quizá mejor escríbele a alguien a quien echas de menos.\nYo seguiré aquí después.\nWei", "Només passava a saludar. Si estàs llegint això, potser millor escriu a algú que trobes a faltar.\nJo encara seré aquí després.\nWei"], "wUpT": ["Who's up in town", "镇上谁还醒着", "鎮上誰還醒著", "Quién está despierto", "Qui és despert"], "wUpSome": ["Tap a face to call. Then call someone real.", "点一张脸打给他们。然后，打给一个真实的人。", "點一張臉打給他們。然後，打給一個真實的人。", "Toca una cara para llamar. Luego llama a alguien de verdad.", "Toca una cara per trucar. Després truca a algú de veritat."], "wUpNone": ["The whole town's asleep. You should be too.", "整个小镇都睡了。你也该睡了。", "整個小鎮都睡了。你也該睡了。", "Todo el pueblo duerme. Tú también deberías.", "Tot el poble dorm. Tu també hauries de dormir."], "wMoonT": ["Tonight's moon", "今晚的月亮", "今晚的月亮", "La luna de esta noche", "La lluna d'aquesta nit"], "wMoonL": ["Look up. Someone you love is under the same one.", "抬头看看。你爱的某个人，也在同一个月亮下面。", "抬頭看看。你愛的某個人，也在同一個月亮下面。", "Mira arriba. Alguien a quien quieres está bajo la misma.", "Mira amunt. Algú que estimes és sota la mateixa."], "mo0": ["New moon", "新月", "新月", "Luna nueva", "Lluna nova"], "mo1": ["Waxing crescent", "娥眉月", "娥眉月", "Luna creciente", "Lluna creixent"], "mo2": ["First quarter", "上弦月", "上弦月", "Cuarto creciente", "Quart creixent"], "mo3": ["Waxing gibbous", "盈凸月", "盈凸月", "Gibosa creciente", "Gibosa creixent"], "mo4": ["Full moon", "满月", "滿月", "Luna llena", "Lluna plena"], "mo5": ["Waning gibbous", "亏凸月", "虧凸月", "Gibosa menguante", "Gibosa minvant"], "mo6": ["Last quarter", "下弦月", "下弦月", "Cuarto menguante", "Quart minvant"], "mo7": ["Waning crescent", "残月", "殘月", "Luna menguante", "Lluna minvant"], "wOneT": ["One person today", "今天的一个人", "今天的一個人", "Una persona hoy", "Una persona avui"], "wOne1": ["Someone you haven't heard from in a year", "一年没联系的某个人", "一年沒聯絡的某個人", "Alguien de quien no sabes nada desde hace un año", "Algú de qui no saps res des de fa un any"], "wOne2": ["Your oldest friend", "你最老的朋友", "你最老的朋友", "Tu amiga o amigo más antiguo", "La teva amistat més antiga"], "wOne3": ["A neighbour you only ever nod to", "一个你只点过头的邻居", "一個你只點過頭的鄰居", "Un vecino al que solo saludas con la cabeza", "Un veí a qui només saludes amb el cap"], "wOne4": ["Whoever taught you something that stuck", "教过你一件一直记得的事的人", "教過你一件一直記得的事的人", "Quien te enseñó algo que no has olvidado", "Qui et va ensenyar alguna cosa que no has oblidat"], "wOne5": ["A grandparent, or someone who feels like one", "外婆外公，或者像他们一样的人", "外婆外公，或者像他們一樣的人", "Una abuela, un abuelo, o alguien que lo parece", "Una àvia, un avi, o algú que s'hi assembla"], "wOne6": ["A cousin you used to see every summer", "以前每年夏天都见面的表亲", "以前每年夏天都見面的表親", "Una prima o primo que veías cada verano", "Una cosina o cosí que veies cada estiu"], "wOne7": ["Whoever made you laugh last week", "上周让你笑出来的那个人", "上週讓你笑出來的那個人", "Quien te hizo reír la semana pasada", "Qui et va fer riure la setmana passada"], "wOne8": ["Someone who just moved somewhere new", "刚搬到新地方的某个人", "剛搬到新地方的某個人", "Alguien que se acaba de mudar", "Algú que s'acaba de mudar"], "wCall": ["Call", "打电话", "打電話", "Llamar", "Trucar"], "wWrite": ["Write a postcard", "写张明信片", "寫張明信片", "Escribir una postal", "Escriure una postal"], "wWeekT": ["This week", "这一周", "這一週", "Esta semana", "Aquesta setmana"], "wWeekNone": ["Nothing planned with anyone yet. Plan one thing.", "还没和谁约好什么。约一件事吧。", "還沒和誰約好什麼。約一件事吧。", "Aún no has quedado con nadie. Planea una cosa.", "Encara no has quedat amb ningú. Planeja una cosa."], "wkDinner": ["Dinner with {n}", "和{n}吃晚饭", "和{n}吃晚飯", "Cena con {n}", "Sopar amb {n}"], "wkAsk": ["Ask {n} this week's question", "问{n}这周的问题", "問{n}這週的問題", "Hazle a {n} la pregunta de la semana", "Fes-li a {n} la pregunta de la setmana"], "wkGrapes": ["Twelve grapes at Popo's table", "在婆婆桌上吃十二颗葡萄", "在婆婆桌上吃十二顆葡萄", "Doce uvas en la mesa de Popo", "Dotze grans de raïm a la taula de la Popo"], "wFarT": ["Weather there", "那边的天气", "那邊的天氣", "El tiempo allí", "El temps allà"], "wFarAdd": ["Someone far away? Add their city and see their sky.", "有人在远方？加上他们的城市，看看他们的天空。", "有人在遠方？加上他們的城市，看看他們的天空。", "¿Alguien lejos? Añade su ciudad y mira su cielo.", "Algú lluny? Afegeix la seva ciutat i mira el seu cel."], "wFarBtn": ["Add their city", "加上他们的城市", "加上他們的城市", "Añadir su ciudad", "Afegir la seva ciutat"], "wFarName": ["Their name", "对方的名字", "對方的名字", "Su nombre", "El seu nom"], "wFarCity": ["Their city", "对方的城市", "對方的城市", "Su ciudad", "La seva ciutat"], "wFarFind": ["Find", "查找", "查詢", "Buscar", "Cercar"], "wFarNote": ["Only the city goes to Open-Meteo, for the weather. Nothing about you.", "只有城市名会发给 Open-Meteo 查天气。不会发送关于你的任何信息。", "只有城市名會發給 Open-Meteo 查天氣。不會發送關於你的任何資訊。", "Solo la ciudad va a Open-Meteo, para el tiempo. Nada sobre ti.", "Només la ciutat va a Open-Meteo, per al temps. Res sobre tu."], "wFarNone": ["No city by that name. Try another spelling.", "找不到这个城市。换个写法试试。", "找不到這個城市。換個寫法試試。", "No hay ninguna ciudad con ese nombre. Prueba a escribirla de otra forma.", "No hi ha cap ciutat amb aquest nom. Prova d'escriure-la d'una altra manera."], "wFarTime": ["It's {t} for {n}", "{n}那边现在是{t}", "{n}那邊現在是{t}", "Son las {t} para {n}", "Són les {t} per a {n}"], "wFarMorn": ["They're probably having breakfast.", "他们大概在吃早饭。", "他們大概在吃早飯。", "Seguramente está desayunando.", "Segurament està esmorzant."], "wFarDay": ["They're probably out and about.", "他们大概在外面忙。", "他們大概在外面忙。", "Seguramente está fuera, a lo suyo.", "Segurament és fora, a les seves coses."], "wFarEve": ["A good hour to call: they're likely home.", "打电话的好时候：他们多半在家。", "打電話的好時候：他們多半在家。", "Buena hora para llamar: seguramente está en casa.", "Bona hora per trucar: segurament és a casa."], "wFarNight": ["They're asleep. Leave a note for their morning.", "他们在睡觉。给他们的早晨留个言。", "他們在睡覺。給他們的早晨留個言。", "Está durmiendo. Déjale una nota para su mañana.", "Està dormint. Deixa-li una nota per al seu matí."], "wFarX": ["Not now", "先不用", "先不用", "Ahora no", "Ara no"], "wFarChange": ["Change", "更换", "更換", "Cambiar", "Canviar"], "wx0": ["clear", "晴", "晴", "despejado", "serè"], "wx1": ["partly cloudy", "多云", "多雲", "algo nublado", "una mica ennuvolat"], "wx2": ["cloudy", "阴", "陰", "nublado", "ennuvolat"], "wx3": ["fog", "雾", "霧", "niebla", "boira"], "wx4": ["drizzle", "毛毛雨", "毛毛雨", "llovizna", "plugim"], "wx5": ["rain", "雨", "雨", "lluvia", "pluja"], "wx6": ["snow", "雪", "雪", "nieve", "neu"], "wx7": ["storm", "雷雨", "雷雨", "tormenta", "tempesta"], "sWall": ["Wallpaper", "壁纸", "桌布", "Fondo de pantalla", "Fons de pantalla"], "calT": ["Seasons and feast days", "季节与节日", "季節與節日", "Estaciones y fiestas", "Estacions i festes"], "calSet": ["The wallpaper and the icons follow the season and the day. Now and then something passes by: tap it.", "壁纸和图标会跟着季节和日子变。偶尔会有东西经过，点一下看看。", "桌布和圖示會跟著季節和日子變。偶爾會有東西經過，點一下看看。", "El fondo y los iconos siguen la estación y el día. De vez en cuando pasa algo: tócalo.", "El fons i les icones segueixen l'estació i el dia. De tant en tant hi passa alguna cosa: toca-la."], "surStar": ["A shooting star. Make a wish, then tell the person it's for.", "一颗流星。许个愿，然后告诉那个你为之许愿的人。", "一顆流星。許個願，然後告訴那個你為之許願的人。", "Una estrella fugaz. Pide un deseo y cuéntaselo a la persona para quien es.", "Un estel fugaç. Demana un desig i explica-ho a la persona per a qui és."], "surPlane": ["A paper plane. Write someone a real note today, on paper.", "一架纸飞机。今天给谁写张真正的纸条吧，写在纸上。", "一架紙飛機。今天給誰寫張真正的紙條吧，寫在紙上。", "Un avión de papel. Hoy escríbele a alguien una nota de verdad, en papel.", "Un avió de paper. Avui escriu-li a algú una nota de debò, en paper."], "surBalloon": ["A balloon drifting over. Step outside and look up: the real sky is bigger.", "一只热气球飘过。出门抬头看看，真的天空大多了。", "一隻熱氣球飄過。出門抬頭看看，真的天空大多了。", "Pasa un globo. Sal y mira arriba: el cielo de verdad es más grande.", "Passa un globus. Surt i mira amunt: el cel de debò és més gran."], "surDog": ["Mantou wants a walk. Who would you ask to come along?", "馒头想去散步。你会叫谁一起去？", "饅頭想去散步。你會叫誰一起去？", "Mantou quiere salir a pasear. ¿A quién le pedirías que viniera?", "En Mantou vol sortir a passejar. A qui li demanaries que vingués?"], "surCat": ["{c} is off to find a warm lap. Who could you sit next to tonight?", "{c}去找个暖和的膝盖窝着了。今晚你可以坐在谁身边？", "{c}去找個暖和的膝蓋窩著了。今晚你可以坐在誰身邊？", "{c} se va a buscar un regazo calentito. ¿Al lado de quién podrías sentarte esta noche?", "{c} se'n va a buscar una falda calenta. Al costat de qui podries seure aquesta nit?"], "surKite": ["Good wind for a kite. Who's free for an hour outside?", "风正好，适合放风筝。谁有空出来待一个小时？", "風正好，適合放風箏。誰有空出來待一個小時？", "Buen viento para una cometa. ¿Quién tiene una hora libre para salir?", "Bon vent per a un estel. Qui té una hora lliure per sortir?"], "surGeese": ["Geese flying south, together. Call someone you'd fly home to.", "一群大雁结伴南飞。给一个你想飞回去见的人打个电话。", "一群大雁結伴南飛。給一個你想飛回去見的人打個電話。", "Gansos volando al sur, juntos. Llama a alguien a quien volverías volando.", "Oques volant cap al sud, juntes. Truca a algú a qui tornaries volant."], "surRainbow": ["A rainbow. Send someone a photo of your real sky.", "一道彩虹。拍一张你那边真实的天空，发给某个人。", "一道彩虹。拍一張你那邊真實的天空，發給某個人。", "Un arcoíris. Mándale a alguien una foto de tu cielo de verdad.", "Un arc de Sant Martí. Envia a algú una foto del teu cel de debò."], "sWallHint": ["Moves slowly, and rests while an app is open. Weather there is the sky over the person far away, at their hour.", "会慢慢动；打开应用时就停下来休息。“那边的天气”是远方那个人头顶的天空，按他们那边的时间。", "會慢慢動；開啟應用時就停下來休息。“那邊的天氣”是遠方那個人頭頂的天空，按他們那邊的時間。", "Se mueve despacio y descansa mientras hay una app abierta. El tiempo allí es el cielo sobre esa persona lejana, a su hora.", "Es mou a poc a poc i descansa mentre hi ha una app oberta. El temps allà és el cel sobre aquella persona llunyana, a la seva hora."], "wallSky": ["The sky", "天空", "天空", "El cielo", "El cel"], "wallTown": ["Nearby", "近邻", "近鄰", "Cerca", "A Prop"], "wallWeather": ["Weather there", "那边的天气", "那邊的天氣", "El tiempo allí", "El temps allà"], "wallStation": ["Train window", "车窗", "車窗", "Ventanilla del tren", "Finestra del tren"], "wallLake": ["Mirror Lake", "镜湖", "鏡湖", "Lago Espejo", "Llac Mirall"], "wallPlain": ["Plain", "纯色", "純色", "Liso", "Llis"], "sIcons": ["Icon style", "图标风格", "圖示風格", "Estilo de los iconos", "Estil de les icones"], "isPixel": ["Pixel", "像素", "畫素", "Píxel", "Píxel"], "isFlat": ["Flat", "扁平", "扁平", "Plano", "Pla"], "isNouveau": ["Art nouveau", "新艺术", "新藝術", "Art nouveau", "Modernisme"], "isMinimal": ["Minimal", "极简", "極簡", "Minimalista", "Minimalista"], "sLook": ["Appearance", "外观", "外觀", "Apariencia", "Aparença"], "lkAuto": ["Like my phone", "跟随手机", "跟隨手機", "Como mi móvil", "Com el meu mòbil"], "lkDay": ["Day", "白天", "白天", "Día", "Dia"], "lkNight": ["Night", "夜晚", "夜晚", "Noche", "Nit"], "lkHour": ["With the hour", "跟随时间", "跟隨時間", "Según la hora", "Segons l'hora"], "q_a3": ["Everything here tries to end the same way: off the screen, next to someone. If one of these makes you call somebody, it did its job.", "这里的每一样东西都想用同一种方式结束：离开屏幕，回到某个人身边。只要有一个让你给谁打了电话，它就算完成任务了。", "這裡的每一樣東西都想用同一種方式結束：離開螢幕，回到某個人身邊。只要有一個讓你給誰打了電話，它就算完成任務了。", "Todo aquí intenta acabar igual: fuera de la pantalla, al lado de alguien. Si algo de esto te hace llamar a alguien, ha cumplido.", "Tot aquí intenta acabar igual: fora de la pantalla, al costat d'algú. Si alguna d'aquestes coses et fa trucar a algú, ja ha fet la feina."], "q_a5": ["*Miso sits on the remote. The television is now in Spanish.*", "*味噌坐在了遥控器上。电视现在说西班牙语了。*", "*味噌坐在了遙控器上。電視現在說西班牙語了。*", "*Miso se sienta en el mando. La tele ahora habla en chino.*", "*La Miso s'asseu sobre el comandament. Ara la tele parla en xinès.*"], "q_a7": ["fun fact nothing here counts anything. no streaks. popo doesn't know what a streak is and i'm not explaining it", "冷知识：这里什么都不计数。没有连续打卡。婆婆不知道什么叫打卡，我也不打算解释", "冷知識：這裡什麼都不計數。沒有連續打卡。婆婆不知道什麼叫打卡，我也不打算解釋", "dato curioso: aquí nada cuenta nada. cero rachas. popo no sabe qué es una racha y no pienso explicárselo", "dada curiosa: aquí res compta res. zero ratxes. la popo no sap què és una ratxa i no penso explicar-l'hi"], "q_a8": ["*drops the lead on your foot. Looks at the door. Looks at you. Looks at the door.* {app:ww}", "*把牵绳丢在你脚上。看看门。看看你。又看看门。* {app:ww}", "*把牽繩丟在你腳上。看看門。看看你。又看看門。* {app:ww}", "*te deja la correa en el pie. Mira la puerta. Te mira. Mira la puerta.* {app:ww}", "*et deixa la corretja al peu. Mira la porta. Et mira. Mira la porta.* {app:ww}"], "q_a10": ["*slides a coaster over* Most of what you make here lives in the link you send, or on this phone. I keep very little. Exactly what: \"Your privacy\" in Settings says it.", "*推过来一个杯垫* 你在这里做的东西，大多住在你发出去的链接里，或者就在这部手机上。我留下的很少。到底留了什么，设置里的“你的隐私”写得清清楚楚。", "*推過來一個杯墊* 你在這裡做的東西，大多住在你發出去的連結裡，或者就在這部手機上。我留下的很少。到底留了什麼，設定裡的“你的隱私”寫得清清楚楚。", "*desliza un posavasos* Casi todo lo que haces aquí vive en el enlace que envías, o en este móvil. Yo guardo muy poco. Qué exactamente: lo dice «Tu privacidad», en Ajustes.", "*fa lliscar un posagots* Gairebé tot el que fas aquí viu a l'enllaç que envies, o en aquest mòbil. Jo en guardo molt poc. Què exactament: ho diu «La teva privadesa», a Configuració."], "q_a12": ["who's the one person you keep meaning to text. ok now put this down and do it. i'll wait (i won't, i have a life)", "那个你一直想发消息却没发的人是谁。好，现在放下手机去发。我等你（才不等，我很忙的）", "那個你一直想發訊息卻沒發的人是誰。好，現在放下手機去發。我等你（才不等，我很忙的）", "¿quién es esa persona a la que llevas tiempo queriendo escribir? vale, pues suelta esto y hazlo. te espero (mentira, tengo vida)", "qui és aquella persona a qui fa temps que vols escriure? doncs deixa això i fes-ho. t'espero (mentida, tinc vida)"], "q_b1": ["Wei say the coffee machine need \"calibrate\". I say it need a wash.", "Wei 说咖啡机要“校准”。我说它要洗一洗啦。", "Wei 說咖啡機要“校準”。我說它要洗一洗啦。", "Wei dice la cafetera necesita «calibrar». Yo digo necesita lavar.", "En Wei diu que la cafetera s'ha de «calibrar». Jo dic que s'ha de rentar."], "q_b2": ["popo found my nail polish and used it to label the spice jars. honestly? iconic", "婆婆找到了我的指甲油，拿去给调料罐做标记了。说实话？绝了", "婆婆找到了我的指甲油，拿去給調料罐做標記了。說實話？絕了", "popo encontró mi pintaúñas y lo usó para marcar los botes de especias. ¿la verdad? icónico", "la popo ha trobat el meu pintaungles i l'ha fet servir per marcar els pots d'espècies. la veritat? icònic"], "q_b3": ["*polishes the same glass twice* Slow night. The good kind.", "*把同一只杯子擦了两遍* 今晚人少。是好的那种。", "*把同一只杯子擦了兩遍* 今晚人少。是好的那種。", "*saca brillo dos veces al mismo vaso* Noche tranquila. De las buenas.", "*eixuga dues vegades el mateix got* Nit tranquil·la. De les bones."], "q_b4": ["*Yuzu has been in the box for three hours. The box is too small. Yuzu disagrees.*", "*柚子在纸箱里待了三个小时。箱子太小了。柚子不这么认为。*", "*柚子在紙箱裡待了三個小時。箱子太小了。柚子不這麼認為。*", "*Yuzu lleva tres horas en la caja. La caja es demasiado pequeña. Yuzu no está de acuerdo.*", "*La Yuzu fa tres hores que és dins la capsa. La capsa és massa petita. La Yuzu no hi està d'acord.*"], "q_b5": ["*woof.* *It was the postman. It is always the postman. He is still thrilled.*", "*汪。* *是邮递员。每次都是邮递员。他还是高兴得不得了。*", "*汪。* *是郵遞員。每次都是郵遞員。他還是高興得不得了。*", "*guau.* *Era el cartero. Siempre es el cartero. Sigue encantado.*", "*bup.* *Era el carter. Sempre és el carter. Continua encantat.*"], "q_b6": ["Mei make me coffee today. Aiya. I drink it. I love her, that's why.", "Mei 今天给我冲咖啡。哎呀。我喝了。疼她嘛。", "Mei 今天給我沖咖啡。哎呀。我喝了。疼她嘛。", "Mei hoy me hace café. Ay. Yo lo bebo. Porque la quiero.", "Avui la Mei m'ha fet un cafè. Ai. Me l'he begut. Perquè me l'estimo."], "q_b7": ["wei's \"worst joke\" is getting worse. didn't think that was possible", "wei 的“最烂笑话”越来越烂了。没想到还能更烂", "wei 的“最爛笑話”越來越爛了。沒想到還能更爛", "el «peor chiste» de wei va a peor. no creía que fuera posible", "el «pitjor acudit» d'en wei va a pitjor. no em pensava que fos possible"], "q_b8": ["Popo corrected my congee again. She was right again.", "婆婆又改了我的粥。她又是对的。", "婆婆又改了我的粥。她又是對的。", "Popo me ha vuelto a corregir el congee. Ha vuelto a tener razón.", "La Popo m'ha tornat a corregir el congee. Ha tornat a tenir raó."], "q_b9": ["*Miso looks at the rain. Miso looks at you. This is your fault.*", "*味噌看看雨。味噌看看你。这都怪你。*", "*味噌看看雨。味噌看看你。這都怪你。*", "*Miso mira la lluvia. Miso te mira. Esto es culpa tuya.*", "*La Miso mira la pluja. La Miso et mira. Això és culpa teva.*"], "q_b10": ["*brings you one sock. Not a pair. One.*", "*给你叼来一只袜子。不是一双。就一只。*", "*給你叼來一隻襪子。不是一雙。就一隻。*", "*te trae un calcetín. No un par. Uno.*", "*et porta un mitjó. No un parell. Un.*"], "q_b11": ["The lemon tree got three lemon. One for you if you come. Real one, not picture.", "柠檬树结了三个柠檬。你来就给你一个。真的喔，不是照片。", "檸檬樹結了三個檸檬。你來就給你一個。真的喔，不是照片。", "El limonero tiene tres limón. Uno para ti si vienes. De verdad, no foto.", "El llimoner ha fet tres llimones. Una per a tu si véns. De veritat, no en foto."], "q_b12": ["the clock in the tower is slow on purpose btw. avi built it that way so the good hours last longer. yes i cried, shut up", "对了，钟楼上的钟是故意走慢的。外公就是这么造的，好让好时光长一点。是的我哭了，闭嘴", "對了，鐘樓上的鐘是故意走慢的。外公就是這麼造的，好讓好時光長一點。是的我哭了，閉嘴", "por cierto, el reloj de la torre va lento a propósito. el avi lo hizo así para que las horas buenas duren más. sí, lloré, calla", "per cert, el rellotge de la torre va lent expressament. l'avi el va fer així perquè les hores bones durin més. sí, vaig plorar, calla"], "q_b13": ["Someone left an umbrella at the counter in March. Still here. Still hoping.", "三月有人把一把伞落在了吧台。还在这儿。还在等。", "三月有人把一把傘落在了吧檯。還在這兒。還在等。", "Alguien se dejó un paraguas en la barra en marzo. Sigue aquí. Sigue esperando.", "Algú es va deixar un paraigua a la barra al març. Encara és aquí. Encara espera."], "q_b14": ["*One grape rolls off the table. Nobody saw anything.*", "*一颗葡萄滚下了桌子。谁也没看见。*", "*一顆葡萄滾下了桌子。誰也沒看見。*", "*Una uva rueda de la mesa. Nadie ha visto nada.*", "*Un gra de raïm cau rodolant de la taula. Ningú no ha vist res.*"], "q_b15": ["*asleep by the gate. One ear still on duty.*", "*在门边睡着了。有一只耳朵还在值班。*", "*在門邊睡著了。有一隻耳朵還在值班。*", "*dormido junto a la verja. Una oreja sigue de guardia.*", "*adormit al costat de la porta. Una orella encara fa guàrdia.*"], "q_b16": ["Josep always say: clock is for trains, not for dinner. Sit down lah.", "Josep 以前常说：钟是给火车看的，不是给晚饭看的。坐下啦。", "Josep 以前常說：鍾是給火車看的，不是給晚飯看的。坐下啦。", "Josep siempre dice: reloj es para trenes, no para cena. Siéntate.", "En Josep sempre deia: el rellotge és per als trens, no per al sopar. Seu."], "q_b18": ["the postcard thing opens on the day you pick. not before. waiting is the present {app:sh}", "那个明信片，到你选的那天才能打开。早一天都不行。等，就是礼物 {app:sh}", "那個明信片，到你選的那天才能開啟。早一天都不行。等，就是禮物 {app:sh}", "la postal se abre el día que tú eliges. ni antes. la espera es el regalo {app:sh}", "la postal s'obre el dia que tu tries. ni abans. l'espera és el regal {app:sh}"], "q_b20": ["One question a week only. More than that is interview, not visit. {app:ap}", "一个礼拜问一个问题就好。问多了是采访，不是探望啦。{app:ap}", "一個禮拜問一個問題就好。問多了是採訪，不是探望啦。{app:ap}", "Una pregunta por semana solo. Más es entrevista, no visita. {app:ap}", "Una pregunta per setmana i prou. Més
