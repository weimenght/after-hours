.now li a span:last-child{font:12px/1 'Space Mono',monospace;color:var(--dim);white-space:nowrap}

    $("kick").textContent = w("kick");
    $("out").textContent = out ? w("on") : w("down");
    $("out").className = out ? "btn ghost" : "btn";
    $("bye").innerHTML = out ? w("bye") : "";
    document.title = "after-hours";
    sky();
    if (window.FBC && FBC.foot) FBC.foot($("foot"), { extra: "<span>" + esc(w("none")) + "</span>" });
  }
  /* Put the phone down: the windows go dark one by one, and the page says goodnight */
  $("out").onclick = function () {
    out = !out; var tiles = [].slice.call(document.querySelectorAll(".tile"));
    if (out) { document.documentElement.classList.add("out"); $("out").textContent = w("on"); $("out").className = "btn ghost"; $("bye").innerHTML = w("bye"); }
    else { document.documentElement.classList.remove("out"); paint(); }
  };
  $("lang").onclick = function () { var i = (li() + 1) % L.length; if (window.FBL) FBL.set(L[i]); paint(); };
  window.addEventListener("fbllang", paint);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !out) { H = new Date().getHours(); paint(); } });
  paint();
  window.AHApp = { paint: paint, traces: traces };   // test hook
})();
</script>
