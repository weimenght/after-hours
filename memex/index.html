*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

#cmd{flex:1;min-width:0;font:inherit;color:var(--fg);background:transparent;border:0;outline:none;text-shadow:inherit;caret-color:var(--fg);text-transform:uppercase;letter-spacing:inherit}
#cmd::placeholder{color:var(--dim);opacity:.8;text-transform:none}

.foot{margin:.5em 0 0;font-family:Figtree,system-ui,sans-serif;font-size:13px;text-shadow:none;color:var(--dim)}

#dark{position:fixed;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center;color:#2a5a35;font-size:18px;text-align:center;padding:24px;text-shadow:none;cursor:pointer}

(function () {
  "use strict";
  var D = [{"c": "LT", "s": "little-things", "n": ["Little Things", "小事", "小事", "Cosas pequeñas", "Petites coses"], "l": ["One small offline thing at a time.", "一次一件屏幕外的小事。", "一次一件螢幕外的小事。", "Una cosita fuera de la pantalla cada vez.", "Una coseta fora de la pantalla cada vegada."], "d": ["In Popo's kitchen, she hands you one little thing from her jar: ring someone, cook for someone, walk a different way home. What you did goes back in as a dated paper note, never counted.", "在婆婆的厨房里，她从罐子里递给你一件小事：给谁打个电话、为谁做顿饭、换条路回家。做过的事会变成一张写了日期的小纸条放回罐子里，从不计数。", "在婆婆的廚房裡，她從罐子裡遞給你一件小事：給誰打個電話、為誰做頓飯、換條路回家。做過的事會變成一張寫了日期的小紙條放回罐子裡，從不計數。", "En la cocina de Popo, ella te da una cosita de su tarro: llamar a alguien, cocinar para alguien, volver a casa por otro camino. Lo que hiciste vuelve al tarro como una nota de papel con fecha, nunca contada.", "A la cuina de la Popo, ella et dona una coseta del seu pot: trucar a algú, cuinar per a algú, tornar a casa per un altre camí. El que has fet torna al pot com una nota de paper amb data, mai comptada."], "t2": ["100 little things", "100 件小事", "100 件小事", "100 cositas", "100 cosetes"], "t3": ["On your device", "只在你的设备上", "只在你的裝置上", "En tu dispositivo", "Al teu dispositiu"], "k": "popo", "g": "home", "when": "morn aft", "h": "/little-things/"}, {"c": "PW", "s": "paw-reading", "n": ["Paw Reading", "猫爪占卜", "貓爪占卜", "Lectura de Patas", "Lectura de Potes"], "l": ["One card a day, from two cats.", "每天一张牌，两只猫给的。", "每天一張牌，兩隻貓給的。", "Una carta al día, de dos gatas.", "Una carta al dia, de dues gates."], "d": ["Miso and Yuzu's stall from Nearby. One of them paws you a card from the Nearby deck, and it asks one thing of you, somewhere real: call first, cook for two, look up for a minute. Draw with someone and you both get the same card. Then it goes in your pocket.", "近邻里味噌和柚子的小摊。其中一只用爪子推给你一张近邻牌，它请你在屏幕外做一件事：先打那通电话、做两人份的饭、抬头看一分钟。和谁一起抽，你们就拿到同一张。然后把它收进口袋。", "近鄰里味噌和柚子的小攤。其中一隻用爪子推給你一張近鄰牌，它請你在螢幕外做一件事：先打那通電話、做兩人份的飯、抬頭看一分鐘。和誰一起抽，你們就拿到同一張。然後把它收進口袋。", "El puesto de Miso y Yuzu en Cerca. Una de ellas te acerca con la pata una carta de la baraja de Cerca, y te pide una cosa, ahí fuera: llama tú primero, cocina para dos, mira arriba un minuto. Saca con alguien y os toca la misma carta. Luego, al bolsillo.", "La parada de la Miso i la Yuzu a A Prop. Una d'elles t'acosta amb la pota una carta de la baralla d'A Prop, i et demana una cosa, allà fora: truca tu primer, cuina per a dos, mira amunt un minut. Treu amb algú i us toca la mateixa carta. Després, a la butxaca."], "t2": ["One a day", "一天一张", "一天一張", "Una al día", "Una al dia"], "t3": ["Cats nap at 11", "猫咪十一点睡", "貓咪十一點睡", "Las gatas duermen a las 11", "Les gates dormen a les 11"], "k": "cats", "g": "home", "when": "morn", "h": "/paw-reading/"}, {"c": "CO", "s": "come-over", "n": ["Come Over", "来我家", "來我家", "Ven a Casa", "Vine a Casa"], "l": ["Have people over.", "请大家来家里坐坐。", "請大家來家裡坐坐。", "Invita a gente a casa.", "Convida gent a casa."], "d": ["Write the invitation, send the link, see who's coming and what they'll bring. A guest sees it the moment they open it, in their own time zone, with a reminder the day before. It ends at the table, with the phone put away. The same invitations as Come Over in Nearby.", "写好邀请，发出链接，看看谁会来、带什么。客人一打开就看到，时间按他们当地的时区显示，前一天还会提醒。最后在饭桌上收尾，手机放一边。和近邻里的来我家是同样的邀请。", "寫好邀請，發出連結，看看誰會來、帶什麼。客人一開啟就看到，時間按他們當地的時區顯示，前一天還會提醒。最後在飯桌上收尾，手機放一邊。和近鄰里的來我家是同樣的邀請。", "Escribe la invitación, envía el enlace y mira quién viene y qué trae. Quien la abre la ve al momento, a su propia hora, con un aviso el día antes. Termina en la mesa, con el móvil lejos. Las mismas invitaciones que Ven a Casa en Cerca.", "Escriu la invitació, envia l'enllaç i mira qui ve i què porta. Qui l'obre la veu de seguida, a la seva hora, amb un avís el dia abans. S'acaba a taula, amb el mòbil lluny. Les mateixes invitacions que Vine a Casa a A Prop."], "t2": ["No account", "不用账号", "不用賬號", "Sin cuenta", "Sense compte"], "t3": ["Ends at the table", "在饭桌上收尾", "在飯桌上收尾", "Acaba en la mesa", "Acaba a taula"], "k": "popo", "g": "table", "when": "aft eve", "h": "/come-over/"}, {"c": "FS", "s": "a-few-stems", "n": ["A Few Stems", "几枝花", "幾枝花", "Cuatro Flores", "Quatre Flors"], "l": ["A few flowers, for someone real.", "几枝花，送给真实的人。", "幾枝花，送給真實的人。", "Unas flores, para alguien de verdad.", "Unes flors, per a algú de debò."], "d": ["Tie up to nine stems in paper, write who they're for and a line, and send them in a link or a picture. Let them wait, wrapped, until a birthday. Then go and buy real ones.", "用纸包起最多九枝花，写上送给谁、一句话，用链接或图片送出去。也可以包好等到生日那天再打开。然后，去买束真的。", "用紙包起最多九枝花，寫上送給誰、一句話，用連結或圖片送出去。也可以包好等到生日那天再開啟。然後，去買束真的。", "Envuelve hasta nueve flores en papel, escribe para quién son y una línea, y envíalas en un enlace o una foto. Déjalas esperar envueltas hasta un cumpleaños. Y luego ve a comprarlas de verdad.", "Embolica fins a nou flors amb paper, escriu per a qui són i una línia, i envia-les en un enllaç o una foto. Deixa-les esperar embolicades fins a un aniversari. I després vés a comprar-les de debò."], "t2": ["Opens on a day", "定一天打开", "定一天開啟", "Se abre un día concreto", "S'obre un dia concret"], "t3": ["Link or picture", "链接或图片", "連結或圖片", "Enlace o foto", "Enllaç o foto"], "k": "wei", "g": "two", "when": "morn aft", "h": "/a-few-stems/"}, {"c": "BP", "s": "borrowed-pages", "n": ["Borrowed Pages", "借来的书", "借來的書", "Páginas Prestadas", "Pàgines Manllevades"], "l": ["Real books, lent by hand between neighbours.", "真的书，在邻居之间亲手传递。", "真的書，在鄰居之間親手傳遞。", "Libros de verdad, prestados en mano entre vecinos.", "Llibres de debò, deixats en mà entre veïns."], "d": ["A house of books people actually own, each with a note inside. Ask for one, meet the person who has it, and take it home. The book remembers everyone who kept it. The same shelves as Josep's Books in Nearby.", "一栋装满别人真有的书的房子，每本里都夹着便条。想借哪本就开口，和拿着它的人见一面，把书带回家。书会记得每一个读过它的人。和近邻里外公书房的是同一面书架。", "一棟裝滿別人真有的書的房子，每本里都夾著便條。想借哪本就開口，和拿著它的人見一面，把書帶回家。書會記得每一個讀過它的人。和近鄰里外公書房的是同一面書架。", "Una casa de libros que la gente tiene de verdad, cada uno con una nota dentro. Pide uno, queda con quien lo tiene y llévatelo a casa. El libro recuerda a todos los que lo guardaron. Los mismos estantes que Libros de Josep en Cerca.", "Una casa de llibres que la gent té de debò, cadascun amb una nota dins. Demana'n un, queda amb qui el té i emporta-te'l a casa. El llibre recorda tothom que l'ha guardat. Els mateixos prestatges que Llibres d'en Josep a A Prop."], "t2": ["Real books", "真的书", "真的書", "Libros de verdad", "Llibres de debò"], "t3": ["Meet in person", "见面交接", "見面交接", "En persona", "En persona"], "k": "popo", "g": "far", "when": "aft", "h": "/borrowed-pages/"}, {"c": "SH", "s": "say-hello", "n": ["Say Hello", "问个好", "問個好", "Di Hola", "Digues Hola"], "l": ["A postcard that opens on its day.", "一张到了那天才拆开的明信片。", "一張到了那天才拆開的明信片。", "Una postal que se abre en su día.", "Una postal que s’obre el seu dia."], "d": ["Write it today and seal it until the day it matters: a birthday, a landing, next year. Send the link with a line that says why, or print it on A6 and post it by hand. The same postcards as Say Hello in Nearby.", "今天写好，封到要紧的那天：一个生日、一次落地、明年。附一句为什么发出链接，或者打印成 A6，亲手投进邮筒。和近邻里的问个好是同一批明信片。", "今天寫好，封到要緊的那天：一個生日、一次落地、明年。附一句為什麼發出連結，或者列印成 A6，親手投進郵筒。和近鄰里的問個好是同一批明信片。", "Escríbela hoy y séllala hasta el día que importa: un cumpleaños, un aterrizaje, el año que viene. Manda el enlace con una línea que diga por qué, o imprímela en A6 y échala al buzón. Las mismas postales que Di Hola en Cerca.", "Escriu-la avui i segella-la fins al dia que importa: un aniversari, un aterratge, l’any que ve. Envia l’enllaç amb una línia que digui per què, o imprimeix-la en A6 i tira-la a la bústia. Les mateixes postals que Digues Hola a A Prop."], "t2": ["Sealed till its day", "封到那天", "封到那天", "Cerrada hasta su día", "Tancada fins al seu dia"], "t3": ["Print and post", "打印、投邮", "列印、投郵", "Imprimir y enviar", "Imprimeix i envia"], "k": "popo", "g": "two", "when": "aft eve", "h": "/say-hello/"}, {"c": "HG", "s": "home-ground", "n": ["Home Ground", "我们的家园", "我們的家園", "Nuestro Rincón", "El Nostre Racó"], "l": ["A town your people build together.", "一座家人朋友一起盖的小镇。", "一座家人朋友一起蓋的小鎮。", "Un pueblo que construyen los tuyos.", "Un poble que construeixen els teus."], "d": ["A family or a few friends each move in next door, then put down the ways you look after each other: Sunday dinner, the long walk, the call that comes every week. It ends at the dinner table, with one thing to try. New, and still being built.", "一家人或几个朋友各自搬进隔壁，再放下你们照顾彼此的方式：周日的晚饭、长长的散步、每周都会打来的电话。最后落在饭桌上，带着一件可以试试的事。新做的，还在盖。", "一家人或幾個朋友各自搬進隔壁，再放下你們照顧彼此的方式：週日的晚飯、長長的散步、每週都會打來的電話。最後落在飯桌上，帶著一件可以試試的事。新做的，還在蓋。", "Una familia o unos amigos se mudan a la casa de al lado y luego ponen las formas en que os cuidáis: la cena del domingo, el paseo largo, la llamada de cada semana. Termina en la mesa, con una cosa que probar. Nuevo, y todavía en obras.", "Una família o uns amics es muden a la casa del costat i després hi posen les maneres com us cuideu: el sopar del diumenge, la passejada llarga, la trucada de cada setmana. Acaba a taula, amb una cosa per provar. Nou, i encara en obres."], "t2": ["For family & friends", "给家人和朋友", "給家人和朋友", "Para familia y amigos", "Per a família i amics"], "t3": ["Ends at dinner", "在饭桌上收尾", "在飯桌上收尾", "Acaba en la cena", "Acaba al sopar"], "k": "mei", "g": "far", "when": "aft eve", "h": "/home-ground/"}, {"c": "TG", "s": "twelve-grapes", "n": ["Twelve Grapes", "十二颗葡萄", "十二顆葡萄", "Las Doce Uvas", "Els Dotze Grans"], "l": ["Twelve grapes, one for each month.", "十二颗葡萄，一个月一颗。", "十二顆葡萄，一個月一顆。", "Doce uvas, una por cada mes.", "Dotze grans de raïm, un per cada mes."], "d": ["New Year's Eve at Popo's table. Each grape is a month and one good thing from it. Then a chair for everyone you care about, and three small red papers on the door instead of resolutions. At midnight the clock strikes, and it ends with the phone down.", "在婆婆家的饭桌跨年。每颗葡萄是一个月，和那个月的一件好事。再给每个在乎的人摆一把椅子，门上贴三张小红纸，代替新年计划。午夜钟声响起，最后放下手机。", "在婆婆家的飯桌跨年。每顆葡萄是一個月，和那個月的一件好事。再給每個在乎的人擺一把椅子，門上貼三張小紅紙，代替新年計劃。午夜鐘聲響起，最後放下手機。", "Nochevieja en la mesa de Popo. Cada uva es un mes y una cosa buena de ese mes. Luego, una silla para cada persona que te importa y tres papelitos rojos en la puerta en lugar de propósitos. A medianoche suena el reloj, y termina dejando el móvil.", "La nit de Cap d'Any a la taula de la Popo. Cada gra és un mes i una cosa bona d'aquell mes. Després, una cadira per a cada persona que t'importa i tres paperets vermells a la porta en lloc de propòsits. A mitjanit toca el rellotge, i acaba deixant el mòbil."], "t2": ["For New Year's Eve", "跨年夜用", "跨年夜用", "Para Nochevieja", "Per Cap d'Any"], "t3": ["Ends at midnight", "在午夜收尾", "在午夜收尾", "Acaba a medianoche", "Acaba a mitjanit"], "k": "popo", "g": "table", "when": "eve", "h": "/twelve-grapes/"}, {"c": "AP", "s": "ask-popo", "n": ["Ask Popo", "问婆婆", "問婆婆", "Pregúntale a Popo", "Pregunta-li a la Popo"], "l": ["One question a week, asked in person.", "每周一个问题，当面问。", "每週一個問題，當面問。", "Una pregunta a la semana, en persona.", "Una pregunta a la setmana, en persona."], "d": ["Type the name of an older relative and the day you usually see them. Each week Popo hands you one question to ask at the table: what their street sounded like, the first thing they cooked, who taught them to save. Two lines keep the answer, and the answers make a small book you can print and give them.", "写下一位长辈的称呼，和你平常去看他们的日子。每周婆婆给你一个问题，坐在饭桌边问：小时候那条街有什么声音、第一次自己做的菜、是谁教他们存钱。两行字记下回答，攒起来就是一本可以打印、送给他们的小书。", "寫下一位長輩的稱呼，和你平常去看他們的日子。每週婆婆給你一個問題，坐在飯桌邊問：小時候那條街有什麼聲音、第一次自己做的菜、是誰教他們存錢。兩行字記下回答，攢起來就是一本可以列印、送給他們的小書。", "Escribe el nombre de una persona mayor de tu familia y el día que sueles verla. Cada semana Popo te da una pregunta para hacerle en la mesa: cómo sonaba su calle, lo primero que cocinó, quién le enseñó a ahorrar. Dos líneas guardan la respuesta, y las respuestas forman un librito que puedes imprimir y regalarle.", "Escriu el nom d'una persona gran de la família i el dia que la sols veure. Cada setmana la Popo et dona una pregunta per fer-li a taula: com sonava el seu carrer, què va ser el primer que va cuinar, qui li va ensenyar a estalviar. Dues ratlles guarden la resposta, i les respostes fan un llibret que pots imprimir i regalar-li."], "t2": ["For grandparents & elders", "给长辈", "給長輩", "Para los abuelos", "Per als avis"], "t3": ["Ends at the table", "在饭桌边收尾", "在飯桌邊收尾", "Acaba en la mesa", "Acaba a taula"], "k": "popo", "g": "table", "when": "aft", "h": "/ask-popo/"}, {"c": "WW", "s": "walk-with", "n": ["Walk With", "一起走走", "一起走走", "Camina Conmigo", "Camina amb Mi"], "l": ["Twenty minutes, one corner, phones away.", "二十分钟，一个街角，收起手机。", "二十分鐘，一個街角，收起手機。", "Veinte minutos, una esquina, sin móvil.", "Vint minuts, una cantonada, sense mòbil."], "d": ["Pick a time and type the name of a corner near you. Send one link to one person. Both phones count down to the same minute, then say: phones away, see you in twenty. No map, no route, no steps. Afterwards, one question: same time next week?", "选一个时间，写下你附近的一个街角，把一个链接发给一个人。两部手机倒数到同一分钟，然后只说一句：收起手机，二十分钟后见。没有地图，没有路线，不计步数。走完只问一句：下周同一时间？", "選一個時間，寫下你附近的一個街角，把一個連結發給一個人。兩部手機倒數到同一分鐘，然後只說一句：收起手機，二十分鐘後見。沒有地圖，沒有路線，不計步數。走完只問一句：下週同一時間？", "Elige una hora y escribe el nombre de una esquina cerca de ti. Envía un enlace a una persona. Los dos móviles cuentan hacia el mismo minuto y luego dicen: móviles fuera, nos vemos en veinte. Sin mapa, sin ruta, sin pasos. Después, una sola pregunta: ¿a la misma hora la semana que viene?", "Tria una hora i escriu el nom d'una cantonada a prop teu. Envia un enllaç a una persona. Els dos mòbils compten cap al mateix minut i després diuen: mòbils fora, ens veiem d'aquí a vint. Sense mapa, sense ruta, sense passos. Després, una sola pregunta: a la mateixa hora la setmana que ve?"], "t2": ["For two", "两个人", "兩個人", "Para dos", "Per a dos"], "t3": ["Ends on the street", "在街上收尾", "在街上收尾", "Acaba en la calle", "Acaba al carrer"], "k": "mantou", "g": "two", "when": "morn aft eve", "h": "/walk-with/"}, {"c": "AW", "s": "along-the-way", "n": ["Along the Way", "一路上", "一路上", "Por el Camino", "Pel Camí"], "l": ["A few lines a day. A road you can keep.", "每天写几行，攒成一条可以留着的路。", "每天寫幾行，攢成一條可以留著的路。", "Unas líneas al día. Un camino que puedes guardar.", "Unes línies al dia. Un camí que pots guardar."], "d": ["Each evening Mei asks about the weather inside you, Popo asks for a rose, a thorn and a bud, and Wei asks who made the day better. The days line up into a road, and the road becomes a small PDF book. Then go and thank the person you named.", "每天晚上，Mei 问你心里什么天气，婆婆问一朵玫瑰、一根刺、一个花苞，Wei 问今天是谁让日子好了一点。一天天连成一条路，再变成一本小小的 PDF 书。然后，去谢谢你写下的那个人。", "每天晚上，Mei 問你心裡什麼天氣，婆婆問一朵玫瑰、一根刺、一個花苞，Wei 問今天是誰讓日子好了一點。一天天連成一條路，再變成一本小小的 PDF 書。然後，去謝謝你寫下的那個人。", "Cada noche Mei te pregunta qué tiempo hace por dentro, Popo te pide una rosa, una espina y un brote, y Wei te pregunta quién hizo mejor el día. Los días se ponen en fila y forman un camino, y el camino se vuelve un librito en PDF. Luego ve a dar las gracias a la persona que escribiste.", "Cada nit la Mei et pregunta quin temps fa per dins, la Popo et demana una rosa, una espina i un brot, i en Wei et pregunta qui ha fet millor el dia. Els dies es posen en fila i fan un camí, i el camí es converteix en un llibret en PDF. Després ves a donar les gràcies a la persona que hi has escrit."], "t2": ["Two minutes a day", "每天两分钟", "每天兩分鐘", "Dos minutos al día", "Dos minuts al dia"], "t3": ["Ends with a thank-you", "以一句谢谢收尾", "以一句謝謝收尾", "Acaba con un gracias", "Acaba amb un gràcies"], "k": "all3", "g": "home", "when": "eve late", "h": "/along-the-way/"}, {"c": "WR", "s": "window-radio", "n": ["Window Radio", "窗边电台", "窗邊電臺", "Radio de la Ventana", "Ràdio de la Finestra"], "l": ["Lo-fi from your window. The day writes the tape.", "窗边的 lo-fi，今天替你写磁带。", "窗邊的 lo-fi，今天替你寫磁帶。", "Lo-fi desde tu ventana. El día escribe la cinta.", "Lo-fi des de la teva finestra. El dia escriu la cinta."], "d": ["Tell it how you feel and what the sky is doing. The weekday picks the key, the hour sets the tempo, a festival adds its own sound, and rain or wind plays outside the glass. Same picks on the same day make the same tape, so press play together. Then it ends, and you go put the kettle on for two.", "告诉它你的心情，还有窗外的天气。星期几决定调，几点钟决定快慢，节日会加上它自己的声音，雨和风在玻璃外面响。同一天、同样的选择，会放出同一盘磁带，所以一起按播放吧。放完了，就去烧一壶水，泡两杯茶。", "告訴它你的心情，還有窗外的天氣。星期幾決定調，幾點鐘決定快慢，節日會加上它自己的聲音，雨和風在玻璃外面響。同一天、同樣的選擇，會放出同一盤磁帶，所以一起按播放吧。放完了，就去燒一壺水，泡兩杯茶。", "Dile cómo te sientes y qué hace el cielo. El día de la semana elige el tono, la hora marca el ritmo, una fiesta añade su propio sonido, y la lluvia o el viento suenan al otro lado del cristal. Las mismas respuestas el mismo día dan la misma cinta, así que dadle al play juntos. Luego se acaba y vas a poner agua a hervir para dos.", "Digues-li com et sents i què fa el cel. El dia de la setmana tria el to, l'hora marca el ritme, una festa hi afegeix el seu so, i la pluja o el vent sonen a l'altra banda del vidre. Les mateixes respostes el mateix dia fan la mateixa cinta, així que premeu play junts. Després s'acaba i vas a posar aigua a bullir per a dos."], "t2": ["For a cup of tea", "一杯茶的时间", "一杯茶的時間", "Lo que dura un té", "El que dura un te"], "t3": ["Ends with tea for two", "以两杯茶收尾", "以兩杯茶收尾", "Acaba con té para dos", "Acaba amb te per a dos"], "k": "cats", "g": "home", "when": "late eve aft", "h": "/window-radio/"}, {"c": "GW", "s": "get-well-soup", "n": ["Get Well Soup", "一碗热汤", "一碗熱湯", "Sopa de Mejórate", "Sopa de Millora't"], "l": ["Someone's got a cold? Put a pot on for them.", "有人感冒了？给他们炖一锅汤。", "有人感冒了？給他們燉一鍋湯。", "¿Alguien se ha resfriado? Ponle una olla al fuego.", "Algú s'ha refredat? Posa-li una olla al foc."], "d": ["Type their name and pick what you'd really bring: soup, tissues and honey, something to watch, or a quiet call. Send one link. They lift the lid, pick the one thing that would help, and their answer comes back to you as a text. Then you go and knock on the door.", "写下对方的名字，选你真的会带过去的东西：一碗汤、纸巾和蜂蜜、看点什么，或者安静地通个电话。发一个链接。对方掀开锅盖，选最需要的那一样，回复会变成一条消息回到你这里。然后，你去敲门。", "寫下對方的名字，選你真的會帶過去的東西：一碗湯、紙巾和蜂蜜、看點什麼，或者安靜地通個電話。發一個連結。對方掀開鍋蓋，選最需要的那一樣，回覆會變成一條訊息回到你這裡。然後，你去敲門。", "Escribe su nombre y elige lo que de verdad le llevarías: sopa, pañuelos y miel, algo que ver o una llamada tranquila. Envía un enlace. Levanta la tapa, elige lo único que le ayudaría y su respuesta te llega como un mensaje. Luego vas y llamas a su puerta.", "Escriu el seu nom i tria el que de debò li portaries: sopa, mocadors i mel, alguna cosa per veure o una trucada tranquil·la. Envia un enllaç. Aixeca la tapa, tria l'única cosa que l'ajudaria i la resposta et torna com un missatge. Després hi vas i truques a la porta."], "t2": ["For someone poorly", "给生病的人", "給生病的人", "Para quien está malito", "Per a qui està malalt"], "t3": ["Ends at their door", "在对方门口收尾", "在對方門口收尾", "Acaba en su puerta", "Acaba a la seva porta"], "k": "popo", "g": "two", "when": "morn aft eve", "h": "/get-well-soup/"}, {"c": "CF", "s": "cook-for-someone", "n": ["Cook for Someone", "为谁下厨", "為誰下廚", "Cocina para Alguien", "Cuina per a Algú"], "l": ["Popo's recipe box, for whoever's eating.", "婆婆的食谱盒，给要吃饭的那个人。", "婆婆的食譜盒，給要吃飯的那個人。", "La caja de recetas de Popo, para quien vaya a comer.", "La capsa de receptes de la Popo, per a qui hagi de menjar."], "d": ["Tell Popo who it's for: someone unwell, the whole table, a friend who helped you move. She hands you one family recipe from the box at Next Door, someone's grandmother's or her own. Leave your family's recipe for the next person. It ends with a line to send: come and eat.", "告诉婆婆做给谁吃：生病的人、一大家子、帮你搬家的朋友。她从“隔壁”的食谱盒里递给你一张家传菜，可能是谁家外婆的，也可能是她自己的。也把你家的菜留给下一个人。最后发一句话：来吃饭吧。", "告訴婆婆做給誰吃：生病的人、一大家子、幫你搬家的朋友。她從“隔壁”的食譜盒裡遞給你一張家傳菜，可能是誰家外婆的，也可能是她自己的。也把你家的菜留給下一個人。最後發一句話：來吃飯吧。", "Dile a Popo para quién es: alguien enfermo, toda la mesa, el amigo que te ayudó con la mudanza. Te da una receta de familia de la caja de Al Lado, de la abuela de alguien o suya. Deja la receta de tu familia para el siguiente. Acaba con un mensaje que enviar: ven a comer.", "Digues-li a la Popo per a qui és: algú malalt, tota la taula, l'amic que et va ajudar amb la mudança. Et dona una recepta de família de la capsa d'Al Costat, de l'àvia d'algú o seva. Deixa-hi la recepta de la teva família per al següent. Acaba amb un missatge per enviar: vine a menjar."], "t2": ["Family recipes", "家传菜", "家傳菜", "Recetas de familia", "Receptes de família"], "t3": ["Ends at the table", "在饭桌上收尾", "在飯桌上收尾", "Acaba en la mesa", "Acaba a taula"], "k": "popo", "g": "table", "when": "aft eve", "h": "/cook-for-someone/"}, {"c": "MX", "s": "mix-for-someone", "n": ["Mix for Someone", "为谁调一杯", "為誰調一杯", "Mezcla para Alguien", "Barreja per a Algú"], "l": ["Next Door's House book, zero-proof too.", "“隔壁”的酒谱本，也有无酒精的。", "“隔壁”的酒譜本，也有無酒精的。", "El libro de la casa de Al Lado, también sin alcohol.", "El llibre de la casa d'Al Costat, també sense alcohol."], "d": ["Tell Wei what kind of evening it is and he picks a drink from the book neighbours keep at Next Door, or mix your own on the bench and add it. Every drink is drawn in its own colour, with what's in it and how. It ends with two glasses: make one for someone, and a glass of water each.", "告诉 Wei 今晚是什么样的晚上，他就从邻居们在“隔壁”写下的酒谱里挑一杯；你也可以在吧台上自己调，写进酒谱。每一杯都画出它自己的颜色，写着配方和做法。最后是两只杯子：调一杯给某个人，再每人一杯水。", "告訴 Wei 今晚是什麼樣的晚上，他就從鄰居們在“隔壁”寫下的酒譜裡挑一杯；你也可以在吧檯上自己調，寫進酒譜。每一杯都畫出它自己的顏色，寫著配方和做法。最後是兩隻杯子：調一杯給某個人，再每人一杯水。", "Dile a Wei qué tipo de noche es y elige una bebida del libro que los vecinos llevan en Al Lado, o prepara la tuya en la barra y añádela. Cada bebida se dibuja con su propio color, con lo que lleva y cómo se hace. Acaba con dos vasos: prepara uno para alguien, y un vaso de agua cada uno.", "Digues-li a en Wei quina mena de nit és i tria una beguda del llibre que els veïns porten a Al Costat, o prepara la teva a la barra i afegeix-la. Cada beguda es dibuixa amb el seu propi color, amb el que porta i com es fa. Acaba amb dos gots: prepara'n un per a algú, i un got d'aigua cadascú."], "t2": ["Zero-proof too", "也有无酒精的", "也有無酒精的", "También sin alcohol", "També sense alcohol"], "t3": ["Ends with two glasses", "以两只杯子收尾", "以兩隻杯子收尾", "Acaba con dos vasos", "Acaba amb dos gots"], "k": "wei", "g": "table", "when": "eve", "h": "/mix-for-someone/"}, {"c": "CH", "s": "common-hand", "n": ["Common Hand", "凑一手", "湊一手", "Mano Común", "Mà Comuna"], "l": ["Four at the table, something in common for every pair.", "四个人一桌，每两个人都找到一个共同点。", "四個人一桌，每兩個人都找到一個共同點。", "Cuatro en la mesa, algo en común para cada pareja.", "Quatre a taula, alguna cosa en comú per a cada parella."], "d": ["Before a game of mahjong, one phone goes in the middle. Draw a tile, read it out, and tap everyone it's true for: grew up near water, can't stand durian, learned the game from a grandparent. Two is a pung, three a chow, all four a kong. When every pair at the table has something in common the hand is complete. Send it on, then phones face down and deal.", "打麻将之前，把一部手机放在桌子中间。摸一张牌，念出来，点所有符合的人：在水边长大的、受不了榴莲的、跟祖辈学的牌。两个人是碰，三个人是吃，四个人是杠。等桌上每两个人都有了共同点，就胡了。把这一手发出去，然后手机扣过来，开打。", "打麻將之前，把一部手機放在桌子中間。摸一張牌，念出來，點所有符合的人：在水邊長大的、受不了榴槤的、跟祖輩學的牌。兩個人是碰，三個人是吃，四個人是槓。等桌上每兩個人都有了共同點，就胡了。把這一手發出去，然後手機扣過來，開打。", "Antes de una partida de mahjong, un móvil va al centro de la mesa. Roba una ficha, léela en voz alta y toca a todos a los que les pasa: crecieron cerca del agua, no soportan el durián, aprendieron a jugar con un abuelo. Dos es un pung, tres un chow, los cuatro un kong. Cuando cada pareja de la mesa tiene algo en común, la mano está completa. Envíala y luego móviles boca abajo y a repartir.", "Abans d'una partida de mahjong, un mòbil va al mig de la taula. Roba una fitxa, llegeix-la en veu alta i toca tothom a qui li passa: van créixer a prop de l'aigua, no suporten el durian, van aprendre a jugar amb un avi. Dos és un pung, tres un chow, tots quatre un kong. Quan cada parella de la taula té alguna cosa en comú, la mà és completa. Envia-la i després mòbils cap per avall i a repartir."], "t2": ["For four at a table", "给一桌四个人", "給一桌四個人", "Para cuatro en una mesa", "Per a quatre a taula"], "t3": ["Ends with the tiles washed", "以洗牌收尾", "以洗牌收尾", "Acaba con las fichas lavadas", "Acaba amb les fitxes rentades"], "k": "popo", "g": "table", "when": "eve", "h": "/common-hand/"}, {"c": "PB", "s": "put-it-back", "n": ["Put It Back", "归位", "歸位", "Cada Cosa en su Sitio", "Cada Cosa al seu Lloc"], "l": ["Everyone's things wandered off. Help them home, then tidy one real spot.", "大家的东西都跑丢了。帮它们回家，再真的去收拾一个角落。", "大家的東西都跑丟了。幫它們回家，再真的去收拾一個角落。", "Las cosas de todos se han ido de paseo. Ayúdalas a volver y ordena un rincón de verdad.", "Les coses de tothom han marxat a passejar. Ajuda-les a tornar i endreça un racó de debò."], "d": ["Popo's glasses are on the rug, Mei's book is under the sofa, there's a sock on the lamp. Tap each thing and it floats home while its owner says thanks; Miso and Mantou undo a little of it, of course. Then pick one real spot, a song and someone to do it with. Put each thing back with its person, and keep one line about what turned up.", "婆婆的眼镜在地毯上，Mei 的书在沙发底下，台灯上挂着一只袜子。点一样东西，它就飘回家，主人跟你道谢；当然，Miso 和馒头会给你添一点乱。然后挑一个真实的角落、一首歌、一个一起收拾的人。把每样东西还给它的主人，再写一行，记下收拾时冒出来的东西。", "婆婆的眼鏡在地毯上，Mei 的書在沙發底下，檯燈上掛著一隻襪子。點一樣東西，它就飄回家，主人跟你道謝；當然，Miso 和饅頭會給你添一點亂。然後挑一個真實的角落、一首歌、一個一起收拾的人。把每樣東西還給它的主人，再寫一行，記下收拾時冒出來的東西。", "Las gafas de Popo están en la alfombra, el libro de Mei bajo el sofá y hay un calcetín en la lámpara. Toca cada cosa y vuelve flotando a su sitio mientras su dueño te da las gracias; Miso y Mantou deshacen un poco, cómo no. Luego elige un rincón de verdad, una canción y alguien con quien hacerlo. Devuelve cada cosa a su persona y guarda una línea sobre lo que apareció.", "Les ulleres de la Popo són a la catifa, el llibre de la Mei sota el sofà i hi ha un mitjó al llum. Toca cada cosa i torna surant al seu lloc mentre el seu amo et dona les gràcies; en Miso i en Mantou en desfan una mica, és clar. Després tria un racó de debò, una cançó i algú amb qui fer-ho. Torna cada cosa a la seva persona i desa una línia sobre el que ha aparegut."], "t2": ["One song long", "一首歌那么长", "一首歌那麼長", "Lo que dura una canción", "El que dura una cançó"], "t3": ["Ends with the room put back", "以房间归位收尾", "以房間歸位收尾", "Acaba con la sala en orden", "Acaba amb la sala endreçada"], "k": "popo", "g": "home", "when": "morn aft", "h": "/put-it-back/"}, {"c": "PF", "s": "pour-for-someone", "n": ["Pour for Someone", "为谁冲一杯", "為誰沖一杯", "Un Café para Alguien", "Un Cafè per a Algú"], "l": ["Wei's V60, by the gram. The second cup is for someone.", "Wei 的手冲，按克数来。第二杯是给某个人的。", "Wei 的手沖，按克數來。第二杯是給某個人的。", "El V60 de Wei, gramo a gramo. La segunda taza es para alguien.", "El V60 d'en Wei, gram a gram. La segona tassa és per a algú."], "d": ["Next Door's roastery shelf on your phone. Say how you want it, bright, sweet, strong or iced, and Wei picks a brew from the shelf or one a neighbour left. Pour starts the clock: it calls the bloom and every pour, and shows what the scale should read. Write your own in the brew book. It ends with the second cup carried over.", "隔壁的烘焙架，放进你的手机。说说你想要什么样的：明亮、甜润、浓一点，还是冰的，Wei 会从架子上挑一款，或者挑一款街坊留下的。按下冲煮就开始计时：它会喊闷蒸、每一次注水，还告诉你秤上该到多少克。你自己的冲法也可以写进冲煮本。最后，把第二杯端过去。", "隔壁的烘焙架，放進你的手機。說說你想要什麼樣的：明亮、甜潤、濃一點，還是冰的，Wei 會從架子上挑一款，或者挑一款街坊留下的。按下沖煮就開始計時：它會喊悶蒸、每一次注水，還告訴你秤上該到多少克。你自己的沖法也可以寫進沖煮本。最後，把第二杯端過去。", "La estantería del tostadero de Al Lado, en tu móvil. Di cómo lo quieres, brillante, dulce, fuerte o con hielo, y Wei elige un café de la estantería o uno que dejó un vecino. Al servir empieza el reloj: avisa del bloom y de cada vertido, y te dice qué debe marcar la báscula. Escribe el tuyo en el libro de cafés. Acaba con la segunda taza, llevada a alguien.", "La prestatgeria del torrador d'Al Costat, al teu mòbil. Digues com el vols, brillant, dolç, fort o amb gel, i en Wei tria un cafè de la prestatgeria o un que va deixar un veí. En servir comença el rellotge: avisa del bloom i de cada abocada, i et diu què ha de marcar la bàscula. Escriu el teu al llibre de cafès. Acaba amb la segona tassa, portada a algú."], "t2": ["Three minutes long", "三分钟那么长", "三分鐘那麼長", "Lo que duran tres minutos", "El que duren tres minuts"], "t3": ["Ends with the second cup", "以第二杯收尾", "以第二杯收尾", "Acaba con la segunda taza", "Acaba amb la segona tassa"], "k": "wei", "g": "table", "when": "morn", "h": "/pour-for-someone/"}, {"c": "TF", "s": "steep-for-someone", "n": ["Steep for Someone", "为谁泡壶茶", "為誰泡壺茶", "Un Té para Alguien", "Un Te per a Algú"], "l": ["Tea from the tables of the world, poured at Popo's. The other cup is for someone.", "世界各地茶桌上的茶，在婆婆家倒。另一杯是给某个人的。", "世界各地茶桌上的茶，在婆婆家倒。另一杯是給某個人的。", "Té de las mesas del mundo, servido en casa de Popo. La otra taza es para alguien.", "Te de les taules del món, servit a casa la Popo. L'altra tassa és per a algú."], "d": ["Hong Kong yum cha, Chaozhou gongfu, a Longjing glass from Hangzhou, a London pot, Moroccan mint poured from high, Mumbai chai, Istanbul çay, Kyoto sencha. Tell Popo what kind of afternoon it is or pick a table: each card says how it's poured there. A timer calls every steep. Write your family's way into the tea book. It ends with pouring for someone else first.", "香港饮茶、潮州工夫茶、杭州玻璃杯里的龙井、伦敦的一壶红茶、高冲的摩洛哥薄荷茶、孟买奶茶、伊斯坦布尔红茶、京都煎茶。告诉婆婆今天是什么样的下午，或者挑一张茶桌：每张茶卡都写着那里怎么倒茶。计时器会提醒你每一泡。你家的泡法可以写进茶谱。最后，先给别人倒。", "香港飲茶、潮州工夫茶、杭州玻璃杯裡的龍井、倫敦的一壺紅茶、高衝的摩洛哥薄荷茶、孟買奶茶、伊斯坦布林紅茶、京都煎茶。告訴婆婆今天是什麼樣的下午，或者挑一張茶桌：每張茶卡都寫著那裡怎麼倒茶。計時器會提醒你每一泡。你家的泡法可以寫進茶譜。最後，先給別人倒。", "Yum cha de Hong Kong, gongfu de Chaozhou, un vaso de Longjing de Hangzhou, una tetera de Londres, té con menta marroquí servido desde lo alto, chai de Bombay, çay de Estambul, sencha de Kioto. Dile a Popo qué tipo de tarde es o elige una mesa: cada ficha dice cómo se sirve allí. Un temporizador avisa en cada infusión. Escribe la manera de tu familia en el libro del té. Acaba sirviendo primero a otra persona.", "Yum cha de Hong Kong, gongfu de Chaozhou, un got de Longjing de Hangzhou, una tetera de Londres, te amb menta marroquí servit des de dalt, chai de Bombai, çay d'Istanbul, sencha de Kyoto. Digues-li a la Popo quina mena de tarda és o tria una taula: cada fitxa diu com se serveix allà. Un temporitzador avisa a cada infusió. Escriu la manera de la teva família al llibre del te. Acaba servint primer una altra persona."], "t2": ["Eleven tables", "十一张茶桌", "十一張茶桌", "Once mesas", "Onze taules"], "t3": ["Pour for them first", "先给别人倒", "先給別人倒", "Sírveles primero", "Serveix-los primer"], "k": "popo", "g": "table", "when": "aft", "h": "/steep-for-someone/"}, {"c": "AC", "s": "casino", "n": ["After Hours Casino", "小赌场", "小賭場", "El Casinito", "El Casinet"], "l": ["A tiny casino for one table. Seeds for chips, never money.", "一张桌子的小赌场。筹码是瓜子，永远不用钱。", "一張桌子的小賭場。籌碼是瓜子，永遠不用錢。", "Un casino diminuto para una mesa. Pipas como fichas, nunca dinero.", "Un casino petitó per a una taula. Pipes com a fitxes, mai diners."], "d": ["Popo runs the house, and her staff cheat in your favour. Pull Wei's slot for a real plan, spin the little wheel for a small dare right now, or tell a true story or a tall tale while Mei watches your ears. Last call ends the night, and the plans go home with you.", "婆婆当庄家，她的员工专门帮你作弊。拉一下 Wei 的老虎机，约一件真事；转一下小转盘，现在就做一件小事；或者讲一个真故事、吹一个牛，Mei 盯着你的耳朵。最后一轮结束这一晚，约好的事跟你们回家。", "婆婆當莊家，她的員工專門幫你作弊。拉一下 Wei 的老虎機，約一件真事；轉一下小轉盤，現在就做一件小事；或者講一個真故事、吹一個牛，Mei 盯著你的耳朵。最後一輪結束這一晚，約好的事跟你們回家。", "Popo lleva la casa y su personal hace trampas a tu favor. Tira de la tragaplanes de Wei para un plan de verdad, gira la ruedita para un pequeño reto ahora mismo, o cuenta una historia real o una trola mientras Mei te mira las orejas. La última ronda cierra la noche, y los planes se van con vosotros.", "La Popo porta la casa i el seu personal fa trampes a favor teu. Estira la màquina d'en Wei per a un pla de debò, gira la rodeta per a un petit repte ara mateix, o explica una història real o una bola mentre la Mei et mira les orelles. L'última ronda tanca la nit, i els plans se'n van amb vosaltres."], "t2": ["One table, one night", "一张桌子，一个晚上", "一張桌子，一個晚上", "Una mesa, una noche", "Una taula, una nit"], "t3": ["Ends with a plan to meet", "以一个约定收尾", "以一個約定收尾", "Acaba con un plan para veros", "Acaba amb un pla per veure-us"], "k": "popo", "g": "table", "when": "eve", "h": "/casino/"}, {"c": "SL", "s": "still-today", "n": ["Still Today", "今天还没完", "今天還沒完", "Aún es Hoy", "Encara és Avui"], "l": ["Pretend today was your last day. Good news: it isn't.", "假装今天是你的最后一天。好消息：不是。", "假裝今天是你的最後一天。好訊息：不是。", "Imagina que hoy era tu último día. Buena noticia: no lo es.", "Imagina que avui era el teu últim dia. Bona notícia: no ho és."], "d": ["One of Nearby's six asks one question: who you haven't called, what you meant to say, what you skipped for being boring, the work that could wait, what you rushed past, whether you got outside. Answer in a few words. Then Josep's clock runs slow and you get the rest of the day back, with one thing to do in it. Too late? Popo keeps it on a paper for the morning. Tap the clock face for Josep's own list.", "近邻的六位里有一位问你一个问题：还有谁没打电话，想说却没说的话，因为无聊没去做的事，可以等的工作，匆匆走过的东西，今天有没有出门。用几个字回答。然后 Josep 的钟走慢了，剩下的一天还给你，里面放一件要做的事。太晚了？婆婆写在纸条上，留到早上。点一下钟面，看看 Josep 自己的清单。", "近鄰的六位裡有一位問你一個問題：還有誰沒打電話，想說卻沒說的話，因為無聊沒去做的事，可以等的工作，匆匆走過的東西，今天有沒有出門。用幾個字回答。然後 Josep 的鐘走慢了，剩下的一天還給你，裡面放一件要做的事。太晚了？婆婆寫在紙條上，留到早上。點一下鐘面，看看 Josep 自己的清單。", "Uno de los seis de Cerca te hace una pregunta: a quién no has llamado, qué querías decir, qué no hiciste por pereza, el trabajo que podía esperar, qué pasaste de largo, si saliste a la calle. Responde en pocas palabras. Luego el reloj de Josep se atrasa y te devuelve el resto del día, con una cosa que hacer. ¿Es tarde? Popo te lo deja en una nota para la mañana. Toca la esfera del reloj para ver la lista del propio Josep.", "Un dels sis d'A Prop et fa una pregunta: a qui no has trucat, què volies dir, què no has fet per mandra, la feina que podia esperar, per davant de què has passat de llarg, si has sortit al carrer. Respon amb poques paraules. Després el rellotge d'en Josep s'endarrereix i et torna la resta del dia, amb una cosa per fer. És tard? La Popo t'ho deixa en una nota per al matí. Toca l'esfera del rellotge per veure la llista del mateix Josep."], "t2": ["One minute long", "一分钟", "一分鐘", "Un minuto", "Un minut"], "t3": ["Ends with the thing, today", "以今天就去做收尾", "以今天就去做收尾", "Acaba con hacerlo hoy", "Acaba fent-ho avui"], "k": "popo", "g": "home", "when": "eve late", "h": "/still-today/"}, {"c": "GB", "s": "what-grows-between-us", "n": ["What Grows Between Us", "我们之间长的花", "我們之間長的花", "Lo que Crece Entre Nosotros", "El que Creix Entre Nosaltres"], "l": ["A seed with no label, grown by your friends from what you do together.", "一包没有名字的种子，靠你和朋友一起做的事长大。", "一包沒有名字的種子，靠你和朋友一起做的事長大。", "Una semilla sin etiqueta que crece con lo que hacéis juntos.", "Una llavor sense etiqueta que creix amb el que feu junts."], "d": ["Popo found a seed packet of Josep's with the name washed off. Plant it with your friends. It grows only from real things you do together, off the screen: calling instead of texting, a walk, a meal, a song, a hand with something. Pass the pot hand to hand, guess what it is, and when it blooms, grow a real one.", "婆婆找到一包 Josep 的种子，名字被雨洗掉了。跟朋友一起种下。它只靠你们在屏幕外一起做的真事长大：打个电话而不是发消息、散步、吃顿饭、一首歌、搭把手。花盆一手传一手，猜猜是什么；开花那天，一起种一棵真的。", "婆婆找到一包 Josep 的種子，名字被雨洗掉了。跟朋友一起種下。它只靠你們在螢幕外一起做的真事長大：打個電話而不是發訊息、散步、吃頓飯、一首歌、搭把手。花盆一手傳一手，猜猜是什麼；開花那天，一起種一棵真的。", "Popo encontró un sobre de semillas de Josep con el nombre borrado por la lluvia. Plantadla entre amigos. Solo crece con cosas de verdad que hacéis juntos, fuera de la pantalla: llamar en vez de escribir, un paseo, una comida, una canción, echar una mano. Pasaos la maceta de mano en mano, adivinad qué es y, cuando florezca, plantad una de verdad.", "La Popo va trobar un sobre de llavors d'en Josep amb el nom esborrat per la pluja. Planteu-la entre amics. Només creix amb coses de debò que feu junts, fora de la pantalla: trucar en lloc d'escriure, un passeig, un àpat, una cançó, donar un cop de mà. Passeu-vos el test de mà en mà, endevineu què és i, quan floreixi, planteu-ne una de debò."], "t2": ["About two weeks", "大约两周", "大約兩週", "Unas dos semanas", "Unes dues setmanes"], "t3": ["Ends with a real plant", "以一棵真的花收尾", "以一棵真的花收尾", "Acaba con una planta de verdad", "Acaba amb una planta de debò"], "k": "popo", "g": "far", "when": "aft", "h": "/what-grows-between-us/"}, {"c": "CS", "s": "counting-sleeps", "n": ["Counting Sleeps", "还有几觉", "還有幾覺", "Cuántas Noches", "Quantes Nits"], "l": ["The day you'll see them, counted on a paper chain.", "见面那天，用一条纸环链来数。", "見面那天，用一條紙環鏈來數。", "El día en que os veréis, contado en una cadena de papel.", "El dia que us veureu, comptat en una cadena de paper."], "d": ["Pick the day you'll see a friend or family who lives far away, and send them the same chain. Print it and hang it on the fridge: one ring off each night. Save little things to tell them in a jar; on the day you swap jars at the table, and put the phone down.", "定好和远方的朋友或家人见面的那天，也给对方发一条一样的纸环链。打印出来挂在冰箱上：每晚撕一个环。把想当面说的小事攒进罐子；那天在饭桌上交换罐子，然后放下手机。", "定好和遠方的朋友或家人見面的那天，也給對方發一條一樣的紙環鏈。打印出來掛在冰箱上：每晚撕一個環。把想當面說的小事攢進罐子；那天在飯桌上交換罐子，然後放下手機。", "Elige el día en que verás a un amigo o a alguien de la familia que vive lejos, y envíale la misma cadena. Imprímela y cuélgala en la nevera: un anillo menos cada noche. Guarda en un tarro cositas para contarle; el día os cambiáis los tarros en la mesa y dejáis el móvil.", "Tria el dia que veuràs un amic o algú de la família que viu lluny, i envia-li la mateixa cadena. Imprimeix-la i penja-la a la nevera: una anella menys cada nit. Guarda en un pot petites coses per explicar-li; el dia us canvieu els pots a taula i deixeu el mòbil."], "t2": ["Up to 100 sleeps", "最多 100 觉", "最多 100 覺", "Hasta 100 noches", "Fins a 100 nits"], "t3": ["Ends at the table", "以饭桌收尾", "以飯桌收尾", "Acaba en la mesa", "Acaba a taula"], "k": "popo", "g": "far", "when": "morn eve", "h": "/counting-sleeps/"}, {"c": "NB", "s": "nearby", "n": ["Nearby", "近邻", "近鄰", "Cerca", "A Prop"], "l": ["A little world that sends you back to yours.", "一个小小的世界，把你送回你自己的世界。", "一個小小的世界，把你送回你自己的世界。", "Un mundo pequeño que te devuelve al tuyo.", "Un món petit que et torna al teu."], "d": ["A pixel town with a bar, a bookshop, a cabin, a lake and a night train. Wander alone or bring a friend, leave something for the neighbours, and let Wei the bartender point the way. Every visit ends with one thing to take outside.", "一座像素小镇：一间酒吧、一家书店、一间小屋、一片湖和一趟夜车。一个人逛，或者带上朋友；给街坊留点东西；让酒保 Wei 给你指路。每次离开，都带走一件可以去外面做的事。", "一座畫素小鎮：一間酒吧、一家書店、一間小屋、一片湖和一趟夜車。一個人逛，或者帶上朋友；給街坊留點東西；讓酒保 Wei 給你指路。每次離開，都帶走一件可以去外面做的事。", "Un pueblo de píxeles con un bar, una librería, una cabaña, un lago y un tren nocturno. Pasea solo o con un amigo, deja algo a los vecinos y deja que Wei, el barman, te indique el camino. Cada visita termina con una cosa que llevarte fuera.", "Un poble de píxels amb un bar, una llibreria, una cabana, un llac i un tren de nit. Passeja sol o amb un amic, deixa alguna cosa als veïns i deixa que en Wei, el cambrer, t'indiqui el camí. Cada visita acaba amb una cosa per endur-te fora."], "t2": ["20+ places", "20 多个地方", "20 多個地方", "Más de 20 sitios", "Més de 20 llocs"], "t3": ["Alone or together", "一个人或一起", "一個人或一起", "Solo o en compañía", "Sol o en companyia"], "k": "all", "g": "town", "when": "late morn aft eve", "h": "/nearby/"}, {"c": "ST", "s": "station", "n": ["Nearby Station", "近邻站", "近鄰站", "Estación Cerca", "Estació A Prop"], "l": ["A window seat on a slow train.", "慢火车上一个靠窗的座位。", "慢火車上一個靠窗的座位。", "Un asiento junto a la ventana en un tren lento.", "Un seient a la finestra en un tren lent."], "d": ["Pick a record, get a cup from the trolley, watch the world go by. Get off at any stop, walk the platform, catch another train. Some stops lead down into Nearby. It ends where trains do: you get off, and call the person you'd take the real trip with.", "挑一张唱片，从小推车拿一杯喝的，看窗外世界经过。在哪一站都能下车，在站台上走走，再换一班车。有几站下去就是近邻。最后像所有火车一样：你下车，然后打给那个你想一起真的去旅行的人。", "挑一張唱片，從小推車拿一杯喝的，看窗外世界經過。在哪一站都能下車，在站臺上走走，再換一班車。有幾站下去就是近鄰。最後像所有火車一樣：你下車，然後打給那個你想一起真的去旅行的人。", "Elige un disco, pide algo al carrito y mira pasar el mundo. Bájate en cualquier parada, pasea por el andén y coge otro tren. Algunas paradas bajan hasta Cerca. Termina como terminan los trenes: te bajas y llamas a la persona con quien harías el viaje de verdad.", "Tria un disc, demana alguna cosa al carretó i mira passar el món. Baixa a qualsevol parada, passeja per l'andana i agafa un altre tren. Algunes parades baixen fins a A Prop. Acaba com acaben els trens: baixes i truques a la persona amb qui faries el viatge de debò."], "t2": ["Get off anywhere", "随处下车", "隨處下車", "Bájate donde quieras", "Baixa on vulguis"], "t3": ["Screen stays on", "屏幕常亮", "螢幕常亮", "La pantalla no se apaga", "La pantalla no s'apaga"], "k": "mantou", "g": "town", "when": "late eve", "h": "/station/"}, {"c": "HO", "s": "handoff", "n": ["Handoff", "Handoff", "Handoff", "Handoff", "Handoff"], "l": ["For two people in different cities.", "给分隔两座城市的两个人。", "給分隔兩座城市的兩個人。", "Para dos personas en ciudades distintas.", "Per a dues persones en ciutats diferents."], "d": ["Notes and voice messages for one person, each other's weather and time of day, and a capsule that opens later. Only the two of you see it.", "只写给一个人的留言和语音、彼此那边的天气和时间，还有一个以后才打开的时间胶囊。只有你们两个人看得到。", "只寫給一個人的留言和語音、彼此那邊的天氣和時間，還有一個以後才打開的時間膠囊。只有你們兩個人看得到。", "Notas y mensajes de voz para una sola persona, el tiempo y la hora del otro, y una cápsula que se abre más adelante. Solo lo veis vosotros dos.", "Notes i missatges de veu per a una sola persona, el temps i l'hora de l'altre, i una càpsula que s'obre més endavant. Només ho veieu vosaltres dos."], "t2": ["For two", "两个人用", "兩個人用", "Para dos", "Per a dos"], "t3": ["Installs like an app", "能像 App 一样安装", "能像 App 一樣安裝", "Se instala como una app", "S'instal·la com una app"], "k": "mei", "g": "two", "when": "eve late morn", "h": "/handoff/"}, {"c": "TC", "s": "two-candles", "n": ["Two Candles", "双烛小馆", "雙燭小館", "Dos Velas", "Dues Espelmes"], "l": ["Dinner for two, however far apart.", "两个人的晚饭，再远也一起吃。", "兩個人的晚飯，再遠也一起吃。", "Una cena para dos, por lejos que estéis.", "Un sopar per a dos, per lluny que sigueu."], "d": ["
