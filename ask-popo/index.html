<style>
  /* one column like Twelve Grapes: Popo's table on top, the question under it */
  :root {
    --page:#efe3c8; --ink:#2a1c14; --mut:#6e5440; --panel:#f7ecd4; --field:#fffaf0; --wood:#a8703c; --woodD:#6e4420; --amber:#e8a838;
    --line:#1a1410; --red:#c8303a; --check:rgba(90,60,30,.06); color-scheme:light;
    --pix:"VT323", ui-monospace, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", monospace;
    --sign:"Press Start 2P", "VT323", monospace;
    --book:"Fraunces", "Iowan Old Style", Georgia, "Songti SC", "STSong", "Noto Serif SC", serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#14101e; --ink:#f3ead8; --mut:#b9a88e; --panel:#2a1c14; --field:#1c130d; --wood:#7a4a28; --woodD:#3e2414; --check:rgba(255,255,255,.025); color-scheme:dark; } }
  :root[data-theme="dark"] { --page:#14101e; --ink:#f3ead8; --mut:#b9a88e; --panel:#2a1c14; --field:#1c130d; --wood:#7a4a28; --woodD:#3e2414; --check:rgba(255,255,255,.025); color-scheme:dark; }
  :lang(zh) { --pix:"VT323", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  :lang(zh-Hant) { --pix:"VT323", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; --book:"Fraunces", Georgia, "Songti TC", "PMingLiU", "Noto Serif TC", serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--page); color:var(--ink); }
  body { font:21px/1.25 var(--pix); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; -webkit-text-size-adjust:100%;
    background-image:repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%); background-size:8px 8px; }
  html:lang(zh) body, html:lang(zh-Hant) body { font-size:17px; line-height:1.5; }
  .wrap { width:100%; max-width:620px; margin:0 auto; flex:1; display:grid; align-content:start; gap:14px;
    padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  header { --ahh-bg:var(--panel); --ahh-ink:var(--ink); --ahh-line:var(--line); --ahh-name:var(--sign); }
  html:lang(zh) .ahh-nm, html:lang(zh-Hant) .ahh-nm { font:700 18px/1.2 var(--pix); letter-spacing:.1em; }
  .stage { border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); background:#14101e; }
  #room { display:block; width:100%; height:auto; aspect-ratio:320/200; image-rendering:pixelated; }
  .course { font:8px/1 var(--sign); color:#f3ead8; background:#1a1410; padding:8px 10px 7px; letter-spacing:.08em; }
  html:lang(zh) .course, html:lang(zh-Hant) .course { font:15px/1 var(--pix); letter-spacing:.12em; padding:6px 10px; }
  .panel { background:var(--panel); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); padding:14px 16px 16px; display:grid; gap:12px; min-width:0; }
  .who { display:flex; align-items:center; gap:10px; }
  #face { width:44px; height:44px; image-rendering:pixelated; border:3px solid var(--line); background:#3a2414; flex:none; }
  #name { font:10px var(--sign); letter-spacing:.06em; }
  html:lang(zh) #name, html:lang(zh-Hant) #name { font:700 17px var(--pix); }
  #line { margin:0; color:var(--mut); overflow-wrap:anywhere; }
  #line em { font-style:italic; }
  #ctl { display:grid; gap:12px; min-width:0; }
  .kick { margin:0; color:var(--red); font-size:21px; }
  html:lang(zh) .kick, html:lang(zh-Hant) .kick { font-size:17px; }
  .q { margin:0; font-size:32px; line-height:1.1; overflow-wrap:anywhere; }
  .q.sm { font-size:25px; }
  html:lang(zh) .q, html:lang(zh-Hant) .q { font-size:25px; line-height:1.45; font-weight:700; }
  html:lang(zh) .q.sm, html:lang(zh-Hant) .q.sm { font-size:20px; }
  .note { margin:0; color:var(--mut); }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .col { display:grid; gap:10px; }
  .btn { font:21px/1.05 var(--pix); color:#fff6e6; background:linear-gradient(var(--wood), var(--woodD)); border:3px solid var(--line); border-radius:0;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 3px 3px 0 var(--line); padding:12px 14px; min-height:48px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; text-align:center; }
  html:lang(zh) .btn, html:lang(zh-Hant) .btn { font-size:17px; }
  .btn:active { transform:translate(2px,2px); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 1px 1px 0 var(--line); }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, .link:focus-visible { outline:3px solid var(--amber); outline-offset:2px; }
  .btn.pri, .btn.on { background:linear-gradient(#f4c25a, #d8901f); color:#1a1410; }
  .btn.sm { font:8px var(--sign); padding:8px; min-height:36px; letter-spacing:.06em; }
  html:lang(zh) .btn.sm, html:lang(zh-Hant) .btn.sm { font:15px var(--pix); }
  .btn[disabled] { opacity:.45; cursor:default; }
  .links { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 16px; }
  .link { font:18px var(--pix); color:var(--mut); background:none; border:0; padding:8px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; min-height:40px; }
  html:lang(zh) .link, html:lang(zh-Hant) .link { font-size:15px; }
  textarea, input[type="text"] { font:22px/1.25 var(--pix); color:var(--ink); background:var(--field); border:3px solid var(--line); border-radius:0; padding:10px 12px; width:100%; resize:none; }
  html:lang(zh) textarea, html:lang(zh) input, html:lang(zh-Hant) textarea, html:lang(zh-Hant) input { font-size:18px; line-height:1.5; }
  label.lab { font:8px/1.6 var(--sign); letter-spacing:.06em; color:var(--mut); display:block; margin-bottom:6px; text-transform:uppercase; }
  html:lang(zh) label.lab, html:lang(zh-Hant) label.lab { font:15px var(--pix); }
  .days { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
  .days .btn { padding:10px 0; min-height:46px; font-size:19px; }
  html:lang(zh) .days .btn, html:lang(zh-Hant) .days .btn { font-size:14px; }
  .quiet { text-align:center; }
  footer { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; padding:14px 16px max(18px, env(safe-area-inset-bottom)); font-size:17px; color:var(--mut); }
  footer a { color:inherit; display:inline-flex; align-items:center; gap:5px; }

  /* the Book: a small printed book */
  .book { background:#fffaf0; color:#2a1c14; font-family:var(--book); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line), 7px 7px 0 #d8c8a8, 10px 10px 0 var(--line);
    padding:34px 26px 30px; border-left:10px solid #e2d2b2; }
  .book .cover { text-align:center; }
  .book h2 { font-weight:400; font-size:28px; line-height:1.15; margin:8px 0 6px; }
  .book .bsub { font-style:italic; color:#6e5440; margin:0; font-size:16px; }
  .orn { text-align:center; color:#c8303a; margin:20px 0; letter-spacing:.5em; font-size:18px; }
  .entry { margin:0 0 24px; break-inside:avoid; page-break-inside:avoid; }
  .entry + .entry { border-top:1px dotted #cbbca5; padding-top:20px; }
  .entry .n { font:12px var(--book); letter-spacing:.14em; text-transform:uppercase; color:#8a7058; }
  .entry h3 { font-weight:400; font-style:italic; font-size:19px; line-height:1.3; margin:6px 0 8px; }
  .entry p { margin:0; font-size:17px; line-height:1.5; white-space:pre-line; }
  .entry .d { font-size:13px; color:#8a7058; margin-top:6px; }
  .entry .none { color:#8a7058; font-style:italic; }
  .entry .pa { margin:8px 0 0 14px; font-size:14px; line-height:1.45; color:#8a7058; font-style:italic; }
  .entry .pa b { font-style:normal; font-weight:400; letter-spacing:.1em; margin-right:6px; }
  .pans { margin:18px auto 0; max-width:34em; text-align:left; }
  .pans .lead { margin:0 0 6px; color:var(--mut); }
  .pans blockquote { margin:0; padding:12px 14px; border-left:3px solid var(--amber); background:var(--field); font-size:17px; line-height:1.5; }
  .pans.paper blockquote { border-left:0; background:#f6efdf; color:#3a2a1c; box-shadow:2px 3px 0 rgba(0,0,0,.18); transform:rotate(-.6deg); }
  .pans .sig { display:block; text-align:right; margin-top:6px; letter-spacing:.1em; }
  .bempty { text-align:center; font-style:italic; color:#6e5440; }
  html:lang(zh) .book h3, html:lang(zh-Hant) .book h3 { font-style:normal; font-weight:600; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { .btn:active { transform:none; } }

  /* print: a clean A5 booklet, the Book and nothing else */
  @page { size:A5; margin:18mm 15mm; }
  /* handoff/DESIGN.md §5: phone one column; tablet the same, centred at 560; computer the scene beside the flow, 560 + 480 in 1080 */
  @media (min-width: 720px) { .wrap { max-width:592px; } }
  @media (min-width: 1024px) {
    .wrap { max-width:1112px; grid-template-columns:minmax(0, 560px) minmax(0, 480px); justify-content:space-between; column-gap:40px; align-items:start; }
    .wrap > header { grid-column:1 / -1; }
    .wrap > .stage { grid-column:1; position:sticky; top:24px; }
    .wrap > .panel { grid-column:2; }
  }
  @media print {
    html, body { background:#fff !important; }
    body { display:block; }
    header, .stage, .who, #line, .np, footer, .ahh-menu { display:none !important; }
    .wrap { padding:0; max-width:none; display:block; }
    .panel { border:0; box-shadow:none; padding:0; background:#fff; display:block; }
    .book { border:0; box-shadow:none; padding:0; background:#fff; }
    .book .cover { height:150mm; display:flex; flex-direction:column; justify-content:center; break-after:page; page-break-after:always; }
    .book h2 { font-size:24pt; }
    .entry h3 { font-size:12.5pt; }
    .entry p { font-size:11.5pt; }
    .entry .n, .entry .d { font-size:8.5pt; }
  }
</style>
