<style>
/* Layout: one phone-width column, one screen per state: Popo's mahjong table in pixels, the host's line, the felt with four seats, wood buttons. */
:root {
  --page: #14101e; --check: rgba(0,0,0,.25);

  --amber: #f6b73c; --amber-ink: #1d130d; --line: #000;
  --felt: #2e6a4a; --felt-hi: #3a7d58; --tile: #fbf6e9; --tile-back: #1f8a62;
  --red: #c8303a; --blue: #2a5aa8; --green: #2a7a3a;
  --muted: #b8a890; --head: #fbeedd;
  --px: "Press Start 2P", ui-monospace, monospace;
  --vt: "VT323", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-monospace, monospace;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "Songti SC", serif;
  --bevel: inset -3px -3px 0 rgba(0,0,0,.38), inset 3px 3px 0 rgba(255,220,170,.16);

  --drop: 3px 3px 0 #000;
  color-scheme: dark;
}

:root[data-theme="light"] { --page: #e9dcc0; --check: rgba(120,80,40,.08); --muted: #6a5240; --head: #1d130d; color-scheme: light }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0 / 4px 4px, var(--page);
  color: var(--ink-on-wood); font-family: var(--vt); font-size: 20px; line-height: 1.2; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

}

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--px); font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.screen { display: flex; flex-direction: column; gap: 14px; }

.say canvas { width: 40px; height: 40px; image-rendering: pixelated; border: 2px solid #000; background: #2b1a10; }
.say .who { font-family: var(--px); font-size: 9px; color: var(--amber); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.say p { margin: 0; font-size: 21px; line-height: 1.15; color: var(--ink-on-wood); text-wrap: pretty; }
.say > div { min-width: 0; }
.card { background: var(--paper); color: var(--ink); border: 3px solid var(--line); box-shadow: var(--drop); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
h1 { font-family: var(--px); font-size: 20px; line-height: 1.4; color: var(--head); }
h2 { font-family: var(--px); font-size: 13px; line-height: 1.5; color: var(--ink); }
.sub { margin: 0; font-size: 22px; color: var(--muted); }
.hint { font-size: 18px; color: var(--ink-soft); margin: 0; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seatf { display: flex; align-items: center; gap: 8px; min-width: 0; }
.seatf label { font-family: var(--kai); font-size: 24px; color: var(--red); width: 26px; text-align: center; flex: none; font-weight: 700; }
input[type=text] {
  width: 100%; min-width: 0; box-sizing: border-box; font-family: var(--vt); font-size: 22px; line-height: 1.1; color: var(--ink);

.btn {
  -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
  min-height: 48px; border: 3px solid #000; border-radius: 0; background: var(--wood); color: var(--ink-on-wood);
  font-family: var(--vt); font-size: 22px; line-height: 1; padding: 0 16px; box-shadow: var(--bevel), var(--drop);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { background: var(--wood-hi); }
.btn:active { transform: translate(2px, 2px); box-shadow: var(--bevel), 1px 1px 0 #000; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.btn.pri { background: var(--amber); color: var(--amber-ink); box-shadow: var(--bevel-pri), var(--drop); }
.btn.pri:hover { background: #ffc95a; }
.btn.lg { min-height: 58px; font-size: 25px; }
.btn.wide { width: 100%; }
.btn.small { min-height: 40px; font-size: 19px; padding: 0 12px; }
.btn.quiet { background: transparent; color: var(--muted); box-shadow: none; border-color: transparent; font-size: 18px; min-height: 36px; align-self: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* the felt: four seats, six pairs */
.table { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto; box-sizing: border-box;
  background: repeating-conic-gradient(rgba(0,0,0,.06) 0 25%, transparent 0 50%) 0 0 / 6px 6px, var(--felt);
  border: 3px solid #000; box-shadow: inset 0 0 0 6px #5a3a22, inset 0 0 0 9px #000, var(--drop); }
.table svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.table .seat, .table .mid { z-index: 1; }
.seat { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 76px; max-width: 42%; min-height: 0; padding: 5px 8px 6px; background: var(--paper); color: var(--ink); font-size: 20px;
  box-shadow: inset -2px -2px 0 rgba(0,0,0,.15), 3px 3px 0 #000; }
.seat:hover { background: #f8efdc; }
.seat:active { transform: translate(calc(-50% + 2px), calc(-50% + 2px)); box-shadow: inset -2px -2px 0 rgba(0,0,0,.15), 1px 1px 0 #000; }
.seat .w { font-family: var(--kai); font-size: 17px; color: var(--red); line-height: 1; font-weight: 700; }
.seat .n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat[aria-pressed="true"] { background: var(--amber); box-shadow: inset 0 0 0 2px #fff, 3px 3px 0 #000; }
.seat[disabled] { cursor: default; opacity: 1; }
.s0 { left: 50%; top: 86%; } .s1 { left: 83%; top: 50%; } .s2 { left: 50%; top: 14%; } .s3 { left: 17%; top: 50%; }
.mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.tile { display: block; width: 64px; height: 88px; image-rendering: pixelated; image-rendering: crisp-edges; filter: drop-shadow(3px 3px 0 rgba(0,0,0,.45)); flex: none; }
.tile.mini { width: 32px; height: 44px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.3)); }
.tileb { all: unset; position: relative; display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tileb span { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-family: var(--vt); font-size: 22px; color: #fbeedd; text-shadow: 2px 2px 0 #000; }
.tileb:hover .tile { filter: drop-shadow(3px 3px 0 rgba(0,0,0,.45)) brightness(1.1); }
.tileb:active { transform: translate(2px, 2px); }
.tileb:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.flip { animation: flip .3s steps(5) both; }
@keyframes flip { from { transform: scaleX(0); } to { transform: none; } }
.wallrow { display: flex; justify-content: center; gap: 6px; }
.wallrow .tile.wall { width: 16px; height: 22px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
.q { font-size: 28px; line-height: 1.08; margin: 0; color: var(--ink); text-wrap: balance; }
.toast { min-height: 1.2em; margin: 0; text-align: center; font-size: 20px; color: var(--amber); }
.sets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sets li { display: flex; gap: 10px; align-items: center; padding-bottom: 8px; border-bottom: 2px dashed rgba(0,0,0,.18); }
.sets li:last-child { border-bottom: 0; padding-bottom: 0; }
.sets p { margin: 0; font-size: 20px; line-height: 1.12; min-width: 0; overflow-wrap: anywhere; }
.sets b { font-weight: 400; color: var(--red); }
.note { font-size: 19px; color: var(--ink-soft); margin: 0; min-height: 1.2em; }
#foot { padding-top: 6px; color: var(--muted); text-align: center; font-size: 16px; }
#foot a { color: inherit; }
/* phone face down */
#dark { position: fixed; inset: 0; background: #050308; z-index: 20; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); text-align: center; color: #8a7a6a; cursor: pointer; }
#dark canvas { width: 132px; height: 96px; image-rendering: pixelated; margin: 0 auto 14px; display: block; }
#dark p { font-size: 24px; margin: 0 0 10px; max-width: 22ch; }
#dark small { font-size: 16px; opacity: .6; }
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: in .25s steps(4) both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { .flip { animation: none; } }
:lang(zh) h1, :lang(zh-Hant) h1 { font-family: var(--vt); font-size: 32px; line-height: 1.1; }
:lang(zh) .brand, :lang(zh-Hant) .brand { font-family: var(--vt); font-size: 18px; }
.note:empty { display: none; }
:lang(zh-Hant) { --vt: "VT323", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", ui-monospace, monospace; }
.langm { position: relative; }
.tops { display: flex; gap: 8px; align-items: center; }
#sndBtn[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.langm .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--wood); border: 3px solid #000; box-shadow: var(--drop); display: grid; min-width: 150px; }
.langm .menu button { all: unset; cursor: pointer; padding: 10px 14px; font-family: var(--vt); font-size: 20px; color: var(--ink-on-wood); }
.langm .menu button[aria-checked="true"] { color: var(--amber); }
.langm .menu button:hover, .langm .menu button:focus-visible { background: var(--wood-hi); }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="brand" id="brand">Common Hand</span>
    <div class="tops"><button class="btn small" id="sndBtn" type="button" aria-pressed="true">♪</button><div class="langm"><button class="btn small" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false">EN</button><div class="menu" id="langMenu" role="menu" hidden></div></div></div>
  </div>

  <!-- home: who's at the table -->
  <section class="screen" data-s="home">
    <canvas class="scene" id="scHome" width="160" height="96" role="img" aria-label="Popo, Wei and Mei sit at a mahjong table with one stool empty; Miso sits on the table, Yuzu on the window sill, Mantou under the table."></canvas>
    <div class="stack">
      <h1 data-t="title">Common Hand</h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="say" id="sayHome"></div>
    <div class="card">
      <h2 data-t="seatsT"></h2>
      <div class="seats" id="seats"></div>
      <p class="hint" data-t="how"></p>
    </div>
    <button class="btn pri lg wide" id="wash" type="button" data-t="wash"></button>
  </section>

  <!-- play -->
  <section class="screen" data-s="play" hidden>
    <div class="wallrow" id="wall" role="img"></div>
    <div class="table" id="felt"></div>
    <p class="toast" id="toast" role="status"></p>
    <div class="say" id="sayPlay"></div>
    <div class="card" id="qcard"></div>
    <button class="btn quiet" id="reseat" type="button" data-t="reset"></button>
  </section>

  <!-- hand complete -->
  <section class="screen" data-s="done" hidden>
    <canvas class="scene" id="scDone" width="160" height="96" role="img" aria-label="The tiles tipped out on the table for washing; Popo, Wei and Mei pull up their stools and the animals settle down."></canvas>
    <h1 data-t="doneT"></h1>
    <p class="sub" data-t="doneSub"></p>
    <div class="card"><ul class="sets" id="sets"></ul></div>
    <div class="say" id="sayDone"></div>
    <div class="stack">
      <button class="btn pri lg wide" id="send" type="button" data-t="send"></button>
      <p class="note" id="sendNote" role="status"></p>
      <button class="btn wide" id="putDown" type="button" data-t="putDown"></button>
      <button class="btn quiet" id="again" type="button" data-t="again"></button>
    </div>
  </section>

  <!-- someone else's hand, opened from a link -->
  <section class="screen" data-s="recv" hidden>
    <canvas class="scene" id="scRecv" width="160" height="96" role="img" aria-label="Popo, Wei and Mei at the mahjong table with one stool empty."></canvas>
    <h1 data-t="recvT"></h1>
    <p class="sub" data-t="recvSub"></p>
    <div class="card"><ul class="sets" id="rsets"></ul></div>
    <div class="say" id="sayRecv"></div>
    <button class="btn pri lg wide" id="dealOwn" type="button" data-t="dealOwn"></button>
  </section>

  <footer id="foot"></footer>
</div>

<div id="dark" hidden role="button" tabindex="0">
  <div>
    <canvas id="scDark" width="66" height="48" aria-hidden="true"></canvas>
    <p id="darkLine"></p>
    <small data-t="tapWake"></small>
  </div>
</div>
