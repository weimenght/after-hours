/* Put It Back (town family, handoff/DESIGN.md): the living room in pixels beside one question at a time; the header is

:root {
  --page: #14101e; --check: rgba(0,0,0,.25);
  --wood: #3a2214; --wood-hi: #4d2e1a; --ink-on-wood: #fbeedd;

  --bevel: inset -3px -3px 0 rgba(0,0,0,.38), inset 3px 3px 0 rgba(255,220,170,.16);
  --bevel-pri: inset -3px -3px 0 rgba(0,0,0,.22), inset 3px 3px 0 rgba(255,255,255,.42);
  --drop: 3px 3px 0 #000;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --page: #e9dcc0; --check: rgba(120,80,40,.08); --muted: #6a5240; --head: #1d130d; --hd: #f3ead8; color-scheme: light } }
:root[data-theme="light"] { --page: #e9dcc0; --check: rgba(120,80,40,.08); --muted: #6a5240; --head: #1d130d; --hd: #f3ead8; color-scheme: light }
:lang(zh-Hant) { --vt: "VT323", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", ui-monospace, monospace; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0 / 4px 4px, var(--page);
  color: var(--ink-on-wood); font-family: var(--vt); font-size: 20px; line-height: 1.2; margin: 0; -webkit-font-smoothing: none;
}
/* ---- the header: [icon] name · ? ⋯ ---- */
.hd { position: sticky; top: 0; z-index: 15; background: var(--hd); border-bottom: 3px solid #000; padding-top: env(safe-area-inset-top, 0px); }

  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); max-width: 1080px; margin: 0 auto; }

.brand span { font-family: var(--px); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span.long { font-size: 9px; }
@media (min-width: 1024px) { .brand span.long { font-size: 11px; } }
.brand:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
:lang(zh) .brand span, :lang(zh-Hant) .brand span { font-family: var(--vt); font-size: 20px; letter-spacing: 0; }
.hdr { display: flex; gap: 8px; position: relative; }
.rb { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #000; background: var(--wood); color: var(--ink-on-wood);
  font-family: var(--vt); font-size: 26px; line-height: 1; box-shadow: var(--bevel), 2px 2px 0 #000; cursor: pointer; display: grid; place-items: center; padding: 0; -webkit-tap-highlight-color: transparent; }
.rb:hover { background: var(--wood-hi); } .rb:active { transform: translate(1px, 1px); box-shadow: var(--bevel), 1px 1px 0 #000; }
.rb:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; background: var(--wood); border: 3px solid #000; box-shadow: var(--drop); display: grid; min-width: 230px; padding: 4px 0; }

.menu .langs { display: grid; padding: 0 0 4px 12px; }
.menu .langs button { min-height: 40px; font-size: 20px; }

.scenecol { display: flex; flex-direction: column; gap: 12px; }
.flow { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

@supports (aspect-ratio: 1) { .stage { max-width: calc(40vh * 1.5); } }

.item { all: unset; position: absolute; cursor: pointer; z-index: 3; -webkit-tap-highlight-color: transparent;
  transition: left .75s cubic-bezier(.3,1.35,.5,1), top .75s cubic-bezier(.3,1.35,.5,1); }
.item::after { content: ""; position: absolute; inset: -14px; }

.item.loose { animation: wob 1.4s steps(2) infinite; }
.item.home { pointer-events: none; }
.item.home canvas { filter: none; }
.item:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.locked .item { pointer-events: none; }

.hot:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.hot.ready { z-index: 4; }
.say.bare { grid-template-columns: 1fr; }
.say .who:empty { display: none; }

.hot.ready:focus-visible { outline: 2px solid var(--amber); }

.puff { position: absolute; z-index: 6; font-family: var(--px); font-size: 9px; color: #c8303a; pointer-events: none; text-shadow: 1px 1px 0 #fff; animation: puff 1s steps(6) forwards; }
@keyframes puff { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }
.say { background: var(--wood); border: 3px solid var(--line); box-shadow: var(--bevel), var(--drop); padding: 10px 12px 12px; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; min-height: 64px; box-sizing: border-box; }
.say canvas { width: 40px; height: 40px; image-rendering: pixelated; border: 2px solid #000; background: #2b1a10; }
.say .who { font-family: var(--px); font-size: 9px; color: var(--amber); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
:lang(zh) .say .who, :lang(zh-Hant) .say .who { font-family: var(--vt); font-size: 17px; letter-spacing: 0; }
.say p { margin: 0; font-size: 21px; line-height: 1.15; color: var(--ink-on-wood); text-wrap: pretty; }
.say p i { color: #e8cfa8; }
.say > div { min-width: 0; }
.card { background: var(--paper); color: var(--ink); border: 3px solid var(--line); box-shadow: var(--drop); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
h1 { font-family: var(--px); font-size: 20px; line-height: 1.4; color: var(--head); }
h2 { font-family: var(--px); font-size: 15px; line-height: 1.5; color: var(--head); }
:lang(zh) h1, :lang(zh-Hant) h1 { font-family: var(--vt); font-size: 34px; line-height: 1.1; }
:lang(zh) h2, :lang(zh-Hant) h2 { font-family: var(--vt); font-size: 28px; line-height: 1.15; }
.sub { margin: 0; font-size: 21px; color: var(--muted); max-width: 640px; }
.lead { margin: 0; font-size: 22px; color: var(--head); }
.status { margin: 0; font-size: 20px; color: var(--amber); min-height: 1.2em; }
.btn {
  -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
  min-height: 48px; border: 3px solid #000; border-radius: 0; background: var(--wood); color: var(--ink-on-wood);
  font-family: var(--vt); font-size: 22px; line-height: 1; padding: 0 16px; box-shadow: var(--bevel), var(--drop);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box;
}
.btn:hover { background: var(--wood-hi); }
.btn:active { transform: translate(2px, 2px); box-shadow: var(--bevel), 1px 1px 0 #000; }
.btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.btn.pri { background: var(--amber); color: var(--amber-ink); box-shadow: var(--bevel-pri), var(--drop); }
.btn.pri:hover { background: #ffc06a; }
.btn.lg { min-height: 58px; font-size: 25px; }
.btn.wide { width: 100%; }

.acts { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

.opt { -webkit-appearance: none; appearance: none; text-align: left; background: var(--paper); color: var(--ink); border: 3px solid #000; box-shadow: var(--drop); padding: 10px 14px; min-height: 60px; cursor: pointer; font-family: var(--vt); display: flex; flex-direction: column; justify-content: center; gap: 2px; }

.opt:hover { background: #fbf3e2; }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.opt:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.opt[aria-pressed="true"] { background: var(--amber); }

.invite { background: #e8d3ae; color: var(--ink); border: 3px solid #000; box-shadow: var(--drop); padding: 12px 14px; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.invite canvas { width: 56px; height: auto; image-rendering: pixelated; }
.invite p { margin: 0; font-size: 23px; line-height: 1.1; }

  width: 100%; min-width: 0; box-sizing: border-box; font-family: var(--vt); font-size: 23px; line-height: 1.1; color: var(--ink);
  background: #fffaf0; border: 3px solid #000; border-radius: 0; padding: 10px; box-shadow: inset 2px 2px 0 rgba(0,0,0,.12);

.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(8,6,12,.6); display: grid; place-items: center; padding: 16px; }

acc); }html.ahp-town .recipe .pin { border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.25); }html.ahp-town .langm .menu, html.ahp-town .toast, html.ahp-town #toast { background: var(--ahp-card) !important; color: var(--ahp-ink) !important; border: 1px solid var(--ahp-line) !important; border-radius: 14px; box-shadow: var(--ahp-shadow) !important; }html.ahp-town .langm .menu button { color: var(--ahp-ink); }html.ahp-town .langm .menu button[aria-checked="true"] { color: var(--ahp-accd); }html.ahp-town .sheet > :is(.in, .card, div:first-child) { border-radius: 22px 22px 0 0; }@media (min-width: 720px) { html.ahp-town .sheet > :is(.in, .card, div:first-child) { border-radius: 22px; } }html.ahp-town #dark, html.ahp-town #dark * { border-radius: 0; }html.ahp-town #dark { background: #0d0a08 !important; color: #efe5d4; }html.ahp-paper:root:root {--bg: var(--ahp-bg); --bg2: var(--ahp-bg2); --card: var(--ahp-card); --panel: var(--ahp-card); --line: var(--ahp-line);}html.ahp-ink:root:root { --ink: var(--ahp-ink); --ink2: var(--ahp-ink2); --soft: var(--ahp-ink2); }html.ahp-pg:root:root { --paper: var(--ahp-bg); --paper2: var(--ahp-bg2); --field: var(--ahp-field); --dot: transparent; }html.ahp-pc:root:root { --paper: var(--ahp-card); --paper2: var(--ahp-bg2); }html.skin-ah .ahh { --ahh-bg: var(--ahp-card); --ahh-ink: var(--ahp-ink); --ahh-line: var(--ahp-line); --ahh-name: var(--ahp-say); }html.skin-ah .ahh .ahh-nm { font-family: var(--ahp-say) !important; font-size: 20px !important; font-weight: 600 !important; text-transform: none !important; letter-spacing: 0 !important; line-height: 1.2 !important; }html.skin-ah .ahh .ahh-b { border-radius: 999px !important; border: 1px solid var(--ahp-line2) !important; background: var(--ahp-card) !important; color: var(--ahp-ink) !important; box-shadow: none !important; font-family: var(--ahp-ui) !important; font-size: 17px !important; width: 44px; height: 44px; padding: 0; }html.skin-ah .ahh .ahh-b:hover { background: var(--ahp-bg2) !important; }html.skin-ah .ahh .ahh-ic img { image-rendering: auto; }html.ahp-town :is(.top, header.top) { background: transparent !important; border: 0 !important; box-shadow: none !important; }html.skin-ah{--ahp-acc:#B5762A}</style></head>
<body>
<header class="hd">
  <div class="hdin">
    <button class="brand" id="brand" type="button"><img id="brandIcon" src="./icon.svg" alt=""><b class="bk" id="brandBack" hidden aria-hidden="true">‹</b><span id="brandName">Put It Back</span></button>
    <div class="hdr">
      <button class="rb" id="helpBtn" type="button">?</button>
      <button class="rb" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false">⋯</button>
      <div class="menu" id="moreMenu" role="menu" hidden></div>
    </div>
  </div>
</header>

<main class="main">
  <div class="scenecol">
    <div class="stage" id="stage" role="group">
      <canvas class="room" id="room" width="192" height="128" role="img"></canvas>
    </div>
    <div class="say" id="say"></div>
  </div>

  <div class="flow">
    <!-- home -->
    <section data-s="home">
      <div class="flow">
        <h1 data-t="title">Put It Back</h1>
        <p class="sub" data-t="sub"></p>
        <div class="acts"><button class="btn pri lg wide" id="startBtn" type="button" data-t="start"></button></div>
      </div>
    </section>

    <!-- the room -->
    <section data-s="room" hidden>
      <div class="flow">
        <h2 id="roomQ" data-t="hint"></h2>
        <p class="status" id="roomStatus" role="status"></p>
        <div class="acts"><button class="btn pri lg wide" id="turnBtn" type="button" data-t="yourTurn" hidden></button></div>
      </div>
    </section>

    <!-- one spot -->
    <section data-s="spot" hidden>
      <div class="flow">
        <h2 data-t="spotQ"></h2>
        <p class="sub" data-t="spotSub"></p>
        <div class="rows" id="spots"></div>
      </div>
    </section>

    <!-- whose things -->
    <section data-s="whose" hidden>
      <div class="flow">
        <h2 data-t="whoseQ"></h2>
        <p class="lead" data-t="whose1"></p>
        <p class="sub" data-t="whose2"></p>
        <div class="acts"><button class="btn pri lg wide" id="whoseOk" type="button" data-t="ok"></button></div>
      </div>
    </section>

    <!-- how long -->
    <section data-s="time" hidden>
      <div class="flow">
        <h2 data-t="timeQ"></h2>
        <div class="rows">
          <button class="opt" type="button" data-len="song"><b data-t="song"></b><span data-t="songD"></span></button>
          <button class="opt" type="button" data-len="ten"><b data-t="ten"></b><span data-t="tenD"></span></button>
        </div>
      </div>
    </section>

    <!-- the song -->
    <section data-s="song" hidden>
      <div class="flow">
        <h2 data-t="songQ"></h2>
        <p class="sub" data-t="songSub"></p>
        <div class="cue" id="cue" aria-live="polite"></div>
        <div class="acts">
          <button class="btn pri lg wide" id="gotOne" type="button" data-t="gotOne"></button>
          <button class="btn quiet" id="anotherCue" type="button" data-t="another"></button>
        </div>
      </div>
    </section>

    <!-- with someone -->
    <section data-s="invite" hidden>
      <div class="flow">
        <h2 data-t="inviteQ"></h2>
        <p class="sub" data-t="inviteSub"></p>
        <div class="invite"><canvas id="invPic" width="22" height="16" aria-hidden="true"></canvas><p id="inviteText"></p></div>
        <p class="status" id="sendNote" role="status"></p>
        <div class="acts">
          <button class="btn pri lg wide" id="goBtn" type="button" data-t="begin"></button>
          <button class="btn wide" id="sendBtn" type="button" data-t="sendIt"></button>
        </div>
      </div>
    </section>

    <!-- how does it look -->
    <section data-s="check" hidden>
      <div class="flow">
        <h2 data-t="checkQ"></h2>
        <div class="rows">
          <button class="opt" type="button" data-check="nicer"><b data-t="nicer"></b><span data-t="nicerD"></span></button>
          <button class="opt" type="button" data-check="same"><b data-t="same"></b><span data-t="sameD"></span></button>
          <button class="opt" type="button" data-check="found"><b data-t="found"></b><span data-t="foundD"></span></button>
        </div>
      </div>
    </section>

    <!-- what turned up -->
    <section data-s="found" hidden>
      <div class="flow">
        <h2 data-t="foundQ"></h2>
        <p class="sub" data-t="foundSub"></p>
        <input type="text" id="foundIn" maxlength="80" autocomplete="off" enterkeyhint="done">
        <div class="acts">
          <button class="btn pri lg wide" id="keepBtn" type="button" data-t="keepIt"></button>
          <button class="btn quiet" id="skipBtn" type="button" data-t="skip"></button>
        </div>
      </div>
    </section>

    <!-- the end: off the screen -->
    <section data-s="done" hidden>
      <div class="flow">
        <h1 id="doneT"></h1>
        <p class="lead" id="doneLine"></p>
        <div class="acts"><button class="btn pri lg wide" id="putDown" type="button" data-t="putDown"></button></div>
      </div>
    </section>

    <!-- the found drawer -->
    <section data-s="drawer" hidden>
      <div class="flow">
        <h2 data-t="drawerT"></h2>
        <p class="sub" data-t="drawerSub"></p>
        <div class="card"><ul class="drawer" id="drawerList"></ul></div>
        <div class="acts"><button class="btn wide" id="closeDrawer" type="button" data-t="closeDrawer"></button></div>
      </div>
    </section>

    <!-- an invitation from a link -->
    <section data-s="recv" hidden>
      <div class="flow">
        <h2 id="recvT"></h2>
        <p class="sub" id="recvSub"></p>
        <p class="status" id="recvNote" role="status"></p>
        <div class="acts">
          <button class="btn pri lg wide" id="recvYes" type="button" data-t="recvSay"></button>
          <button class="btn quiet" id="recvOwn" type="button" data-t="recvOwn"></button>
        </div>
      </div>
    </section>
  </div>
</main>
<footer id="foot"></footer>

<div id="go" hidden>
  <div class="in">
    <p class="big" id="goT"></p>
    <p class="dim" id="goLine"></p>
    <p class="clock" id="goClock" aria-live="off"></p>
    <div class="grow"></div>
    <button class="btn quiet" id="backBtn" type="button" data-t="back2"></button>
  </div>

  song: function () { lock(); $("cue").textContent = T(W.CUES[cueI % W.CUES.length]); var s = speaker(W.songLines, ["wei", "popo", "mei", "cats"]); say(s && s.w, s && s.t); },
  invite: function () {
    lock(); say(null); $("inviteText").textContent = inviteText();
    var c = $("invPic"), g = c.getContext("2d"); g.clearRect(0, 0, 22, 16); drawPet(g, "mantou", 11, 16, 1, { flip: true });
  },
  check: function () { lock(); say(null); },
  found: function () { lock(); $("foundIn").placeholder = t("foundPh"); var s = speaker(W.foundLines, ["mei", "popo", "wei", "cats"]); say(s && s.w, s && s.t); },
  done: function () { lock(); trail = ["home"]; doneWords(); say(null); },
  drawer: function () { lock(); say(null); drawerList(); },
  recv: function () {
    lock(); var sp = spotOf(recv.s);
    $("recvT").textContent = t("recvT", { n: recv.n || t("recvSome"), s: T(sp.s) });
    $("recvSub").textContent = t("recvSub", { l: recv.l === "ten" ? t("ten") : t("song") });
    var s = speaker(W.recvLines); say(s && s.w, s && s.t);
  }
};
function lock() { $("stage").classList.add("locked"); }
function spotOf(k) { return W.SPOTS.filter(function (x) { return x.k === k; })[0] || W.SPOTS[0]; }
function lenWord(l) { return l === "ten" ? t("ten") : t("song"); }
function inviteText() { return t("inviteText", { s: T(spotOf(S.spot).s), l: lenWord(S.len) }); }

/* ---------- the invitation (a link; nothing stored anywhere but the link) ---------- */
function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64d(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }
function home() { return /(^|\.)after-hours\.work$/.test(location.hostname) ? "https://www.after-hours.work/put-it-back/" : location.href.split("#")[0]; }
function nick() { try { return (localStorage.getItem("fb_nick") || "").trim().slice(0, 24); } catch (e) { return ""; } }
function inviteLink() { var o = { v: 1, s: S.spot || "shelf", l: S.len || "song" }, n = nick(); if (n) o.n = n; return home() + "#t=" + b64e(JSON.stringify(o)); }
function readInvite() {
  var m = /[#&]t=([A-Za-z0-9_-]+)/.exec(location.hash); if (!m) return null;
  try { var o = JSON.parse(b64d(m[1])); if (!o || o.v !== 1) return null;
    return { s: W.SPOTS.some(function (x) { return x.k === o.s; }) ? o.s : "shelf", l: o.l === "ten" ? "ten" : "song", n: typeof o.n === "string" ? o.n.slice(0, 24) : "" };
  } catch (e) { return null; }
}
function copy(text, note) {
  var done = function () { note.textContent = t("copied"); return true; };
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(done, function () { return manual(text, note); }); } catch (e) {}
  return manual(text, note);
}
function manual(text, note) {
  var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "width:100%;box-sizing:border-box;min-height:110px;font:20px var(--vt);border:3px solid #000;padding:8px";
  note.textContent = ""; note.appendChild(ta); ta.select(); return false;
}
function shareOut(text, note, card) {
  var c = card && window.FBShare && FBShare.card(card); if (c) return c;   /* the share card: a picture with a QR for WeChat, or WhatsApp */
  if (navigator.share) return navigator.share({ text: text }).then(function () { return true; }, function (e) { return e && e.name === "AbortError" ? false : copy(text, note); });
  return copy(text, note);
}
function sendInvite() {
  var link = inviteLink(), text = inviteText() + " " + link;
  shareOut(text, $("sendNote"), { text: inviteText() + " " + link, app: t("title"), mascots: ["mantou", "yuzu", "miso"], fallback: function () { return copy(text, $("sendNote")); } });
}

/* ---------- go: the phone stays here ---------- */
function startGo(o) {
  S.go = { s: o.s, l: o.l, end: o.l === "ten" ? Date.now() + 10 * 60000 : 0, at: Date.now() }; save(); openGo();
}
function openGo() {
  var g = S.go; if (!g) return; cur = "go";
  $("go").hidden = false; $("goT").textContent = t("goT");
  var sp = T(spotOf(g.s).s); $("goLine").textContent = g.l === "ten" ? t("goTen", { s: sp }) : t("goSong", { s: sp });
  $("backBtn").textContent = t("back2");
  clearInterval(ticker); $("goClock").textContent = "";
  if (g.l === "ten") { tick(); ticker = setInterval(tick, 1000); }
}
function tick() {
  var g = S.go; if (!g) return; var s = Math.max(0, Math.round((g.end - Date.now()) / 1000));
  $("goClock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  if (s <= 0) { clearInterval(ticker); sfx("chime"); closeGo(); }
}
function closeGo() { clearInterval(ticker); S.go = null; save(); $("go").hidden = true; cur = "check"; trail = ["home"]; show("check", false); }

/* ---------- the end ---------- */
var outcome = "nicer", foundText = "";
function doneWords() {
  $("doneT").textContent = outcome === "found" ? t("doneFoundT") : outcome === "same" ? t("doneSameT") : t("doneNicerT");
  $("doneLine").textContent = outcome === "found" ? t("doneFound", { x: foundText }) : outcome === "same" ? t("doneSame") : t("doneNicer");
}
function sceneDark(c) {
  var g = c.getContext("2d"); g.fillStyle = "#050308"; g.fillRect(0, 0, 66, 48);
  drawPet(g, "miso", 16, 40, 1, { asleep: true }); drawPet(g, "yuzu", 34, 40, 1, { asleep: true, flip: true }); drawPet(g, "mantou", 52, 42, 1, { asleep: true, flip: true });
  g.fillStyle = "#3a3448"; g.fillRect(28, 20, 1, 1); g.fillRect(30, 17, 2, 1); g.fillRect(33, 13, 3, 1);
}
function drawerList() {
  var ul = $("drawerList"); ul.textContent = "";
  if (!S.found.length) { var e = document.createElement("li"); e.innerHTML = "<p>" + esc(t("drawerEmpty")) + "</p>"; ul.appendChild(e); return; }
  S.found.forEach(function (f, i) {
    var li2 = document.createElement("li"), sp = spotOf(f.s);
    li2.innerHTML = "<div><p>" + esc(f.t) + "</p><small>" + esc(f.d) + " · " + esc(T(sp.s)) + "</small></div>";
    var b = document.createElement("button"); b.type = "button"; b.className = "btn quiet"; b.textContent = t("takeOut");
    b.onclick = function () { S.found.splice(i, 1); save(); drawerList(); }; li2.appendChild(b); ul.appendChild(li2);
  });
}

/* ---------- the header's two buttons ---------- */
function stepIcon(k) {
  var c = document.createElement("canvas"); c.width = 16; c.height = 16; var g = c.getContext("2d");
  if (k === 0) { g.fillStyle = "#e8d3ae"; g.fillRect(0, 0, 16, 16); var m = itemCanvas("glasses"); g.drawImage(m, 3, 6); }
  else if (k === 1) { var r = itemCanvas("record"); g.drawImage(r, 4, 4); }
  else drawPet(g, "mantou", 8, 15, .6, { asleep: true });
  return c;
}
function openHelp() {
  var ol = $("steps"); ol.textContent = "";
  ["h1", "h2", "h3"].forEach(function (k, i) { var li2 = document.createElement("li"); li2.appendChild(stepIcon(i)); var sp = document.createElement("span"); sp.textContent = t(k); li2.appendChild(sp); ol.appendChild(li2); });
  $("helpT").textContent = t("help"); $("helpOk").textContent = t("gotIt");
  $("helpSheet").hidden = false; $("helpOk").focus();
}
function closeHelp() { $("helpSheet").hidden = true; S.seen = 1; save(); $("helpBtn").focus({ preventScroll: true }); }
function closeMore() { $("moreMenu").hidden = true; $("moreBtn").setAttribute("aria-expanded", "false"); }
function openMore() {
  var m = $("moreMenu"); m.textContent = "";
  function item(label, right, fn, tag) { var b = document.createElement(tag || "button"); if (!tag) b.type = "button"; b.setAttribute("role", "menuitem"); b.innerHTML = "<span>" + esc(label) + "</span>" + (right ? "<small>" + esc(right) + "</small>" : ""); if (fn) b.onclick = fn; m.appendChild(b); return b; }
  item(t("drawerM"), "", function () { closeMore(); show("drawer"); });
  item(t("sound"), SND ? t("on") : t("off"), function (e) { e.stopPropagation(); SND = !SND; try { localStorage.setItem("pb_snd", SND ? "1" : "0"); } catch (x) {} if (SND) sfx("tap"); openMore(); });
  var lb = item(t("lang"), LNAMES[li()], function (e) { e.stopPropagation(); var L = m.querySelector(".langs"); L.hidden = !L.hidden; });
  lb.setAttribute("aria-haspopup", "true");
  var L = document.createElement("div"); L.className = "langs"; L.hidden = true;
  LANGS.forEach(function (l, i) { var b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", String(i === li())); b.lang = l; b.textContent = LNAMES[i];
    b.onclick = function () { if (window.FBL) FBL.set(l); else document.documentElement.lang = l; closeMore(); render(); }; L.appendChild(b); });
  m.appendChild(L);
  var pv = item(t("privacy"), "", null, "a"); pv.href = "/privacy/";
  if (window.FBC && FBC.head && FBC.head.more) { var ah = item(FBC.t(FBC.head.more) + " \u203a", "", null, "a"); ah.href = "/app/"; }   /* the way to the rest, as in every app's \u22ef */
  m.hidden = false; $("moreBtn").setAttribute("aria-expanded", "true"); m.firstChild.focus();
}
function foot() {
  var f = $("foot"); if (!f || f.hidden) return;
  var _k = function (k, d) { return window.FBC && FBC.W && FBC.W[k] ? FBC.t(FBC.W[k]) : d; };
  var x = "<span>" + esc(_k("fDevice", t("device"))) + '</span><a href="https://www.after-hours.work/?fbl=' + LANGS[li()] + '" target="_blank" rel="noopener">' + esc(_k("fAh", t("ah"))) + "</a>";
  if (window.FBC && FBC.foot) FBC.foot(f, { px: 1, extra: x }); else f.innerHTML = x;
}

/* ---------- wiring ---------- */
$("brand").onclick = function () { if (cur === "home") return; back(); };
$("helpBtn").onclick = openHelp; $("helpOk").onclick = closeHelp;
$("helpSheet").onclick = function (e) { if (e.target === $("helpSheet")) closeHelp(); };
$("moreBtn").onclick = function (e) { e.stopPropagation(); if (!$("moreMenu").hidden) closeMore(); else openMore(); };
document.addEventListener("click", function (e) { if (!e.target.closest || !e.target.closest(".hdr")) closeMore(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeMore(); if (!$("helpSheet").hidden) closeHelp(); } });
addEventListener("fbl:lang", function () { render(); });
$("startBtn").onclick = function () { sfx("tap"); if (room.returns || room.all) { freshRoom(true); buildItems(); } show("room"); };
$("turnBtn").onclick = function () { show("spot"); };
$("whoseOk").onclick = function () { show("time"); };
document.querySelectorAll("[data-len]").forEach(function (b) { b.onclick = function () { sfx("tap"); S.len = b.getAttribute("data-len"); save(); if (S.len === "song") { cueI = (Math.random() * W.CUES.length) | 0; show("song"); } else show("invite"); }; });
$("anotherCue").onclick = function () { sfx("tap"); cueI++; $("cue").textContent = T(W.CUES[cueI % W.CUES.length]); };
$("gotOne").onclick = function () { show("invite"); };
$("sendBtn").onclick = sendInvite;
$("goBtn").onclick = function () { sfx("tap"); startGo({ s: S.spot || "shelf", l: S.len || "song" }); };
$("backBtn").onclick = closeGo;
document.querySelectorAll("[data-check]").forEach(function (b) { b.onclick = function () {
  outcome = b.getAttribute("data-check"); if (outcome === "found") { $("foundIn").value = ""; show("found"); setTimeout(function () { $("foundIn").focus(); }, 300); } else show("done"); }; });
$("keepBtn").onclick = function () {
  var v = $("foundIn").value.trim().slice(0, 80);
  if (v) { var d = new Date(); S.found.unshift({ t: v, s: S.spot || "shelf", d: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }); S.found = S.found.slice(0, 60); save(); foundText = v; }
  else outcome = "nicer";
  show("done");
};
$("foundIn").onkeydown = function (e) { if (e.key === "Enter") $("keepBtn").click(); };
$("skipBtn").onclick = function () { outcome = "nicer"; show("done"); };
$("closeDrawer").onclick = function () { back(); };
$("putDown").onclick = function () { sceneDark($("scDark")); $("darkLine").textContent = t("lights"); $("dark").hidden = false; };
function wakeUp() { $("dark").hidden = true; trail = []; show("home", false); }
$("dark").onclick = wakeUp; $("dark").onkeydown = function (e) { if (e.key === "Enter" || e.key === " " || e.key === "Escape") wakeUp(); };
$("recvYes").onclick = function () {
  var text = t("recvReply");
  Promise.resolve(shareOut(text, $("recvNote"), null)).then(function (ok) { if (ok !== false) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} S.spot = recv.s; S.len = recv.l; save(); startGo(recv); } });
};
$("recvOwn").onclick = function () { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} recv = null; show("home"); };
document.addEventListener("visibilitychange", function () { if (!document.hidden && cur === "go") { if (S.go && S.go.l === "ten") tick(); } else if (!document.hidden) drawRoom(); });

/* offline copy (sw.js: network first, own files only); a new version reloads an open page once */
if ("serviceWorker" in navigator && window.isSecureContext) addEventListener("load", function () {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
    document.addEventListener("visibilitychange", function () { if (!document.hidden) reg.update().catch(function () {}); });
  }).catch(function () {});
});

/* ---------- start ---------- */
freshRoom(false); buildItems(); animate();
recv = readInvite();
var g0 = S.go, alive = g0 && (g0.l === "ten" ? g0.end > Date.now() - 60000 : Date.now() - g0.at < 45 * 60000);
if (recv) show("recv", false);
else if (alive) { show("home", false); openGo(); if (g0.l === "ten" && g0.end <= Date.now()) closeGo(); }
else { if (g0) { S.go = null; save(); } show("home", false); }
if (!S.seen && !recv && !alive) setTimeout(openHelp, 400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });
window.PB = { W: W, state: function () { return S; }, room: function () { return room; }, show: show, screen: function () { return cur; }, send: function (id) { var it = itemOf(id); if (it) sendHome(it); }, lift: liftYuzu, poke: poke, visit: function () { return visit(); }, go: function () { return S.go; } };
})();
</script>
