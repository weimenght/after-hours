<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="same-origin"><title>after-hours</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#120F18;color:#ECEBE6}a{color:#F2A33A}</style></head><body><p><a href="/">after-hours</a></p>
<script>(function(){var h=location.hash.slice(1),q={};h.split("&").forEach(function(p){var i=p.indexOf("=");if(i>0)q[p.slice(0,i)]=p.slice(i+1)});
var to="/";try{to=decodeURIComponent(q.to||"/")}catch(e){}if(!/^\/(?!\/)/.test(to))to="/";
try{if(q.s){var js=decodeURIComponent(escape(atob(q.s.replace(/-/g,"+").replace(/_/g,"/"))));var s=JSON.parse(js),n=0,had=localStorage.getItem("fb_device_key");
for(var k in s){if(localStorage.getItem(k)===null){localStorage.setItem(k,s[k]);n++}}
if(had&&s.fb_device_key&&s.fb_device_key!==had){var old=[];try{old=JSON.parse(localStorage.getItem("fb_keys_old")||"[]")}catch(e){}old.unshift({d:s.fb_device_key,b:s.dogeared_key||""});localStorage.setItem("fb_keys_old",JSON.stringify(old.slice(0,5)))}
if(n)sessionStorage.setItem("fb_moved",String(n))}}catch(e){}
location.replace(to)})()</script></body></html>
