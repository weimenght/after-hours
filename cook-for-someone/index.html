<head>

<meta name="theme-color" content="#14101e" media="(prefers-color-scheme: dark)">

<style>
/* The town's pixel look, shared with Along the Way: one phone-width column, one screen per state. */

/* Layout: one phone-width column, one screen per state: the pixel scene, the host's line, a paper card, wood buttons. */
:root {
  --page: #14101e; --check: rgba(0,0,0,.25);
  --wood: #3a2214; --wood-hi: #4d2e1a; --ink-on-wood: #fbeedd;
  --paper: #f3ead8; --paper-2: #e8dcc2; --ink: #1d130d; --ink-soft: #6a5240;
  --amber: #f6b73c; --amber-ink: #1d130d; --teal: #1f6f62; --rose: #c8303a; --line: #000;
  --muted: #b8a890; --head: #fbeedd;
  --px: "Press Start 2P", ui-monospace, monospace;
  --vt: "VT323", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-monospace, monospace;
  --bevel: inset -3px -3px 0 rgba(0,0,0,.38), inset 3px 3px 0 rgba(255,220,170,.16);
  --bevel-pri: inset -3px -3px 0 rgba(0,0,0,.22), inset 3px 3px 0 rgba(255,255,255,.42);
  --drop: 3px 3px 0 #000;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --page: #e9dcc0; --check: rgba(120,80,40,.08); --muted: #6a5240; --head: #1d130d; color-scheme: light } }
:root[data-theme="light"] { --page: #e9dcc0; --check: rgba(120,80,40,.08); --muted: #6a5240; --head: #1d130d; color-scheme: light }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0 / 4px 4px, var(--page);
  color: var(--ink-on-wood); font-family: var(--vt); font-size: 20px; line-height: 1.2;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px; -webkit-font-smoothing: none;
}
#app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { --ahh-bg: var(--paper); --ahh-ink: var(--ink); --ahh-line: var(--line); }
.top .ahh-ic img { width: 100%; height: 100%; image-rendering: pixelated; }
html:lang(zh) .top .ahh-nm, html:lang(zh-Hant) .top .ahh-nm { font: 700 18px/1.2 var(--vt); letter-spacing: .1em; }
.brand { font-family: var(--px); font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.screen { display: flex; flex-direction: column; gap: 14px; }
.scene { width: 100%; aspect-ratio: 160 / 96; max-width: 100%; display: block; image-rendering: pixelated; border: 3px solid var(--line); box-shadow: var(--drop); background: #2a1c30; }
.say { background: var(--wood); border: 3px solid var(--line); box-shadow: var(--bevel), var(--drop); padding: 10px 12px 12px; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.say canvas { width: 40px; height: 40px; image-rendering: pixelated; border: 2px solid #000; background: #2b1a10; }
.say .who { font-family: var(--px); font-size: 9px; color: var(--amber); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.say p { margin: 0; font-size: 21px; line-height: 1.15; color: var(--ink-on-wood); text-wrap: pretty; min-width: 0; }
.card { background: var(--paper); color: var(--ink); border: 3px solid var(--line); box-shadow: var(--drop); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
h1 { font-family: var(--px); font-size: 20px; line-height: 1.4; color: var(--head); }
h2 { font-family: var(--px); font-size: 13px; line-height: 1.5; color: var(--ink); }
.sub { margin: 0; font-size: 22px; color: var(--muted); }
.lbl { font-family: var(--px); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.lbl i { width: 10px; height: 10px; border: 2px solid #000; display: inline-block; }
.hint { font-size: 18px; color: var(--ink-soft); margin: 0; }
textarea, input[type=text] {
  width: 100%; box-sizing: border-box; font-family: var(--vt); font-size: 22px; line-height: 1.1; color: var(--ink);
  background: #fffaf0; border: 3px solid #000; border-radius: 0; padding: 8px 10px; resize: none; box-shadow: inset 2px 2px 0 rgba(0,0,0,.12);
}
textarea { min-height: 64px; }
textarea:focus, input:focus { outline: 3px solid var(--amber); outline-offset: 1px; }
.btn {
  -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
  min-height: 48px; border: 3px solid #000; border-radius: 0; background: var(--wood); color: var(--ink-on-wood);
  font-family: var(--vt); font-size: 22px; line-height: 1; padding: 0 16px; box-shadow: var(--bevel), var(--drop);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { background: var(--wood-hi); }
.btn:active { transform: translate(2px, 2px); box-shadow: var(--bevel), 1px 1px 0 #000; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.btn.pri { background: var(--amber); color: var(--amber-ink); box-shadow: var(--bevel-pri), var(--drop); }
.btn.pri:hover { background: #ffc95a; }
.btn.lg { min-height: 58px; font-size: 25px; }
.btn.wide { width: 100%; }
.btn.small { min-height: 40px; font-size: 19px; padding: 0 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.mood { min-width: 0; min-height: 0; padding: 8px 0 6px; overflow: hidden; flex-direction: column; gap: 6px; font-size: 16px; background: var(--paper-2); color: var(--ink); box-shadow: inset -2px -2px 0 rgba(0,0,0,.15), 2px 2px 0 #000; border-width: 2px; }
.mood:hover { background: #f8efdc; }
.mood canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.mood[aria-pressed="true"] { background: var(--amber); box-shadow: inset 0 0 0 2px #fff, 2px 2px 0 #000; }
.steps { display: flex; gap: 6px; justify-content: center; }
.steps i { width: 10px; height: 10px; background: var(--wood); border: 2px solid #000; }
.steps i.on { background: var(--amber); }
.thx { display: grid; gap: 8px; padding-top: 10px; border-top: 2px dashed rgba(0,0,0,.2); }
.thx:first-of-type { border-top: 0; padding-top: 0; }
/* the road */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dn { font-family: var(--px); font-size: 7px; text-align: center; color: var(--ink-soft); padding-bottom: 2px; }
.cal .d { aspect-ratio: 1; background: var(--paper-2); border: 2px solid rgba(0,0,0,.25); display: grid; place-items: center; position: relative; }
.cal .d canvas { width: 70%; height: 70%; image-rendering: pixelated; }
.cal .d.today { border-color: #000; }
.cal .d.future { opacity: .35; }
.cal .d span { position: absolute; top: 1px; left: 3px; font-size: 13px; color: var(--ink-soft); }
.ranges { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 40px; font-size: 19px; padding: 0 12px; background: var(--paper-2); color: var(--ink); border-width: 2px; box-shadow: 2px 2px 0 #000; }
.chip[aria-pressed="true"] { background: var(--amber); }
.entry { background: var(--paper); color: var(--ink); border: 3px solid #000; box-shadow: var(--drop); padding: 12px 14px; display: grid; gap: 8px; }
.entry-h { display: flex; align-items: center; gap: 10px; }
.entry-h canvas { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.entry-h b { font-family: var(--px); font-size: 10px; font-weight: 400; line-height: 1.5; }
.entry-h small { display: block; font-size: 18px; color: var(--ink-soft); }
.entry-h .grow { flex: 1; min-width: 0; }
.ln { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: baseline; }
.ln .k { font-family: var(--px); font-size: 8px; letter-spacing: .06em; text-transform: uppercase; }
.ln p { margin: 0; font-size: 20px; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
.k.r { color: var(--rose); } .k.t { color: #5a6a3a; } .k.b { color: var(--teal); } .k.w { color: #a0601a; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #f8e2d8; border: 2px solid #000; padding: 8px; }
.confirm p { margin: 0; flex: 1 1 100%; font-size: 19px; }
.empty { text-align: center; padding: 18px 10px; }
.note { font-size: 19px; color: var(--ink-soft); margin: 0; min-height: 1.2em; }
.foot { text-align: center; font-size: 16px; color: var(--muted); padding-top: 6px; }
.foot a { color: inherit; }
/* lights out */
#dark { position: fixed; inset: 0; background: #050308; z-index: 20; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); text-align: center; color: #8a7a6a; cursor: pointer; }
#dark canvas { width: 132px; height: 96px; image-rendering: pixelated; margin: 0 auto 14px; display: block; }
#dark p { font-size: 24px; margin: 0 0 10px; max-width: 22ch; }
#dark small { font-size: 16px; opacity: .6; }
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: in .25s steps(4) both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
  :lang(zh-Hant) { --vt: "VT323", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", ui-monospace, monospace; }
  .langm { position: relative; }
  .langm .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--wood); border: 3px solid #000; box-shadow: var(--drop); display: grid; min-width: 150px; }
  .langm .menu button { all: unset; cursor: pointer; padding: 10px 14px; font-family: var(--vt); font-size: 20px; color: var(--ink-on-wood); }
  .langm .menu button[aria-checked="true"] { color: var(--amber); }
  .langm .menu button:hover, .langm .menu button:focus-visible { background: var(--wood-hi); }
  #foot { padding-top: 6px; color: var(--muted); }

/* Cook for Someone */
.tags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tags .chip { min-height: 48px; justify-content: flex-start; text-align: left; padding: 6px 12px; line-height: 1; }
.tags .chip.any { grid-column: 1 / -1; justify-content: center; background: var(--wood); color: var(--ink-on-wood); box-shadow: var(--bevel), 2px 2px 0 #000; }
.recipe { gap: 10px; position: relative; }
.recipe h2 { font-size: 15px; line-height: 1.45; padding-right: 26px; }
.recipe .meta { display: grid; gap: 4px; }
.recipe .body { margin: 0; font-size: 21px; line-height: 1.2; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 2px dashed rgba(0,0,0,.2); padding-top: 10px; }
.recipe .sign { margin: 0; font-size: 19px; color: var(--ink-soft); text-align: right; font-style: italic; }
.recipe .pin { position: absolute; top: -9px; right: 14px; width: 18px; height: 18px; background: var(--rose); border: 3px solid #000; border-radius: 50%; }
.ln { grid-template-columns: 96px 1fr; }
.k.f { color: #a0601a; }
.tools { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.tools .btn { background: var(--paper-2); color: var(--ink); }
.list { display: grid; gap: 8px; }
.item { -webkit-appearance: none; appearance: none; text-align: left; width: 100%; background: var(--paper); color: var(--ink); border: 3px solid #000; box-shadow: var(--drop); padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; font-family: var(--vt); }
.item b { font-size: 22px; font-weight: 400; line-height: 1.05; }
.item small { font-size: 17px; color: var(--ink-soft); }
.item:hover { background: #fbf3e2; }
.item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.item:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.sect { font-family: var(--px); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.count { font-size: 15px; color: var(--ink-soft); text-align: right; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 25; max-width: min(400px, calc(100vw - 32px)); background: var(--wood); color: var(--ink-on-wood); border: 3px solid #000; box-shadow: var(--bevel), var(--drop); padding: 10px 14px; font-size: 20px; text-align: center; }
.towna { color: var(--muted); font-size: 18px; text-align: center; }
/* handoff/DESIGN.md §5: phone one column; tablet the same, centred at 560; computer the scene (560) beside the flow (480), 1080 in all; a screen without a scene stays one column of 480 */
@media (min-width: 720px) { #app { max-width: 560px; } }
@media (min-width: 1024px) {
  #app { max-width: 1080px; }
  .screen:not(:has(> .scene)) { max-width: 480px; width: 100%; margin-left: auto; margin-right: auto; }
  .screen:has(> .scene) { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 480px); justify-content: space-between; column-gap: 40px; row-gap: 0; align-items: start; }
  .screen:has(> .scene) > .scene { grid-column: 1; grid-row: 1 / span 30; position: sticky; top: 24px; }
  .screen:has(> .scene) > :not(.scene) { grid-column: 2; margin-bottom: 14px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="head"><span class="brand">Cook for Someone</span></header>

  <!-- home: Popo's kitchen -->
  <section class="screen" data-s="home">
    <canvas class="scene" id="scHome" width="160" height="96" role="img" aria-label="Popo's kitchen: Popo behind the counter by the stove, a pot steaming, her blue tin of recipe cards on the shelf, a cat on the window sill."></canvas>
    <div class="stack">
      <h1 data-t="title">Cook for Someone</h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="say" id="sayHome"></div>
    <div class="stack">
      <button class="btn pri lg wide" id="goSuggest" type="button" data-t="suggest"></button>
      <div class="row">
        <button class="btn" id="goBox" type="button" data-t="box"></button>
        <button class="btn" id="goLeave" type="button" data-t="leave"></button>
      </div>
      <button class="btn wide" id="goKept" type="button" data-t="kept" hidden></button>
    </div>
  </section>

  <!-- who is it for -->
  <section class="screen" data-s="pick" hidden>
    <canvas class="scene" id="scPick" width="160" height="96" role="img" aria-label="Popo's kitchen table with two empty chairs and a pot in the middle."></canvas>
    <div class="say" id="sayPick"></div>
    <div class="card">
      <h2 data-t="forQ"></h2>
      <div class="tags" id="tags" role="group"></div>
    </div>
    <button class="btn" type="button" data-home data-t="back" style="align-self:flex-start"></button>
  </section>

  <!-- one card -->
  <section class="screen" data-s="card" hidden>
    <div class="say" id="sayCard"></div>
    <article class="card recipe" id="recipe"></article>
    <div class="stack">
      <button class="btn pri lg wide" type="button" id="cookIt" data-t="cookIt"></button>
      <div class="row">
        <button class="btn" type="button" id="cardBack" data-t="back"></button>
        <button class="btn" type="button" id="another" data-t="another"></button>
        <button class="btn" type="button" id="keepBtn" data-t="keep"></button>
      </div>
    </div>
  </section>

  <!-- done: who will you cook it for -->
  <section class="screen" data-s="done" hidden>
    <canvas class="scene" id="scDone" width="160" height="96" role="img" aria-label="A table set for two under a warm lamp, Mantou waiting underneath."></canvas>
    <div class="say" id="sayDone"></div>
    <div class="card">
      <h2 data-t="doneT"></h2>
      <label class="hint" for="whoName" data-t="doneName"></label>
      <input type="text" id="whoName" maxlength="24" autocomplete="off">
      <button class="btn pri wide" type="button" id="invite" data-t="invite"></button>
    </div>
    <div class="stack">
      <button class="btn wide" type="button" id="putDown" data-t="putDown"></button>
      <button class="btn wide" type="button" data-home data-t="home"></button>
    </div>
  </section>

  <!-- the box -->
  <section class="screen" data-s="box" hidden>
    <div class="row" style="align-items:center">
      <button class="btn small" type="button" data-home data-t="back" style="flex:none"></button>
      <h1 data-t="box" style="font-size:15px;flex:1"></h1>
    </div>
    <canvas class="scene" id="scBox" width="160" height="96" role="img" aria-label="Popo's blue biscuit tin, open, full of handwritten recipe cards."></canvas>
    <input type="text" id="q" maxlength="40" autocomplete="off" enterkeyhint="search">
    <p class="note" id="boxNote" role="status"></p>
    <div id="boxList" class="stack"></div>
    <a class="towna" id="townA" href="/nearby/next-door/?from=app" data-t="town"></a>
  </section>

  <!-- leave a recipe -->
  <section class="screen" data-s="leave" hidden>
    <div class="row" style="align-items:center">
      <button class="btn small" type="button" data-home data-t="back" style="flex:none"></button>
      <h1 data-t="leave" style="font-size:15px;flex:1"></h1>
    </div>
    <div class="say" id="sayLeave"></div>
    <form class="card" id="leaveForm" novalidate>
      <label class="lbl" for="fDish" data-t="fDish"></label>
      <input type="text" id="fDish" maxlength="40" autocomplete="off" required>
      <label class="hint" for="fWhose" data-t="fWhose"></label>
      <input type="text" id="fWhose" maxlength="40" autocomplete="off">
      <label class="hint" for="fFor" data-t="fFor"></label>
      <input type="text" id="fFor" maxlength="80" autocomplete="off">
      <label class="lbl" for="fBody" data-t="fBody"></label>
      <textarea id="fBody" maxlength="800" rows="7" required></textarea>
      <div class="count" id="bodyCount" aria-hidden="true"></div>
      <label class="hint" for="fSign" data-t="fSign"></label>
      <input type="text" id="fSign" maxlength="24" autocomplete="nickname">
      <p class="hint" data-t="fPublic"></p>
      <p class="note" id="leaveNote" role="status"></p>
      <button class="btn pri lg wide" type="submit" id="sendBtn" data-t="send"></button>
    </form>
  </section>

  <!-- thanks -->
  <section class="screen" data-s="thanks" hidden>
    <canvas class="scene" id="scThanks" width="160" height="96" role="img" aria-label="Popo slipping a new card into her blue tin."></canvas>
    <div class="say" id="sayThanks"></div>
    <article class="card recipe" id="thanksCard"></article>
    <div class="stack">
      <button class="btn pri wide" type="button" id="shareBtn" data-t="share"></button>
      <button class="btn wide" type="button" data-home data-t="home"></button>
    </div>
  </section>

  <!-- my cards -->
  <section class="screen" data-s="kept" hidden>
    <div class="row" style="align-items:center">
      <button class="btn small" type="button" data-home data-t="back" style="flex:none"></button>
      <h1 data-t="kept" style="font-size:15px;flex:1"></h1>
    </div>
    <div id="keptList" class="stack"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div id="dark" hidden role="button" tabindex="0">
  <div>
    <canvas id="scDark" width="66" height="48" aria-hidden="true"></canvas>
    <p id="darkLine"></p>
    <small data-t="tapWake"></small>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {

function li() { var l = window.FBL ? FBL.get() : (document.documentElement.lang || "en"); var i = LANGS.indexOf(l); return i < 0 ? 0 : i; }

function pick(a) { return a[(Math.random() * a.length) | 0]; }
var $ = function (id) { return document.getElementById(id); };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
